<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 'Newsreader',serif;background-image:radial-gradient(#1e293b 1px, transparent 1px);background-size:24px 24px;}
h1,h2,h3,h4{font-family:'Chakra Petch',sans-serif;margin:0;letter-spacing:-0.02em}
.serif{font-family:'Cinzel',serif}
.sans{font-family:'Inter',system-ui,sans-serif}
.mono{font-family:'JetBrains Mono',monospace}

header{background:#0a0d17;border-bottom:3px double #334155;padding:18px;text-align:center;position:relative}

.masthead-sub{font-size:12px;color:var(--ac);text-transform:uppercase;letter-spacing:3px;font-family:'Inter';font-weight:700;margin-top:3px}
.masthead-bar{display:flex;justify-content:space-between;max-width:1100px;margin:10px auto 0;border-top:1px solid #1e293b;border-bottom:1px solid #1e293b;padding:4px 10px;font-size:12px;color:var(--muted);font-family:'Inter';flex-wrap:wrap;gap:6px}

.sync-bar{background:#0c111e;padding:8px 16px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-family:'Inter';border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px}
.sync-bar button, .sync-bar label.btn-upload{background:#1e293b;color:#fff;border:1px solid #334155;border-radius:6px;padding:4px 12px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none;}
.sync-bar button:hover, .sync-bar label.btn-upload:hover{border-color:var(--gold)}

nav{background:#0f172a;border-bottom:1px solid var(--border);display:flex;justify-content:center;gap:6px;padding:8px 14px;flex-wrap:wrap;position:sticky;top:0;z-index:40}
nav button{background:transparent;color:var(--muted);border:1px solid transparent;border-radius:6px;padding:6px 14px;font-family:'Inter';font-size:13px;font-weight:600;cursor:pointer;transition:0.2s}
nav button:hover{color:#fff;border-color:#334155}
nav button.on{background:var(--gold);color:#070a12;border-color:var(--gold);font-weight:700}

.container{max-width:1300px;margin:20px auto;padding:0 16px}
.editorial-card{background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:18px;box-shadow:0 4px 16px rgba(0,0,0,0.3)}
.kicker{font-family:'Inter';font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:6px;display:inline-block}

.season-selector-bar{display:flex;align-items:center;justify-content:space-between;background:#0d1527;border:1px solid var(--border);border-radius:8px;padding:10px 16px;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.season-selector-bar select{background:#1e293b;color:var(--gold-bright);border:1px solid #334155;border-radius:6px;padding:6px 12px;font-family:'JetBrains Mono';font-weight:700;cursor:pointer;max-width:100%}
.btn-ui{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:5px 12px;font-family:'Inter';font-weight:600;cursor:pointer;font-size:12px}
.btn-ui:hover{border-color:var(--gold);background:#25334d}
.btn-ui:disabled{opacity:.4;cursor:default}
.btn-gold{background:linear-gradient(135deg,#d97706,#f59e0b);color:#070a12;border:none;border-radius:6px;padding:6px 14px;font-family:'Inter';font-weight:700;cursor:pointer;font-size:12px}
.btn-gold:hover{background:linear-gradient(135deg,#f59e0b,#fde047)}
.btn-sm{padding:2px 8px;font-size:11px}

.comp-btn{background:#16203a;color:#cbd5e1;border:1px solid #334155;border-radius:6px;padding:6px 12px;font-family:'Inter';font-weight:600;font-size:12px;cursor:pointer}

.comp-btn.active{background:var(--gold);color:#070a12;border-color:var(--gold)}

.bracket-scroll-container{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;margin-bottom:16px}

.match-line{display:flex;justify-content:space-between;align-items:center;font-family:'Inter';font-size:12.5px;margin:3px 0;gap:6px}
.match-winner{color:var(--gold-bright);font-weight:700}

.modal-body{padding:20px;overflow-y:auto;max-height:80vh;font-family:'Inter',sans-serif}

</style>
</head>

<div class="container" id="app"></div>

<script>
var DATA = JSON.parse(document.getElementById('raw-data').textContent);
var curSe = DATA.startSe, curMode = "league", curT = 0, curJornada = 1;
var T_NAMES = ["Premier League", "The Championship"];
var FIRST_NAMES = DATA.firstNames || [];
var LAST_NAMES = DATA.lastNames || [];

function nameFromId(n){
  var F = FIRST_NAMES.length, L = LAST_NAMES.length, pairs = F * L;
  if(n < pairs){ var k = (n * 7919) % pairs; return FIRST_NAMES[k % F] + ' ' + LAST_NAMES[Math.floor(k / F)]; }
  var m = n - pairs, total = pairs * L, k2 = (m * 104729) % total;
  return FIRST_NAMES[k2 % F] + ' ' + LAST_NAMES[Math.floor(k2 / F) % L] + ' ' + LAST_NAMES[Math.floor(k2 / pairs)];
}

function getC(id){ return (id !== null && id !== undefined) ? (DATA.clubNames[id] || ('Club #' + id)) : 'TBD'; }
function pLink(id, name){ return '<span class="player-link" onclick="openPlayerDossier(' + id + ')">' + (name || nameFromId(id)) + '</span>'; }

function init(){
  document.getElementById('header-sub').textContent = 'Comprehensive Match Archive · Season ' + DATA.startSe + ' to ' + DATA.endSe;
  var sel = document.getElementById('se-sel');
  sel.innerHTML = '';
  for(var s = DATA.startSe; s <= DATA.endSe; s++){
    if(DATA.seasons[s]) sel.innerHTML += '<option value="' + s + '">Season ' + s + '</option>';
  }
  render();
}

function changeSe(s){ curSe = s; curJornada = 1; render(); }

function setCompMode(mode, tier, btnEl){
  curMode = mode;
  if(tier !== undefined) curT = tier;
  var btns = document.querySelectorAll('#comp-nav button');
  btns.forEach(function(b){ b.classList.remove('active'); });
  if(btnEl) btnEl.classList.add('active');
  render();
}

function openPlayerDossier(id){
  var pName = nameFromId(id);
  var mBody = document.getElementById('m-body');
  mBody.innerHTML = 
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-bottom:1px solid #1e293b;padding-bottom:8px;">' +
      '<h3 style="color:var(--gold-bright);margin:0;">👤 ' + pName + '</h3>' +
      '<button class="btn close-btn" onclick="document.getElementById(\'modal\').classList.remove(\'active\')">✕</button>' +
    '</div>' +
    '<div style="background:#111827;border:1px solid #1e293b;padding:12px;border-radius:6px;margin-bottom:12px;">' +
      '<div><b>Player ID:</b> <span class="mono">' + id + '</span></div>' +
      '<div><b>Historical Archive Season:</b> S.' + curSe + '</div>' +
    '</div>' +
    '<p style="color:var(--muted);font-size:12px;">Data snapshot dossier terverifikasi dari arsip resmi The Wimbledon Heritage.</p>';
  document.getElementById('modal').classList.add('active');
}

function openMatchDetails(tierIdx, jIdx, mIdx){
  var sn = DATA.seasons[curSe];
  if(!sn || !sn.league || !sn.league[tierIdx] || !sn.league[tierIdx].jornadas) return;
  var m = sn.league[tierIdx].jornadas[jIdx][mIdx];
  if(!m) return;

  var homeId = m[0], awayId = m[1], gh = m[2], ga = m[3];

function renderBracket64View(cupData, title, statObj, cupKey) {

  var roundNames = ["Round of 64", "Round of 32", "Round of 16", "Quarter-Finals", "Semi-Finals", "Grand Final"];
  var roundKeys = ["r64", "r32", "r16", "qf", "sf", "final"];
  
  var colsHtml = roundKeys.map(function(key, idx){
    var matches = cupData[key] || [];
    var mBoxes = matches.map(function(m, mIdx){
      var res = m.res;
      var sc = res ? (res.isFinal ? (res.gh + ' - ' + res.ga) : (res.aggH + ' - ' + res.aggA + ' [Agg]')) : 'VS';
      var wH = res && res.winner === m.h;
      var wA = res && res.winner === m.a;
      var btnClick = res ? 'onclick="openCupMatchDetails(\'' + cupKey + '\',\'' + key + '\',' + mIdx + ')" style="cursor:pointer;"' : '';
      return '<div class="match-box" ' + btnClick + '>' +
        '<div class="match-line ' + (wH ? 'match-winner' : '') + '"><span>' + getC(m.h) + '</span><b>' + (res ? (res.isFinal ? res.gh : res.aggH) : '') + '</b></div>' +

      '</div>';
    }).join('');

  var scHtml = '', asHtml = '';
  if (statObj && statObj.scorers && statObj.scorers.length) {

      return '<tr><td class="mono">' + (i + 1) + '</td><td>' + pLink(x.id, nameFromId(x.id)) + '</td><td>' + getC(x.club) + '</td><td class="mono" style="color:var(--gold-bright);font-weight:bold;">' + x.g + '</td><td class="mono">' + x.a + '</td></tr>';

function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

function pseudoRandom(seed) {
  var s = Math.floor(Math.abs(seed)) % 2147483647;
  if (s <= 0) s += 2147483646;
  var f = function() { return (s = s * 16807 % 2147483647) / 2147483647; };
  f(); f(); f(); f();
  return f;
}

function shuffleArr(arr, r) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(r() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function generatePoissonGoals(expectedLambda, r) {
  var L = Math.exp(-expectedLambda);
  var k = 0, p = 1.0;
  do { k++; p *= r(); } while (p > L && k < 12);
  return Math.max(0, k - 1);
}

function nameFromId(n) {
  var F = FIRST_NAMES_EN.length, L = LAST_NAMES_EN.length;
  var pairs = F * L;
  if (n < pairs) {
    var k = (n * 7919) % pairs;
    return FIRST_NAMES_EN[k % F] + ' ' + LAST_NAMES_EN[Math.floor(k / F)];
  }
  var m = n - pairs;
  var total = pairs * L;
  var k2 = (m * 104729) % total;
  var fi = k2 % F;
  var l1 = Math.floor(k2 / F) % L;
  var l2 = Math.floor(k2 / pairs);
  return FIRST_NAMES_EN[fi] + ' ' + LAST_NAMES_EN[l1] + '-' + LAST_NAMES_EN[l2];
}

  var names = ALL_370_CLUBS.slice();

  var prestige = {};

  for (var id = 0; id < TOTAL_CLUBS; id++) {
    var r = pseudoRandom(id * 997 + 13);
    if (id < TIER_SIZES[0]) {
      t1.push(id);
      prestige[id] = id < 10 ? 84 + Math.floor(r() * 8) : 74 + Math.floor(r() * 10);
    } else if (id < TIER_SIZES[0] + TIER_SIZES[1]) {
      t2.push(id);
      prestige[id] = 64 + Math.floor(r() * 10);
    } else {
      prestige[id] = 52 + Math.floor(r() * 10);
    }
  }

  return {
    version: 10,
    name: names,
    customNames: {},
    mem: [t1, t2],
    prestige: prestige,
    nextPlayerId: 1001,
    legends: [],
    undo: null,

function ageFactor(age) {
  if (age <= 17) return 0.72;
  if (age <= 24) return [0.72,0.76,0.80,0.84,0.88,0.92,0.95,0.98][age - 17];
  if (age <= 29) return 1;
  var t = { 30: 0.99, 31: 0.97, 32: 0.94, 33: 0.91, 34: 0.88, 35: 0.85 };
  return t[age] || 0.82;
}

function makeYouth(cId, pos, debutSe, r) {
  var pr = S.prestige[cId] || 70;
  var pot = clamp(Math.round(pr - 6 + (r() + r() + r() - 1.5) * 9), 52, 97);
  var ovr = clamp(Math.round(pot * ageFactor(17) + (r() - 0.5) * 4), 38, pot);
  return makePlayer(cId, pos, 17, pot, ovr, debutSe);
}

function initActivePlayerPool() {

    var ages = shuffleArr(AGE_BASE, r);
    var pr = S.prestige[cId];
    var squad = [];
    for (var i = 0; i < SQUAD_SIZE; i++) {
      var pot = clamp(Math.round(pr - 6 + (r() + r() + r() - 1.5) * 9), 52, 97);
      var age = ages[i];
      var ovr = clamp(Math.round(pot * ageFactor(age) + (r() - 0.5) * 3), 38, 97);
      squad.push(makePlayer(cId, POS_LAYOUT[i], age, pot, ovr, 1));

}

function getClubPriorFinishTag(cId, curSe) {
  if (cId === null || cId === undefined) return '';
  var prevSe = curSe - 1;
  if (prevSe < 1 || !H.seasons[prevSe]) return '<span class="pos-tag" style="color:var(--muted)">[Inaugural]</span>';

  var prevS = H.seasons[prevSe];
  var tag = '';

  if (prevS.leagueDone && prevS.league) {
    for (var t = 0; t < prevS.tiers.length; t++) {
      var tab = prevS.league[t].table;
      for (var i = 0; i < tab.length; i++) {
        if (tab[i][0] === cId) {
          tag = TIER_SHORT[t] + ' #' + (i + 1);
          break;
        }
      }
      if (tag) break;
    }
  }

  if (prevS.faWinner === cId) tag += ' · 🛡️ FA Winner';
  else if (prevS.faRunner === cId) tag += ' · 🛡️ FA Finalist';
  else if (prevS.lcWinner === cId) tag += ' · 🏅 LC Winner';
  else if (prevS.lcRunner === cId) tag += ' · 🏅 LC Finalist';

  if (!tag) tag = 'Dormant Pool';
  return '<span class="pos-tag">[' + tag + ']</span>';
}

function pickStartingXI(squad, r) {
  var ratedSquad = squad.map(function(p) {
    var formRoll = (r() * 8 - 4);
    var ageFatigue = p.age >= 32 ? (p.age - 31) * 1.5 : 0;
    var matchFitness = p.ovr + formRoll - ageFatigue;
    return { p: p, score: matchFitness };
  });

  var byScore = function(a, b) { return b.score - a.score; };
  var gk = ratedSquad.filter(function(x){ return x.p.pos === 'GK'; }).sort(byScore);
  var def = ratedSquad.filter(function(x){ return x.p.pos === 'DF'; }).sort(byScore);
  var med = ratedSquad.filter(function(x){ return x.p.pos === 'MF'; }).sort(byScore);
  var fwd = ratedSquad.filter(function(x){ return x.p.pos === 'FW'; }).sort(byScore);

  var xi = [];
  if (gk[0]) xi.push(gk[0].p);
  for (var i = 0; i < 4 && i < def.length; i++) xi.push(def[i].p);
  for (var j = 0; j < 4 && j < med.length; j++) xi.push(med[j].p);
  for (var k = 0; k < 2 && k < fwd.length; k++) xi.push(fwd[k].p);

  var usedIds = new Set(xi.map(function(p){ return p.id; }));
  ratedSquad.sort(byScore).forEach(function(item){
    if (xi.length < 11 && !usedIds.has(item.p.id)) {
      xi.push(item.p);
      usedIds.add(item.p.id);
    }
  });

  var bench = squad.filter(function(p){ return !usedIds.has(p.id); }).sort(function(a, b){ return b.ovr - a.ovr; });
  return { xi: xi, bench: bench };
}

function clubStrength(c) {
  var sq = PLAYERS_DB[c];
  if (!sq || !sq.length) return (S.prestige[c] || 70) - 6;
  var o = sq.map(function(p){ return p.ovr; }).sort(function(a, b){ return b - a; });
  var n = Math.min(13, o.length), sum = 0;
  for (var i = 0; i < n; i++) sum += o[i];
  return sum / n;
}

function legendScore(c) {
  return c.t1Goals + 0.5 * (c.goals - c.t1Goals) + 0.5 * c.assists +
         40 * c.t1Boots + 70 * c.mvp + 10 * (c.faBoots + c.lcBoots) + 6 * c.lowBoots;
}

function retirePlayer(p, cId, se) {
  var sc = legendScore(p.career);
  if (sc >= LEGEND_THRESHOLD) {
    S.legends.push({
      id: p.id, name: p.name, pos: p.pos, age: p.age, ovr: p.ovr, peak: p.peak,
      club: +cId, origin: p.origin, debut: p.debut, retired: se,
      career: JSON.parse(JSON.stringify(p.career)),
      hist: p.hist, score: Math.round(sc)
    });
  }
}

function agePlayersOneYear(se) {
  var r = pseudoRandom(se * 8849 + 17);
  Object.keys(PLAYERS_DB).forEach(function(cId) {
    var squad = PLAYERS_DB[cId];
    for (var i = 0; i < squad.length; i++) {
      var p = squad[i];
      p.age++; p.seasonsAtClub++;
      if (p.age <= 24) {
        var gain = Math.round((p.pot - p.ovr) * 0.32 + r() * 2);
        if (gain < 0) gain = 0;
        p.ovr = Math.min(p.pot, p.ovr + gain);
      } else if (p.age <= 29) {
        p.ovr += Math.floor(r() * 3) - 1;
        if (p.ovr > p.pot + 1) p.ovr = p.pot + 1;
      } else if (p.age <= 31) {
        p.ovr -= Math.floor(r() * 2);
      } else if (p.age <= 35) {
        p.ovr -= 1 + Math.floor(r() * 3);
      } else {
        p.ovr -= 2 + Math.floor(r() * 3);
      }
      p.ovr = clamp(p.ovr, 35, 99);
      if (p.ovr > p.peak) p.peak = p.ovr;

      var retire = false;
      if (p.age >= 39) retire = true;
      else if (p.age >= 35 && r() < RETIRE_P[p.age]) retire = true;
      else if (p.age >= 33 && p.ovr < 54 && r() < 0.5) retire = true;

      if (retire) {
        retirePlayer(p, +cId, se);
        squad[i] = makeYouth(+cId, p.pos, se + 1, r);
      }
    }
  });
}

function runTransferMarket(se) {
  var r = pseudoRandom(se * 5309 + 77);
  var allClubs = Object.keys(PLAYERS_DB).map(Number);
  var transfersLog = [];
  var rankedClubs = allClubs.slice().sort(function(a, b){ return (S.prestige[b] || 70) - (S.prestige[a] || 70); });
  var eliteClubs = rankedClubs.slice(0, 16);

  eliteClubs.forEach(function(buyer) {
    if (r() < 0.20) return;
    var marketStars = [];
    allClubs.forEach(function(seller) {
      if (seller === buyer) return;
      (PLAYERS_DB[seller] || []).forEach(function(p) {
        if (p.age >= 20 && p.age <= 30 && p.ovr >= 80 && (S.prestige[buyer] >= (S.prestige[seller] - 5))) {
          marketStars.push({ p: p, seller: seller });
        }
      });
    });

    if (!marketStars.length) return;
    marketStars.sort(function(a, b){ return b.p.ovr - a.p.ovr; });
    var chosen = marketStars[Math.floor(r() * Math.min(5, marketStars.length))];
    var star = chosen.p;
    var seller = chosen.seller;

    var bSquad = PLAYERS_DB[buyer] || [];
    var sSquad = PLAYERS_DB[seller] || [];
    if (sSquad.length <= 16 || bSquad.length >= 24) return;

    PLAYERS_DB[seller] = sSquad.filter(function(x){ return x.id !== star.id; });
    star.club = buyer;
    star.seasonsAtClub = 1;
    PLAYERS_DB[buyer].push(star);

    transfersLog.push({ pId: star.id, pName: star.name, pos: star.pos, ovr: star.ovr, from: seller, to: buyer, type: 'Marquee Signing' });
  });

  allClubs.forEach(function(buyer) {
    var bPr = S.prestige[buyer] || 70;
    if (r() >= 0.50) return;
    var seller = allClubs[Math.floor(r() * allClubs.length)];
    if (seller === buyer) return;

    var sSquad = PLAYERS_DB[seller] || [];
    var bSquad = PLAYERS_DB[buyer] || [];
    if (sSquad.length <= 16 || bSquad.length >= 24) return;

    var cand = sSquad.filter(function(p){ return p.age >= 19 && p.age <= 32 && Math.abs(p.ovr - bPr) <= 9; });
    if (!cand.length) return;
    var target = cand[Math.floor(r() * cand.length)];

    PLAYERS_DB[seller] = sSquad.filter(function(x){ return x.id !== target.id; });
    target.club = buyer;
    target.seasonsAtClub = 1;
    PLAYERS_DB[buyer].push(target);

    transfersLog.push({ pId: target.id, pName: target.name, pos: target.pos, ovr: target.ovr, from: seller, to: buyer, type: 'Open Window Transfer' });
  });

  allClubs.forEach(function(cId) {
    var sq = PLAYERS_DB[cId];
    while (sq.length < SQUAD_SIZE) sq.push(makeYouth(cId, POS_LAYOUT[sq.length % POS_LAYOUT.length], se, r));
    while (sq.length > 22) {
      sq.sort(function(a, b){ return a.ovr - b.ovr; });
      var dropped = sq.shift();
      var lowClub = rankedClubs[rankedClubs.length - 1 - Math.floor(r() * 10)];
      if (lowClub && PLAYERS_DB[lowClub].length < 22) {
        dropped.club = lowClub;
        PLAYERS_DB[lowClub].push(dropped);
      }
    }
  });

  return transfersLog;
}

function buildPlayerIndex() {
  var m = {};
  Object.keys(PLAYERS_DB).forEach(function(c) { PLAYERS_DB[c].forEach(function(p) { m[p.id] = p; }); });
  return m;
}

// ==============================================================
// 6. ENGINE LIGA 62 PEKAN (DENGAN DETAIL MATCHDAY & EVENTS)
// ==============================================================
function buildLineupWeights(lineup) {
  var cs = [], ca = [], ts = 0, ta = 0;
  for (var i = 0; i < lineup.length; i++) {
    var p = lineup[i];
    var f = Math.pow(Math.max(1, p.ovr - 40) / 50, 3);
    ts += POS_SCORE_W[p.pos] * f;
    ta += POS_ASSIST_W[p.pos] * f;
    cs.push(ts); ca.push(ta);
  }
  return { cs: cs, ca: ca, ts: ts, ta: ta };
}

function pickIdx(cum, total, r) {
  var x = r() * total;
  for (var i = 0; i < cum.length; i++) if (x <= cum[i]) return i;
  return cum.length - 1;
}

function generateMatchEventsWithSubs(xi, bench, goals, rr) {
  var subs = [];
  var currentXI = xi.slice();
  var benchPool = bench.slice();
  var playerMinutes = {};
  
  xi.forEach(function(p){ playerMinutes[p.id] = 90; });
  bench.forEach(function(p){ playerMinutes[p.id] = 0; });

  var subMinutes = [
    55 + Math.floor(rr() * 10),
    66 + Math.floor(rr() * 10),
    76 + Math.floor(rr() * 10)
  ].sort(function(a, b){ return a - b; });

  for (var s = 0; s < 3 && benchPool.length > 0; s++) {
    var sMin = subMinutes[s];
    var outCandidates = currentXI.filter(function(p){ return p.pos !== 'GK'; });
    if (!outCandidates.length) break;
    
    var outP = outCandidates[Math.floor(rr() * outCandidates.length)];
    var outIdx = currentXI.indexOf(outP);

    var matchingSubs = benchPool.filter(function(bp){ return bp.pos === outP.pos; });
    var inP = null;
    if (matchingSubs.length > 0 && rr() < 0.75) {
      inP = matchingSubs[Math.floor(rr() * matchingSubs.length)];
    } else {
      var nonGkBench = benchPool.filter(function(bp){ return bp.pos !== 'GK'; });
      inP = nonGkBench.length ? nonGkBench[Math.floor(rr() * nonGkBench.length)] : benchPool[0];
    }

    if (!inP) break;

    subs.push([outP.id, inP.id, sMin]);
    playerMinutes[outP.id] = sMin;
    playerMinutes[inP.id] = 90 - sMin;

    currentXI[outIdx] = inP;
    benchPool = benchPool.filter(function(bp){ return bp.id !== inP.id; });
  }

  var weightsEarly = buildLineupWeights(xi);
  var weightsLate = buildLineupWeights(currentXI);
  var events = [];

  for (var k = 0; k < goals; k++) {
    var minute = Math.floor(rr() * 90) + 1;
    var pool = (minute < 65) ? xi : currentXI;
    var w = (minute < 65) ? weightsEarly : weightsLate;

    var si = pickIdx(w.cs, w.ts, rr);
    var scorer = pool[si];
    scorer.tempG = (scorer.tempG || 0) + 1;

    var assistId = null;
    if (rr() < 0.75) {
      var ai = pickIdx(w.ca, w.ta, rr);
      if (ai === si) ai = pickIdx(w.ca, w.ta, rr);
      if (ai !== si) {
        var assister = pool[ai];
        assister.tempA = (assister.tempA || 0) + 1;
        assistId = assister.id;
      }
    }
    events.push([scorer.id, assistId, minute]);
  }
  events.sort(function(a, b){ return a[2] - b[2]; });

  return { events: events, subs: subs, minutes: playerMinutes };
}

function generateRoundRobinSchedule(teams) {
  var n = teams.length;
  var rounds = [];
  var list = teams.slice();
  var totalRounds = n - 1;
  var half = n / 2;

  for (var r = 0; r < totalRounds; r++) {
    var roundMatches = [];
    for (var i = 0; i < half; i++) {
      var home = list[i];
      var away = list[n - 1 - i];
      if (r % 2 === 1) {
        var tmp = home; home = away; away = tmp;
      }
      roundMatches.push([home, away]);
    }
    rounds.push(roundMatches);
    var fixed = list[0];
    var rest = list.slice(1);
    rest.unshift(rest.pop());
    list = [fixed].concat(rest);
  }

  var secondHalfRounds = rounds.map(function(roundMatches) {
    return roundMatches.map(function(m){ return [m[1], m[0]]; });
  });

  return rounds.concat(secondHalfRounds);
}

function playTierLeague(clubs, t, se) {
  var rr = pseudoRandom(se * 10007 + t * 7919 + 13);
  var schedule = generateRoundRobinSchedule(clubs);
  var totalJornadas = schedule.length;
  
  var clubMap = {};
  clubs.forEach(function(c) {
    var sq = PLAYERS_DB[c];
    clubMap[c] = {
      id: c,
      sq: sq,
      str: clubStrength(c) + (rr() - 0.5) * 5,
      W: 0, D: 0, L: 0, GF: 0, GA: 0
    };
  });

  var jornadasData = [];

  for (var jIdx = 0; jIdx < totalJornadas; jIdx++) {
    var fixturesThisJornada = [];
    var pairings = schedule[jIdx];

    for (var mIdx = 0; mIdx < pairings.length; mIdx++) {
      var hId = pairings[mIdx][0];
      var aId = pairings[mIdx][1];
      var home = clubMap[hId];
      var away = clubMap[aId];

      var hLineup = pickStartingXI(home.sq, rr);
      var aLineup = pickStartingXI(away.sq, rr);

      var diff = (home.str + 2) - away.str;
      var lh = Math.max(0.85, Math.min(3.8, 1.48 * Math.exp(diff / 22)));
      var la = Math.max(0.65, Math.min(3.5, 1.18 * Math.exp(-diff / 22)));
      var gh = generatePoissonGoals(lh, rr);
      var ga = generatePoissonGoals(la, rr);

      home.GF += gh; home.GA += ga; away.GF += ga; away.GA += gh;
      if (gh > ga) { home.W++; away.L++; }
      else if (gh < ga) { away.W++; home.L++; }
      else { home.D++; away.D++; }

      home.sq.forEach(function(p){ p.tempG = 0; p.tempA = 0; });
      away.sq.forEach(function(p){ p.tempG = 0; p.tempA = 0; });

      var hSim = generateMatchEventsWithSubs(hLineup.xi, hLineup.bench, gh, rr);
      var aSim = generateMatchEventsWithSubs(aLineup.xi, aLineup.bench, ga, rr);

      hLineup.xi.forEach(function(p){ p.sstart = (p.sstart || 0) + 1; });
      aLineup.xi.forEach(function(p){ p.sstart = (p.sstart || 0) + 1; });

      home.sq.forEach(function(p){
        var mins = hSim.minutes[p.id] || 0;
        p.sg = (p.sg || 0) + (p.tempG || 0);
        p.sa = (p.sa || 0) + (p.tempA || 0);
        p.smin = (p.smin || 0) + mins;
        if (mins > 0) p.sapp = (p.sapp || 0) + 1;
      });

      away.sq.forEach(function(p){
        var mins = aSim.minutes[p.id] || 0;
        p.sg = (p.sg || 0) + (p.tempG || 0);
        p.sa = (p.sa || 0) + (p.tempA || 0);
        p.smin = (p.smin || 0) + mins;
        if (mins > 0) p.sapp = (p.sapp || 0) + 1;
      });

      fixturesThisJornada.push([
        home.id, away.id, gh, ga,
        hSim.events, aSim.events,
        hLineup.xi.map(function(p){ return p.id; }),
        aLineup.xi.map(function(p){ return p.id; }),
        hLineup.bench.map(function(p){ return p.id; }),
        aLineup.bench.map(function(p){ return p.id; }),
        hSim.subs, aSim.subs
      ]);
    }
    jornadasData.push(fixturesThisJornada);
  }

  var table = clubs.map(function(cId) {
    var x = clubMap[cId];
    return [x.id, x.W, x.D, x.L, x.GF, x.GA, (x.W * 3 + x.D)];
  }).sort(function(a, b) {
    return (b[6] - a[6]) || ((b[4] - b[5]) - (a[4] - a[5])) || (b[4] - a[4]) || (a[0] - b[0]);
  });

  var pool = [];
  clubs.forEach(function(cId) {
    (PLAYERS_DB[cId] || []).forEach(function(p){ pool.push(p); });
  });

  var scorers = pool.slice()
    .filter(function(p){ return (p.sg || 0) > 0; })
    .sort(function(a, b){ return (b.sg - a.sg) || (b.sa - a.sa) || (b.ovr - a.ovr); })
    .slice(0, 15).map(function(p){ return [p.id, p.name, p.club, p.sg, p.sa]; });

  var assisters = pool.slice()
    .filter(function(p){ return (p.sa || 0) > 0; })
    .sort(function(a, b){ return (b.sa - a.sa) || (b.sg - a.sg) || (b.ovr - a.ovr); })
    .slice(0, 10).map(function(p){ return [p.id, p.name, p.club, p.sa, p.sg]; });

  return { table: table, scorers: scorers, assisters: assisters, jornadas: jornadasData };
}

// ==============================================================
// 7. ENGINE TURNAMEN PIALA 64 KLUB (DENGAN DETAIL MATCH EVENT)
// ==============================================================
function ensureSquadForClub(cId, se) {
  if (PLAYERS_DB[cId] && PLAYERS_DB[cId].length >= 16) return PLAYERS_DB[cId];
  var r = pseudoRandom(cId * 883 + se * 31);
  var pr = S.prestige[cId] || 54;
  var squad = [];
  for (var i = 0; i < SQUAD_SIZE; i++) {
    var pot = clamp(Math.round(pr - 6 + (r() + r() + r() - 1.5) * 9), 48, 88);
    var age = AGE_BASE[i % AGE_BASE.length];
    var ovr = clamp(Math.round(pot * ageFactor(age) + (r() - 0.5) * 3), 36, pot);
    squad.push(makePlayer(cId, POS_LAYOUT[i], age, pot, ovr, se));
  }
  PLAYERS_DB[cId] = squad;
  return squad;
}

function simulateTwoLegTie(h, a, seedVal, isFinal, se) {
  var r = pseudoRandom(seedVal);
  var sqH = ensureSquadForClub(h, se);
  var sqA = ensureSquadForClub(a, se);

  var ovrH = clubStrength(h);
  var ovrA = clubStrength(a);

  if (r() < 0.12) {
    if (ovrH > ovrA) ovrA += 7 + Math.floor(r() * 6);
    else ovrH += 7 + Math.floor(r() * 6);
  }

  // Leg 1
  var diff1 = (ovrH + 2.5) - ovrA;
  var lh1 = Math.max(0.7, Math.min(3.8, 1.45 * Math.exp(diff1 / 22)));
  var la1 = Math.max(0.6, Math.min(3.5, 1.15 * Math.exp(-diff1 / 22)));
  var gh1 = generatePoissonGoals(lh1, r);
  var ga1 = generatePoissonGoals(la1, r);

  var hLineup1 = pickStartingXI(sqH, r);
  var aLineup1 = pickStartingXI(sqA, r);
  var evH1 = generateMatchEventsWithSubs(hLineup1.xi, hLineup1.bench, gh1, r).events;
  var evA1 = generateMatchEventsWithSubs(aLineup1.xi, aLineup1.bench, ga1, r).events;

  if (isFinal) {
    var penH = null, penA = null;
    if (gh1 === ga1) {
      penH = 4; penA = 3;
      if (r() < 0.5) { penH = 3; penA = 4; }
    }
    var winF = (gh1 > ga1 || (penH !== null && penH > penA)) ? h : a;
    var losF = (winF === h) ? a : h;
    return {
      gh: gh1, ga: ga1, winner: winF, loser: losF, isFinal: true,
      penH: penH, penA: penA,
      eventsH: evH1, eventsA: evA1,
      xiH: hLineup1.xi.map(function(p){ return p.id; }),
      xiA: aLineup1.xi.map(function(p){ return p.id; })
    };
  }

  // Leg 2
  var diff2 = (ovrA + 2.5) - ovrH;
  var la2 = Math.max(0.7, Math.min(3.8, 1.45 * Math.exp(diff2 / 22)));
  var lh2 = Math.max(0.6, Math.min(3.5, 1.15 * Math.exp(-diff2 / 22)));
  var ga2 = generatePoissonGoals(la2, r);
  var gh2 = generatePoissonGoals(lh2, r);

  var aLineup2 = pickStartingXI(sqA, r);
  var hLineup2 = pickStartingXI(sqH, r);
  var evA2 = generateMatchEventsWithSubs(aLineup2.xi, aLineup2.bench, ga2, r).events;
  var evH2 = generateMatchEventsWithSubs(hLineup2.xi, hLineup2.bench, gh2, r).events;

  var totH = gh1 + gh2;
  var totA = ga1 + ga2;
  var penH2 = null, penA2 = null;

  if (totH === totA) {
    penH2 = 4; penA2 = 3;
    if (r() < 0.5) { penH2 = 3; penA2 = 4; }
  }

  var winner = (totH > totA || (penH2 !== null && penH2 > penA2)) ? h : a;
  var loser = (winner === h) ? a : h;

  return {
    gh: gh1 + ' / ' + gh2,
    ga: ga1 + ' / ' + ga2,
    aggH: totH,
    aggA: totA,
    winner: winner,
    loser: loser,
    penH: penH2,
    penA: penA2,
    isFinal: false,
    eventsH1: evH1, eventsA1: evA1,
    eventsH2: evH2, eventsA2: evA2,
    xiH: hLineup1.xi.map(function(p){ return p.id; }),
    xiA: aLineup1.xi.map(function(p){ return p.id; })
  };
}

function build64CupStructure(entrants) {
  var r64 = [];
  for (var i = 0; i < 32; i++) {
    r64.push({ id: i, h: entrants[i * 2], a: entrants[i * 2 + 1], res: null });
  }
  var makeEmpty = function(count) {
    var arr = [];
    for (var k = 0; k < count; k++) arr.push({ id: k, h: null, a: null, res: null });
    return arr;
  };
  return {
    r64: r64,
    r32: makeEmpty(16),
    r16: makeEmpty(8),
    qf: makeEmpty(4),
    sf: makeEmpty(2),
    final: makeEmpty(1)
  };
}

function initFaCupEntrants(se, s) {
  var r = pseudoRandom(se * 8819 + 71);
  var prevSe = se - 1;
  var prevT1 = (prevSe >= 1 && H && H.seasons && H.seasons[prevSe] && H.seasons[prevSe].league) ? 
               H.seasons[prevSe].league[0].table.map(function(x){ return x[0]; }) : s.tiers[0];

  var seeded16 = prevT1.slice(0, 16);
  var remainingT1 = prevT1.slice(16, 32);
  var proPool = shuffleArr(remainingT1.concat(s.tiers[1]), r);
  var pro24 = proPool.slice(0, 24);

  var usedSet = new Set(seeded16.concat(pro24));
  var dormantPool = [];
  for (var cId = 0; cId < TOTAL_CLUBS; cId++) {
    if (!usedSet.has(cId) && s.tiers[0].indexOf(cId) === -1 && s.tiers[1].indexOf(cId) === -1) {
      dormantPool.push(cId);
    }
  }
  var wild24 = shuffleArr(dormantPool, r).slice(0, 24);

  var opponents = shuffleArr(pro24.concat(wild24), r);
  var finalEntrants = [];
  for (var i = 0; i < 16; i++) {
    finalEntrants.push(seeded16[i]);
    finalEntrants.push(opponents[i]);
  }
  for (var j = 16; j < 48; j += 2) {
    finalEntrants.push(opponents[j]);
    finalEntrants.push(opponents[j + 1]);
  }
  return build64CupStructure(finalEntrants);
}

function initLeagueCupEntrants(se, s) {
  var r = pseudoRandom(se * 4423 + 19);
  var all64 = shuffleArr(s.tiers[0].concat(s.tiers[1]), r);
  return build64CupStructure(all64);
}

function simSingleCupMatch(cupKey, stageKey, matchIdx, se) {
  var s = H.seasons[se];
  if (!s) return;
  var cup = cupKey === 'fa' ? s.faCup64 : s.leagueCup64;
  if (!cup || !cup[stageKey]) return;

  var m = cup[stageKey][matchIdx];
  if (m.res || m.h === null || m.a === null) return;

  var isFinal = (stageKey === 'final');
  var stages = ["r64", "r32", "r16", "qf", "sf", "final"];
  var nextStages = ["r32", "r16", "qf", "sf", "final", null];
  var stageIdx = stages.indexOf(stageKey);
  var nextSt = nextStages[stageIdx];

  var seed = se * 10000 + stageIdx * 500 + matchIdx * 19 + (cupKey === 'fa' ? 333 : 777);
  m.res = simulateTwoLegTie(m.h, m.a, seed, isFinal, se);

  if (nextSt && cup[nextSt]) {
    var targetMatch = cup[nextSt][Math.floor(matchIdx / 2)];
    if (matchIdx % 2 === 0) targetMatch.h = m.res.winner;
    else targetMatch.a = m.res.winner;
  }

  if (isFinal) {
    if (cupKey === 'fa') { s.faWinner = m.res.winner; s.faRunner = m.res.loser; }
    else { s.lcWinner = m.res.winner; s.lcRunner = m.res.loser; }
  }

  autoSaveHistory();
  render();
}

function simCupStage(cupKey, stageKey, se) {
  var s = H.seasons[se];
  if (!s) return;
  var cup = cupKey === 'fa' ? s.faCup64 : s.leagueCup64;
  if (!cup || !cup[stageKey]) return;

  cup[stageKey].forEach(function(m, idx) {
    if (!m.res && m.h !== null && m.a !== null) {
      simSingleCupMatch(cupKey, stageKey, idx, se);
    }
  });
  autoSaveHistory();
  render();
}

function simulateEntireCup64(cup, cupKey, se) {
  var stages = ["r64", "r32", "r16", "qf", "sf", "final"];
  stages.forEach(function(st) {
    simCupStage(cupKey, st, se);
  });
  return cup.final[0].res ? cup.final[0].res.winner : null;
}

function manualRedrawCup(cupKey, se) {
  var s = H.seasons[se];
  if (!s || s.finalized) return;
  if (!confirm("Undi ulang bagan untuk musim ini? Pertandingan yang sudah dimainkan di turnamen ini akan direset.")) return;

  if (cupKey === 'fa') s.faCup64 = initFaCupEntrants(se, s);
  else s.leagueCup64 = initLeagueCupEntrants(se, s);

  autoSaveHistory();
  render();
}

// ==============================================================
// 8. FINALISASI, REGENERASI & PROMOSI/DEGRADASI
// ==============================================================
function applyPromotionRelegationAndDynastyBoost(se) {
  var s = H.seasons[se];
  var r = pseudoRandom(se * 6101 + 5);
  var t1Table = s.league[0].table.map(function(x){ return x[0]; });
  var t2Table = s.league[1].table.map(function(x){ return x[0]; });

  var t1Champ = t1Table[0];
  S.prestige[t1Champ] = clamp(S.prestige[t1Champ] + 4.0, 88, 98);
  for (var topIdx = 1; topIdx < 4; topIdx++) {
    var cTop = t1Table[topIdx];
    S.prestige[cTop] = clamp(S.prestige[cTop] + (3.0 - topIdx * 0.7), 84, 96);
  }

  var downT1toT2 = t1Table.slice(-T1_RELEGATION_COUNT);
  var upT2toT1 = t2Table.slice(0, T1_RELEGATION_COUNT);

  var midT2 = t2Table.slice(T1_RELEGATION_COUNT, -T2_RELEGATION_COUNT);
  var downT2toDormant = t2Table.slice(-T2_RELEGATION_COUNT);

  var activeSet = new Set(t1Table.concat(t2Table));
  var dormantCandidates = [];
  for (var id = 0; id < TOTAL_CLUBS; id++) {
    if (!activeSet.has(id)) {
      dormantCandidates.push({ id: id, pr: S.prestige[id] || 52 });
    }
  }
  dormantCandidates.sort(function(a, b){
    return (b.pr + (r() * 20 - 10)) - (a.pr + (r() * 20 - 10));
  });
  var upDormanttoT2 = dormantCandidates.slice(0, T2_RELEGATION_COUNT).map(function(x){ return x.id; });

  upDormanttoT2.forEach(function(cId) {
    ensureSquadForClub(cId, se + 1);
  });

  var newT1 = t1Table.slice(0, -T1_RELEGATION_COUNT).concat(upT2toT1);
  var newT2 = midT2.concat(downT1toT2, upDormanttoT2);

  S.mem = [newT1, newT2];
  s.moves = {
    up2to1: upT2toT1,
    down1to2: downT1toT2,
    upDormantTo2: upDormanttoT2,
    down2ToDormant: downT2toDormant
  };
}

function commitSeasonPlayerStats(se) {
  var s = H.seasons[se];
  for (var t = 0; t < s.tiers.length; t++) {
    s.tiers[t].forEach(function(cId) {
      (PLAYERS_DB[cId] || []).forEach(function(p) {
        var c = p.career;
        c.goals += p.sg; c.assists += p.sa; c.seasons++;
        c.minutes = (c.minutes || 0) + (p.smin || 0);
        c.apps = (c.apps || 0) + (p.sapp || 0);
        c.starts = (c.starts || 0) + (p.sstart || 0);
        if (t === 0) { c.t1Goals += p.sg; c.t1Seasons++; }
        p.hist.push([se, +cId, t, p.sg, p.sa, p.ovr, p.age, p.smin || 0, p.sapp || 0, p.sstart || 0]);
        p.sg = 0; p.sa = 0; p.smin = 0; p.sapp = 0; p.sstart = 0;
      });
    });
  }
}

function simulateSeasonIndividualAwards(se) {
  var s = H.seasons[se];
  if (s.awards) return;
  var idx = buildPlayerIndex();
  var L = s.league;

  var allT1Players = [];
  s.tiers[0].forEach(function(cId){ (PLAYERS_DB[cId] || []).forEach(function(p){ allT1Players.push(p); }); });
  allT1Players.sort(function(a,b){ return (b.sg - a.sg) || (b.sa - a.sa) || (b.ovr - a.ovr); });

  var tp = allT1Players[0];
  if (tp) tp.career.t1Boots++;

  var lowSc = L[1].scorers[0];
  var lowPl = lowSc ? idx[lowSc[0]] : null;
  if (lowPl) lowPl.career.lowBoots++;

  var champ = s.league[0].table[0][0];
  var best = null, bestScore = -1e9, bestClub = null;
  s.tiers[0].forEach(function(cId) {
    (PLAYERS_DB[cId] || []).forEach(function(p) {
      var sc = p.sg + 0.7 * p.sa + (p.ovr - 70) * 0.8 + 
               (cId === champ ? 15 : 0) + (cId === s.faWinner ? 6 : 0) + (cId === s.lcWinner ? 4 : 0);
      if (sc > bestScore) { bestScore = sc; best = p; bestClub = cId; }
    });
  });
  if (best) best.career.mvp++;

  s.awards = {
    mvp: best ? { id: best.id, name: best.name, club: bestClub, ovr: best.ovr, mvpCount: best.career.mvp } : { id: 0, name: '—', club: 0, ovr: 0, mvpCount: 0 },
    t1Scorer: tp ? { id: tp.id, name: tp.name, club: tp.club, goals: tp.sg, assists: tp.sa, bootsCount: tp.career.t1Boots } : { id: 0, name: '—', club: 0, goals: 0, assists: 0, bootsCount: 0 },
    t2Scorer: lowPl ? { id: lowPl.id, name: lowPl.name, club: lowSc[2], goals: lowSc[3] } : { id: 0, name: '—', club: 0, goals: 0 }
  };
}

function recalculateTrophyCabinet() {
  var cab = {};
  function C(c){
    if (!cab[c]) cab[c] = { t1: 0, fa: 0, lc: 0, doubles: 0, trebles: 0, pts: 0 };
    return cab[c];
  }
  var max = getMaxSeasonInArchive();
  for (var se = 1; se <= max; se++) {
    var s = H.seasons[se];
    if (!s || !s.leagueDone) continue;

    var lChamp = s.league[0].table[0][0];
    C(lChamp).t1++; C(lChamp).pts += 15;

    if (s.faWinner !== null) { C(s.faWinner).fa++; C(s.faWinner).pts += 8; }
    if (s.lcWinner !== null) { C(s.lcWinner).lc++; C(s.lcWinner).pts += 5; }

    if (lChamp === s.faWinner && lChamp === s.lcWinner) {
      C(lChamp).trebles++; C(lChamp).pts += 30;
    } else if (lChamp === s.faWinner) {
      C(lChamp).doubles++; C(lChamp).pts += 15;
    }
  }
  H.clubStats = cab;
}

function purgeArchivedSeasonFixtures(startSe, endSe) {
  for (var s = startSe; s <= endSe; s++) {
    var sn = H.seasons[s];
    if (sn && !sn.fixturesPurged) {
      if (sn.league) {
        sn.league.forEach(function(tier) {
          tier.jornadas = [];
        });
      }
      if (sn.faCup64) {
        sn.faCup64.r64 = []; sn.faCup64.r32 = []; sn.faCup64.r16 = [];
        sn.faCup64.qf = []; sn.faCup64.sf = [];
      }
      if (sn.leagueCup64) {
        sn.leagueCup64.r64 = []; sn.leagueCup64.r32 = []; sn.leagueCup64.r16 = [];
        sn.leagueCup64.qf = []; sn.leagueCup64.sf = [];
      }
      sn.fixturesPurged = true;
    }
  }
}

function finalizeSeason(se) {
  var s = H.seasons[se];
  if (s.finalized) return;

  simulateSeasonIndividualAwards(se);
  commitSeasonPlayerStats(se);
  applyPromotionRelegationAndDynastyBoost(se);
  agePlayersOneYear(se);
  s.transfers = runTransferMarket(se);
  s.finalized = true;

  if (se % 50 === 0) {
    var startBlock = se - 49;
    var endBlock = se;
    exportBatchDetailedHtml(startBlock, endBlock);
    purgeArchivedSeasonFixtures(startBlock, endBlock);
  }

  H.seasons[se + 1] = createBlankSeasonObject(se + 1);
  recalculateTrophyCabinet();
}

function simulateFullSeasonInternal(se, noSnap) {
  var s = H.seasons[se];
  if (!s || s.finalized) return;

  if (!noSnap && (!S.undo || S.undo.se !== se)) takeSnapshot(se);

  s.league = [0, 1].map(function(t){ return playTierLeague(s.tiers[t], t, se); });
  s.currentJornada = (s.tiers[0].length - 1) * 2;
  s.leagueDone = true;
  s.premierChampion = s.league[0].table[0][0];

  if (!s.faCup64) s.faCup64 = initFaCupEntrants(se, s);
  s.faWinner = simulateEntireCup64(s.faCup64, 'fa', se);
  s.faRunner = s.faCup64.final[0].res ? s.faCup64.final[0].res.loser : null;

  if (!s.leagueCup64) s.leagueCup64 = initLeagueCupEntrants(se, s);
  s.lcWinner = simulateEntireCup64(s.leagueCup64, 'lc', se);
  s.lcRunner = s.leagueCup64.final[0].res ? s.leagueCup64.final[0].res.loser : null;

  finalizeSeason(se);
}

function advanceSingleJornada(se) {
  var s = H.seasons[se];

  $('#status-label').textContent = 'Simulating Matchday...';

  setTimeout(function() {
    if (!s.league) {
      if (!S.undo || S.undo.se !== se) takeSnapshot(se);
      s.league = [0, 1].map(function(t){ return playTierLeague(s.tiers[t], t, se); });
      s.currentJornada = 0;
    }

    var maxJ = (s.tiers[0].length - 1) * 2;
    if (s.currentJornada < maxJ) {
      s.currentJornada++;
      selectedJornada = s.currentJornada;

      for (var t = 0; t < 2; t++) {
        s.league[t].table = recalculateTableUpToJornada(s.league[t], s.currentJornada);
      }

      if (s.currentJornada >= maxJ) {
        s.leagueDone = true;
        s.premierChampion = s.league[0].table[0][0];

        if (!s.faWinner && s.faCup64) s.faWinner = simulateEntireCup64(s.faCup64, 'fa', se);
        if (!s.lcWinner && s.leagueCup64) s.lcWinner = simulateEntireCup64(s.leagueCup64, 'lc', se);

        finalizeSeason(se);
      }
    }

    autoSaveHistory();

function recalculateTableUpToJornada(tierData, playedJornadas) {
  var stats = {};
  tierData.table.forEach(function(r) {
    stats[r[0]] = { id: r[0], W: 0, D: 0, L: 0, GF: 0, GA: 0, pts: 0 };
  });

  for (var j = 0; j < playedJornadas; j++) {
    var matches = tierData.jornadas[j] || [];
    matches.forEach(function(m) {
      var h = stats[m[0]], a = stats[m[1]], gh = m[2], ga = m[3];
      h.GF += gh; h.GA += ga;
      a.GF += ga; a.GA += gh;
      if (gh > ga) { h.W++; h.pts += 3; a.L++; }
      else if (gh < ga) { a.W++; a.pts += 3; h.L++; }
      else { h.D++; h.pts += 1; a.D++; a.pts += 1; }
    });
  }

  var res = [];
  Object.keys(stats).forEach(function(k){
    var x = stats[k];
    res.push([x.id, x.W, x.D, x.L, x.GF, x.GA, x.pts]);
  });
  return res.sort(function(a, b) {
    return (b[6] - a[6]) || ((b[4] - b[5]) - (a[4] - a[5])) || (b[4] - a[4]) || (a[0] - b[0]);
  });
}

function takeSnapshot(se) {

}

function getMaxSeasonInArchive() {

}

function getErasDefinition() {
  var total = getMaxSeasonInArchive();
  var span = Math.max(50, Math.ceil(total / 4));
  return [
    { id: 1, name: "Era of the Founders", range: [1, span], desc: "Establishment of the national 370-club pyramid and pure two-tier professional league." },
    { id: 2, name: "Era of the Twin Cups", range: [span + 1, span * 2], desc: "Rise of 64-club home & away knockout cup tournaments and classic underdog runs." },
    { id: 3, name: "Era of Tactical Dynasties", range: [span * 2 + 1, span * 3], desc: "Fierce multi-season battles for the prestigious League and FA Cup Treble." },
    { id: 4, name: "Era of Perpetual Glory", range: [span * 3 + 1, Math.max(total, span * 4)], desc: "Endless marathon of promotion, relegation, and all-time hall of fame records." }
  ];
}

function getEraForSeason(se) {
  var eras = getErasDefinition();
  for (var i = 0; i < eras.length; i++) {
    if (se >= eras[i].range[0] && se <= eras[i].range[1]) return eras[i].id;
  }
  return eras[eras.length - 1].id;
}

function exportBatchDetailedHtml(startSe, endSe) {
  var exportSeasons = {};
  for (var se = startSe; se <= endSe; se++) {
    if (H.seasons[se] && H.seasons[se].leagueDone) {
      var snCopy = JSON.parse(JSON.stringify(H.seasons[se]));

      ['faCup64', 'leagueCup64'].forEach(function(cupKey) {
        var cup = snCopy[cupKey];
        var statKey = cupKey === 'faCup64' ? 'faStats' : 'lcStats';
        var pMap = {};
        if (cup) {
          ["r64", "r32", "r16", "qf", "sf", "final"].forEach(function(stKey) {
            (cup[stKey] || []).forEach(function(m) {
              if (!m.res) return;
              var allEv = [];
              if (m.res.eventsH) allEv = allEv.concat(m.res.eventsH);
              if (m.res.eventsA) allEv = allEv.concat(m.res.eventsA);
              if (m.res.eventsH1) allEv = allEv.concat(m.res.eventsH1);
              if (m.res.eventsA1) allEv = allEv.concat(m.res.eventsA1);
              if (m.res.eventsH2) allEv = allEv.concat(m.res.eventsH2);
              if (m.res.eventsA2) allEv = allEv.concat(m.res.eventsA2);

              allEv.forEach(function(ev) {
                var scId = ev[0], asId = ev[1];
                if (scId) {
                  if (!pMap[scId]) pMap[scId] = { id: scId, g: 0, a: 0, club: m.h };
                  pMap[scId].g++;
                }
                if (asId) {
                  if (!pMap[asId]) pMap[asId] = { id: asId, g: 0, a: 0, club: m.a };
                  pMap[asId].a++;
                }
              });
            });
          });
        }
        var list = Object.keys(pMap).map(function(k){ return pMap[k]; });
        snCopy[statKey] = {
          scorers: list.slice().filter(function(x){ return x.g > 0; }).sort(function(a, b){ return b.g - a.g || b.a - a.a; }).slice(0, 15),
          assisters: list.slice().filter(function(x){ return x.a > 0; }).sort(function(a, b){ return b.a - a.a || b.g - a.g; }).slice(0, 10)
        };
      });

      exportSeasons[se] = snCopy;
    }
  }

  var payload = {
    startSe: startSe,
    endSe: endSe,
    clubNames: S.name,
    seasons: exportSeasons,
    firstNames: FIRST_NAMES_EN,
    lastNames: LAST_NAMES_EN
  };

  var templateEl = document.getElementById('offline-html-template');
  if (!templateEl) return;

  var rawTemplate = templateEl.innerHTML;
  var safeJson = JSON.stringify(payload);
  var finalHtml = rawTemplate.replace('__DATA_PLACEHOLDER__', safeJson);

  var blob = new Blob([finalHtml], { type: 'text/html;charset=utf-8' });
  var blobUrl = URL.createObjectURL(blob);
  window.open(blobUrl, '_blank');

  var a = document.createElement('a');
  a.href = blobUrl;
  a.download = 'wimbledon_archive_S' + startSe + '_S' + endSe + '.html';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function findPlayerRecord(id) {
  var clubs = Object.keys(PLAYERS_DB);
  for (var i = 0; i < clubs.length; i++) {
    var sq = PLAYERS_DB[clubs[i]];
    for (var j = 0; j < sq.length; j++) {
      if (sq[j].id === id) return { status: 'active', rec: sq[j], club: +clubs[i] };
    }
  }
  var lg = (S.legends || []);
  for (var k = 0; k < lg.length; k++) if (lg[k].id === id) return { status: 'legend', rec: lg[k], club: lg[k].club };
  return null;
}

function openPlayerSeasonLog(pId, se) {
  var sn = H.seasons[se];
  if (!sn || !sn.league) {
    alert("Simulate the season first to view logs.");
    return;
  }
  var pRec = findPlayerRecord(pId);
  var pName = pRec && pRec.rec ? pRec.rec.name : nameFromId(pId);
  var playerClub = -1, targetTier = -1;

  for (var t = 0; t < sn.tiers.length; t++) {
    var clubs = sn.tiers[t];
    for (var c = 0; c < clubs.length; c++) {
      var cid = clubs[c];
      var sq = PLAYERS_DB[cid] || [];
      if (sq.some(function(p){ return p.id === pId; })) {
        playerClub = cid; targetTier = t; break;
      }
    }
    if (playerClub !== -1) break;
  }

  if (playerClub === -1) {
    alert("Player not in active squad for Season " + se);
    return;
  }

  var L = sn.league[targetTier];
  var jornadas = L.jornadas || [];
  var totalJ = (sn.tiers[targetTier].length - 1) * 2;
  var playedCount = sn.leagueDone ? totalJ : (sn.currentJornada || 0);
  var logRows = [];
  var totalMins = 0, totalStarts = 0, totalSubsIn = 0, totalUnused = 0, totalGoals = 0, totalAssists = 0;

  for (var jIdx = 0; jIdx < playedCount; jIdx++) {
    var jMatches = jornadas[jIdx] || [];
    var m = jMatches.find(function(match){ return match[0] === playerClub || match[1] === playerClub; });
    if (!m) continue;

    var isHome = m[0] === playerClub;
    var oppId = isHome ? m[1] : m[0];
    var scoreTxt = isHome ? (m[2] + ' - ' + m[3]) : (m[3] + ' - ' + m[2]);
    var xiList = isHome ? (m[6] || []) : (m[7] || []);
    var benchList = isHome ? (m[8] || []) : (m[9] || []);
    var subs = isHome ? (m[10] || []) : (m[11] || []);
    var events = isHome ? (m[4] || []) : (m[5] || []);

    var subIn = subs.find(function(sb){ return sb[1] === pId; });
    var subOut = subs.find(function(sb){ return sb[0] === pId; });
    var statusTxt = '', matchMin = 0;

    if (xiList.indexOf(pId) !== -1) {
      totalStarts++;
      if (subOut) { matchMin = subOut[2]; statusTxt = '<b style="color:var(--gold-bright);">Starter</b> <span style="color:var(--danger);font-size:11px;">[Out ' + subOut[2] + '\']</span>'; }
      else { matchMin = 90; statusTxt = '<b style="color:var(--gold-bright);">Starter (90\')</b>'; }
    } else if (subIn) {
      totalSubsIn++; matchMin = 90 - subIn[2]; statusTxt = '<b style="color:var(--ok);">Sub In (' + subIn[2] + '\')</b>';
    } else if (benchList.indexOf(pId) !== -1) {
      totalUnused++; statusTxt = '<span style="color:var(--muted);">Bench</span>';
    }

    totalMins += matchMin;
    var g = events.filter(function(ev){ return ev[0] === pId; }).length;
    var a = events.filter(function(ev){ return ev[1] === pId; }).length;
    totalGoals += g; totalAssists += a;

    var contrib = [];
    if (g > 0) contrib.push('⚽ ' + g + ' G');
    if (a > 0) contrib.push('🎯 ' + a + ' A');

    logRows.push('<tr><td class="mono">M.' + (jIdx + 1) + '</td><td>' + (isHome ? 'vs ' : '@ ') + getClubName(oppId) + '</td><td class="mono">' + scoreTxt + '</td><td>' + statusTxt + '</td><td class="mono" style="color:var(--gold-bright);">' + matchMin + '\'</td><td style="color:var(--gold-bright);font-weight:600;">' + (contrib.join(' · ') || '—') + '</td></tr>');

    '<div style="background:#111827;border:1px solid #1e293b;padding:8px;border-radius:6px;text-align:center;"><span style="font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;">Total Minutes</span><b class="mono" style="display:block;font-size:16px;color:var(--gold-bright);">' + totalMins + '\'</b></div>' +
    '<div style="background:#111827;border:1px solid #1e293b;padding:8px;border-radius:6px;text-align:center;"><span style="font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;">Appearances</span><b class="mono" style="display:block;font-size:16px;color:var(--ac);">' + (totalStarts + totalSubsIn) + '</b></div>' +
    '<div style="background:#111827;border:1px solid #1e293b;padding:8px;border-radius:6px;text-align:center;"><span style="font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;">Starts / Subs</span><b class="mono" style="display:block;font-size:15px;color:#cbd5e1;">' + totalStarts + ' / ' + totalSubsIn + '</b></div>' +
    '<div style="background:#111827;border:1px solid #1e293b;padding:8px;border-radius:6px;text-align:center;"><span style="font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;">Goals / Assists</span><b class="mono" style="display:block;font-size:15px;color:var(--gold-bright);">⚽ ' + totalGoals + ' · 🎯 ' + totalAssists + '</b></div>' +
  '</div>';

  $('#am-kicker').textContent = 'Matchday Performance Tracker · Season ' + se;
  $('#am-title').textContent = pName + ' (' + getClubName(playerClub) + ')';
  $('#am-body').innerHTML = summaryBanner +
    '<div class="table-wrap" style="max-height:55vh;overflow-y:auto;"><table><tr><th>Round</th><th>Opponent</th><th>Score</th><th>Status</th><th>Mins</th><th>Contributions</th></tr>' +
      (logRows.join('') || '<tr><td colspan=6 style="text-align:center;padding:12px;">No appearances yet.</td></tr>') +
    '</table></div>';
  $('#archive-modal').classList.add('active');
}

function openMatchDetailsModal(tierIdx, jornadaIdx, matchIdx, se) {
  var sn = H.seasons[se];
  if (!sn || !sn.league || !sn.league[tierIdx] || !sn.league[tierIdx].jornadas) return;
  var m = sn.league[tierIdx].jornadas[jornadaIdx][matchIdx];
  if (!m) return;

  var homeId = m[0], awayId = m[1], gh = m[2], ga = m[3];
  var allEvents = [];
  (m[4] || []).forEach(function(e){ allEvents.push({ type: 'goal', side: 'h', sc: e[0], as: e[1], min: e[2] }); });
  (m[5] || []).forEach(function(e){ allEvents.push({ type: 'goal', side: 'a', sc: e[0], as: e[1], min: e[2] }); });
  (m[10] || []).forEach(function(s){ allEvents.push({ type: 'sub', side: 'h', out: s[0], in: s[1], min: s[2] }); });
  (m[11] || []).forEach(function(s){ allEvents.push({ type: 'sub', side: 'a', out: s[0], in: s[1], min: s[2] }); });
  allEvents.sort(function(a, b){ return a.min - b.min; });

  var timelineHtml = allEvents.length ? allEvents.map(function(ev){
    var teamTxt = ev.side === 'h' ? getClubName(homeId) : getClubName(awayId);
    if (ev.type === 'goal') {
      var asTxt = ev.as ? ' · <span style="color:var(--ac);">Assist: ' + playerLink(ev.as, nameFromId(ev.as)) + '</span>' : ' · <i>Unassisted</i>';
      return '<div class="timeline-item"><span class="minute-badge">' + ev.min + '\'</span><div>⚽ <b>' + playerLink(ev.sc, nameFromId(ev.sc)) + '</b> (' + teamTxt + ')' + asTxt + '</div></div>';
    } else {
      return '<div class="timeline-item"><span class="minute-badge" style="color:#fdba74;">' + ev.min + '\'</span><div style="color:var(--muted);">🔄 (' + teamTxt + ') IN: <b>' + playerLink(ev.in, nameFromId(ev.in)) + '</b> ➔ OUT: <b>' + playerLink(ev.out, nameFromId(ev.out)) + '</b></div></div>';
    }
  }).join('') : '<div style="color:var(--muted);padding:8px 0;">No key events recorded in this match.</div>';

  var renderLineupList = function(ids) {
    return ids.map(function(id, idx){
      var p = findPlayerRecord(id);
      var posTxt = p && p.rec ? p.rec.pos : 'N/A';
      return '<div style="padding:2px 0;"><b>' + (idx+1) + '.</b> ' + playerLink(id, nameFromId(id)) + ' <span class="mono" style="color:var(--ac);font-size:10px;">[' + posTxt + ']</span></div>';
    }).join('');
  };

  $('#am-kicker').textContent = TIER_NAMES[tierIdx] + ' · Matchday ' + (jornadaIdx + 1) + ' · Season ' + se;
  $('#am-title').textContent = getClubName(homeId) + ' ' + gh + ' - ' + ga + ' ' + getClubName(awayId);
  $('#am-body').innerHTML =
    '<div style="text-align:center;padding:12px;background:#0c1322;border:1px solid #1e293b;border-radius:8px;margin-bottom:16px;">' +
      '<div style="font-size:32px;font-family:\'JetBrains Mono\';font-weight:900;color:var(--gold-bright);">' + gh + ' - ' + ga + '</div>' +
      '<div style="font-size:13px;color:#cbd5e1;"><b>' + getClubName(homeId) + '</b> vs <b>' + getClubName(awayId) + '</b></div>' +
    '</div>' +
    '<h4 style="color:var(--gold-bright);margin-bottom:6px;">⏱️ Match Events &amp; Timeline</h4>' +
    '<div style="background:#0e1526;border:1px solid #1e293b;border-radius:8px;padding:10px 14px;margin-bottom:16px;">' + timelineHtml + '</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">' +
      '<div class="lineup-box"><h4 style="color:var(--gold-bright);padding-bottom:4px;margin-bottom:6px;">👕 ' + getClubName(homeId) + '</h4>' + renderLineupList(m[6] || []) + '<div style="font-weight:700;margin-top:8px;color:var(--muted);">Bench:</div>' + renderLineupList(m[8] || []) + '</div>' +
      '<div class="lineup-box"><h4 style="color:var(--gold-bright);padding-bottom:4px;margin-bottom:6px;">👕 ' + getClubName(awayId) + '</h4>' + renderLineupList(m[7] || []) + '<div style="font-weight:700;margin-top:8px;color:var(--muted);">Bench:</div>' + renderLineupList(m[9] || []) + '</div>' +
    '</div>';
  $('#archive-modal').classList.add('active');
}

function openClub5SeasonFormModal(clubId, targetSe) {
  var cName = getClubName(clubId);
  var startSe = Math.max(1, targetSe - 5);
  var endSe = Math.max(1, targetSe - 1);
  var rows = [];
  var trophies = 0, played = 0;

  if (targetSe > 1) {
    for (var s = endSe; s >= startSe; s--) {
      var sn = H.seasons[s];
      if (!sn || !sn.leagueDone) continue;
      played++;
      var posTxt = '—';
      for (var t = 0; t < sn.tiers.length; t++) {
        var tab = sn.league[t].table;
        for (var i = 0; i < tab.length; i++) {
          if (tab[i][0] === clubId) {
            posTxt = TIER_SHORT[t] + ' · #' + (i + 1) + ' (' + tab[i][6] + ' pts)';
            if (t === 0 && i === 0) { posTxt += ' 🏆 Champion'; trophies++; }
            break;
          }
        }
      }
      var faText = (sn.faWinner === clubId) ? (trophies++, "🏆 Winner") : ((sn.faRunner === clubId) ? "🥈 Finalist" : "—");
      var lcText = (sn.lcWinner === clubId) ? (trophies++, "🏆 Winner") : ((sn.lcRunner === clubId) ? "🥈 Finalist" : "—");
      rows.push({ season: s, lg: posTxt, fa: faText, lc: lcText });
    }
  }

  $('#am-kicker').textContent = 'Club Momentum & Dynamic Progress';
  $('#am-title').textContent = cName + ' (Leading to Season ' + targetSe + ')';
  $('#am-body').innerHTML =
    '<div class="p-grid">' +
      '<div class="p-stat-box"><span>Trophies Won (5 Yrs)</span><b>' + trophies + '</b></div>' +
      '<div class="p-stat-box"><span>Seasons Recorded</span><b>' + played + '</b></div>' +
      '<div class="p-stat-box"><span>Current Prestige</span><b>' + (S.prestige[clubId] || 0).toFixed(1) + '</b></div>' +
      '<div class="p-stat-box"><span>Squad Strength</span><b>' + clubStrength(clubId).toFixed(1) + '</b></div>' +
    '</div>' +
    '<h4 style="color:var(--gold-bright);margin-top:14px;border-bottom:1px solid #1e293b;padding-bottom:4px;">📜 Last 5 Seasons Track Record</h4>' +
    '<div class="table-wrap"><table><tr><th>Season</th><th>League Finish</th><th>FA Cup</th><th>League Cup</th></tr>' +
      (rows.map(function(r){ return '<tr><td class="mono"><b>S.' + r.season + '</b></td><td>' + r.lg + '</td><td style="color:var(--gold-bright);">' + r.fa + '</td><td style="color:var(--ac);">' + r.lc + '</td></tr>'; }).join('') || '<tr><td colspan=4 style="text-align:center;">No past data.</td></tr>') +
    '</table></div>';
  $('#archive-modal').classList.add('active');
}
