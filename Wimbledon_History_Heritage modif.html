function seasonSelectorHtml() {
  var keys = Object.keys(H.seasons).map(Number).sort(function(a, b){ return a - b; });
  return '<select onchange="selectedSeason=+this.value;selectedJornada=1;render();">' +
    keys.map(function(se) {
      var s = H.seasons[se];
      var tx = s.finalized ? ' [PL Champ: ' + getClubName(s.premierChampion) + ' | FA: ' + getClubName(s.faWinner) + ']' : (s.leagueDone ? ' (Finished)' : ' (Unplayed)');
      return '<option value="' + se + '"' + (se === selectedSeason ? ' selected' : '') + '>Season ' + se + tx + '</option>';
    }).join('') + '</select>';
}

function renderBracket64UI(cupData, title, desc, cupWinner, cupRunner, cupKey) {
  if (!cupData) return '<div class="editorial-card"><p style="color:var(--muted);">Tournament bracket not generated.</p></div>';

  var roundNames = ["Round of 64", "Round of 32", "Round of 16", "Quarter-Finals", "Semi-Finals", "Grand Final"];
  var roundKeys = ["r64", "r32", "r16", "qf", "sf", "final"];

  var colsHtml = roundKeys.map(function(key, idx){
    var matches = cupData[key] || [];
    var canSimRound = matches.some(function(m){ return !m.res && m.h !== null && m.a !== null; });

    var mBoxes = matches.map(function(m, mIdx){
      var res = m.res;
      var ready = m.h !== null && m.a !== null;
      var wH = res && res.winner === m.h;
      var wA = res && res.winner === m.a;
      var sc = res ? (res.isFinal ? (res.gh + ' - ' + res.ga + (res.penH ? ' (' + res.penH + 'p)' : '')) : (res.aggH + ' - ' + res.aggA + ' [Agg]')) : 'VS';
      var legsTxt = (res && !res.isFinal) ? '<div style="font-size:10px;color:var(--muted);text-align:center;">L1: ' + res.gh.split('/')[0] + '-' + res.ga.split('/')[0] + ' · L2: ' + res.ga.split('/')[1] + '-' + res.gh.split('/')[1] + '</div>' : '';

      var simBtn = (ready && !res) ? '<button type="button" class="btn-ui btn-sm" style="margin-top:4px;width:100%;" onclick="simSingleCupMatch(\'' + cupKey + '\',\'' + key + '\',' + mIdx + ',' + selectedSeason + ')">⚡ Sim Match</button>' : '';

      return '<div class="match-box">' +
        '<div class="match-line ' + (wH ? 'match-winner' : '') + '"><span>' + (m.h !== null ? getClubName(m.h) + ' ' + getClubPriorFinishTag(m.h, selectedSeason) : 'TBD') + '</span></div>' +
        '<div class="match-line ' + (wA ? 'match-winner' : '') + '"><span>' + (m.a !== null ? getClubName(m.a) + ' ' + getClubPriorFinishTag(m.a, selectedSeason) : 'TBD') + '</span></div>' +
        '<div style="text-align:center;font-family:\'JetBrains Mono\';font-weight:700;color:var(--gold-bright);font-size:11px;margin-top:4px;">' + sc + '</div>' +
        legsTxt +
        simBtn +
      '</div>';
    }).join('');

    var roundHeaderBtn = canSimRound ? '<button type="button" class="btn-gold btn-sm" style="width:100%;margin-bottom:6px;" onclick="simCupStage(\'' + cupKey + '\',\'' + key + '\',' + selectedSeason + ')">⚡ Sim All ' + roundNames[idx] + '</button>' : '';

    return '<div class="bracket-round-col"><h4 style="color:var(--gold-bright);margin-bottom:6px;font-size:13px;">' + roundNames[idx] + '</h4>' + roundHeaderBtn + mBoxes + '</div>';
  }).join('');

  return '<div class="editorial-card">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:gap:8px;margin-bottom:12px;">' +
      '<div><span class="kicker">Official 64-Club Knockout Tournament</span><h2 style="color:#fff;">' + title + ' — Season ' + selectedSeason + '</h2></div>' +
      '<div style="display:flex;gap:6px;"><button type="button" class="btn-ui btn-sm" onclick="manualRedrawCup(\'' + cupKey + '\',' + selectedSeason + ')">🎲 Re-Draw Bracket</button></div>' +
    '</div>' +
    (cupWinner !== null ? '<div style="background:#131c30;border:1px solid var(--gold);padding:8px 14px;border-radius:6px;margin-bottom:14px;font-size:13px;color:var(--gold-bright);">' +
      '👑 <b>Champion: ' + getClubName(cupWinner) + '</b> ' + getClubPriorFinishTag(cupWinner, selectedSeason) + ' · Runner-up: ' + getClubName(cupRunner) + '</div>' : '') +
    '<div class="bracket-scroll-container">' + colsHtml + '</div>' +
  '</div>';
}

function renderLeagueTab(cur) {
  var html = '<div class="season-selector-bar">' +
    '<div style="display:flex;align-items:center;gap:8px;"><span>Select Season: </span>' + seasonSelectorHtml() + '</div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
      [0, 1].map(function(t) {
        return '<button type="button" class="comp-btn ' + (selectedTier === t ? 'active' : '') + '" onclick="selectedTier=' + t + ';selectedJornada=1;fixturesClubFilter=-1;render();">' + TIER_SHORT[t] + ' · ' + TIER_NAMES[t] + '</button>';
      }).join('') +
    '</div></div>';

  var totalJ = (cur.tiers[0].length - 1) * 2;
  if (!cur.leagueDone) {
    html += '<div class="editorial-card" style="text-align:center;">' +
      '<span class="kicker">Season ' + cur.season + ' in Progress</span>' +
      '<h3 style="color:#fff;margin:6px 0;">Current Round: ' + cur.currentJornada + ' / ' + totalJ + '</h3>' +
      '<div style="display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap;">' +
        '<button type="button" class="btn-gold" onclick="advanceSingleJornada(' + cur.season + ')">⚡ Simulate Round ' + (cur.currentJornada + 1) + '</button>' +
        '<button type="button" class="btn-ui" onclick="simulateLeagueOnly(' + cur.season + ')">⏩ Complete Season Instantly</button>' +
      '</div></div>';
    if (cur.currentJornada === 0) return html;
  }

  var t = selectedTier;
  var L = cur.league[t];
  var n = L.table.length;
  var playedCount = cur.leagueDone ? totalJ : cur.currentJornada;

  var rows = L.table.map(function(row, i) {
    var pos = i + 1, zone = '';
    if (t === 0) {
      if (pos === 1) zone = 'zone-champ';
      else if (pos > n - T1_RELEGATION_COUNT) zone = 'zone-down';
    } else {
      if (pos <= T1_RELEGATION_COUNT) zone = 'zone-up';
      else if (pos > n - T2_RELEGATION_COUNT) zone = 'zone-down';
    }
    var gd = row[4] - row[5];
    return '<tr class="' + zone + '">' +
      '<td class="mono">' + pos + '</td>' +
      '<td>' + clubLinkAt(row[0], cur.season + 1) + ' ' + getClubPriorFinishTag(row[0], cur.season) + (t === 0 && pos === 1 ? ' <span style="color:var(--gold-bright);font-weight:bold;">🏆 Champion</span>' : '') + '</td>' +
      '<td class="mono">' + playedCount + '</td>' +
      '<td class="mono">' + row[1] + '</td><td class="mono">' + row[2] + '</td><td class="mono">' + row[3] + '</td>' +
      '<td class="mono">' + row[4] + '</td><td class="mono">' + row[5] + '</td>' +
      '<td class="mono">' + (gd > 0 ? '+' : '') + gd + '</td>' +
      '<td class="mono" style="color:var(--gold-bright);font-weight:700;">' + row[6] + '</td></tr>';
  }).join('');

  var legendTxt = t === 0 ?
    '<span><i style="background:var(--gold-bright)"></i>Premier Champion (#1)</span><span><i style="background:var(--danger)"></i>Relegated to Championship (Bottom 6)</span>' :
    '<span><i style="background:var(--ok)"></i>Promoted to Premier League (Top 6)</span><span><i style="background:var(--danger)"></i>Relegated to Dormant Pool (Bottom 10)</span>';

  var scorerRows = (L.scorers || []).map(function(x, i) {
    return '<tr><td class="mono">' + (i + 1) + '</td><td>' + playerLink(x[0], x[1]) + '</td><td>' + getClubName(x[2]) + '</td><td class="mono"><b style="color:var(--gold-bright);">' + x[3] + '</b></td><td class="mono">' + x[4] + '</td></tr>';
  }).join('');
  var assistRows = (L.assisters || []).map(function(x, i) {
    return '<tr><td class="mono">' + (i + 1) + '</td><td>' + playerLink(x[0], x[1]) + '</td><td>' + getClubName(x[2]) + '</td><td class="mono"><b style="color:var(--ac);">' + x[3] + '</b></td><td class="mono">' + x[4] + '</td></tr>';
  }).join('');

  html += '<div class="editorial-card">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">' +
      '<div><span class="kicker">Official Standings · 62 Matchdays</span><h2 style="color:#fff;">' + TIER_NAMES[t] + ' — Season ' + cur.season + '</h2></div>' +
      '<div style="font-size:12px;color:var(--muted);font-family:Inter;">32 Clubs · Leader: <b style="color:var(--gold-bright);">' + getClubName(L.table[0][0]) + '</b></div>' +
    '</div>' +
    '<div class="table-wrap" style="max-height:480px;overflow-y:auto;"><table>' +
      '<tr><th>#</th><th>Club</th><th>Pld</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr>' + rows +
    '</table></div>' +
    '<div class="zone-legend">' + legendTxt + '</div>' +
  '</div>';

  html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;">' +
    '<div class="editorial-card"><span class="kicker">Top Scorers ' + TIER_SHORT[t] + '</span><h3 style="color:#fff;margin-bottom:8px;">⚽ Top 15 Goalscorers</h3>' +
      '<div class="table-wrap"><table><tr><th>#</th><th>Player</th><th>Club</th><th>G</th><th>A</th></tr>' + (scorerRows || '<tr><td colspan=5 style="text-align:center;">No data recorded.</td></tr>') + '</table></div></div>' +
    '<div class="editorial-card"><span class="kicker">Playmakers ' + TIER_SHORT[t] + '</span><h3 style="color:#fff;margin-bottom:8px;">🎯 Top 10 Assists</h3>' +
      '<div class="table-wrap"><table><tr><th>#</th><th>Player</th><th>Club</th><th>A</th><th>G</th></tr>' + (assistRows || '<tr><td colspan=5 style="text-align:center;">No data recorded.</td></tr>') + '</table></div></div>' +
  '</div>';

  // Blok Jadwal Laga & Dossier Per Pekan
  if (L.jornadas && L.jornadas.length > 0) {
    if (selectedJornada > totalJ) selectedJornada = totalJ;
    if (selectedJornada < 1) selectedJornada = 1;

    var jMatches = L.jornadas[selectedJornada - 1] || [];
    var jOpts = '';
    for (var j = 1; j <= totalJ; j++) {
      jOpts += '<option value="' + j + '"' + (j === selectedJornada ? ' selected' : '') + '>Matchday ' + j + '</option>';
    }

    var fixRows = jMatches.map(function(m, idx) {
      return '<tr class="match-row-clickable">' +
        '<td class="mono">' + (idx + 1) + '</td>' +
        '<td style="text-align:right;">' + clubLinkAt(m[0], cur.season + 1) + '</td>' +
        '<td style="text-align:center;">' +
          '<button type="button" class="score-badge-btn" onclick="openMatchDetailsModal(' + t + ',' + (selectedJornada - 1) + ',' + idx + ',' + cur.season + ')">' + m[2] + ' - ' + m[3] + '</button>' +
        '</td>' +
        '<td>' + clubLinkAt(m[1], cur.season + 1) + '</td>' +
      '</tr>';
    }).join('');

    html += '<div class="editorial-card">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;">' +
        '<div><span class="kicker">Full Match Dossier &amp; Timeline</span><h3 style="color:var(--gold-bright);margin:0;">📜 Matchday Schedule &amp; Results</h3></div>' +
        '<div style="display:flex;gap:6px;align-items:center;font-size:12px;">' +
          '<button type="button" class="btn-ui" onclick="selectedJornada--;render();" ' + (selectedJornada === 1 ? 'disabled' : '') + '>◀ Prev</button>' +
          '<select onchange="selectedJornada=+this.value;render();" style="background:#1e293b;color:var(--gold-bright);border:1px solid #334155;border-radius:6px;padding:4px 8px;font-family:\'JetBrains Mono\';">' + jOpts + '</select>' +
          '<button type="button" class="btn-ui" onclick="selectedJornada++;render();" ' + (selectedJornada === totalJ ? 'disabled' : '') + '>Next ▶</button>' +
        '</div>' +
      '</div>' +
      '<div class="table-wrap"><table>' +
        '<tr><th style="width:40px;">No</th><th style="text-align:right;">Home Club</th><th style="text-align:center;width:110px;">Score Dossier</th><th>Away Club</th></tr>' +
        (fixRows || '<tr><td colspan=4 style="text-align:center;padding:14px;color:var(--muted);">No fixtures recorded.</td></tr>') +
      '</table></div></div>';
  }

  if (cur.moves) {
    var list = function(ids) { return ids.map(function(c){ return clubLinkAt(c, cur.season + 1); }).join(', '); };
    html += '<div class="editorial-card"><span class="kicker">Official Promotion &amp; Relegation Report</span><h3 style="color:#fff;margin-bottom:8px;">🔄 Tier Movements Season ' + cur.season + ' → ' + (
cur.season + 1) + '</h3>' +
      '<div style="font-family:Inter;font-size:12.5px;line-height:1.9;">' +
        '<div><span style="color:var(--ok);font-weight:700;">▲ Championship → Premier League (6 Clubs):</span> ' + list(cur.moves.up2to1) + '</div>' +
        '<div><span style="color:var(--danger);font-weight:700;">▼ Premier League → Championship (6 Clubs):</span> ' + list(cur.moves.down1to2) + '</div>' +
        '<div><span style="color:var(--ok);font-weight:700;">▲ Dormant Pool → Championship (10 Clubs):</span> ' + list(cur.moves.upDormantTo2) + '</div>' +
        '<div><span style="color:var(--danger);font-weight:700;">▼ Championship → Dormant Pool (10 Clubs):</span> ' + list(cur.moves.down2ToDormant) + '</div>' +
      '</div></div>';
  }
  return html;
}

function renderRosterTab(cur) {
  var allClubs = cur.tiers[0].concat(cur.tiers[1]);
  if (allClubs.indexOf(selectedRosterClub) === -1) selectedRosterClub = cur.tiers[0][0];

  var clubOpts = '';
  for (var t = 0; t < cur.tiers.length; t++) {
    clubOpts += '<optgroup label="' + TIER_NAMES[t] + '">';
    cur.tiers[t].forEach(function(cId) {
      clubOpts += '<option value="' + cId + '"' + (cId === selectedRosterClub ? ' selected' : '') + '>' + getClubName(cId) + '</option>';
    });
    clubOpts += '</optgroup>';
  }

  var sq = PLAYERS_DB[selectedRosterClub] || [];
  var rows = sq.map(function(p, i) {
    var c = p.career || {};
    return '<tr>' +
      '<td class="mono">' + (i + 1) + '</td>' +
      '<td>' + playerLink(p.id, p.name) + '</td>' +
      '<td class="mono"><span class="tag-pos">' + p.pos + '</span></td>' +
      '<td class="mono"><b>' + p.ovr + '</b></td>' +
      '<td class="mono">' + p.age + '</td>' +
      '<td class="mono" style="color:var(--gold-bright);">' + (p.smin || 0) + '\'</td>' +
      '<td class="mono"><b>' + (p.sg || 0) + '</b></td>' +
      '<td class="mono">' + (p.sa || 0) + '</td>' +
      '<td class="mono" style="color:var(--ac);">' + (c.goals || 0) + ' G · ' + (c.assists || 0) + ' A</td>' +
      '<td><button type="button" class="btn-ui btn-sm" onclick="openPlayerSeasonLog(' + p.id + ',' + cur.season + ')">Log</button></td>' +
    '</tr>';
  }).join('');

  return '<div class="editorial-card">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;">' +
      '<div><span class="kicker">Roster &amp; Statistics · Season ' + cur.season + '</span>' +
      '<h2 style="color:#fff;">' + getClubName(selectedRosterClub) + '</h2></div>' +
      '<select onchange="selectedRosterClub=+this.value;render();" style="background:#1e293b;color:var(--gold-bright);border:1px solid #334155;border-radius:6px;padding:5px 10px;font-family:Inter;font-size:12.5px;">' + clubOpts + '</select>' +
    '</div>' +
    '<div class="table-wrap"><table>' +
      '<tr><th>#</th><th>Player Name</th><th>Pos</th><th>OVR</th><th>Age</th><th>Mins S.' + cur.season + '</th><th>G</th><th>A</th><th>Career Totals</th><th>Action</th></tr>' +
      (rows || '<tr><td colspan=10 style="text-align:center;">No players registered.</td></tr>') +
    '</table></div></div>';
}

function renderTransfersTab(cur) {
  var logs = cur.transfers || [];
  var rows = logs.map(function(t, idx) {
    return '<tr>' +
      '<td class="mono">' + (idx + 1) + '</td>' +
      '<td><b>' + playerLink(t.pId, t.pName) + '</b> <span class="mono" style="color:var(--ac);font-size:11px;">[' + t.pos + ' · OVR ' + t.ovr + ']</span></td>' +
      '<td style="color:#f87171;">' + getClubName(t.from) + '</td>' +
      '<td style="color:#4ade80;font-weight:700;">➔ ' + getClubName(t.to) + '</td>' +
      '<td>' + t.type + '</td>' +
    '</tr>';
  }).join('');

  return '<div class="editorial-card">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;">' +
      '<div><span class="kicker">Official Transfer Market Gazette</span><h2 style="color:#fff;">Transfer Window Season ' + cur.season + '</h2></div>' +
      '<div style="font-size:12px;color:var(--gold-bright);font-weight:700;">Total Deals: ' + logs.length + ' Players</div>' +
    '</div>' +
    '<div class="table-wrap"><table><tr><th>No</th><th>Player</th><th>Selling Club</th><th>Buying Club</th><th>Deal Type</th></tr>' +
      (rows || '<tr><td colspan=5 style="text-align:center;padding:16px;color:var(--muted);">No completed transfers for this season.</td></tr>') +
    '</table></div></div>';
}

function renderHallOfFame() {
  var reg = [];
  Object.keys(PLAYERS_DB).forEach(function(cId) {
    PLAYERS_DB[cId].forEach(function(p) {
      reg.push({ id: p.id, name: p.name, status: 'active', age: p.age, ovr: p.ovr, club: +cId, c: p.career, score: legendScore(p.career) });
    });
  });
  (S.legends || []).forEach(function(l) {
    reg.push({ id: l.id, name: l.name, status: 'legend', age: l.age, ovr: l.ovr, club: l.club, c: l.career, score: legendScore(l.career) });
  });

  var topGoals = reg.filter(function(x){ return x.c.goals > 0; }).sort(function(a, b){ return b.c.goals - a.c.goals; }).slice(0, 10);
  var topT1 = reg.filter(function(x){ return x.c.t1Goals > 0; }).sort(function(a, b){ return b.c.t1Goals - a.c.t1Goals; }).slice(0, 10);
  var topMvp = reg.filter(function(x){ return x.c.mvp > 0; }).sort(function(a, b){ return b.c.mvp - a.c.mvp; }).slice(0, 10);
  var legends = reg.filter(function(x){ return x.status === 'legend'; }).sort(function(a, b){ return b.score - a.score; });

  var legendRows = legends.slice(0, 30).map(function(x, i) {
    return '<tr><td class="mono">' + (i + 1) + '</td><td>' + playerLink(x.id, x.name) + '</td><td>' + getClubName(x.club) + '</td>' +
      '<td class="mono"><b style="color:var(--gold-bright);">' + x.c.goals + '</b></td><td class="mono">' + x.c.assists + '</td>' +
      '<td class="mono">' + x.c.t1Boots + '</td><td class="mono">' + x.c.mvp + '</td><td class="mono" style="color:#c084fc;">' + Math.round(x.score) + '</td></tr>';
  }).join('');

  var makeList = function(title, items, fn, col) {
    return '<div class="editorial-card"><h4 style="color:#fff;margin-bottom:8px;">' + title + '</h4>' +
      items.map(function(x, i){
        return '<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #1a2438;font-size:12px;">' +
          '<div><b>' + (i+1) + '.</b> ' + playerLink(x.id, x.name) + ' (' + getClubName(x.club) + ')</div><b class="mono" style="color:' + col + ';">' + fn(x) + '</b></div>';
      }).join('') + '</div>';
  };

  return '<div class="editorial-card"><span class="kicker">Roll of Legends</span><h3 style="color:#fff;margin-bottom:8px;">🏛️ Retired Hall of Fame Legends</h3>' +
    '<div class="table-wrap"><table><tr><th>#</th><th>Player</th><th>Final Club</th><th>Goals</th><th>Assists</th><th>Boots</th><th>POTY</th><th>Score</th></tr>' +
      (legendRows || '<tr><td colspan=8 style="text-align:center;">No legends recorded yet.</td></tr>') +
    '</table></div></div>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;">' +
      makeList('⚽ Top Career Goalscorers', topGoals, function(x){ return x.c.goals + ' G'; }, 'var(--gold-bright)') +
      makeList('🥅 Premier League All-Time Goals', topT1, function(x){ return x.c.t1Goals + ' G'; }, 'var(--gold-bright)') +
      makeList('⭐ Player of the Season (POTY)', topMvp, function(x){ return x.c.mvp + 'x'; }, 'var(--ac)') +
    '</div>';
}

function renderCabinet() {
  recalculateTrophyCabinet();
  var sortedClubs = Object.keys(H.clubStats).map(function(cId) { return { id: +cId, st: H.clubStats[cId] }; })
    .sort(function(a, b) {
      return (b.st.pts - a.st.pts) || (b.st.t1 - a.st.t1) || (b.st.fa - a.st.fa) || (b.st.lc - a.st.lc);
    });

  var rows = sortedClubs.slice(0, 100).map(function(item, idx) {
    var st = item.st, badges = '';
    if (st.trebles > 0) badges += '<span class="badge-treble">' + st.trebles + 'x TREBLE</span>';
    if (st.doubles > 0) badges += '<span class="badge-double">' + st.doubles + 'x DOUBLE</span>';

    return '<tr>' +
      '<td class="mono">' + (idx + 1) + '</td>' +
      '<td><b>' + getClubName(item.id) + '</b> ' + badges + '</td>' +
      '<td><b style="color:var(--gold-bright);">' + st.t1 + 'x</b></td>' +
      '<td><b>' + st.fa + 'x</b></td>' +
      '<td><b>' + st.lc + 'x</b></td>' +
      '<td class="mono" style="font-size:14px;color:var(--ac);font-weight:700;">' + st.pts + ' pts</td></tr>';
  }).join('');

  return '<div class="editorial-card">' +
    '<span class="kicker">Museum of National Glory</span>' +
    '<h2 style="color:#fff;margin-bottom:8px;">All-Time Trophy Cabinet (370 Clubs)</h2>' +
    '<div class="info-note">Point System: Premier League Champion 15 · The FA Cup 8 · The League Cup 5 · Double (PL+FA) +15 · Treble (PL+FA+LC) +30.</div>' +
    '<div class="table-wrap"><table><tr><th>#</th><th>Club Name</th><th>Premier League</th><th>The FA Cup</th><th>The League Cup</th><th>Historic Pts</th></tr>' +
      (rows || '<tr><td colspan=6 style="text-align:center;padding:16px;">No trophies awarded yet.</td></tr>') +
    '</table></div></div>';
}

function renderLedger() {
  var allSeasonsList = Object.keys(H.seasons).map(Number).sort(function(a, b){ return a - b; });
  var totalPages = Math.ceil(allSeasonsList.length / SEASONS_PER_PAGE) || 1;
  if (ledgerCurrentPage > totalPages) ledgerCurrentPage = totalPages;
  if (ledgerCurrentPage < 1) ledgerCurrentPage = 1;
  var startIdx = (ledgerCurrentPage - 1) * SEASONS_PER_PAGE;
  var slice = allSeasonsList.slice(startIdx, startIdx + SEASONS_PER_PAGE);

  var ledgerRows = slice.map(function(se) {
    var s = H.seasons[se];
    var lChamp = s.premierChampion !== null ? '<b style="color:var(--gold-bright);">' + getClubName(s.premierChampion) + '</b>' : '—';
    var faTxt = s.faWinner !== null ? '<b>' + getClubName(s.faWinner) + '</b> <span class="dim-text">R/U: ' + getClubName(s.faRunner) + '</span>' : '—';
    var lcTxt = s.lcWinner !== null ? '<b>' + getClubName(s.lcWinner) + '</b> <span class="dim-text">R/U: ' + getClubName(s.lcRunner) + '</span>' : '—';
    var awardsTxt = s.awards ? '⭐ <b>' + playerLink(s.awards.mvp.id, s.awards.mvp.name) + '</b><br>⚽ <b>' + playerLink(s.awards.t1Scorer.id, s.awards.t1Scorer.name) + '</b> (' + s.awards.t1Scorer.goals + 'G)' : '—';

    return '<tr>' +
      '<td class="mono">Season ' + se + '</td>' +
      '<td>' + lChamp + '</td>' +
      '<td>' + faTxt + '</td>' +
      '<td>' + lcTxt + '</td>' +
      '<td style="font-size:11px;">' + awardsTxt + '</td>' +
      '<td><button type="button" class="btn-ui btn-sm" onclick="selectedSeason=' + se + ';activeTab=\'league\';render();">View Standings</button></td>' +
    '</tr>';
  }).join('');

  return '<div class="editorial-card">' +
    '<span class="kicker">Official Chronicle Records</span><h2 style="color:#fff;margin-bottom:8px;">Roll of Honour</h2>' +
    '<div class="table-wrap"><table><tr><th>Season</th><th>Premier League Champion</th><th>The FA Cup</th><th>The League Cup</th><th>Individual Honors</th><th>Action</th></tr>' +
      (ledgerRows || '<tr><td colspan=6 style="text-align:center;">No records available.</td></tr>') +
    '</table></div></div>';
}

function render() {
  if (!H || !S) return;
  if (!H.seasons[selectedSeason]) selectedSeason = getMaxSeasonInArchive();
  var html = '';
  var cur = H.seasons[selectedSeason];
  var maxSeasons = getMaxSeasonInArchive();

  $('#date-label').textContent = 'Season ' + selectedSeason + ' (Total: ' + maxSeasons + ' Seasons) · Era ' + cur.era;

  if (activeTab === 'league') html += renderLeagueTab(cur);
  if (activeTab === 'fa_cup') html += renderBracket64UI(cur.faCup64, 'The Wimbledon FA Cup', '64-Club Knockout · Two-Leg Ties (Home & Away)', cur.faWinner, cur.faRunner, 'fa');
  if (activeTab === 'league_cup') html += renderBracket64UI(cur.leagueCup64, 'The Wimbledon League Cup', '64 Active Professional Clubs · Two-Leg Ties', cur.lcWinner, cur.lcRunner, 'lc');
  if (activeTab === 'roster') html += renderRosterTab(cur);
  if (activeTab === 'transfers') html += renderTransfersTab(cur);
  if (activeTab === 'cabinet') html += renderCabinet();
  if (activeTab === 'hof_players') html += renderHallOfFame();
  if (activeTab === 'ledger') html += renderLedger();
  if (activeTab === 'eras') {
    var erasDef = getErasDefinition();
    html += '<div class="editorial-card"><span class="kicker">Periodization</span><h2 style="color:#fff;margin-bottom:12px;">Evolution of Competition (Season 1 to ' + maxSeasons + ')</h2>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;">' +
        erasDef.map(function(e){
          return '<div style="background:#0e1526;border:1px solid #1e293b;border-radius:8px;padding:14px;border-left:4px solid var(--gold);">' +
            '<h3 style="color:var(--gold-bright);margin-bottom:4px;">Era ' + e.id + ': ' + e.name + '</h3>' +
            '<div style="font-size:12px;color:var(--ac);margin-bottom:8px;">Span: Season ' + e.range[0] + ' – ' + e.range[1] + '</div>' +
            '<p style="font-size:13px;color:#cbd5e1;line-height:1.5;">' + e.desc + '</p></div>';
        }).join('') + '</div></div>';
  }

  $('#app').innerHTML = html;
}

$('#tabs').addEventListener('click', function(e) {
  var btn = e.target.closest('button');
  if (!btn) return;
  e.preventDefault();
  document.querySelectorAll('#tabs button').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
  activeTab = btn.dataset.v;
  render();
});

// Jalankan langsung jika dokumen sudah selesai dimuat atau via listener
if (document.readyState === 'loading') {
  window.addEventListener('DOMContentLoaded', initHistoryApp);
} else {
  initHistoryApp();
}
</script>
</body>
</html>
