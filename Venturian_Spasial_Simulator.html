<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VENTURIAN SPASIAL SIMULATOR</title>
<style>
:root{
  --bg:#04060b; --sf:rgba(9,14,25,.88); --pn:rgba(18,27,44,.72); --pn2:rgba(26,38,60,.7);
  --ed:rgba(130,160,210,.15); --ed2:rgba(130,160,210,.30);
  --gold:#e9c985; --gold2:#b8893a; --cy:#5eead4; --em:#34d399; --am:#f5b94a;
  --vi:#a78bfa; --ro:#fb7185; --sk:#7dd3fc; --tx:#e8eef8; --mt:#8a9cb8;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--tx);font-family:'Inter','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(1100px 650px at 85% -10%,rgba(94,234,212,.09),transparent 60%),radial-gradient(900px 600px at -10% 110%,rgba(167,139,250,.11),transparent 60%),var(--bg)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:rgba(130,160,210,.22);border-radius:9px}::-webkit-scrollbar-track{background:transparent}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.mut{color:var(--mt)}
header{background:linear-gradient(180deg,rgba(14,21,36,.95),rgba(8,12,22,.92));border-bottom:1px solid var(--ed2);padding:8px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;backdrop-filter:blur(10px);position:relative;z-index:20}
header:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),var(--cy),transparent);opacity:.55}
.brand{display:flex;align-items:center;gap:11px}
.brand svg{filter:drop-shadow(0 0 8px rgba(233,201,133,.55))}
.brand h1{margin:0;font-size:15px;font-weight:800;letter-spacing:.22em;background:linear-gradient(90deg,#f6e2b0,#e9c985 45%,#5eead4);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;color:var(--mt);font-size:9.5px;letter-spacing:.12em;margin-top:2px;text-transform:uppercase}
.tabs{display:flex;gap:4px;background:rgba(0,0,0,.3);padding:3px;border-radius:10px;border:1px solid var(--ed)}
.tab{background:transparent;color:var(--mt);border:0;padding:6px 13px;border-radius:8px;cursor:pointer;font-weight:600;font-size:12px;transition:.2s}
.tab:hover{color:var(--tx)}
.tab.on{background:linear-gradient(180deg,rgba(233,201,133,.2),rgba(233,201,133,.08));color:var(--gold);box-shadow:inset 0 0 0 1px rgba(233,201,133,.4)}
.btn{background:linear-gradient(180deg,#f0d799,#d4aa57);color:#1a1204;border:0;border-radius:8px;padding:6px 11px;font-weight:700;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:5px;transition:.18s;box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 4px 14px rgba(233,201,133,.12)}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.g{background:rgba(255,255,255,.04);color:var(--tx);border:1px solid var(--ed2);box-shadow:none}
.btn.g:hover{background:rgba(255,255,255,.09)}
.btn.a{background:linear-gradient(180deg,#fbc765,#e29a1e);color:#1d1002}
.btn.v{background:linear-gradient(180deg,#b9a2ff,#7c5cf0);color:#fff}
.btn.r{background:linear-gradient(180deg,#fd8b9c,#e0425f);color:#fff}
.btn.c{background:linear-gradient(180deg,#7ff2de,#1fb9a2);color:#02221d}
.btn.on{outline:2px solid #fff;outline-offset:1px}
.xchip{display:flex;align-items:center;gap:9px;padding:4px 12px 4px 6px;border-radius:30px;border:1px solid var(--ed2);background:rgba(255,255,255,.04);cursor:pointer;min-width:190px}
.xchip:hover{border-color:var(--gold)}
.xav{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,#f6e2b0,#b8893a);font-size:15px}
.xchip b{font-size:12px;display:block;line-height:1.1}
.xchip small{color:var(--gold);font-size:10px;letter-spacing:.06em}
.xbar{height:3px;background:rgba(255,255,255,.1);border-radius:3px;margin-top:3px;overflow:hidden}
.xbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--cy));width:0}
#sidebar{width:392px;background:var(--sf);border-right:1px solid var(--ed2);display:flex;flex-direction:column;overflow:hidden;backdrop-filter:blur(12px)}
#canvas-wrap{flex:1;position:relative;background:#02040a;display:flex;flex-direction:column;overflow:hidden}
.breadcrumb{background:rgba(6,10,18,.92);border-bottom:1px solid var(--ed);padding:7px 12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px}
.crumb{cursor:pointer;color:var(--cy);text-decoration:underline dotted;text-underline-offset:3px}
.crumb.active{color:#fff;font-weight:700;text-decoration:none;cursor:default}
.toolbar{background:rgba(9,14,25,.92);border-bottom:1px solid var(--ed);padding:7px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;z-index:5}
svg#map{flex:1;width:100%;height:100%;cursor:grab;touch-action:none;user-select:none}
.panel-sec{padding:11px 13px;border-bottom:1px solid var(--ed)}
.panel-scroll{flex:1;overflow-y:auto;padding:12px}
.card{background:var(--pn);border:1px solid var(--ed);border-radius:11px;padding:11px;margin-bottom:9px;transition:.15s}
.card.sel{border-color:var(--gold);background:rgba(233,201,133,.08);box-shadow:0 0 0 1px rgba(233,201,133,.2),0 6px 24px rgba(233,201,133,.07)}
label{display:block;font-size:10.5px;color:var(--mt);margin-bottom:3px;letter-spacing:.03em}
input,select,textarea{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--ed2);color:var(--tx);border-radius:7px;padding:6px 9px;font:inherit;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(233,201,133,.12)}
select option{background:#0b111c}
.row{display:flex;gap:8px;align-items:end}.row>*{flex:1}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;background:rgba(130,160,210,.15);font-size:10.5px;margin-right:4px}
.badge-ok{background:rgba(52,211,153,.16);color:#6ee7b7;border:1px solid rgba(52,211,153,.5)}
.badge-warn{background:rgba(245,185,74,.16);color:#fcd34d;border:1px solid rgba(245,185,74,.5)}
.badge-no{background:rgba(251,113,133,.16);color:#fda4af;border:1px solid rgba(251,113,133,.5)}
.full-page{flex:1;overflow-y:auto;padding:20px;max-width:1560px;margin:0 auto;width:100%}
h2.pt{margin:0;color:var(--gold);font-weight:800;letter-spacing:.05em}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 9px;border-bottom:1px solid var(--ed);text-align:left}
th{color:var(--gold);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;background:#0b121e;position:sticky;top:0;z-index:2}
tr:hover td{background:rgba(255,255,255,.025)}
#hud:empty{display:none}
#hud{position:absolute;bottom:12px;left:12px;background:rgba(5,8,14,.85);border:1px solid var(--ed2);padding:6px 11px;border-radius:8px;pointer-events:none;font-size:11px;color:#a9bbd2;backdrop-filter:blur(6px)}
#scalebar{position:absolute;bottom:50px;left:14px;display:none;align-items:center;gap:8px;font-size:11px;color:#cfe0f5;pointer-events:none}
#scalebar i{display:block;height:6px;border:1.5px solid #cfe0f5;border-top:0}
#legend{position:absolute;right:12px;bottom:12px;background:rgba(5,8,14,.85);border:1px solid var(--ed2);padding:7px 10px;border-radius:8px;font-size:10.5px;pointer-events:none;display:flex;flex-direction:column;gap:3px;backdrop-filter:blur(6px)}
#legend span i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:11px;margin-bottom:14px}
.tile{background:linear-gradient(160deg,rgba(26,38,60,.8),rgba(12,18,30,.8));border:1px solid var(--ed);border-top:2px solid var(--gold);border-radius:11px;padding:10px 14px}
.tile b{display:block;font-size:22px;color:var(--gold);letter-spacing:.02em}
.tile span{font-size:10.5px;color:var(--mt);text-transform:uppercase;letter-spacing:.08em}
.tw{overflow:auto;max-height:62vh}
#gmodal{position:fixed;inset:0;background:rgba(2,4,9,.86);display:none;z-index:100;overflow:auto;padding:20px;backdrop-filter:blur(6px)}
.gbox{max-width:1060px;margin:auto;background:linear-gradient(180deg,#0d1522,#080d17);border:1px solid var(--ed2);border-radius:16px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.lk{color:var(--cy);text-decoration:none}.lk:hover{text-decoration:underline}
.kvg{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:11px;padding:4px 0;border-bottom:1px dashed rgba(130,160,210,.12)}
.kv span{color:var(--mt)}.kv b{color:#dfe9f7;text-align:right;font-weight:600}
.note{font-size:11px;color:#b6c5da;margin-top:7px;line-height:1.5}
details{background:var(--pn);border:1px solid var(--ed);border-radius:10px;margin:8px 12px 0;padding:0}
details summary{cursor:pointer;padding:8px 11px;font-weight:700;color:var(--gold);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary:before{content:'▸';margin-right:7px;display:inline-block;transition:.2s}
details[open] summary:before{transform:rotate(90deg)}
details .dbody{padding:2px 11px 10px}
.bar{display:grid;grid-template-columns:150px 1fr 90px;gap:9px;align-items:center;margin:5px 0;font-size:11.5px}
.bar .bl{color:#cbd8ea;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{height:9px;background:rgba(255,255,255,.06);border-radius:9px;overflow:hidden}
.bt i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:9px}
.bv{text-align:right;color:var(--gold)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px}
.log{max-height:360px;overflow:auto;font-size:11.5px}
.log div{padding:6px 0;border-bottom:1px dashed var(--ed);display:flex;gap:10px}
.log time{color:var(--mt);min-width:112px}
#toasts{position:fixed;top:70px;right:16px;z-index:500;display:flex;flex-direction:column;gap:8px}
.toast{background:rgba(10,16,28,.96);border:1px solid var(--ed2);border-left:3px solid var(--cy);padding:9px 14px;border-radius:9px;transform:translateX(120%);opacity:0;transition:.35s;max-width:340px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.show{transform:none;opacity:1}.toast.gold{border-left-color:var(--gold)}.toast.err{border-left-color:var(--ro)}
/* ===== FX TRANSISI ===== */
#fx{display:none;position:fixed;inset:0;z-index:300;background:#02040a;opacity:1;transition:opacity .7s ease;cursor:progress}
#fx.run{animation:fxin .4s ease}
#fx.out{opacity:0;pointer-events:none}
@keyframes fxin{from{opacity:0}to{opacity:1}}
#fxc{position:absolute;inset:0}
.fx-top{position:absolute;top:7%;left:0;right:0;text-align:center;pointer-events:none;text-shadow:0 2px 22px rgba(0,0,0,.9)}
#fx-kicker{font-size:11px;letter-spacing:.42em;color:var(--cy);text-transform:uppercase}
#fx-title{margin:8px 0 4px;font-size:clamp(22px,3.6vw,44px);letter-spacing:.2em;font-weight:800;background:linear-gradient(90deg,#fff,#f0d799,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
#fx-sub{font-size:15px;color:#e9eef7}
#fx-detail{font-size:12px;color:var(--gold);margin-top:6px;letter-spacing:.06em}
.fx-tel{position:absolute;left:3%;top:50%;transform:translateY(-50%);min-width:215px;background:rgba(4,8,15,.62);border:1px solid rgba(94,234,212,.35);border-radius:12px;padding:12px 15px;backdrop-filter:blur(6px);pointer-events:none}
.fx-tel h4{margin:0 0 8px;font-size:10px;letter-spacing:.3em;color:var(--cy)}
.fx-tel div{display:flex;justify-content:space-between;gap:16px;font-size:12px;padding:3px 0}
.fx-tel span{color:var(--mt)}.fx-tel b{font-family:ui-monospace,Menlo,Consolas,monospace;color:#fff;font-weight:600}
.fx-bottom{position:absolute;left:0;right:0;bottom:6%;display:flex;flex-direction:column;align-items:center;gap:10px}
#fx-phase{font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);text-shadow:0 0 12px rgba(0,0,0,.9)}
.fx-bar{width:min(560px,70vw);height:3px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
.fx-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--gold))}
#fx-skip{background:rgba(255,255,255,.07);color:#cfe0f5;border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:5px 15px;cursor:pointer;font-size:11px;letter-spacing:.1em}
#fx-skip:hover{background:rgba(255,255,255,.16)}
</style>
</head>
<body>
<div id="toasts"></div>

<header>
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 40 40"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e2b0"/><stop offset="1" stop-color="#5eead4"/></linearGradient></defs><polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="none" stroke="url(#lg)" stroke-width="2"/><circle cx="20" cy="20" r="6" fill="url(#lg)"/><ellipse cx="20" cy="20" rx="14" ry="5" fill="none" stroke="url(#lg)" stroke-width="1.2" transform="rotate(-24 20 20)"/></svg>
    <div><h1>VENTURIAN SPASIAL SIMULATOR</h1><small>Orbit sistem · atmosfer · benua · negara · permukiman terkecil</small></div>

<script>
const DB_NAME = "Venturian_Spasial_Simulator_DB";
const LS_KEY = "VENTURIAN_SPASIAL_SIMULATOR_V1";
const $ = s => document.querySelector(s);
const uid = () => 'u_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const fmt = n => Number(n || 0).toLocaleString('id-ID', { maximumFractionDigits: 2 });
const fmtC = n => { n = Number(n || 0); const a = Math.abs(n); if (a >= 1e12) return fmt(n / 1e12) + ' T'; if (a >= 1e9) return fmt(n / 1e9) + ' M'; if (a >= 1e6) return fmt(n / 1e6) + ' jt'; return fmt(n); };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const lerp = (a, b, x) => a + (b - a) * x;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const smooth = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const bell = (x, c, w) => Math.exp(-Math.pow((x - c) / w, 2));
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.classList.add('show'), 10);
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 400); }, 3400);
}

const HIERARCHY_LABELS = [
  "Sistem Bintang", "Planet", "Benua / Massa Daratan", "Negara / Sektor Otoritas",
  "Provinsi / Negara Bagian", "Kabupaten / Distrik", "Kecamatan / Sektor Lokal",
  "Kelurahan / Kota Kecil", "Permukiman Lokal / Desa"
];
const gxL = d => HIERARCHY_LABELS[Math.min(d, HIERARCHY_LABELS.length - 1)];
const SURVEY_OPTS = ['Belum disurvei', 'Disurvei', 'Dipetakan', 'Dikembangkan'];

const PLANETS_54 = [
  { id:"p1", no:1, name:"Lecossa-01", zone:"Inner Zone", cls:"Mercury-type", diam:6800, sats:0, mass:0.1111, au:1.1, rot:1428.6, tilt:2.9, g:0.39, temp:606, press:0, atm:"Eksosfer sangat tipis (Na, K, He, H₂)", landPct:18, bio:"Tidak ada", civ:"Tidak ada", res:"Besi, nikel, titanium, helium-3 regolit" },

/* ===== MODEL FISIKA & SKOR KELAYAKAN HUNI LOKAL ===== */
function getPlanetTotalArea(p) {
  return 4 * Math.PI * Math.pow((p.diam || 1) / 2, 2);
}

function getPlanetLandArea(p) {
  return Math.round(getPlanetTotalArea(p) * ((p.landPct || 0) / 100));
}

function calcLocalTemp(p, latDeg) {
  const absLat = Math.min(90, Math.abs(latDeg));
  const latRad = (absLat * Math.PI) / 180;
  const pressFactor = Math.min(1, Math.max(0.15, 1 / (1 + Math.log10(Math.max(0.1, p.press || 0.1)))));
  const deltaT = (38 + (p.tilt || 15) * 0.45) * pressFactor;
  const localT = p.temp + deltaT * (Math.cos(latRad) - 0.64);
  return Math.round(localT * 10) / 10;
}

function evaluateHabitability(p, latDeg, mode = 'open') {
  const localTemp = calcLocalTemp(p, latDeg);
  if (!p.landPct || p.landPct <= 0) {
    return { score: 0, label: "Raksasa Gas/Es (Tanpa Permukaan Padat)", temp: localTemp, reason: "Penambangan atmosfer Helium-3 / Deuterium saja." };
  }
  const hasO2 = /O₂/.test(p.atm || '');
  const toxic = /SO₂|asam sulfat|logam alkali/i.test(p.atm || '');

  if (mode === 'open') {
    if (!hasO2 || toxic || p.bio !== 'Ya') {
      return { score: 0, label: "Tidak Layak Terbuka", temp: localTemp, reason: "Tanpa biosfer O₂ atau atmosfer beracun; wajib kubah bertekanan." };
    }
    let score = 100;
    const reasons = [];
    if (localTemp < -20 || localTemp > 48) { score -= 65; reasons.push(`Suhu ekstrem (${localTemp}°C)`); }
    else if (localTemp < 5) { score -= Math.round((5 - localTemp) * 1.4); reasons.push(`Iklim dingin (${localTemp}°C)`); }
    else if (localTemp > 32) { score -= Math.round((localTemp - 32) * 1.8); reasons.push(`Iklim panas (${localTemp}°C)`); }
    else { reasons.push(`Suhu optimal (${localTemp}°C)`); }

    if (p.g > 1.5) { score -= Math.round((p.g - 1.5) * 45); reasons.push(`Gravitasi berat (${p.g} g)`); }
    else if (p.g < 0.7) { score -= Math.round((0.7 - p.g) * 35); reasons.push(`Gravitasi rendah (${p.g} g)`); }

    if (p.press > 2.5) { score -= Math.round((p.press - 2.5) * 15); reasons.push(`Tekanan tinggi (${p.press} atm)`); }
    else if (p.press < 0.6) { score -= Math.round((0.6 - p.press) * 40); reasons.push(`Udara tipis (${p.press} atm)`); }

    score = Math.max(0, Math.min(100, score));
    const label = score >= 75 ? "Sangat Potensial (Zona Inti Huni)" : score >= 45 ? "Moderat (Adaptasi Iklim/Gravitasi)" : score >= 20 ? "Marginal (Perbatasan Ekstrem)" : "Tidak Layak Terbuka";
    return { score, label, temp: localTemp, reason: reasons.join(" · ") };
  } else {
    let score = 85;
    const reasons = [];
    if (localTemp > 220 || localTemp < -150) { score -= 55; reasons.push(`Beban termal ekstrem (${localTemp}°C)`); }
    else if (localTemp > 100 || localTemp < -80) { score -= 22; reasons.push(`Isolasi termal berat (${localTemp}°C)`); }
    else { reasons.push(`Beban termal terkendali (${localTemp}°C)`); }

    if (p.press > 25) { score -= 45; reasons.push(`Tekanan penghancur (${p.press} atm)`); }
    else if (p.press > 5) { score -= 18; reasons.push(`Tekanan luar tinggi (${p.press} atm)`); }

    if (p.g > 1.6) { score -= 25; reasons.push(`Gravitasi tinggi (${p.g} g)`); }
    if (/es air|air tawar|logam|helium-3/i.test(p.res || '')) { score += 10; reasons.push("Sumber daya lokal bernilai tinggi"); }
    score = Math.max(0, Math.min(100, score));
    const label = score >= 70 ? "Ideal untuk Koloni Kubah / Tambang" : score >= 40 ? "Layak Pos Riset / Ekstraksi" : "Sangat Berbahaya (Robotik Saja)";
    return { score, label, temp: localTemp, reason: reasons.join(" · ") };
  }
}

/* ===== GEOMETRI POLIGON & TESELASI ORGANIK ===== */
const SYLLABLES = ["ka","ve","lor","an","mi","tar","so","ra","bel","dun","hol","zen","ur","ti","mor","qa","sha","li","gor","fen"];
function forgeName(sufStr = "-rik,-haven,-grad", seed = Date.now()) {
  const r = (n) => Math.abs(Math.floor(Math.sin(seed * 12.9898 + n * 78.233) * 43758.5453));
  const sufs = String(sufStr || "-rik,-haven,-grad").split(',').map(s => s.trim()).filter(Boolean);
  const s = sufs[r(1) % sufs.length];
  let base = SYLLABLES[r(2) % SYLLABLES.length] + SYLLABLES[r(3) % SYLLABLES.length];
  base = base[0].toUpperCase() + base.slice(1);
  if (s.endsWith('-')) return s.slice(0, -1) + base.toLowerCase();
  if (s.startsWith('-')) return base + s.slice(1);
  return base + s;
}

function makeBlobPoly(cx, cy, rx, ry, seed, ptsCount = 20) {
  const pts = [];
  for (let i = 0; i < ptsCount; i++) {
    const a = (i / ptsCount) * Math.PI * 2;
    const n1 = Math.sin(seed * 11.3 + i * 2.1) * 0.22;
    const n2 = Math.cos(seed * 5.7 + i * 3.9) * 0.14;
    const rf = 0.78 + n1 + n2;
    const x = Math.max(25, Math.min(975, cx + rx * rf * Math.cos(a)));
    const y = Math.max(25, Math.min(535, cy + ry * rf * Math.sin(a)));
    pts.push([Math.round(x * 10) / 10, Math.round(y * 10) / 10]);
  }
  return pts;
}

function polyArea(pts) {
  if (!pts || pts.length < 3) return 0;
  let s = 0;
  for (let i = 0; i < pts.length; i++) {
    const [x1, y1] = pts[i], [x2, y2] = pts[(i + 1) % pts.length];
    s += x1 * y2 - x2 * y1;
  }
  return Math.abs(s) / 2;
}

function polyCentroid(pts) {
  if (!pts || !pts.length) return [500, 280];
  let sx = 0, sy = 0;
  pts.forEach(p => { sx += p[0]; sy += p[1]; });
  return [sx / pts.length, sy / pts.length];
}

function polyBBox(pts) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  pts.forEach(([x, y]) => {
    if (x < minX) minX = x;
    if (y < minY) minY = y;
    if (x > maxX) maxX = x;
    if (y > maxY) maxY = y;
  });
  return { minX, minY, maxX, maxY, w: Math.max(10, maxX - minX), h: Math.max(10, maxY - minY) };
}

function yToLatitude(y) {
  return Math.round(((280 - y) / 280) * 90 * 10) / 10;
}

function buildOrganicPolygons(parentPoly, k, seedBase = 1) {
  const bb = polyBBox(parentPoly);
  const cols = Math.ceil(Math.sqrt(k * (bb.w / bb.h)));
  const rows = Math.ceil(k / cols);
  const cellW = bb.w / cols;
  const cellH = bb.h / rows;

  const rnd = (s) => {
    const x = Math.sin(s * 91.3458) * 47453.5453;
    return x - Math.floor(x);
  };

  const gridNodes = Array.from({ length: rows + 1 }, (_, r) =>
    Array.from({ length: cols + 1 }, (_, c) => {
      const bx = bb.minX + c * cellW;
      const by = bb.minY + r * cellH;
      const s = seedBase + r * 31 + c * 17;
      const ox = (c === 0 || c === cols) ? (rnd(s) - 0.5) * cellW * 0.15 : (rnd(s) - 0.5) * cellW * 0.44;
      const oy = (r === 0 || r === rows) ? (rnd(s + 3) - 0.5) * cellH * 0.15 : (rnd(s + 3) - 0.5) * cellH * 0.44;
      return [Math.round((bx + ox) * 10) / 10, Math.round((by + oy) * 10) / 10];
    })
  );

  const makeWavyLine = (x1, y1, x2, y2, s) => {
    const dx = x2 - x1, dy = y2 - y1;
    const nx = -dy, ny = dx;
    const p1 = [x1 + dx * 0.33 + nx * (rnd(s) - 0.5) * 0.26, y1 + dy * 0.33 + ny * (rnd(s + 1) - 0.5) * 0.26];
    const p2 = [x1 + dx * 0.67 + nx * (rnd(s + 2) - 0.5) * 0.26, y1 + dy * 0.67 + ny * (rnd(s + 3) - 0.5) * 0.26];
    return [[x1, y1], p1, p2, [x2, y2]];
  };

  const vEdge = {}, hEdge = {};
  for (let r = 0; r <= rows; r++) {
    for (let c = 0; c < cols; c++) {
      hEdge[`${r},${c}`] = makeWavyLine(...gridNodes[r][c], ...gridNodes[r][c + 1], seedBase + r * 100 + c);
    }
  }
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c <= cols; c++) {
      vEdge[`${r},${c}`] = makeWavyLine(...gridNodes[r][c], ...gridNodes[r + 1][c], seedBase + 500 + r * 100 + c);
    }
  }

  const polys = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (polys.length >= k) break;
      const top = hEdge[`${r},${c}`];
      const right = vEdge[`${r},${c + 1}`];
      const bottom = hEdge[`${r + 1},${c}`].slice().reverse();
      const left = vEdge[`${r},${c}`].slice().reverse();
      const poly = [...top, ...right.slice(1), ...bottom.slice(1), ...left.slice(1, -1)].map(p => [
        Math.round(p[0] * 10) / 10,
        Math.round(p[1] * 10) / 10
      ]);
      polys.push(poly);
    }
  }
  return polys;
}

/* Bangkitkan benua organik untuk suatu planet dan tandai userCreated: true */
function generateUserContinents(p, count, salt = 1) {
  const totalLand = getPlanetLandArea(p);
  const cols = Math.ceil(Math.sqrt(count * 1.6));
  const rows = Math.ceil(count / cols);
  const cellW = 880 / cols;
  const cellH = 480 / rows;
  const scaleFactor = Math.sqrt(Math.max(8, p.landPct) / 55);

  const raw = [];
  let sumPx = 0;
  for (let i = 0; i < count; i++) {
    const r = Math.floor(i / cols);
    const c = i % cols;
    const seed = p.no * 37 + i * 19 + salt * 101;
    const jx = Math.sin(seed) * cellW * 0.25;
    const jy = Math.cos(seed * 1.3) * cellH * 0.25;
    const cx = 60 + (c + 0.5) * cellW + jx;
    const cy = 40 + (r + 0.5) * cellH + jy;
    const rx = cellW * 0.36 * scaleFactor * (0.75 + (seed % 5) * 0.1);
    const ry = cellH * 0.36 * scaleFactor * (0.75 + ((seed * 3) % 5) * 0.1);
    const poly = makeBlobPoly(cx, cy, rx, ry, seed, 20);
    const pxA = polyArea(poly);
    sumPx += pxA;
    raw.push({
      id: `${p.id}_land_${i}_${salt}`,
      name: forgeName("-terra,-var,-thal,-dor,-nusa", seed),
      kind: p.landPct <= 15 ? "Kepulauan / Busur Vulkanik" : "Benua Utama",
      cap: forgeName("-base,-haven,-pol,-port", seed + 7),
      gov: "Zona Eksplorasi / Sektor",
      pxA,
      poly
    });
  }

  return raw.map(item => ({
    id: item.id,
    name: item.name,
    kind: item.kind,
    cap: item.cap,
    gov: item.gov,
    area: Math.round(totalLand * (item.pxA / (sumPx || 1))),
    pop: 0,
    suf: "-rik,-haven,-pol,-grad",
    poly: item.poly,
    userCreated: true,
    createdAt: new Date().toISOString(),
    children: [],
    pins: [],
    par: [],
    note: ""
  }));
}

function buildEleantorCanon() {
  return CONT_SEED.map((c, idx) => {
    const col = idx % 4;
    const row = Math.floor(idx / 4);
    const cx = 135 + col * 245 + ((idx % 2) * 18 - 9);
    const cy = 105 + row * 178 + ((idx % 3) * 12 - 12);
    const scale = Math.sqrt(c[1] / 245);
    const contPoly = makeBlobPoly(cx, cy, 88 * scale, 62 * scale, idx + 1.5, 22);
    const rawNations = NSEED.filter(n => n[1] === idx);

function regionStats(n, p, parent) {

  (function w(x) { (x.children || []).forEach(c => { desc++; w(c); }); pins += (x.pins || []).length; })(n);
  s.desc = desc; s.pins = pins;

  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);

    puffs: Array.from({ length: 30 }, () => ({ x: Math.random(), ph: Math.random(), sp: .5 + Math.random() * .8, s: Math.random() }))

function hashHue(str) { let h = 0; for (const ch of String(str)) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; }

function getUserBuiltEntries() {
  const results = [];
  (S.root.children || []).forEach(planet => {
    function walk(node, depth, trail) {
      if (depth >= 2 && node.userCreated) {
        results.push({ node, planet, depth, levelName: gxL(depth), trailNames: trail.map(x => x.name), isPin: false });
      }
      (node.pins || []).forEach(pin => {
        if (pin.userCreated) results.push({
          node: { id: pin.id, name: pin.name, kind: pin.type || "Titik Kota / Pos", cap: "", area: 0, pop: pin.pop || 0, children: [], userCreated: true },
          planet, depth: depth + 1, levelName: "Titik Kota / Permukiman", trailNames: trail.concat([node]).map(x => x.name), isPin: true, parentId: node.id
        });
      });
      (node.children || []).forEach(c => walk(c, depth + 1, trail.concat([node])));
    }
    (planet.children || []).forEach(cont => walk(cont, 2, [S.root, planet]));
  });
  return results;
}
function updateUserCounterBadge() { const el = $('#hdr-user-count'); if (el) el.textContent = getUserBuiltEntries().length; }

function buildUserLoreText() {
  const entries = getUserBuiltEntries();
  if (!entries.length) return "";
  const lines = ["======================================================================",
    "KOMPENDIUM GEOGRAFI & WILAYAH BINAAN — SISTEM BINTANG LECOSSA",
    `Penjelajah: ${S.explorer.name} (${S.explorer.callsign}) · ${rankInfo(S.explorer.xp).name}`,
    `Tanggal ekspor: ${new Date().toLocaleString('id-ID')}`, `Total entitas tercatat: ${entries.length}`,
    "======================================================================", ""];
  const byPlanet = {};
  entries.forEach(e => { (byPlanet[e.planet.id] = byPlanet[e.planet.id] || { planet: e.planet, items: [] }).items.push(e); });
  Object.values(byPlanet).forEach(({ planet, items }) => {
    const st = planetStats(planet);
    lines.push(`# PLANET ${planet.name.toUpperCase()} (${planet.zone} — ${planet.cls})`);
    lines.push(`Fisik: diameter ${fmt(planet.diam)} km | g ${planet.g} | suhu ${planet.temp}°C | tekanan ${planet.press} atm | kec. lepas ${fmt(st.vesc)} km/s | hari ${fmt(st.dayH)} jam`);
    lines.push(`Atmosfer: ${planet.atm} | Darat:Laut ${planet.landPct}:${100 - planet.landPct} (${fmt(planet.area)} km² daratan)`);
    lines.push(`Sumber daya: ${planet.res}`);
    lines.push("----------------------------------------------------------------------");
    items.forEach(e => {
      const ind = "  ".repeat(Math.max(0, e.depth - 2)), path = e.trailNames.slice(1).join(" › ");
      lines.push(`${ind}• [${e.levelName}] ${e.node.name}${e.node.cap ? ` (Pusat: ${e.node.cap})` : ''}`);
      lines.push(`${ind}  Jalur: ${path} › ${e.node.name}`);
      if (e.isPin) lines.push(`${ind}  Jenis: ${e.node.kind} | Populasi: ${fmt(e.node.pop)} jiwa`);
      else {
        const s = regionStats(e.node, planet, null);
        let extra = '';
        if (s.lat !== undefined) extra = ` | ${Math.abs(s.lat)}° ${s.lat >= 0 ? 'LU' : 'LS'} ~${s.habO.temp}°C, huni terbuka ${s.habO.score}/100, kubah ${s.habD.score}/100`;
        lines.push(`${ind}  Luas: ${fmt(e.node.area)} km² | Pop: ${fmt(e.node.pop)} | Kepadatan: ${fmt(s.density)}/km² (${s.dclass})${extra}`);
        lines.push(`${ind}  Status: ${e.node.survey || '—'} | Klaim: ${e.node.claimedBy || '—'}`);
      }
      if (e.node.note) lines.push(`${ind}  Catatan lore: ${e.node.note.replace(/\n+/g, ' ')}`);
    });
    lines.push("");
  });
  return lines.join("\n");
}
function buildUserSynopsisText() {
  const entries = getUserBuiltEntries();
  if (!entries.length) return "";
  const top = entries.filter(e => e.depth <= 3), src = top.length ? top : entries;
  return src.map((e, idx) => {
    const p = e.planet; let latDesc = "";
    if (!e.isPin && e.node.poly && e.node.poly.length >= 3) {
      const [, cy] = polyCentroid(e.node.poly), lat = yToLatitude(cy), ho = evaluateHabitability(p, lat, 'open'), hd = evaluateHabitability(p, lat, 'dome');
      latDesc = `Terletak di lintang ${Math.abs(lat)}° ${lat >= 0 ? 'LU' : 'LS'} dengan suhu lokal sekitar ${ho.temp}°C (potensi huni terbuka ${ho.score}/100, koloni kubah ${hd.score}/100). `;
    }
    const subs = (e.node.children || []).map(c => c.name).slice(0, 6);
    const subText = subs.length ? `Wilayah ini terbagi ke dalam sektor administratif termasuk ${subs.join(', ')}${e.node.children.length > 6 ? ', dan lainnya' : ''}. ` : '';
    const noteText = e.node.note ? `Catatan lapangan: ${e.node.note.replace(/\n+/g, ' ')}. ` : '';
    const tech = p.id === 'p19' ? "Dinamika geopolitik peradaban Venturian pada era teknologi setara 2100 M (Kardashev 0,86)." : "Misi pemetaan wahana nirawak/orbiter atau perencanaan koloni kubah bertekanan sesuai batas teknologi ≤ 2100 M tanpa FTL.";
    const syn = `Fokus latar berada di ${e.node.name} (${e.levelName}), wilayah seluas ${fmt(e.node.area)} km² di planet ${p.name} (${p.zone}, gravitasi ${p.g} g). Dijelajahi oleh ${S.explorer.name}. ${latDesc}${subText}${noteText}${tech}`;
    return `1|${idx + 1}|Ekspedisi ${e.node.name} (${p.name})|${syn}`;
  }).join("\n");
}

}
function renderStatsPage() {
  const ex = S.explorer, r = rankInfo(ex.xp), all = getUserBuiltEntries(), regions = all.filter(e => !e.isPin), pinsN = all.length - regions.length;
  const planetsVisited = (S.root.children || []).filter(p => ex.visited[p.id]).length;
  const top = regions.slice().sort((a, b) => (+b.node.area || 0) - (+a.node.area || 0)).slice(0, 10);
  const byLevel = {};
  regions.forEach(e => { byLevel[e.depth] = (byLevel[e.depth] || 0) + 1; });
  const lvlItems = Object.keys(byLevel).sort((a, b) => a - b).map(d => ({ l: gxL(+d), v: byLevel[d] }));
  const bins = [['< 20 · tidak layak', 0, 20, '#fb7185'], ['20–44 · marginal', 20, 45, '#f5b94a'], ['45–74 · moderat', 45, 75, '#14b8a6'], ['≥ 75 · sangat potensial', 75, 101, '#34d399']];
  const binCount = bins.map(() => 0);
  regions.forEach(e => {
    if (!e.node.poly || e.node.poly.length < 3) return;
    const sc = evaluateHabitability(e.planet, yToLatitude(polyCentroid(e.node.poly)[1]), 'open').score;
    bins.forEach((b, i) => { if (sc >= b[1] && sc < b[2]) binCount[i]++; });
  });
  const byPlanetPop = {};
  regions.filter(e => e.depth === 2).forEach(e => { byPlanetPop[e.planet.name] = (byPlanetPop[e.planet.name] || 0) + (+e.node.pop || 0); });
  const popItems = Object.entries(byPlanetPop).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([l, v]) => ({ l, v, t: fmtC(v) }));
  const totalArea = regions.filter(e => e.depth === 2).reduce((a, e) => a + (+e.node.area || 0), 0);
  const totalPop = regions.filter(e => e.depth === 2).reduce((a, e) => a + (+e.node.pop || 0), 0);
  $('#view-stats').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:10px;margin-bottom:14px">
      <div><h2 class="pt">Dossier Penjelajah &amp; Statistik Ekspedisi</h2><small class="mut">Setiap pendaratan, pemetaan, dan pendirian pos menambah XP dan masuk jurnal.</small></div></div>
    <div class="tiles">
      <div class="tile"><b>${planetsVisited}</b><span>Planet didarati</span></div>
      <div class="tile"><b>${regions.length}</b><span>Wilayah dipetakan</span></div>
      <div class="tile"><b>${pinsN}</b><span>Kota / pos didirikan</span></div>
      <div class="tile"><b>${fmtC(totalArea)}</b><span>Luas benua klaim (km²)</span></div>
      <div class="tile"><b>${fmtC(totalPop)}</b><span>Populasi benua klaim</span></div>
      <div class="tile"><b style="font-size:15px;line-height:1.5">${esc(gxL(ex.depthMax || 0))}</b><span>Kedalaman terjauh (L${ex.depthMax || 0})</span></div></div>
    <div class="grid2">
      <div class="card"><h3 style="color:var(--gold);margin-top:0">🧑‍🚀 Profil penjelajah</h3>
        <div class="row" style="margin-bottom:8px"><div><label>Nama</label><input value="${esc(ex.name)}" oninput="S.explorer.name=this.value;updateExplorerChip();saveState()"></div>
          <div><label>Callsign</label><input value="${esc(ex.callsign)}" oninput="S.explorer.callsign=this.value;saveState()"></div>
          <div><label>Wahana</label><input value="${esc(ex.vessel)}" oninput="S.explorer.vessel=this.value;saveState()"></div></div>
        <div style="display:flex;justify-content:space-between;font-size:12px"><b style="color:var(--gold)">${r.name}</b><span class="mono">${fmt(ex.xp)} XP${r.next ? ' / ' + fmt(r.next) : ' (maks.)'}</span></div>
        <div class="xbar" style="height:7px;margin-top:5px"><i style="width:${r.pct}%"></i></div>
        <div class="note mut">Pangkat: ${RANKS.map(x => x[1] + ' (' + x[0] + ')').join(' → ')}</div></div>
      <div class="card"><h3 style="color:var(--gold);margin-top:0">⚙️ Pengaturan simulator</h3>
        <div class="row" style="margin-bottom:8px"><div><label>Massa bintang (M☉) — asumsi untuk periode orbit</label><input type="number" step="0.1" min="0.1" value="${S.cfg.starMass}" oninput="S.cfg.starMass=Math.max(0.1,+this.value||1);saveState()"></div>
          <div><label>Kecepatan transisi</label><select onchange="S.cfg.fxSpeed=+this.value;saveState()">${[[.6, 'Lambat'], [1, 'Normal'], [1.6, 'Cepat'], [2.5, 'Sangat cepat']].map(o => `<option value="${o[0]}" ${S.cfg.fxSpeed === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select></div></div>
        <label style="display:flex;gap:6px;align-items:center;cursor:pointer;margin:0"><input type="checkbox" style="width:auto" ${S.cfg.fx ? 'checked' : ''} onchange="S.cfg.fx=this.checked;saveState();$('#btn-fx').textContent='🎬 Transisi: '+(S.cfg.fx?'ON':'OFF')"> Aktifkan animasi transisi (atmosfer, penurunan wilayah)</label>
        <div class="note mut">Penyimpanan: IndexedDB <span class="mono">${DB_NAME}</span> (terpisah dari Lecossa Unified Atlas lama).</div></div>
      <div class="card"><h3 style="color:var(--am);margin-top:0">Wilayah per tingkat</h3>${barsHTML(lvlItems)}</div>
      <div class="card"><h3 style="color:var(--am);margin-top:0">Distribusi potensi huni (mode terbuka)</h3>${barsHTML(bins.map((b, i) => ({ l: b[0], v: binCount[i], c: b[3] })))}</div>
      <div class="card"><h3 style="color:var(--am);margin-top:0">10 wilayah terluas</h3>${barsHTML(top.map(e => ({ l: e.node.name + ' · ' + e.planet.name, v: +e.node.area || 0, t: fmtC(e.node.area) + ' km²' })))}</div>
      <div class="card"><h3 style="color:var(--am);margin-top:0">Populasi benua klaim per planet</h3>${barsHTML(popItems)}</div>
      <div class="card" style="grid-column:1/-1"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="color:var(--am);margin:0 0 6px">📓 Jurnal ekspedisi</h3><button class="btn g" onclick="downloadTextFile('Jurnal_Ekspedisi.txt',S.explorer.log.slice().reverse().map(l=>new Date(l.t).toLocaleString('id-ID')+'  '+l.msg).join('\\n'))">⬇ Unduh</button></div>
        <div class="log">${ex.log.slice(0, 80).map(l => `<div><time class="mono">${new Date(l.t).toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' })}</time><span>${esc(l.msg)}</span></div>`).join('')}</div></div></div>`;
}

function setTab(t) {
  UI.tab = t;
  ['map', 'planets', 'recap', 'stats'].forEach(k => {
    $('#tab-' + k).classList.toggle('on', k === t);
    $('#view-' + k).style.display = k === t ? (k === 'map' ? 'flex' : 'block') : 'none';
  });
  if (t === 'planets') renderPlanetsPage();
  if (t === 'recap') renderRecapPage();
  if (t === 'stats') renderStatsPage();
  if (t === 'map') render();
}

/* ===== EKSPOR & IMPOR ===== */
function exportJSON() { downloadTextFile('Venturian_Spasial_Simulator_Atlas.json', JSON.stringify(S, null, 2), 'application/json'); }
function exportSVG() {
  const xml = '<?xml version="1.0" encoding="UTF-8"?>\n' + $('#map').outerHTML.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
  downloadTextFile(`Atlas_${getActiveNode().name.replace(/\s+/g, '_')}.svg`, xml, 'image/svg+xml');
}
function importJSON(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (data.root && data.root.id === 'lecossa_system') {
        S = normalizeState(data); UI.path = []; UI.selectedId = 'p19'; persistNow(); setTab('map'); render();
        toast('Atlas berhasil dimuat (kompatibel dengan Lecossa Unified Atlas).'); return;
      }
      if (data.root && data.root.id === 'eleantor') {
        const el = S.root.children.find(p => p.id === 'p19');
        if (el) { el.children = data.root.children; el.pins = data.root.pins || el.pins; }
        saveState(); render(); toast('Data Eleantor digabungkan.'); return;
      }
      if (Array.isArray(data.planets)) {
        data.planets.forEach(ip => {
          const t = S.root.children.find(p => p.id === ip.id || p.name === ip.name);
          if (t && Array.isArray(ip.children)) { t.children = ip.children.map(c => ({ ...c, userCreated: true })); t.pins = (ip.pins || []).map(pin => ({ ...pin, userCreated: true })); }
        });
        saveState(); render(); toast('Data planet digabungkan.'); return;
      }
      toast('Format JSON tidak dikenali.', 'err');
    } catch (e) { toast('Gagal membaca JSON: ' + e.message, 'err'); }
  };
  reader.readAsText(file);
}

/* ===== MODAL BREAKDOWN ===== */
const gxH = t => { let h = 0; for (const c of String(t)) h = (h * 31 + c.charCodeAt(0)) % 100000; return h; };
function gxFind(id) {
  let r = null;
  (function f(n, p) { if (r) return; if (n.id === id) { r = { n, p }; return; } (n.children || []).forEach(c => f(c, p.concat([n]))); })(S.root, []);
  return r;
}
function gxClose() { $('#gmodal').style.display = 'none'; setTab(UI.tab); }
function gxJumpToCanvas(id) {
  const f = gxFind(id);
  if (!f) return;
  $('#gmodal').style.display = 'none';
  setTab('map');
  if (f.n.kind === 'Planet' && (!f.n.landPct || f.n.landPct <= 0)) {
    UI.path = []; UI.selectedId = f.n.id; fitViewToNode(S.root); render(); return;
  }
  const path = f.p.slice(1).map(x => x.id).concat(f.n.id === 'lecossa_system' ? [] : [f.n.id]);
  if (path.join('/') === UI.path.join('/')) { render(); return; }
  navigateTo(path);
}
function gxMini(n) {
  const P = n.poly;
  if (!P || P.length < 3) return '<small class="mut">Tampilan orbit / non-poligon.</small>';
  const xs = P.map(p => p[0]), ys = P.map(p => p[1]), x0 = Math.min(...xs), y0 = Math.min(...ys);
  const w = Math.max(...xs) - x0 || 1, h = Math.max(...ys) - y0 || 1, m = Math.max(w, h), pt = q => q.map(p => p.join(',')).join(' ');
  return `<svg viewBox="${x0 - m * .04} ${y0 - m * .04} ${w + m * .08} ${h + m * .08}" style="width:100%;max-height:290px;background:radial-gradient(circle,#0b2a4a,#030c1a);border-radius:10px;border:1px solid var(--ed)">
    <polygon points="${pt(P)}" fill="#0c1b2c" stroke="#38bdf8" stroke-width="${m / 300}"/>
    ${(n.children || []).filter(c => c.poly && c.poly.length > 2).map(c => `<polygon points="${pt(c.poly)}" fill="hsl(${gxH(c.id) % 360},45%,32%)" stroke="#0b1a14" stroke-width="${m / 600}" style="cursor:pointer" onclick="gxModal('${c.id}')"><title>${esc(c.name)}</title></polygon>`).join('')}
    ${(n.pins || []).map(q => `<circle cx="${q.x}" cy="${q.y}" r="${m / 150}" fill="#e9c985"><title>${esc(q.name)}</title></circle>`).join('')}</svg>`;
}
function gxModal(id) {
  const f = gxFind(id);
  if (!f) return;
  const n = f.n, anc = f.p, d = anc.length, lab = n.kind || gxL(d);
  const planet = n.kind === 'Planet' ? n : (anc[1] || null);
  const parent = anc.length ? anc[anc.length - 1] : null;
  const isP = n.kind === 'Planet';
  $('#gmodal').style.display = 'block';
  $('#gmodal').innerHTML = `<div class="gbox">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><h2 class="pt" style="flex:1;margin:0">${esc(n.name)} <span class="tag">${esc(lab)}</span><span class="tag">L${d}</span></h2>
      <button class="btn" onclick="gxJumpToCanvas('${id}')">🗺️ Buka di Peta</button><button class="btn g" onclick="gxClose()">Tutup ✕</button></div>
    <div style="margin:8px 0;font-size:12px">${anc.map(a => `<a href="#" class="lk" onclick="gxModal('${a.id}');return false">${esc(a.name)}</a> › `).join('')}<b>${esc(n.name)}</b></div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start">
      <div style="flex:1 1 380px"><h3 style="color:var(--am);margin-top:0">Properti (dapat diedit)</h3>
        <div class="row" style="flex-wrap:wrap">
          <div><label>Nama</label><input value="${esc(n.name)}" oninput="const x=gxFind('${id}').n;x.name=this.value;x.userCreated=true;saveState()"></div>
          <div><label>Jenis</label><input value="${esc(lab)}" oninput="const x=gxFind('${id}').n;x.kind=this.value;x.userCreated=true;saveState()" ${isP ? 'disabled' : ''}></div>
          <div><label>Pusat / ibu kota</label><input value="${esc(n.cap || '')}" oninput="const x=gxFind('${id}').n;x.cap=this.value;x.userCreated=true;saveState()"></div>
          <div><label>Luas darat (km²)</label><input type="number" value="${n.area || 0}" oninput="const x=gxFind('${id}').n;x.area=+this.value;x.userCreated=true;saveState()"></div>
          <div><label>Populasi (jiwa)</label><input type="number" value="${n.pop || 0}" oninput="const x=gxFind('${id}').n;x.pop=+this.value;x.userCreated=true;saveState()"></div>
          <div><label>Status survei</label><select onchange="const x=gxFind('${id}').n;x.survey=this.value;x.userCreated=true;saveState()">${SURVEY_OPTS.concat(['Dipetakan Kanon']).map(o => `<option ${n.survey === o ? 'selected' : ''}>${o}</option>`).join('')}</select></div></div>
        <label style="margin-top:8px">Catatan lore / geografis</label>
        <textarea rows="3" oninput="const x=gxFind('${id}').n;x.note=this.value;x.userCreated=true;saveState()">${esc(n.note || '')}</textarea></div>
      <div style="flex:1 1 320px"><h3 style="color:var(--am);margin-top:0">Peta turunan</h3>${gxMini(n)}</div></div>
    <div class="grid2" style="margin-top:14px">
      <div class="card"><h3 style="color:var(--gold);margin-top:0">Statistik wilayah</h3>${regionStatsHTML(n, planet, parent && parent.id !== 'lecossa_system' ? parent : null)}</div>
      ${planet ? `<div class="card"><h3 style="color:var(--gold);margin-top:0">Parameter planet ${esc(planet.name)}</h3>${planetParamsHTML(planet)}</div>` : ''}</div>
    ${(n.children || []).length ? `<h3 style="color:var(--am)">Sub-wilayah langsung (${n.children.length})</h3><div class="tw" style="max-height:28vh"><table><thead><tr><th>Nama</th><th>Jenis</th><th>Luas km²</th><th>Populasi</th><th>Kepadatan</th><th>Sub</th></tr></thead><tbody>
      ${n.children.slice(0, 150).map(c => `<tr><td><a href="#" class="lk" onclick="gxModal('${c.id}');return false">${esc(c.name)}</a></td><td>${esc(c.kind || '')}</td><td>${fmt(c.area)}</td><td>${fmt(c.pop)}</td><td>${c.area ? fmt((c.pop || 0) / c.area) : '—'}</td><td>${(c.children || []).length}</td></tr>`).join('')}</tbody></table></div>` : ''}</div>`;
}

loadState().then(() => {
  $('#btn-fx').textContent = '🎬 Transisi: ' + (S.cfg.fx ? 'ON' : 'OFF');
  initCanvasEvents();
  render();
});
</script>
</body>
