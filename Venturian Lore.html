<style>

.tb{border-radius:0 8px 8px 0;margin:2px 0;transition:.15s}.tb:hover{background:rgba(255,255,255,.05)}

let CONT=[["Orestan",245,38,33.2,"Konfederasi Vesterrik","Korshaven","-rik,-mark,-haven,-grad","gading/terang"],["Sura",232.5,44,38.6,"Perserikatan Kalindesh","Mahaloka","-desh,-mandala,-puri,-loka","zaitun/sawo matang"],["Tairon",218,36,34.9,"Persemakmuran Shenhan","Nanhai","-han,-koku,-hai,-jing","zaitun/sawo matang"],["Qadira",228.4,34,24.8,"Federasi Zarkand","Dar-Qalmir","-kand,-abad,Dar-,-mir","zaitun/sawo matang"],["Valken",196.8,28,18.4,"Uni Skandheim","Osterstad","-heim,-dal,-fjord,-stad","gading/terang"],["Meridia",204.2,39,29.5,"Republik Valemont","Portomare","-terra,-mar,-porto","zaitun/sawo matang"],["Kushara",238.6,46,32.4,"Persekutuan Tanzuri","Kwamara","-zuri,-mara,Kwa-,-goma","cokelat gelap"],["Karda",178.5,22,12.1,"Federasi Severosk","Novopol","-sk,-ov,Severo-,-pol","gading/terang"],["Andara",194.3,35,25.1,"Konfederasi Altosur","Vallecruz","-pampa,-cruz,Alto-","zaitun/sawo matang"],["Dorava",189.4,33,24.7,"Republik Morava","Zelenograd","-ava,-ograd,-polje","gading/terang"],["Lokan",164.8,41,26.34,"Perserikatan Srivijaya","Kotabhumi","-nusa,-jaya,Kota-,-bhumi","cokelat gelap"],["Veldia",149.2,24,9.8,"Persemakmuran Zuidveld","Hafenbay","-veld,-bay,Zuid-,-ford","zaitun/sawo matang"]].map(a=>({name:a[0],area:a[1],countries:a[2],pop:a[3],fed:a[4],cap:a[5],suf:a[6],pig:a[7]}));
let CN=CONT.map(c=>c.name);const P0=JSON.stringify(PLANETS),C0=JSON.stringify(CONT);
const COMPSEED=[["Astronomi","Struktur Sistem Lecossa","54 planet dalam 4 zona (12/18/15/9), 1.450 satelit alami: 435 Pandora-type (30%) dan 1.015 non-Pandora (70%). Bintang induk Lecossan Prime (nama kerja).","planets=54;zones=12,18,15,9;satellites=1450;pandora=435;non_pandora=1015"],
["Astronomi","Eleantor","Diameter 43.000 km, 1 g, darat:laut 42:58, 6 bulan. Luas ≈5,81 miliar km² (darat ≈2,44; laut ≈3,37).","diameter_km=43000;gravity_g=1;land_pct=42;ocean_pct=58;moons=6"],
["Astronomi","Parameter Astronomi Terbuka","Belum ditetapkan: jarak/periode orbit, massa-luminositas bintang, massa/atmosfer planet lain, nama 435 Pandora-type.","status=open"],
["Biologi","Antropologi Venturian","Humanoid tinggi proporsional, 100% biologis-materialis. Tinggi 175–205 cm (~92%), 206–225 (~7,5%), 226–240 apex (~0,5%). Umur 110–130 tahun. Pigmen adaptif lintang.","height_common=175-205;height_tall=206-225;height_apex=226-240;lifespan=110-130"],
["Biologi","Biosfer Habitable Zone","18 planet berbiosfer menyerupai Bumi; hanya Eleantor yang melahirkan peradaban cerdas. Satelit Pandora-type punya ekosistem kompleks tanpa peradaban.","biosphere_planets=18;intelligent=1"],
["Geopolitik","Tatanan 420 Negara","12 benua, 420 negara berdaulat (belum Unity Nation), populasi ≈309,84 miliar, kepadatan 127 jiwa/km² daratan.","continents=12;nations=420;population=309841648921;density=127"],
["Teknologi","Tingkat Teknologi","Ekuivalen manusia tahun 2100 M. Tanpa FTL, sihir, psionik, atau mind-uploading.","tech_year_eq=2100;kardashev=0.86"],
["Ekonomi & Energi","Anggaran Energi","Total daya ≈3,98×10¹⁴ W (≈400 TW); konsumsi per kapita ≈1,29 kW.","power_w=3.98e14;per_capita_kw=1.29"],
["Eksplorasi","Jangkauan Kolonisasi","Kolonisasi fisik baru 6 bulan Eleantor. 17 planet Habitable Zone lain dan 435 Pandora-type hanya dijangkau wahana nirawak/orbiter.","colonized_moons=6;probe_planets=17;probe_moons=435"],
["Militer & Keamanan","Slot Doktrin & Armada","Belum ditetapkan: doktrin, kelas kapal orbital, aliansi antarbenua. Isi di sini sebagai basis game strategi.","status=open"],
["Sosial & Budaya","Rumpun Bahasa 12 Benua","Pola imbuhan nama per benua (lihat Atlas Level 2 / Level 3 generator).","source=continents.suf"],
["Hook Game","Mode Game yang Didukung","Kampanye: Eleantor + 6 bulan koloni. Strategi: 420 negara. Eksplorasi: 17 planet HZ + 435 Pandora.","mode_campaign=eleantor_6moons;mode_strategy=420_nations;mode_explore=17hz+435pandora"],
["Hook Game","Kontrak Data Game Pack","Tombol Game Pack mengekspor planet, benua, kompendium, lore, karakter, tempat, satelit dalam satu JSON (schema venturian-gamepack-1).","schema=venturian-gamepack-1"]];
const COMP=()=>COMPSEED.map(r=>({id:uid(),cat:r[0],title:r[1],text:r[2],params:r[3].replace(/;/g,'\n'),tags:''}));
let CATS=["Astronomi","Biologi","Geopolitik","Teknologi","Ekonomi & Energi","Militer & Keamanan","Sosial & Budaya","Eksplorasi","Sejarah","Hook Game"];
const SEED=()=>({v:1,syn:[],ms:[],arcN:24,arcT:{},lore:[
["Larangan","Tidak boleh ada sihir, psionik, telepati, atau mind-uploading: Venturian 100% biologis-materialis.","aktif"],
["Larangan","Tidak ada FTL/warp/teleportasi; teknologi maksimal ekuivalen 2100 M, Kardashev 0,86.","aktif"],
["Larangan","Kolonisasi fisik hanya 6 satelit alami Eleantor; 17 planet Habitable Zone lain & 435 satelit Pandora-type hanya dijangkau wahana nirawak/orbiter sebelum era melampaui 2100 M.","aktif"],
["Kunci","54 planet, 4 zona (12/18/15/9), 1.450 satelit (435 Pandora / 1.015 non-Pandora) tetap sampai revisi eksplisit.","aktif"],
["Kunci","Eleantor: 43.000 km, darat:laut 42:58, 1 g, 6 bulan; satu-satunya peradaban cerdas.","aktif"],
["Kunci","Populasi ≈309,84 miliar, 12 benua, 420 negara berdaulat (belum Unity Nation), 127 jiwa/km².","aktif"],
["Kunci","Tinggi Venturian: 175–205 cm (~92%), 206–225 (~7,5%), 226–240 apex (~0,5%); harapan hidup 110–130 th.","aktif"],
["Kunci","Diameter saja tidak menentukan gravitasi/massa/kepadatan; ambang 500.000 km tidak otomatis jadi bintang.","aktif"],
["Terbuka","Posisi & jarak orbit Eleantor; jarak orbit, periode revolusi, eksentrisitas semua planet","terbuka"],
["Terbuka","Nama resmi bintang (Lecossan Prime = nama kerja); massa, luminositas, spektrum","terbuka"],
["Terbuka","Massa/kepadatan/gravitasi planet selain Eleantor; atmosfer & iklim per planet","terbuka"],
["Terbuka","Nama khusus 435 satelit Pandora-type & pembagiannya per planet induk","terbuka"],
["Terbuka","Sejarah lokal, kosakata bahasa, katalog 420 negara, struktur politik internal, profil 6 bulan Eleantor","terbuka"]].map(r=>({id:uid(),type:r[0],text:r[1],status:r[2]})),
chars:[],places:[],notes:'',sat:[],planets:JSON.parse(JSON.stringify(PLANETS)),cont:JSON.parse(JSON.stringify(CONT)),comp:COMP()});
let S=SEED(),UI={tab:0,sub:0,fs:'',fe:'',ord:1,msid:null};
/* ===== STORAGE ===== */
let db;const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function load(){try{db=await idb();const v=await new Promise(r=>{const q=db.transaction('kv').objectStore('kv').get('state');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});if(v){S=v;return}}catch(e){}try{const j=localStorage.getItem(SHADOW_KEY);if(j)S=JSON.parse(j)}catch(e){}}
function save(){try{localStorage.setItem(SHADOW_KEY,JSON.stringify(S))}catch(e){}try{if(db)db.transaction('kv','readwrite').objectStore('kv').put(JSON.parse(JSON.stringify(S)),'state')}catch(e){}}
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
/* ===== UI HELPERS ===== */
function modal(title,fields,data,cb){const d=data||{};$('#modal').style.display='block';$('#modal').innerHTML=`<div class="box"><h2>${title}</h2><div class="row">${fields.map(f=>`<div style="${f.t=='area'?'flex-basis:100%':''}"><label>${f.l}</label>${f.t=='area'?`<textarea id="f_${f.k}" rows="6">${esc(d[f.k])}</textarea>`:f.t=='sel'?`<select id="f_${f.k}">${f.o.map(o=>`<option ${o==d[f.k]?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input id="f_${f.k}" type="${f.t||'text'}" value="${esc(d[f.k])}">`}</div>`).join('')}</div><div style="margin-top:12px"><button class="btn" id="mok">Simpan</button><button class="btn g" onclick="closeM()">Batal</button></div></div>`;
$('#mok').onclick=()=>{const o={};fields.forEach(f=>{const v=$('#f_'+f.k).value;o[f.k]=f.t=='number'?(v===''?'':+v):v});cb(o);closeM()}}
const closeM=()=>$('#modal').style.display='none';
const bars=(rows,unit='',col='var(--em)')=>{const m=Math.max(...rows.map(r=>r[1]),1e-9);return rows.map(r=>`<div style="display:flex;gap:8px;align-items:center;margin:3px 0"><div style="width:130px;font-size:12px">${esc(r[0])}</div><div style="flex:1"><div class="bar" style="width:${Math.max(r[1]/m*100,.5)}%;background:${col}"></div></div><div class="mono" style="width:110px;font-size:12px">${fmt(r[1])} ${unit}</div></div>`).join('')};
const sortEp=a=>a.slice().sort((x,y)=>((x.season-y.season)||(x.ep-y.ep))*UI.ord);
const cascade=(arr)=>{const ss=[...new Set(arr.map(x=>x.season))].sort((a,b)=>a-b);let f=arr.filter(x=>!UI.fs||x.season==UI.fs);const es=f.map(x=>x.ep);if(UI.fe&&!es.includes(+UI.fe))UI.fe='';f=f.filter(x=>!UI.fe||x.ep==UI.fe);return{f:sortEp(f),bar:`<div class="card row"><div><label>Season/Arc</label><select onchange="UI.fs=this.value;UI.fe='';R()"><option value="">Semua</option>${ss.map(s=>`<option ${s==UI.fs?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Episode</label><select onchange="UI.fe=this.value;R()"><option value="">Semua</option>${[...new Set(arr.filter(x=>!UI.fs||x.season==UI.fs).map(x=>x.ep))].sort((a,b)=>a-b).map(e=>`<option ${e==UI.fe?'selected':''}>${e}</option>`).join('')}</select></div><button class="btn g" onclick="UI.ord*=-1;R()">Urutan ${UI.ord>0?'Naik ▲':'Turun ▼'}</button><button class="btn g" onclick="UI.fs='';UI.fe='';UI.ord=-1;R()">Lompat ke Terakhir</button></div>`}};
/* ===== TABS ===== */
const TABS=["1 Sinopsis","2 Manuskrip & Reader","3 Matriks Arc","4 Konsistensi Lore","5 Karakter Venturian","6 Atlas Lecossa","7 Kompendium & Kalkulator","8 Intelligence Engine","9 Catatan, Forge & Backup","10 Validator & Generator","11 Timeline, Relasi & Plot","12 Game Lab","13 Peta Visual","14 Wilayah & Rekap"];
function R(){$('#rail').innerHTML='<div class="brand"><b>⬡ LECOSSA</b><small>CHRONICLE &amp; WORLDBUILDING SUITE</small></div>'+TABS.map((t,i)=>`<button class="tb ${i==UI.tab?'on':''}" onclick="UI.tab=${i};UI.sub=0;UI.fs=UI.fe='';R()">${t}</button>`).join('');
$('#main').innerHTML=`<div id="top"><div><b style="font-size:16px">${TABS[UI.tab]}</b><div class="mono" style="font-size:11px;color:#6b7f95">Planet ${PLANETS.length} · Benua ${CONT.length} · Karakter ${S.chars.length} · Naskah ${S.ms.length} · Kompendium ${S.comp.length}</div></div><div><button class="btn g" onclick="exPack()">🎮 Game Pack</button><button class="btn g" onclick="dl('Venturian_FULL_Backup.json',JSON.stringify(S),'application/json')">⬇ Ekspor Semua</button><label class="btn">⬆ Impor Semua<input type="file" accept=".json" hidden onchange="restore(this.files[0])"></label></div></div><div id="pg">${safe([t1,t2,t3,t4,t5,t6,t7,t8,t9,t10,t11,t12,t13,t14][UI.tab])}</div>`;after()}
function after(){if(UI.tab==12){pz('mo','orbit');pz('mc','cont');pz('mg','grid');pz('mb','blk')}const n=$('#notes');if(n)n.oninput=()=>{S.notes=n.value;save()}}
const SF=[{k:'season',l:'Season/Arc',t:'number'},{k:'ep',l:'Episode',t:'number'},{k:'title',l:'Judul'},{k:'focus',l:'Fokus Benua/Planet'},{k:'pov',l:'Karakter POV'},{k:'tech',l:'Batas Teknologi',t:'sel',o:['≤ 2100 M / Kardashev 0,86','Hanya wahana nirawak','Lain (catat di sinopsis)']},{k:'text',l:'Sinopsis',t:'area'}];
function t1(){const c=cascade(S.syn);return`<h2>Studio Sinopsis & Outliner</h2><button class="btn" onclick="synEdit()">+ Sinopsis</button><button class="btn v" onclick="synBulk()">Tempel Massal</button>${modBar('syn')}${c.bar}${c.f.map(s=>`<div class="card"><b>S${s.season} E${s.ep} — ${esc(s.title)}</b> <span class="tag">${esc(s.focus)}</span><span class="tag">POV ${esc(s.pov)}</span><span class="tag">${esc(s.tech)}</span><p class="serif">${esc(s.text)}</p><button class="btn a" onclick="synDev('${s.id}')">Kembangkan ke Tab Naskah</button><button class="btn g" onclick="synEdit('${s.id}')">Edit</button><button class="btn r" onclick="del('syn','${s.id}')">Hapus</button></div>`).join('')||'<div class="card">Belum ada sinopsis.</div>'}`}
function del(k,id){if(confirm('Hapus?')){S[k]=S[k].filter(x=>x.id!=id);save();R()}}

const CORE={name:'name',nama:'name',no:'no',nomor:'no',zone:'zone',zona:'zone',cls:'cls',kelas:'cls',klasifikasi:'cls',diam:'diam',diameter:'diam',diameter_km:'diam',sats:'sats',satelit:'sats',moons:'sats',bulan:'sats',jumlah_bulan:'sats',mass:'mass',massa:'mass',au:'au',jarak_au:'au',jarak_orbit:'au',note:'note',catatan:'note'},NUMK=new Set(['no','diam','sats','mass','au']);
function putPar(p,k,v,u,f){const a=parOf(p),key=String(k??'').trim(),val=v==null?'':String(v);if(!key||(val===''&&!f))return;const r=a.find(x=>x.k.toLowerCase()==key.toLowerCase());if(r){r.v=val;if(u!=null&&u!=='')r.u=String(u)}else a.push({k:key,v:val,u:u==null?'':String(u)})}
function applyPlanet(p,d,f){let n=0;Object.entries(d||{}).forEach(([k,v])=>{const lk=k.toLowerCase();if(lk=='id')return;if(lk=='par'||lk=='params'||lk=='parameter'){if(Array.isArray(v))v.forEach(r=>{putPar(p,r.k??r.key??r.nama??r.parameter,r.v??r.value??r.nilai,r.u??r.unit??r.satuan,f);n++});else if(v&&typeof v=='object')Object.entries(v).forEach(([kk,vv])=>{if(vv&&typeof vv=='object')putPar(p,kk,vv.v??vv.value,vv.u??vv.unit,f);else putPar(p,kk,vv,null,f);n++});return}
if((v===null||v==='')&&!f)return;const c=CORE[lk];if(c){if(c=='name'&&v!==p.name){const o=p.name;S.sat.forEach(x=>{if(x.parent==o)x.parent=String(v)})}p[c]=NUMK.has(c)?(+v||0):String(v??'');n++}else if(v&&typeof v=='object'&&!Array.isArray(v)){putPar(p,k,v.v??v.value,v.u??v.unit,f);n++}else if(typeof v!='object'){putPar(p,k,v,null,f);n++}});return n}
const plObj=p=>{parOf(p);return{id:p.id,no:p.no,name:p.name,zone:p.zone,cls:p.cls,diam:p.diam,sats:p.sats,mass:p.mass||null,au:p.au||null,note:p.note||'',par:p.par}};

function runAll(d){const it=Array.isArray(d)?d.map(x=>[null,x]):(d&&Array.isArray(d.planets))?d.planets.map(x=>[null,x]):Object.entries(d||{});let ok=0;const bad=[];it.forEach(([k,v])=>{if(!v||typeof v!='object')return;const p=findPl(k,v);if(p){applyPlanet(p,v);ok++}else bad.push(k||v.name||v.no)});save();R();alert(ok+' planet diperbarui (digabung; semua tetap bisa diedit).'+(bad.length?'\nTidak cocok: '+bad.slice(0,15).join(', '):''))}

if(GU.sub==0){const iss=[];walk(root,0,n=>{const ch=n.children||[];if(!ch.length)return;const a=ch.reduce((s,c)=>s+(+c.area||0),0),p=ch.reduce((s,c)=>s+(+c.pop||0),0);if(n.area&&a>n.area*1.05)iss.push([n,`Luas anak ${fmt(a/n.area*100)}% dari induk`]);if(n.pop&&p>n.pop*1.05)iss.push([n,`Populasi anak ${fmt(p/n.pop*100)}% dari induk`]);if(n.quotaCountries&&ch.length!=n.quotaCountries)iss.push([n,`Negara ${ch.length} dari kuota ${n.quotaCountries}`])});
body=`<div class="card"><h3>Rekap per level administratif</h3><div class="tw"><table><tr><th>Level</th><th>Jenis</th><th>Jumlah</th><th>Total luas km²</th><th>Total populasi</th><th>Kepadatan rata-rata</th><th>Terbesar (populasi)</th></tr>${Object.keys(lv).map(d=>{const l=lv[d],a=l.reduce((s,n)=>s+(+n.area||0),0),p=l.reduce((s,n)=>s+(+n.pop||0),0),b=l.reduce((m,n)=>(+n.pop||0)>(+m.pop||0)?n:m,l[0]);return`<tr><td>L${d}</td><td>${esc(l[0].kind||lvN(+d))}</td><td>${fmt(l.length)}</td><td>${fmt(a)}</td><td>${fmt(p)}</td><td>${fmt(a?p/a:0)}</td><td><a href="#" style="color:var(--em)" onclick="geoModal('${b.id}');return false">${esc(b.name)}</a></td></tr>`}).join('')}</table></div></div>
<div class="card"><h3>Jumlah wilayah per level</h3>${bars(Object.keys(lv).filter(d=>d>0).map(d=>[(lv[d][0].kind||lvN(+d)).split(' / ')[0]+' (L'+d+')',lv[d].length]),'wilayah')}</div>
<div class="card"><h3>Per benua (turunan dihitung sampai level terdalam yang dibuat)</h3><div class="tw"><table>${gHead(1,md)}${gRows(root.children||[],1,md)}</table></div></div>
<div class="card"><h3>Validasi struktur (${iss.length})</h3>${iss.slice(0,40).map(([n,m])=>`<div>⚠ <a href="#" style="color:var(--am)" onclick="geoModal('${n.id}');return false">${esc(n.name)}</a>: ${m}</div>`).join('')||'<span class="ok">Tidak ada selisih.</span>'}</div>`}
else{const cur=GU.path.length?gfind(root,GU.path[GU.path.length-1],[]).n:root,base=GU.path.length+1;body=`<div class="card"><div style="margin-bottom:8px"><a href="#" style="color:var(--te)" onclick="GU.path=[];R();return false">${esc(root.name)}</a>${GU.path.map((id,i)=>{const f=gfind(root,id,[]);return` › <a href="#" style="color:var(--te)" onclick="GU.path=GU.path.slice(0,${i+1});R();return false">${esc(f?f.n.name:'?')}</a>`}).join('')} <button class="btn a" onclick="geoModal('${cur.id}')">Breakdown ${esc(cur.name)}</button></div><div class="tw"><table>${gHead(base,md)}${gRows(cur.children||[],base,md)}</table></div>${(cur.children||[]).length?'':'<p>Wilayah ini belum punya turunan.</p>'}</div>`}
return`<div class="card row"><label class="btn">⬆ Impor JSON Geoeditor<input type="file" accept=".json" hidden onchange="geoImp(this.files[0])"></label><button class="btn g" onclick="geoCsv()">⬇ CSV semua wilayah</button><button class="btn g" onclick="geoRecap()">⬇ Rekap JSON</button>${S.geo?'<button class="btn r" onclick="gClear()">Hapus data Geo</button>':''}<div class="mono" style="flex:3">Sumber: ${S.geo?esc(S.geo.src)+' · '+new Date(S.geo.t).toLocaleString('id-ID'):'data engine (negara + slice), tanpa poligon — impor JSON Geoeditor untuk wilayah lengkap'}</div></div>
<div class="tiles"><div class="tile"><b>${fmt(all.length-1)}</b><span>Total wilayah (di bawah planet)</span></div><div class="tile"><b>L${md}</b><span>Level terdalam: ${esc(lvN(md))}</span></div><div class="tile"><b class="${nat==quota?'ok':'ko'}">${nat}/${quota}</b><span>Negara dibuat / kuota</span></div><div class="tile"><b>${fmt(root.pop/1e9)}</b><span>Populasi planet (miliar)</span></div></div>
<div class="row" style="margin-bottom:8px"><button class="btn ${GU.sub==0?'':'g'}" onclick="GU.sub=0;R()">📊 Ringkasan</button><button class="btn ${GU.sub==1?'':'g'}" onclick="GU.sub=1;R()">🧭 Telusur wilayah</button></div>${body}`}
function gdHtml(n,anc){const par=anc[anc.length-1],o=[`Kepadatan ${fmt(n.area?n.pop/n.area:0)} jiwa/km²`];if(par&&par.area)o.push(`Porsi luas induk ${fmt(n.area/par.area*100)}% · porsi populasi ${par.pop?fmt(n.pop/par.pop*100)+'%':'—'}`);const ds=descAbs(n,anc.length),ch=n.children||[],ca=ch.reduce((a,c)=>a+(+c.area||0),0);o.push(`Anak langsung: ${ch.length}`+(n.area&&ch.length?` · cakupan luas anak ${fmt(ca/n.area*100)}%`:''));const k=Object.keys(ds);if(k.length)o.push('Turunan: '+k.map(d=>`${fmt(ds[d])} ${lvN(+d)}`).join(' · '));return o.join('<br>')}
function gset(id,k,v){const f=gfind(geoRoot(),id,[]);if(!f||!S.geo)return;f.n[k]=v;save();const e=$('#gd');if(e)e.innerHTML=gdHtml(f.n,f.p)}
function gp(id,i,k,v){gfind(geoRoot(),id,[]).n.par[i][k]=v;save()}
function gpAdd(id,t){const n=gfind(geoRoot(),id,[]).n;n.par=n.par||[];if(t)['Iklim','Topografi','Ekonomi utama','Bahasa/dialek','Kota terbesar','Sumber daya','Catatan sejarah','Hubungan antariksa'].forEach(k=>{if(!n.par.some(r=>r.k==k))n.par.push({k,v:'',u:''})});else n.par.push({k:'',v:'',u:''});save();geoModal(id)}
function gpDel(id,i){gfind(geoRoot(),id,[]).n.par.splice(i,1);save();geoModal(id)}
const closeG=()=>{closeM();R()};
function miniMap(n){const P=n.poly;if(!P||P.length<3)return'<small>Tidak ada poligon (data engine).</small>';const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]),x0=Math.min(...xs),y0=Math.min(...ys),w=Math.max(...xs)-x0||1,h=Math.max(...ys)-y0||1,m=Math.max(w,h),pt=q=>q.map(p=>p.join(',')).join(' ');return`<svg viewBox="${x0-m*.04} ${y0-m*.04} ${w+m*.08} ${h+m*.08}" style="width:100%;max-height:300px;background:#05080c;border-radius:8px"><polygon points="${pt(P)}" fill="#0c1824" stroke="#38bdf8" stroke-width="${m/300}"/>${(n.children||[]).filter(c=>c.poly&&c.poly.length>2).map(c=>`<polygon points="${pt(c.poly)}" fill="hsl(${mn(c.id)%360},45%,30%)" stroke="#0b1a14" stroke-width="${m/600}" style="cursor:pointer" onclick="geoModal('${c.id}')"><title>${esc(c.name)}</title></polygon>`).join('')}${(n.pins||[]).map(q=>`<circle cx="${q.x}" cy="${q.y}" r="${m/150}" fill="#f59e0b"><title>${esc(q.name)} (${esc(q.type||'')})</title></circle>`).join('')}</svg>`}
function geoModal(id){const root=geoRoot(),f=gfind(root,id,[]);if(!f)return;const n=f.n,anc=f.p,d=anc.length,ro=!S.geo,dis=ro?'disabled':'',lab=n.kind||lvN(d),cn=anc[1]||n,C=CONT.find(c=>c.name==cn.name),low=x=>String(x||'').toLowerCase(),nm=n.name;
const fld=(k,l,t,ex)=>`<div><label>${l}</label><input ${dis} type="${t||'text'}" ${ex||''} value="${esc(n[k]??'')}" oninput="gset('${id}','${k}',${t=='number'?'+this.value':'this.value'})"></div>`;
const chs=S.chars.filter(c=>[c.country,c.city].some(v=>v&&low(v)==low(nm))||(d==1&&c.cont==nm)),ms=S.ms.filter(m=>m.text&&m.text.includes(nm)),tl=S.tl.filter(t=>low(t.title+' '+t.text).includes(low(nm))),last=low(nm).split(' ').pop(),sufs=C?C.suf.split(',').map(x=>x.trim().toLowerCase()):[],sok=sufs.some(x=>x.startsWith('-')?last.endsWith(x.slice(1)):x.endsWith('-')?last.startsWith(x.slice(0,-1)):last==x),par=n.par||[];
$('#modal').style.display='block';$('#modal').innerHTML=`<div class="box" style="max-width:1000px"><div class="row" style="align-items:center"><h2 style="flex:1;margin:0">${esc(nm)} <span class="tag">${esc(lab)}</span><span class="tag">L${d}</span></h2><button class="btn g" onclick="closeG()">Tutup ✕</button></div>
<div style="margin:6px 0;font-size:12px">${anc.map(a=>`<a href="#" style="color:var(--te)" onclick="geoModal('${a.id}');return false">${esc(a.name)}</a> › `).join('')}<b>${esc(nm)}</b></div>${ro?'<div class="card" style="border-color:var(--am)">Sumber: data engine (hanya baca). Impor JSON Geoeditor di Tab 14 agar bisa mengedit.</div>':''}
<div class="row" style="align-items:flex-start"><div style="flex:1 1 380px"><h3>Data wilayah</h3><div class="row">${fld('name','Nama')}${fld('cap','Ibu kota / pusat')}${fld('gov','Pemerintahan')}${fld('area','Luas (km²)','number','step="any"')}${fld('pop','Populasi','number')}${fld('suf','Imbuhan nama')}</div><label style="margin-top:6px">Pigmen dominan</label><select ${dis} onchange="gset('${id}','pig',this.value)">${[...new Set(['gading/terang','zaitun/sawo matang','cokelat gelap',n.pig].filter(Boolean))].map(o=>`<option ${o==n.pig?'selected':''}>${esc(o)}</option>`).join('')}</select><label style="margin-top:6px">Catatan</label><textarea ${dis} rows="3" oninput="gset('${id}','note',this.value)">${esc(n.note||'')}</textarea></div><div style="flex:1 1 320px"><h3>Peta wilayah & turunan (klik untuk membuka)</h3>${miniMap(n)}</div></div>
<div class="card mono" id="gd" style="margin-top:8px;line-height:1.7">${gdHtml(n,anc)}</div>
${(n.children||[]).length?`<h3>Wilayah di bawahnya (${n.children.length})</h3><div class="tw" style="max-height:30vh"><table><tr><th>Nama</th><th>Jenis</th><th>Luas km²</th><th>Populasi</th><th>Kepadatan</th><th>Anak</th></tr>${n.children.slice(0,100).map(c=>`<tr><td><a href="#" style="color:var(--em)" onclick="geoModal('${c.id}');return false">${esc(c.name)}</a></td><td>${esc(c.kind||'')}</td><td>${fmt(c.area)}</td><td>${fmt(c.pop)}</td><td>${fmt(c.area?c.pop/c.area:0)}</td><td>${(c.children||[]).length}</td></tr>`).join('')}</table></div>${n.children.length>100?'<small>100 pertama; lihat semuanya di Tab 14 › Telusur.</small>':''}`:''}
${(n.pins||[]).length?`<h3>Titik / kota (pin)</h3>${n.pins.map(q=>`<span class="tag">${esc(q.name)} · ${esc(q.type||'')}${q.pop?' · '+fmt(q.pop):''}</span>`).join('')}`:''}
<h3>Informasi pendukung dari engine</h3><div class="card" style="line-height:1.7">${C?`Benua induk: <b>${esc(C.name)}</b> · federasi ${esc(C.fed)} (${esc(C.cap)}) · imbuhan ${esc(C.suf)} · pigmen ${esc(C.pig)}<br>`:''}${C&&d>=2?`Morfologi nama: <b class="${sok?'ok':'ko'}">${sok?'selaras':'tidak selaras'}</b> dengan imbuhan benua<br>`:''}Karakter terkait: ${chs.map(c=>`<span class="tag">${esc(c.name)}</span>`).join('')||'—'}<br>Disebut di naskah: ${ms.length} episode ${ms.slice(0,12).map(m=>`<span class="tag">S${m.season}E${m.ep}</span>`).join('')}<br>Timeline terkait: ${tl.map(t=>`<span class="tag">Th ${t.year} ${esc(t.title)}</span>`).join('')||'—'}</div>
<h3>Parameter tambahan (editable)</h3><div class="tw" style="max-height:34vh"><table><tr><th>Parameter</th><th>Nilai</th><th>Satuan</th><th></th></tr>${par.map((r,i)=>`<tr><td><input ${dis} value="${esc(r.k)}" oninput="gp('${id}',${i},'k',this.value)"></td><td><input ${dis} style="min-width:220px" value="${esc(r.v)}" oninput="gp('${id}',${i},'v',this.value)"></td><td><input ${dis} style="min-width:60px" value="${esc(r.u)}" oninput="gp('${id}',${i},'u',this.value)"></td><td><button class="btn r" ${dis} onclick="gpDel('${id}',${i})">×</button></td></tr>`).join('')}</table></div>${ro?'':`<button class="btn" onclick="gpAdd('${id}')">+ Parameter</button><button class="btn g" onclick="gpAdd('${id}',1)">Template wilayah</button>`}<div style="margin-top:8px"><button class="btn" onclick="closeG()">Selesai</button></div></div>`}
load().then(()=>{bind();R()});
</script></body></html>
