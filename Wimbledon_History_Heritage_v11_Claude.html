function idealXiAvg(squad) {
  var by = { GK: [], DF: [], MF: [], FW: [] };
  squad.forEach(function(p) { if (by[p.pos]) by[p.pos].push(p.ovr); });
  var need = { GK: 1, DF: 4, MF: 4, FW: 2 }, sum = 0, n = 0;
  Object.keys(need).forEach(function(k) {
    by[k].sort(function(a, b) { return b - a; });
    for (var i = 0; i < need[k] && i < by[k].length; i++) { sum += by[k][i]; n++; }
  });
  return n ? sum / n : 70;
}

function pickStartingXI(squad, r, opts) {
  opts = opts || {};
  var SG = getSettings();
  var restLine = 66 + ((opts.rest === undefined ? 0.5 : opts.rest) - 0.5) * 10;
  var rot = (opts.rot || 0) * SG.rotation;
  var effMap = {};
  var avgOvr = 0, i;
  for (i = 0; i < squad.length; i++) avgOvr += squad[i].ovr;
  avgOvr = squad.length ? avgOvr / squad.length : 70;

  var rated = [], hurt = [];
  for (i = 0; i < squad.length; i++) {
    var p = squad[i];
    ensurePlayerFields(p);
    if (!isAvailable(p)) { hurt.push(p); continue; }
    var e = effRating(p, opts);
    effMap[p.id] = e;
    var sc = e + (r() - 0.5) * 3;
    if (p.fit < restLine) sc -= (restLine - p.fit) * 0.55;
    if (rot > 0) sc += (r() - 0.5) * rot * 16 - rot * Math.max(0, p.ovr - avgOvr) * 0.28;
    rated.push({ p: p, score: sc });
  }

  var byScore = function(a, b) { return b.score - a.score; };
  var gk = [], def = [], med = [], fwd = [];
  for (i = 0; i < rated.length; i++) {
    var ps = rated[i].p.pos;
    (ps === 'GK' ? gk : (ps === 'DF' ? def : (ps === 'MF' ? med : fwd))).push(rated[i]);
  }
  gk.sort(byScore); def.sort(byScore); med.sort(byScore); fwd.sort(byScore);

  var xi = [];
  if (gk[0]) xi.push(gk[0].p);
  for (i = 0; i < 4 && i < def.length; i++) xi.push(def[i].p);
  for (i = 0; i < 4 && i < med.length; i++) xi.push(med[i].p);
  for (i = 0; i < 2 && i < fwd.length; i++) xi.push(fwd[i].p);

  var used = {};
  xi.forEach(function(p) { used[p.id] = 1; });
  rated.sort(byScore).forEach(function(it) {
    if (xi.length < 11 && !used[it.p.id]) { xi.push(it.p); used[it.p.id] = 1; }
  });
  if (xi.length < 11) {
    hurt.sort(function(a, b) { return (a.inj + a.susp) - (b.inj + b.susp); });
    for (i = 0; i < hurt.length && xi.length < 11; i++) {
      effMap[hurt[i].id] = effRating(hurt[i], opts) - 6;
      xi.push(hurt[i]); used[hurt[i].id] = 1;
    }
  }

  var benchItems = rated.filter(function(it) { return !used[it.p.id]; });
  var bench = benchItems.map(function(it) { return it.p; }).slice(0, 9);
  if (!bench.some(function(p) { return p.pos === 'GK'; })) {
    var rg = benchItems.filter(function(it) { return it.p.pos === 'GK'; });
    if (rg.length) { if (bench.length >= 9) bench.pop(); bench.push(rg[0].p); }
  }
  return { xi: xi, bench: bench, eff: effMap };
}

function xiDeviation(xi, effMap, ideal) {
  var s = 0, lead = 0;
  for (var i = 0; i < xi.length; i++) {
    s += (effMap[xi[i].id] !== undefined ? effMap[xi[i].id] : xi[i].ovr);
    var t = traitOf(xi[i]);
    if (t && t.lead && t.lead > lead) lead = t.lead;
  }
  return { dev: (xi.length ? s / xi.length : ideal) - ideal + lead, avg: xi.length ? s / xi.length : ideal };
}

function preUnavailMap(sq) {
  var m = {};
  for (var i = 0; i < sq.length; i++) if (!isAvailable(sq[i])) m[sq[i].id] = 1;
  return m;
}

// ==============================================================
// 6. ENGINE LIGA 62 PEKAN v11 (KELELAHAN, FORM, CEDERA, KARTU, RATING, KONTEKS LAGA)
// ==============================================================
function buildLineupWeights(lineup, effMap, minute) {
  var cs = [], ca = [], ts = 0, ta = 0;
  for (var i = 0; i < lineup.length; i++) {
    var p = lineup[i];
    var e = (effMap && effMap[p.id] !== undefined) ? effMap[p.id] : p.ovr;
    if (minute > 60) e -= (minute - 60) * lateFade(p);
    var f = Math.pow(Math.max(1, e - 40) / 50, 3);
    ts += POS_SCORE_W[p.pos] * f * (p.fin || 1);
    ta += POS_ASSIST_W[p.pos] * f;
    cs.push(ts); ca.push(ta);
  }
  return { cs: cs, ca: ca, ts: ts, ta: ta };
}

function pickIdx(cum, total, r) {
  var x = r() * total;
  for (var i = 0; i < cum.length; i++) if (x <= cum[i]) return i;
  return cum.length - 1;
}

function generateMatchEventsWithSubs(xi, bench, goals, rr, ctx) {
  ctx = ctx || {};
  var SG = getSettings();
  var effMap = ctx.eff || {};
  var inc = ctx.inc || { inj: [], red: null };
  var MAXSUB = 5;
  var minutes = {};
  xi.forEach(function(p) { minutes[p.id] = 90; });
  bench.forEach(function(p) { minutes[p.id] = 0; });

  var cur = xi.slice();
  var pool = bench.slice();
  var used = 0, justIn = {};
  var subs = [], changes = [], injuries = [], cards = [];

  function pickRep(outP) {
    if (!pool.length) return null;
    var same = pool.filter(function(bp) { return bp.pos === outP.pos; });
    if (outP.pos === 'GK') return same.length ? same[0] : pool[0];
    var outfield = pool.filter(function(bp) { return bp.pos !== 'GK'; });
    if (!outfield.length) return null;
    if (same.length && rr() < 0.72) return same[Math.floor(rr() * Math.min(2, same.length))];
    return outfield[Math.floor(rr() * Math.min(3, outfield.length))];
  }
  function applySub(idx, outP, inP, min, why) {
    minutes[outP.id] = min;
    minutes[inP.id] = 90 - min;
    cur[idx] = inP;
    pool = pool.filter(function(bp) { return bp.id !== inP.id; });
    justIn[inP.id] = 1;
    used++;
    subs.push([outP.id, inP.id, min, why]);
    changes.push({ min: min, out: outP, inn: inP });
  }

  var actions = [];
  inc.inj.forEach(function(x) { actions.push({ min: x.min, kind: 'inj', p: x.p, x: x }); });
  if (inc.red) actions.push({ min: inc.red.min, kind: 'red', p: inc.red.p });
  var plannedN = 3 + (rr() < 0.55 ? 1 : 0) + (rr() < 0.25 ? 1 : 0);
  var wins = [55 + Math.floor(rr() * 10), 66 + Math.floor(rr() * 10), 77 + Math.floor(rr() * 9)];
  for (var k = 0; k < plannedN; k++) actions.push({ min: wins[k % 3], kind: 'plan' });
  actions.sort(function(a, b) { return a.min - b.min; });

  actions.forEach(function(a) {
    var idx;
    if (a.kind === 'red') {
      idx = cur.indexOf(a.p);
      if (idx < 0) return;
      cur.splice(idx, 1);
      minutes[a.p.id] = a.min;
      changes.push({ min: a.min, out: a.p, inn: null });
      cards.push([a.p.id, a.min, 'R']);
      return;
    }
    if (a.kind === 'inj') {
      idx = cur.indexOf(a.p);
      if (idx < 0) return;
      injuries.push([a.p.id, a.min, a.x.type, a.x.games]);
      minutes[a.p.id] = a.min;
      var rep = used < MAXSUB ? pickRep(a.p) : null;
      if (rep) applySub(idx, a.p, rep, a.min, 'I');
      else { cur.splice(idx, 1); changes.push({ min: a.min, out: a.p, inn: null }); }
      return;
    }
    if (used >= MAXSUB || !pool.length) return;
    var cand = cur.filter(function(p) { return p.pos !== 'GK' && !justIn[p.id]; });
    if (!cand.length) return;
    var best = null, bs = -1e9;
    for (var c = 0; c < cand.length; c++) {
      var pp = cand[c];
      var ts = (100 - pp.fit) + Math.max(0, pp.age - 29) * 1.2 + rr() * 16;
      if (ts > bs) { bs = ts; best = pp; }
    }
    var rep2 = pickRep(best);
    if (!rep2) return;
    applySub(cur.indexOf(best), best, rep2, a.min, (100 - best.fit) > 15 ? 'F' : 'T');
  });

  function onPitch(m) {
    var arr = xi.slice();
    for (var i = 0; i < changes.length; i++) {
      var ch = changes[i];
      if (ch.min <= m) {
        var j = arr.indexOf(ch.out);
        if (j >= 0) { if (ch.inn) arr[j] = ch.inn; else arr.splice(j, 1); }
      }
    }
    return arr;
  }

  var events = [];
  for (var g = 0; g < goals; g++) {
    var minute = Math.floor(rr() * 90) + 1;
    var pitch = onPitch(minute);
    if (!pitch.length) pitch = xi;
    var w = buildLineupWeights(pitch, effMap, minute);
    var si = pickIdx(w.cs, w.ts, rr);
    var scorer = pitch[si];
    scorer.tempG = (scorer.tempG || 0) + 1;
    var assistId = null;
    if (rr() < 0.75) {
      var ai = pickIdx(w.ca, w.ta, rr);
      if (ai === si) ai = pickIdx(w.ca, w.ta, rr);
      if (ai !== si) {
        var assister = pitch[ai];
        assister.tempA = (assister.tempA || 0) + 1;
        assistId = assister.id;
      }
    }
    events.push([scorer.id, assistId, minute]);
  }
  events.sort(function(a, b) { return a[2] - b[2]; });

  if (SG.discipline) {
    var everyone = xi.concat(bench);
    for (var y = 0; y < everyone.length; y++) {
      var yp = everyone[y], ym = minutes[yp.id];
      if (!(ym > 0)) continue;
      if (rr() < yellowRate(yp) * (ym / 90)) {
        var starter = xi.indexOf(yp) >= 0;
        var lo = starter ? 1 : 90 - ym + 1, hi = starter ? ym : 90;
        cards.push([yp.id, lo + Math.floor(rr() * Math.max(1, hi - lo + 1)), 'Y']);
      }
    }
    cards.sort(function(a, b) { return a[1] - b[1]; });
  }

  return { events: events, subs: subs, minutes: minutes, cards: cards, injuries: injuries };
}

// ---------- Rating laga (MODUL 8) ----------
function matchRating(p, mins, g, a, gf, ga, effDev, r, vol) {
  var base = 6.2 + (gf > ga ? 0.35 : (gf < ga ? -0.3 : 0));
  var gb = 0;
  for (var i = 0; i < g; i++) gb += Math.max(0.35, 0.95 - i * 0.2);
  base += gb + a * 0.55;
  if (ga === 0) base += (p.pos === 'GK' ? 0.6 : (p.pos === 'DF' ? 0.4 : (p.pos === 'MF' ? 0.1 : 0)));
  else if (p.pos === 'GK' || p.pos === 'DF') base -= Math.min(0.9, 0.05 + (ga - 1) * 0.18);
  base += effDev * 0.035 + p.form * 0.045 + gauss(r) * 0.8 * vol;
  if (mins < 25) base = 6.0 + (base - 6.0) * (mins / 25);
  return clamp(base, 3.8, 10);
}

// Pembaruan pasca-laga untuk satu klub: kebugaran, ketajaman, form, moral, rating, cedera, kartu, skorsing
function topIdsByOvr(sq) {
  var byOvr = sq.slice().sort(function(a, b) { return b.ovr - a.ovr; });
  var ex = {};
  for (var e = 0; e < 11 && e < byOvr.length; e++) ex[byOvr[e].id] = true;
  return ex;
}

function postMatchUpdate(sq, sim, effMap, xiAvgEff, gf, ga, pre, wxFat, r, expect) {
  var SG = getSettings();
  var res = gf > ga ? 1 : (gf < ga ? -1 : 0);
  if (!expect) expect = topIdsByOvr(sq);
  var byId = {}, best = null;

  for (var i = 0; i < sq.length; i++) {
    var p = sq[i];
    byId[p.id] = p;
    var mins = sim.minutes[p.id] || 0;
    var preFit = p.fit;
    if (pre[p.id] && mins === 0) { if (p.inj > 0) p.inj--; if (p.susp > 0) p.susp--; if (p.inj <= 0) p.injT = ''; }

    var d = mins > 0 ? drain90(p, wxFat) * (mins / 90) * (mins < 35 ? 1.1 : 1) : 0;
    var f1 = p.fit - d;
    p.fit = r1(clamp(f1 + recoveryOf(p) + (100 - f1) * 0.12, 0, 100));
    if (mins > 0) p.sharp = r1(Math.min(100, p.sharp + (mins / 90) * 11 + (p.sharp < 70 ? 2 : 0)));
    else p.sharp = r1(Math.max(35, p.sharp - 1.8));

    if (mins > 0) {
      var g = p.tempG || 0, a = p.tempA || 0;
      var vol = formVol(p) + (p.age <= 21 ? 0.1 : 0);
      var ed = (effMap[p.id] !== undefined ? effMap[p.id] : p.ovr) - xiAvgEff;
      var rt = matchRating(p, mins, g, a, gf, ga, ed, r, vol);
      if (mins >= 20) {
        p.srt = Math.round((p.srt + rt) * 100) / 100; p.srn++;
        var dl = rt - p.rb;
        p.rb = Math.round((p.rb * 0.97 + rt * 0.03) * 1000) / 1000;
        p.form = r1(clamp(p.form * 0.80 + dl * 1.6 + gauss(r) * 0.9 * vol, -10, 10));
      }
      if (mins >= 45 && (!best || rt > best.rt)) best = { p: p, rt: rt };
      if (mins >= 60 && ga === 0 && (p.pos === 'GK' || p.pos === 'DF')) p.scs++;
      p.mor += (mins >= 45 ? res * 1.1 + g * 1.6 + (rt - 6.6) * 0.8 : res * 0.4) + (mins >= 60 ? 0.9 : 0.2);
    } else {
      p.form = r1(p.form * 0.93);
      if (!pre[p.id]) {
        p.mor -= (expect[p.id] && preFit >= 75) ? 2.0 : 0.3;
        if (r() < 0.0007 * SG.injury) {
          p.inj = 1 + Math.floor(r() * 3); p.injT = 'Training knock';
          p.sinj++; p.sinjW += p.inj; p.career.inj++;
        }
      }
    }
    p.mor = r1(clamp(p.mor + (60 - p.mor) * 0.03, 10, 100));
  }

  sim.injuries.forEach(function(x) {
    var p = byId[x[0]]; if (!p) return;
    p.inj = x[3]; p.injT = x[2]; p.sinj++; p.sinjW += x[3]; p.career.inj++;
    p.sharp = r1(Math.max(35, p.sharp - 10));
  });
  sim.cards.forEach(function(c) {
    var p = byId[c[0]]; if (!p) return;
    if (c[2] === 'Y') {
      p.sy++; p.yc++; p.career.yel++;
      if (p.yc % 5 === 0) p.susp = Math.max(p.susp, 1);
    } else {
      p.sr++; p.career.red++;
      var x = r();
      p.susp = Math.max(p.susp, x < 0.7 ? 1 : (x < 0.9 ? 2 : 3));
    }
  });
  return best;
}

function avgOf(arr, def) {
  if (!arr.length) return def;
  var s = 0;
  for (var i = 0; i < arr.length; i++) s += arr[i];
  return s / arr.length;
}

function playTierLeague(clubs, t, se) {
  var rr = pseudoRandom(se * 10007 + t * 7919 + 13);
  var SG = getSettings();
  var schedule = generateRoundRobinSchedule(clubs);
  var totalJornadas = schedule.length;

  var clubMap = {};
  clubs.forEach(function(c) {
    var sq = PLAYERS_DB[c];
    for (var q = 0; q < sq.length; q++) {
      ensurePlayerFields(sq[q]);
      if (sq[q]._ks !== se) kickoffReset(sq[q], se);
    }
    var mg = getManager(c, se);
    clubMap[c] = {
      id: c, sq: sq, mg: mg,
      str: clubStrength(c) + (rr() - 0.5) * 5 + (mg.r - 65) * 0.06,
      ideal: idealXiAvg(sq), expect: topIdsByOvr(sq), cap: stadiumCapacity(c), pts5: [],
      W: 0, D: 0, L: 0, GF: 0, GA: 0
    };
  });

  var jornadasData = [];

  for (var jIdx = 0; jIdx < totalJornadas; jIdx++) {
    var fixturesThisJornada = [];
    var pairings = schedule[jIdx];
    var wx = rollWeather(jIdx, totalJornadas, rr);

    for (var mIdx = 0; mIdx < pairings.length; mIdx++) {
      var hId = pairings[mIdx][0];
      var aId = pairings[mIdx][1];
      var home = clubMap[hId];
      var away = clubMap[aId];
      var big = home.str > 80 && away.str > 80;

      var hPre = preUnavailMap(home.sq), aPre = preUnavailMap(away.sq);
      var hLineup = pickStartingXI(home.sq, rr, { rest: home.mg.rot, big: big });
      var aLineup = pickStartingXI(away.sq, rr, { rest: away.mg.rot, big: big });
      var hInc = rollIncidents(hLineup.xi, rr, wx);
      var aInc = rollIncidents(aLineup.xi, rr, wx);
      var hD = xiDeviation(hLineup.xi, hLineup.eff, home.ideal);
      var aD = xiDeviation(aLineup.xi, aLineup.eff, away.ideal);

      var fill = clamp(0.60 + ((S.prestige[aId] || 60) - 62) * 0.004 + (avgOf(home.pts5, 1.4) - 1.4) * 0.07 + (rr() - 0.5) * 0.16, 0.45, 1.0);
      var attendance = Math.round(home.cap * fill);
      var hfa = 1.6 + (fill - 0.7) * 3.0;

      var diff = (home.str + hD.dev + hfa) - (away.str + aD.dev);
      var lh = 1.48 * Math.exp(diff / 22) * wx.goal * styleAtt(home.mg) * styleDef(away.mg);
      var la = 1.18 * Math.exp(-diff / 22) * wx.goal * styleAtt(away.mg) * styleDef(home.mg);
      if (hInc.red) { var fh = (90 - hInc.red.min) / 90; lh *= (1 - 0.30 * fh); la *= (1 + 0.20 * fh); }
      if (aInc.red) { var fa = (90 - aInc.red.min) / 90; la *= (1 - 0.30 * fa); lh *= (1 + 0.20 * fa); }
      lh = Math.max(0.8, Math.min(3.9, lh));
      la = Math.max(0.6, Math.min(3.6, la));
      var gh = generatePoissonGoals(lh, rr);
      var ga = generatePoissonGoals(la, rr);

      home.GF += gh; home.GA += ga; away.GF += ga; away.GA += gh;
      if (gh > ga) { home.W++; away.L++; home.pts5.push(3); away.pts5.push(0); }
      else if (gh < ga) { away.W++; home.L++; away.pts5.push(3); home.pts5.push(0); }
      else { home.D++; away.D++; home.pts5.push(1); away.pts5.push(1); }
      if (home.pts5.length > 5) home.pts5.shift();
      if (away.pts5.length > 5) away.pts5.shift();

      home.sq.forEach(function(p) { p.tempG = 0; p.tempA = 0; });
      away.sq.forEach(function(p) { p.tempG = 0; p.tempA = 0; });

      var hSim = generateMatchEventsWithSubs(hLineup.xi, hLineup.bench, gh, rr, { eff: hLineup.eff, inc: hInc });
      var aSim = generateMatchEventsWithSubs(aLineup.xi, aLineup.bench, ga, rr, { eff: aLineup.eff, inc: aInc });

      hLineup.xi.forEach(function(p) { p.sstart = (p.sstart || 0) + 1; });
      aLineup.xi.forEach(function(p) { p.sstart = (p.sstart || 0) + 1; });

      home.sq.forEach(function(p) {
        var mins = hSim.minutes[p.id] || 0;
        p.sg = (p.sg || 0) + (p.tempG || 0);
        p.sa = (p.sa || 0) + (p.tempA || 0);
        p.smin = (p.smin || 0) + mins;
        if (mins > 0) p.sapp = (p.sapp || 0) + 1;
      });
      away.sq.forEach(function(p) {
        var mins = aSim.minutes[p.id] || 0;
        p.sg = (p.sg || 0) + (p.tempG || 0);
        p.sa = (p.sa || 0) + (p.tempA || 0);
        p.smin = (p.smin || 0) + mins;
        if (mins > 0) p.sapp = (p.sapp || 0) + 1;
      });

      var bh = postMatchUpdate(home.sq, hSim, hLineup.eff, hD.avg, gh, ga, hPre, wx.fat, rr, home.expect);
      var ba = postMatchUpdate(away.sq, aSim, aLineup.eff, aD.avg, ga, gh, aPre, wx.fat, rr, away.expect);
      var pm = (bh && (!ba || bh.rt >= ba.rt)) ? bh : ba;
      if (pm) pm.p.career.potm++;

      var meta = {
        pm: pm ? pm.p.id : 0, pr: pm ? Math.round(pm.rt * 10) / 10 : 0,
        w: wx.id, a: attendance,
        c: hSim.cards.concat(aSim.cards),
        i: hSim.injuries.concat(aSim.injuries)
      };

      fixturesThisJornada.push([
        home.id, away.id, gh, ga,
        hSim.events, aSim.events,
        hLineup.xi.map(function(p) { return p.id; }),
        aLineup.xi.map(function(p) { return p.id; }),
        hLineup.bench.map(function(p) { return p.id; }),
        aLineup.bench.map(function(p) { return p.id; }),
        hSim.subs, aSim.subs, meta
      ]);
    }

    // jeda internasional / winter break: pemulihan ekstra
    var brk = ((jIdx + 1) % 10 === 0) ? 4 : (jIdx === 30 ? 8 : 0);
    if (brk) {
      clubs.forEach(function(c) {
        var sq = clubMap[c].sq;
        for (var z = 0; z < sq.length; z++) sq[z].fit = r1(Math.min(100, sq[z].fit + brk + (100 - sq[z].fit) * 0.06));
      });
    }
    jornadasData.push(fixturesThisJornada);
  }

  var table = clubs.map(function(cId) {
    var x = clubMap[cId];
    return [x.id, x.W, x.D, x.L, x.GF, x.GA, (x.W * 3 + x.D)];
  }).sort(function(a, b) {
    return (b[6] - a[6]) || ((b[4] - b[5]) - (a[4] - a[5])) || (b[4] - a[4]) || (a[0] - b[0]);
  });

  var pool = [];
  clubs.forEach(function(cId) {
    (PLAYERS_DB[cId] || []).forEach(function(p) { pool.push(p); });
  });

  var scorers = pool.slice()
    .filter(function(p) { return (p.sg || 0) > 0; })
    .sort(function(a, b) { return (b.sg - a.sg) || (b.sa - a.sa) || (b.ovr - a.ovr); })
    .slice(0, 15).map(function(p) { return [p.id, p.name, p.club, p.sg, p.sa]; });

  var assisters = pool.slice()
    .filter(function(p) { return (p.sa || 0) > 0; })
    .sort(function(a, b) { return (b.sa - a.sa) || (b.sg - a.sg) || (b.ovr - a.ovr); })
    .slice(0, 10).map(function(p) { return [p.id, p.name, p.club, p.sa, p.sg]; });

  return { table: table, scorers: scorers, assisters: assisters, jornadas: jornadasData };
}

// ==============================================================
// 7. ENGINE PIALA v11 (ROTASI PIALA, CAPS & MENIT PIALA, KONDISI SINTETIS PER LAGA)
// ==============================================================
function ensureSquadForClub(cId, se) {
  if (PLAYERS_DB[cId] && PLAYERS_DB[cId].length >= 16) return PLAYERS_DB[cId];
  var r = pseudoRandom(cId * 883 + se * 31);
  var pr = S.prestige[cId] || 54;
  var squad = [];
  for (var i = 0; i < SQUAD_SIZE; i++) {
    var pot = clamp(Math.round(pr - 6 + (r() + r() + r() - 1.5) * 9), 48, 88);
    var age = AGE_BASE[i % AGE_BASE.length];
    var ovr = clamp(Math.round(pot * ageFactor(age) + (r() - 0.5) * 3), 36, pot);
    squad.push(makePlayer(cId, POS_LAYOUT[i], age, pot, ovr, se));
  }
  PLAYERS_DB[cId] = squad;
  return squad;
}

function cupStateSave(sq) {
  return sq.map(function(p) { return [p.fit, p.inj, p.susp, p.form, p.sharp, p.mor]; });
}
function cupStateRestore(sq, snap) {
  for (var i = 0; i < sq.length; i++) {
    var s = snap[i], p = sq[i];
    p.fit = s[0]; p.inj = s[1]; p.susp = s[2]; p.form = s[3]; p.sharp = s[4]; p.mor = s[5];
  }
}
// Kondisi sintetis pada malam piala: tidak bergantung pada kondisi akhir liga
function cupStateRoll(sq, r, stageIdx) {
  var SG = getSettings();
  for (var i = 0; i < sq.length; i++) {
    var p = sq[i];
    ensurePlayerFields(p);
    var injP = (0.045 + Math.max(0, p.age - 28) * 0.004) * SG.injury;
    p.inj = r() < injP ? 1 : 0;
    p.susp = (SG.discipline && r() < 0.015) ? 1 : 0;
    p.fit = clamp(84 + gauss(r) * 7 - stageIdx * 0.8 - Math.max(0, p.age - 28) * 0.9 + (p.stam - 72) * 0.25, 45, 100);
    p.form = clamp(gauss(r) * 2.6 * (formVol(p) / 0.6), -8, 8);
    p.sharp = clamp(82 + gauss(r) * 8, 45, 100);
  }
}

function playCupLeg(sqHome, sqAway, strH, strAway, hfa, rotH, rotA, big, r, mgH, mgA, minsSink) {
  cupStateRoll(sqHome, r, big ? 4 : 1);
  cupStateRoll(sqAway, r, big ? 4 : 1);
  sqHome.forEach(function(p) { p.tempG = 0; p.tempA = 0; });
  sqAway.forEach(function(p) { p.tempG = 0; p.tempA = 0; });
  var hL = pickStartingXI(sqHome, r, { rest: mgH.rot, rot: rotH, big: big, cup: true });
  var aL = pickStartingXI(sqAway, r, { rest: mgA.rot, rot: rotA, big: big, cup: true });
  var hInc = rollIncidents(hL.xi, r, null);
  var aInc = rollIncidents(aL.xi, r, null);
  var hD = xiDeviation(hL.xi, hL.eff, idealXiAvg(sqHome));
  var aD = xiDeviation(aL.xi, aL.eff, idealXiAvg(sqAway));
  var diff = (strH + hD.dev + hfa) - (strAway + aD.dev);
  var lh = 1.45 * Math.exp(diff / 22) * styleAtt(mgH) * styleDef(mgA);
  var la = 1.15 * Math.exp(-diff / 22) * styleAtt(mgA) * styleDef(mgH);
  if (hInc.red) { var f1 = (90 - hInc.red.min) / 90; lh *= (1 - 0.30 * f1); la *= (1 + 0.20 * f1); }
  if (aInc.red) { var f2 = (90 - aInc.red.min) / 90; la *= (1 - 0.30 * f2); lh *= (1 + 0.20 * f2); }
  lh = Math.max(0.7, Math.min(3.9, lh));
  la = Math.max(0.6, Math.min(3.6, la));
  var gh = generatePoissonGoals(lh, r);
  var ga = generatePoissonGoals(la, r);
  var hS = generateMatchEventsWithSubs(hL.xi, hL.bench, gh, r, { eff: hL.eff, inc: hInc });
  var aS = generateMatchEventsWithSubs(aL.xi, aL.bench, ga, r, { eff: aL.eff, inc: aInc });
  if (minsSink) {
    [hS, aS].forEach(function(sim) {
      Object.keys(sim.minutes).forEach(function(pid) {
        var m = sim.minutes[pid];
        if (m > 0) {
          var e = minsSink[pid] || (minsSink[pid] = [0, 0]);
          e[0]++; e[1] += m;
        }
      });
    });
  }
  return { gh: gh, ga: ga, evH: hS.events, evA: aS.events, xiH: hL.xi.map(function(p) { return p.id; }), xiA: aL.xi.map(function(p) { return p.id; }) };
}

function simulateTwoLegTie(h, a, seedVal, isFinal, se, opts) {
  opts = opts || {};
  var r = pseudoRandom(seedVal);
  var sqH = ensureSquadForClub(h, se);
  var sqA = ensureSquadForClub(a, se);
  var stageIdx = opts.stageIdx || 0;
  var mgH = getManager(h, se), mgA = getManager(a, se);
  var snapH = cupStateSave(sqH), snapA = cupStateSave(sqA);

  var ovrH = clubStrength(h) + (mgH.r - 65) * 0.06;
  var ovrA = clubStrength(a) + (mgA.r - 65) * 0.06;
  if (r() < 0.12) {
    if (ovrH > ovrA) ovrA += 7 + Math.floor(r() * 6);
    else ovrH += 7 + Math.floor(r() * 6);
  }

  // MODUL 12: rotasi piala (tim kuat merotasi di putaran awal; League Cup lebih banyak rotasi)
  var stageRot = [0.65, 0.55, 0.40, 0.25, 0.12, 0][Math.min(5, stageIdx)];
  var cupFac = opts.cupKey === 'lc' ? 1.15 : 0.8;
  var rotH = clamp(stageRot * cupFac * (ovrH > ovrA + 6 ? 1.25 : (ovrH < ovrA - 6 ? 0.6 : 1)), 0, 1);
  var rotA = clamp(stageRot * cupFac * (ovrA > ovrH + 6 ? 1.25 : (ovrA < ovrH - 6 ? 0.6 : 1)), 0, 1);
  var big = stageIdx >= 3;
  var sink = opts.mins || null;

  var leg1 = playCupLeg(sqH, sqA, ovrH, ovrA, 2.5, rotH, rotA, big, r, mgH, mgA, sink);

  if (isFinal) {
    var penH = null, penA = null;
    if (leg1.gh === leg1.ga) {
      penH = 4; penA = 3;
      if (r() < 0.5) { penH = 3; penA = 4; }
    }
    var winF = (leg1.gh > leg1.ga || (penH !== null && penH > penA)) ? h : a;
    var losF = (winF === h) ? a : h;
    cupStateRestore(sqH, snapH); cupStateRestore(sqA, snapA);
    return {
      gh: leg1.gh, ga: leg1.ga, winner: winF, loser: losF, isFinal: true,
      penH: penH, penA: penA,
      eventsH: leg1.evH, eventsA: leg1.evA,
      xiH: leg1.xiH, xiA: leg1.xiA
    };
  }

  var leg2 = playCupLeg(sqA, sqH, ovrA, ovrH, 2.5, rotA, rotH, big, r, mgA, mgH, sink);
  var gh1 = leg1.gh, ga1 = leg1.ga;
  var ga2 = leg2.gh, gh2 = leg2.ga;
  var totH = gh1 + gh2;
  var totA = ga1 + ga2;
  var penH2 = null, penA2 = null;
  if (totH === totA) {
    penH2 = 4; penA2 = 3;
    if (r() < 0.5) { penH2 = 3; penA2 = 4; }
  }
  var winner = (totH > totA || (penH2 !== null && penH2 > penA2)) ? h : a;
  var loser = (winner === h) ? a : h;
  cupStateRestore(sqH, snapH); cupStateRestore(sqA, snapA);

  return {
    gh: gh1 + ' / ' + gh2,
    ga: ga1 + ' / ' + ga2,
    aggH: totH,
    aggA: totA,
    winner: winner,
    loser: loser,
    penH: penH2,
    penA: penA2,
    isFinal: false,
    eventsH1: leg1.evH, eventsA1: leg1.evA,
    eventsH2: leg2.evH, eventsA2: leg2.evA,
    xiH: leg1.xiH,
    xiA: leg1.xiA
  };
}

function simulateEntireCup64(cup, cupKey, se) {
  var stages = ["r64", "r32", "r16", "qf", "sf", "final"];
  SIM_BATCH++;
  try {
    stages.forEach(function(st) { simCupStage(cupKey, st, se); });
  } finally { SIM_BATCH--; }
  return cup.final[0].res ? cup.final[0].res.winner : null;
}

function minuteShare(p, se) {
  var h = p.hist && p.hist[p.hist.length - 1];
  if (!h || h[0] !== se) return null;
  return clamp(((h[7] || 0) + (h[16] || 0)) / SEASON_LEAGUE_MINUTES, 0, 1);
}

function agePlayersOneYear(se) {
  var r = pseudoRandom(se * 8849 + 17);
  Object.keys(PLAYERS_DB).forEach(function(cId) {
    var squad = PLAYERS_DB[cId];
    for (var i = 0; i < squad.length; i++) {
      var p = squad[i];
      ensurePlayerFields(p);
      var share = minuteShare(p, se);
      var caps = totalCaps(p);
      var t = traitOf(p);
      var youthEnd = (t && t.late) ? 27 : 24;
      p.age++; p.seasonsAtClub++;

      if (p.age <= youthEnd) {
        var gain = (p.pot - p.ovr) * 0.32 + r() * 2;
        if (share !== null) gain *= clamp(0.45 + share * 0.8, 0.45, 1.15);
        gain = Math.round(gain);
        if (gain < 0) gain = 0;
        p.ovr = Math.min(p.pot, p.ovr + gain);
      } else if (p.age <= 29) {
        p.ovr += Math.floor(r() * 3) - 1;
        if (share !== null) {
          if (share > 0.85 && p.age >= 28 && r() < 0.18) p.ovr -= 1;
          if (share < 0.10 && r() < 0.25) p.ovr -= 1;
        }
        if (p.ovr > p.pot + 1) p.ovr = p.pot + 1;
      } else {
        var dec;
        if (p.age <= 31) dec = Math.floor(r() * 2);
        else if (p.age <= 35) dec = 1 + Math.floor(r() * 3);
        else dec = 2 + Math.floor(r() * 3);
        if (share !== null && share > 0.8 && r() < 0.2) dec += 1;
        if (caps >= 250 && dec >= 2 && r() < 0.3) dec -= 1;
        p.ovr -= dec;
      }
      if ((p.sinjW || 0) >= 30) {
        p.ovr -= 1 + (r() < 0.4 ? 1 : 0);
        if (p.age <= 24) p.pot = Math.max(p.ovr, p.pot - 2);
      }
      p.ovr = clamp(p.ovr, 35, 99);
      if (p.ovr > p.peak) p.peak = p.ovr;

      var retire = false;
      if (p.age >= 39) retire = true;
      else if (p.age >= 35 && r() < RETIRE_P[p.age]) retire = true;
      else if (p.age >= 33 && p.ovr < 54 && r() < 0.5) retire = true;

      if (retire) {
        retirePlayer(p, +cId, se);
        squad[i] = makeYouth(+cId, p.pos, se + 1, r);
      }
    }
  });
}

// ---------- MODUL 4: moral & permintaan pindah ----------
function flagTransferRequests(se) {
  var r = pseudoRandom(se * 3391 + 7);
  S.mem[0].concat(S.mem[1]).forEach(function(cId) {
    var sq = PLAYERS_DB[cId] || [];
    if (sq.length < 14) return;
    var ovrs = sq.map(function(p) { return p.ovr; }).sort(function(a, b) { return a - b; });
    var med = ovrs[Math.floor(ovrs.length / 2)];
    sq.forEach(function(p) {
      p.req = !!(!isLoaned(p) && p.mor < 40 && p.ovr >= med && p.age <= 32 && r() < 0.4);
    });
  });
}

// ---------- MODUL 6: evaluasi manajer ----------
function reviewManagers(se) {
  var s = H.seasons[se];
  var r = pseudoRandom(se * 4001 + 29);
  var log = [];
  [0, 1].forEach(function(t) {
    var tab = s.league[t].table.map(function(x) { return x[0]; });
    var byPres = tab.slice().sort(function(a, b) { return (S.prestige[b] || 60) - (S.prestige[a] || 60); });
    var relN = t === 0 ? T1_RELEGATION_COUNT : T2_RELEGATION_COUNT;
    tab.forEach(function(cId, pos) {
      var mg = getManager(cId, se);
      var perf = byPres.indexOf(cId) - pos;
      var relegated = pos >= tab.length - relN;
      mg.ten = (mg.ten || 0) + 1;
      var sackP = 0.02;
      if (relegated) sackP += 0.35;
      if (perf <= -8) sackP += 0.25 + (-perf - 8) * 0.02;
      if (perf >= 6 || pos === 0) sackP = 0;
      if (t === 0 && pos === 0) mg.r = clamp(mg.r + 2, 38, 97);
      else if (perf >= 5) mg.r = clamp(mg.r + 1, 38, 97);
      else if (perf <= -6) mg.r = clamp(mg.r - 1, 38, 97);
      if (r() < sackP) {
        var nm = makeManager(cId, se + 1, (mg.gen || 0) + 1);
        S.managers[cId] = nm;
        log.push({ c: cId, out: mg.n, outR: mg.r, inn: nm.n, inR: nm.r, why: relegated ? 'Relegation' : (perf <= -8 ? 'Underperformance' : 'Board pressure') });
      }
    });
  });
  s.mgrMoves = log;
}

// ---------- MODUL 10: akademi & wonderkid ----------
function getAcademy(c) {
  if (!S.academy) S.academy = {};
  if (S.academy[c] === undefined) {
    var r = pseudoRandom(c * 541 + 9);
    S.academy[c] = clamp(Math.round((S.prestige[c] || 60) / 6.2 + (r() - 0.5) * 6), 3, 19);
  }
  return S.academy[c];
}

function runAcademyIntake(se) {
  var r = pseudoRandom(se * 7237 + 41);
  var log = [];
  S.mem[0].concat(S.mem[1]).forEach(function(c) {
    var sq = PLAYERS_DB[c];
    if (!sq) return;
    var acad = getAcademy(c);
    var intake = (r() < 0.45 + acad / 45) ? 1 : 0;
    if (r() < 0.06 + acad / 220) intake++;
    var golden = acad >= 14 && r() < 0.03;
    if (golden) intake += 2;
    for (var i = 0; i < intake; i++) {
      if (sq.length >= 22) break;
      var gks = sq.filter(function(p) { return p.pos === 'GK'; }).length;
      var pos = gks < 2 ? 'GK' : POS_LAYOUT[Math.floor(r() * POS_LAYOUT.length)];
      var pr = S.prestige[c] || 70;
      var pot = clamp(Math.round(pr - 8 + (acad - 10) * 0.9 + gauss(r) * 7 + (golden ? 9 : 0)), 50, 97);
      var age = 16 + (r() < 0.6 ? 1 : 0);
      var ovr = clamp(Math.round(pot * (age === 16 ? 0.66 : 0.70) + (r() - 0.5) * 4), 38, pot);
      var np = makePlayer(c, pos, age, pot, ovr, se + 1);
      if (pot >= 86 && !np.tr) np.tr = 'wonder';
      sq.push(np);
      if (pot >= 80) log.push({ pId: np.id, name: np.name, club: c, pos: pos, pot: pot, age: age, golden: golden });
    }
    if (r() < 0.12) S.academy[c] = clamp(acad + (r() < 0.5 ? -1 : 1), 3, 19);
  });
  H.seasons[se].academy = log;
}

// ---------- MODUL 11: sistem pinjaman ----------
function lastSeasonMinutes(p, se) {
  var h = p.hist && p.hist[p.hist.length - 1];
  return (h && h[0] === se) ? (h[7] || 0) : null;
}

function nthBestOvr(sq, n) {
  var o = sq.map(function(p) { return p.ovr; }).sort(function(a, b) { return b - a; });
  return o.length ? o[Math.min(n - 1, o.length - 1)] : 60;
}

function planLoans(se) {
  var r = pseudoRandom(se * 9103 + 3);
  var log = [];
  var t2 = S.mem[1];
  S.mem[0].forEach(function(parent) {
    var sq = PLAYERS_DB[parent];
    if (!sq || sq.length < 19) return;
    var cands = sq.filter(function(p) {
      var lm = lastSeasonMinutes(p, se);
      return !isLoaned(p) && p.age >= 18 && p.age <= 23 && lm !== null && lm < 1100 && (p.pot - p.ovr) >= 4;
    }).sort(function(a, b) { return (b.pot - b.ovr) - (a.pot - a.ovr); }).slice(0, 2);
    cands.forEach(function(p) {
      if (sq.length < 19) return;
      var opts = t2.filter(function(d) {
        var dsq = PLAYERS_DB[d];
        return dsq && dsq.length < 22 && d !== parent && p.ovr >= nthBestOvr(dsq, 11) - 3;
      });
      if (!opts.length) return;
      var dest = opts[Math.floor(r() * opts.length)];
      PLAYERS_DB[parent] = sq = sq.filter(function(x) { return x.id !== p.id; });
      p.loan = parent; p.loanSe = se + 1; p.club = dest;
      PLAYERS_DB[dest].push(p);
      log.push({ pId: p.id, pName: p.name, pos: p.pos, ovr: p.ovr, age: p.age, from: parent, to: dest });
    });
  });
  H.seasons[se].loans = log;
}

function returnLoans(se) {
  Object.keys(PLAYERS_DB).forEach(function(cId) {
    var sq = PLAYERS_DB[cId];
    var back = sq.filter(function(p) { return p.loan !== undefined && p.loanSe === se; });
    back.forEach(function(p) {
      var parent = p.loan;
      PLAYERS_DB[cId] = sq = sq.filter(function(x) { return x.id !== p.id; });
      if (!PLAYERS_DB[parent]) PLAYERS_DB[parent] = [];
      delete p.loan; delete p.loanSe;
      p.club = +parent;
      PLAYERS_DB[parent].push(p);
    });
  });
}

// ---------- Statistik akhir musim ----------
function commitSeasonPlayerStats(se) {
  var s = H.seasons[se];
  var cm = s.cupMins || { fa: {}, lc: {} };
  for (var t = 0; t < s.tiers.length; t++) {
    s.tiers[t].forEach(function(cId) {
      (PLAYERS_DB[cId] || []).forEach(function(p) {
        ensurePlayerFields(p);
        var c = p.career;
        var cupApps = 0, cupMin = 0;
        ['fa', 'lc'].forEach(function(k) {
          var e = cm[k] && cm[k][p.id];
          if (e) { cupApps += e[0]; cupMin += e[1]; }
        });
        c.goals += p.sg; c.assists += p.sa; c.seasons++;
        c.minutes = (c.minutes || 0) + (p.smin || 0);
        c.apps = (c.apps || 0) + (p.sapp || 0);
        c.starts = (c.starts || 0) + (p.sstart || 0);
        c.capps += cupApps; c.cmin += cupMin;
        c.rtS = Math.round((c.rtS + p.srt) * 100) / 100; c.rtN += p.srn; c.cs += p.scs;
        if (t === 0) { c.t1Goals += p.sg; c.t1Seasons++; }
        var avgR = p.srn ? Math.round(p.srt / p.srn * 10) : 0;
        p.hist.push([se, +cId, t, p.sg, p.sa, p.ovr, p.age, p.smin || 0, p.sapp || 0, p.sstart || 0, avgR, p.scs || 0, p.sy || 0, p.sr || 0, p.sinj || 0, cupApps, cupMin]);
        p.sg = 0; p.sa = 0; p.smin = 0; p.sapp = 0; p.sstart = 0;
        p.srt = 0; p.srn = 0; p.scs = 0;
      });
    });
  }
  s.cupMins = null;
}

// ---------- MODUL 9: penghargaan 2.0 ----------
function simulateSeasonIndividualAwards(se) {
  var s = H.seasons[se];
  if (s.awards) return;
  var idx = buildPlayerIndex();
  var L = s.league;

  var allT1Players = [];
  s.tiers[0].forEach(function(cId) { (PLAYERS_DB[cId] || []).forEach(function(p) { allT1Players.push(p); }); });
  var byGoals = allT1Players.slice().sort(function(a, b) { return (b.sg - a.sg) || (b.sa - a.sa) || (b.ovr - a.ovr); });

  var tp = byGoals[0];
  if (tp) tp.career.t1Boots++;

  var lowSc = L[1].scorers[0];
  var lowPl = lowSc ? idx[lowSc[0]] : null;
  if (lowPl) lowPl.career.lowBoots++;

  var champ = s.league[0].table[0][0];
  var best = null, bestScore = -1e9, bestClub = null;
  s.tiers[0].forEach(function(cId) {
    (PLAYERS_DB[cId] || []).forEach(function(p) {
      var sc = p.sg + 0.7 * p.sa + (p.ovr - 70) * 0.5 +
               (p.srn >= 15 ? (p.srt / p.srn - 6.4) * 10 : 0) +
               (cId === champ ? 15 : 0) + (cId === s.faWinner ? 6 : 0) + (cId === s.lcWinner ? 4 : 0);
      if (sc > bestScore) { bestScore = sc; best = p; bestClub = cId; }
    });
  });
  if (best) best.career.mvp++;

  var rated = allT1Players.filter(function(p) { return p.srn >= 20; })
    .map(function(p) { return { p: p, avg: p.srt / p.srn }; })
    .sort(function(a, b) { return b.avg - a.avg; });

  var yp = null;
  rated.forEach(function(x) {
    if (!yp && x.p.age <= 21 && x.p.srn >= 15) yp = x;
  });
  var gg = null;
  allT1Players.forEach(function(p) {
    if (p.pos === 'GK' && p.srn >= 25 && (!gg || p.scs > gg.scs)) gg = p;
  });
  var need = { GK: 1, DF: 4, MF: 4, FW: 2 }, toty = [];
  ['GK', 'DF', 'MF', 'FW'].forEach(function(pos) {
    var n = 0;
    rated.forEach(function(x) {
      if (x.p.pos === pos && n < need[pos]) {
        n++;
        toty.push({ id: x.p.id, name: x.p.name, pos: pos, club: x.p.club, avg: Math.round(x.avg * 100) / 100 });
      }
    });
  });

  s.awards = {
    mvp: best ? { id: best.id, name: best.name, club: bestClub, ovr: best.ovr, mvpCount: best.career.mvp } : { id: 0, name: '—', club: 0, ovr: 0, mvpCount: 0 },
    t1Scorer: tp ? { id: tp.id, name: tp.name, club: tp.club, goals: tp.sg, assists: tp.sa, bootsCount: tp.career.t1Boots } : { id: 0, name: '—', club: 0, goals: 0, assists: 0, bootsCount: 0 },
    t2Scorer: lowPl ? { id: lowPl.id, name: lowPl.name, club: lowSc[2], goals: lowSc[3] } : { id: 0, name: '—', club: 0, goals: 0 },
    yp: yp ? { id: yp.p.id, name: yp.p.name, club: yp.p.club, age: yp.p.age, avg: Math.round(yp.avg * 100) / 100, g: yp.p.sg } : null,
    gg: gg ? { id: gg.id, name: gg.name, club: gg.club, cs: gg.scs } : null,
    toty: toty,
    rated: rated.slice(0, 10).map(function(x) { return { id: x.p.id, name: x.p.name, club: x.p.club, pos: x.p.pos, avg: Math.round(x.avg * 100) / 100, apps: x.p.srn }; })
  };
}

// ---------- MODUL 13: Records Book ----------
function updateRecords(se) {
  var s = H.seasons[se];
  var R = S.records || (S.records = {});
  function rec(key, v, holder, low) {
    var c = R[key];
    if (!c || (low ? v < c.v : v > c.v)) { holder.v = v; holder.se = se; R[key] = holder; }
  }
  [0, 1].forEach(function(t) {
    s.tiers[t].forEach(function(cId) {
      (PLAYERS_DB[cId] || []).forEach(function(p) {
        var h = function() { return { id: p.id, n: p.name, c: cId, t: t }; };
        if (p.sg > 0) rec('goals', p.sg, h());
        if (p.sa > 0) rec('assists', p.sa, h());
        if (p.smin > 0) rec('minutes', p.smin, h());
        if (p.srn >= 25) rec('rating', Math.round(p.srt / p.srn * 100) / 100, h());
        if (p.pos === 'GK' && p.srn >= 25) rec('cs', p.scs, h());
        if (p.sy > 0) rec('yellow', p.sy, h());
        if (p.sinjW > 0) rec('injgames', p.sinjW, h());
      });
    });
    var tab = s.league[t].table;
    tab.forEach(function(row) {
      var h = function() { return { c: row[0], t: t }; };
      rec('pts' + t, row[6], h());
      rec('gf' + t, row[4], h());
      rec('gaLow' + t, row[5], h(), true);
      rec('wins' + t, row[1], h());
    });
    var run = {};
    var jorn = s.league[t].jornadas || [];
    for (var j = 0; j < jorn.length; j++) {
      jorn[j].forEach(function(m) {
        var gh = m[2], ga = m[3];
        var margin = Math.abs(gh - ga);
        if (margin > 0) rec('bigWin', margin, { h: m[0], a: m[1], gh: gh, ga: ga, t: t, md: j + 1 });
        rec('highScore', gh + ga, { h: m[0], a: m[1], gh: gh, ga: ga, t: t, md: j + 1 });
        if (m[12] && m[12].a) rec('attendance', m[12].a, { c: m[0], t: t, md: j + 1 });
        [[m[0], gh, ga], [m[1], ga, gh]].forEach(function(x) {
          var st = run[x[0]] || (run[x[0]] = { u: 0, w: 0 });
          if (x[1] >= x[2]) st.u++; else st.u = 0;
          if (x[1] > x[2]) st.w++; else st.w = 0;
          if (st.u >= 5) rec('unbeaten', st.u, { c: x[0], t: t });
          if (st.w >= 3) rec('winStreak', st.w, { c: x[0], t: t });
        });
      });
    }
  });
}

// ---------- MODUL 5: transfer dengan nilai pasar & fee, permintaan pindah, penjagaan prospek ----------
function runTransferMarket(se) {
  var r = pseudoRandom(se * 5309 + 77);
  var allClubs = Object.keys(PLAYERS_DB).map(Number);
  var transfersLog = [];
  var rankedClubs = allClubs.slice().sort(function(a, b) { return (S.prestige[b] || 70) - (S.prestige[a] || 70); });
  var eliteClubs = rankedClubs.slice(0, 16);

  function move(p, seller, buyer, type, mult) {
    PLAYERS_DB[seller] = (PLAYERS_DB[seller] || []).filter(function(x) { return x.id !== p.id; });
    p.club = buyer; p.seasonsAtClub = 1;
    PLAYERS_DB[buyer].push(p);
    var val = playerValue(p);
    var fee = Math.max(0.05, Math.round(val * (0.85 + r() * 0.4) * mult * 100) / 100);
    transfersLog.push({ pId: p.id, pName: p.name, pos: p.pos, ovr: p.ovr, age: p.age, from: seller, to: buyer, type: type, fee: fee, val: Math.round(val * 100) / 100 });
  }

  // 0. Permintaan pindah (moral rendah / kurang menit)
  allClubs.forEach(function(seller) {
    (PLAYERS_DB[seller] || []).slice().forEach(function(p) {
      if (!p.req || isLoaned(p)) return;
      if ((PLAYERS_DB[seller] || []).length <= 17) return;
      var sPr = S.prestige[seller] || 60;
      var opts = allClubs.filter(function(d) {
        var dsq = PLAYERS_DB[d];
        var dPr = S.prestige[d] || 60;
        return d !== seller && dsq && dsq.length < 23 && dPr >= sPr - 14 && dPr <= sPr + 12 && p.ovr >= nthBestOvr(dsq, 12) - 2;
      });
      if (!opts.length) return;
      var dest = opts[Math.floor(r() * opts.length)];
      move(p, seller, dest, 'Transfer Request', 0.9);
      p.mor = 66;
    });
  });

  eliteClubs.forEach(function(buyer) {
    if (r() < 0.20) return;
    var marketStars = [];
    allClubs.forEach(function(seller) {
      if (seller === buyer) return;
      (PLAYERS_DB[seller] || []).forEach(function(p) {
        if (!isLoaned(p) && p.age >= 20 && p.age <= 30 && p.ovr >= 80 && (S.prestige[buyer] >= (S.prestige[seller] - 5))) {
          marketStars.push({ p: p, seller: seller });
        }
      });
    });
    if (!marketStars.length) return;
    marketStars.sort(function(a, b) { return b.p.ovr - a.p.ovr; });
    var chosen = marketStars[Math.floor(r() * Math.min(5, marketStars.length))];
    var bSquad = PLAYERS_DB[buyer] || [];
    var sSquad = PLAYERS_DB[chosen.seller] || [];
    if (sSquad.length <= 16 || bSquad.length >= 24) return;
    move(chosen.p, chosen.seller, buyer, 'Marquee Signing', 1.15);
  });

  allClubs.forEach(function(buyer) {
    var bPr = S.prestige[buyer] || 70;
    if (r() >= 0.50) return;
    var seller = allClubs[Math.floor(r() * allClubs.length)];
    if (seller === buyer) return;
    var sSquad = PLAYERS_DB[seller] || [];
    var bSquad = PLAYERS_DB[buyer] || [];
    if (sSquad.length <= 16 || bSquad.length >= 24) return;
    var cand = sSquad.filter(function(p) { return !isLoaned(p) && p.age >= 19 && p.age <= 32 && Math.abs(p.ovr - bPr) <= 9; });
    if (!cand.length) return;
    move(cand[Math.floor(r() * cand.length)], seller, buyer, 'Open Window Transfer', 1.0);
  });

  allClubs.forEach(function(cId) {
    var sq = PLAYERS_DB[cId];
    while (sq.length < SQUAD_SIZE) sq.push(makeYouth(cId, POS_LAYOUT[sq.length % POS_LAYOUT.length], se, r));
    while (sq.length > 22) {
      // penjagaan prospek: pemain muda berpotensi tidak dilepas lebih dulu
      var keep = function(p) { return p.ovr + (p.age <= 20 ? (p.pot - p.ovr) * 0.6 : 0) + (isLoaned(p) ? 99 : 0); };
      sq.sort(function(a, b) { return keep(a) - keep(b); });
      var dropped = sq.shift();
      var lowClub = rankedClubs[rankedClubs.length - 1 - Math.floor(r() * 10)];
      if (lowClub && PLAYERS_DB[lowClub].length < 22) {
        dropped.club = lowClub;
        PLAYERS_DB[lowClub].push(dropped);
      }
    }
    for (var i = 0; i < sq.length; i++) sq[i].req = false;
  });

  return transfersLog;
}

function finalizeSeason(se) {
  var s = H.seasons[se];
  if (s.finalized) return;

  simulateSeasonIndividualAwards(se);
  updateRecords(se);
  commitSeasonPlayerStats(se);
  flagTransferRequests(se);
  applyPromotionRelegationAndDynastyBoost(se);
  reviewManagers(se);
  returnLoans(se);
  agePlayersOneYear(se);
  runAcademyIntake(se);
  planLoans(se);
  s.transfers = runTransferMarket(se);
  s.finalized = true;

  if (se % 50 === 0) {
    var startBlock = se - 49;
    var endBlock = se;
    exportBatchDetailedHtml(startBlock, endBlock);
    purgeArchivedSeasonFixtures(startBlock, endBlock);
  }

  H.seasons[se + 1] = createBlankSeasonObject(se + 1);
  recalculateTrophyCabinet();
}

    else if (x.h !== undefined) who = getClubName(x.h) + ' ' + x.gh + '-' + x.ga + ' ' + getClubName(x.a) + ' <span class="dim-text" style="display:inline;">MD ' + x.md + '</span>';
    else who = getClubName(x.c);
    var val = k === 'attendance' ? x.v.toLocaleString() : (k === 'rating' ? x.v.toFixed(2) : x.v);
    return '<tr><td>' + REC_LABELS[k] + '</td><td class="mono"><b style="color:var(--gold-bright);">' + val + '</b></td><td>' + who + '</td><td class="mono">S.' + x.se + '</td></tr>';
  }).join('');

  var reg = [];
  Object.keys(PLAYERS_DB).forEach(function(cId) { PLAYERS_DB[cId].forEach(function(p) { ensurePlayerFields(p); reg.push({ id: p.id, name: p.name, club: +cId, c: p.career, act: true }); }); });
  (S.legends || []).forEach(function(l) { reg.push({ id: l.id, name: l.name, club: l.club, c: l.career || {}, act: false }); });
  var lead = function(title, list, fn) {
    return '<div class="editorial-card"><h4 style="color:#fff;margin-bottom:8px;">' + title + '</h4>' +
      list.map(function(x, i) {
        return '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #1a2438;font-size:12px;"><div><b>' + (i + 1) + '.</b> ' + playerLink(x.id, x.name) + ' <span class="dim-text" style="display:inline;">' + (x.act ? '' : '(retired) ') + getClubName(x.club) + '</span></div><b class="mono" style="color:var(--gold-bright);">' + fn(x) + '</b></div>';
      }).join('') + '</div>';
  };
  var caps = function(x) { return (x.c.apps || 0) + (x.c.capps || 0); };
  var topCaps = reg.slice().sort(function(a, b) { return caps(b) - caps(a); }).slice(0, 10);
  var topMin = reg.slice().sort(function(a, b) { return ((b.c.minutes || 0) + (b.c.cmin || 0)) - ((a.c.minutes || 0) + (a.c.cmin || 0)); }).slice(0, 10);
  var topRt = reg.filter(function(x) { return (x.c.rtN || 0) >= 150; }).sort(function(a, b) { return (b.c.rtS / b.c.rtN) - (a.c.rtS / a.c.rtN); }).slice(0, 10);
  var topPotm = reg.slice().sort(function(a, b) { return (b.c.potm || 0) - (a.c.potm || 0); }).slice(0, 10);
  var topInj = reg.slice().sort(function(a, b) { return (b.c.inj || 0) - (a.c.inj || 0); }).slice(0, 10);

  var mv = cur.mgrMoves || [];
  var mvRows = mv.map(function(x) {
    return '<tr><td>' + getClubName(x.c) + '</td><td>' + x.out + ' <span class="mono">(' + x.outR + ')</span></td><td style="color:#4ade80;">➔ ' + x.inn + ' <span class="mono">(' + x.inR + ')</span></td><td>' + x.why + '</td></tr>';
  }).join('');
  var topMgr = cur.tiers[0].map(function(c) { return { c: c, m: getManager(c, cur.season) }; }).sort(function(a, b) { return b.m.r - a.m.r; }).slice(0, 8);

  return '<div class="season-selector-bar"><div style="display:flex;align-items:center;gap:8px;"><span>Select Season: </span>' + seasonSelectorHtml() + '</div></div>' +
    '<div class="editorial-card"><span class="kicker">Individual Honors · Season ' + cur.season + '</span><h2 style="color:#fff;margin-bottom:10px;">🏅 Awards 2.0</h2>' + awHtml + '</div>' +
    '<div class="editorial-card"><span class="kicker">All-Time Records Book</span><h2 style="color:#fff;margin-bottom:10px;">📚 Records</h2>' +
      '<div class="table-wrap"><table><tr><th>Record</th><th>Value</th><th>Holder</th><th>Set</th></tr>' + (recRows || '<tr><td colspan=4 style="text-align:center;padding:12px;color:var(--muted);">Records appear after the first finalized season.</td></tr>') + '</table></div></div>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;">' +
      lead('🧢 Most Caps (league + cup apps)', topCaps, function(x) { return caps(x); }) +
      lead('⏱ Most Career Minutes', topMin, function(x) { return ((x.c.minutes || 0) + (x.c.cmin || 0)).toLocaleString() + '\''; }) +
      lead('📈 Best Career Avg Rating (≥150 rated apps)', topRt, function(x) { return (x.c.rtS / x.c.rtN).toFixed(2); }) +
      lead('🎖 Most Player-of-the-Match Awards', topPotm, function(x) { return (x.c.potm || 0) + 'x'; }) +
      lead('🩹 Most Career Injuries', topInj, function(x) { return (x.c.inj || 0); }) +

// ---------- MODUL 15: Engine Settings ----------
function setEngineSetting(k, v) {
  var SG = getSettings();
  if (k === 'weather' || k === 'discipline') SG[k] = !!v; else SG[k] = parseFloat(v);
  SG.preset = 'custom';
  autoSaveHistory();
  render();
}
function applyEnginePreset(name) {
  var pr = PRESETS[name]; if (!pr) return;
  S.settings = JSON.parse(JSON.stringify(pr)); S.settings.preset = name;
  autoSaveHistory();
  render();
}
function renderSettingsTab() {
  var SG = getSettings();
  var slider = function(k, label, min, max, step, hint) {
    return '<div class="range-row"><span style="min-width:190px;font-weight:600;">' + label + '</span>' +
      '<input type="range" min="' + min + '" max="' + max + '" step="' + step + '" value="' + SG[k] + '" onchange="setEngineSetting(\'' + k + '\',this.value)">' +
      '<b class="mono" style="color:var(--gold-bright);min-width:42px;">' + Number(SG[k]).toFixed(2) + '</b><span style="color:var(--muted);">' + hint + '</span></div>';
  };
  var toggle = function(k, label, hint) {
    return '<div class="range-row"><span style="min-width:190px;font-weight:600;">' + label + '</span>' +
      '<label><input type="checkbox" ' + (SG[k] ? 'checked' : '') + ' onchange="setEngineSetting(\'' + k + '\',this.checked)"> ' + (SG[k] ? 'ON' : 'OFF') + '</label><span style="color:var(--muted);">' + hint + '</span></div>';
  };
  var presetBtn = function(k) {
    return '<button type="button" class="' + (SG.preset === k ? 'btn-gold' : 'btn-ui') + ' btn-sm" onclick="applyEnginePreset(\'' + k + '\')">' + PRESETS[k].name + '</button> ';
  };
  return '<div class="editorial-card"><span class="kicker">Simulation Realism Controls</span><h2 style="color:#fff;margin-bottom:8px;">⚙️ Engine Settings (v11)</h2>' +
    '<div class="info-note">Pengaturan berlaku untuk musim yang disimulasikan <b>setelah</b> diubah. Musim yang sudah selesai tidak dihitung ulang. Preset aktif: <b>' + (SG.preset || 'custom') + '</b>.</div>' +
    '<div style="margin-bottom:12px;">Presets: ' + presetBtn('arcade') + presetBtn('realistic') + presetBtn('hardcore') + '</div>' +
    slider('fatigue', 'Fatigue intensity', 0.3, 2, 0.05, 'laju kelelahan per menit bermain') +
    slider('form', 'Form volatility', 0, 2, 0.05, 'ayunan form & rating; 0 = form dimatikan') +
    slider('injury', 'Injury rate', 0, 2.5, 0.05, 'frekuensi cedera') +
    slider('rotation', 'Cup rotation', 0, 1.6, 0.05, 'seberapa banyak tim kuat merotasi di piala') +
    toggle('weather', 'Weather & pitch', 'cuaca memengaruhi gol, kelelahan, cedera') +
    toggle('discipline', 'Cards & suspensions', 'kartu kuning/merah dan skorsing') +
  '</div>' +
  '<div class="editorial-card"><span class="kicker">How the engine works</span><h3 style="color:#fff;margin-bottom:8px;">Model realisme</h3>' +
    '<div style="font-size:12.5px;line-height:1.7;color:#cbd5e1;font-family:Inter;">' +
    '<b>Menit &amp; caps:</b> starter tidak lagi otomatis 90 menit. Pemain dirotasi bila kebugaran turun, diganti karena lelah/cedera (hingga 5 pergantian), dan caps liga + piala dihitung. Caps memberi bonus pengalaman kecil; menit tahun lalu memengaruhi perkembangan (muda) dan keausan (veteran).<br>' +
    '<b>Kelelahan:</b> tiap menit bermain menguras kebugaran sesuai stamina, usia, posisi, dan cuaca; pemulihan antar-laga + jeda internasional. Kebugaran rendah menurunkan rating efektif, menaikkan risiko cedera/kartu, dan membuat pemain pudar di akhir laga.<br>' +
    '<b>Fluktuasi performa:</b> form tersembunyi (AR-1) naik-turun dari rating tiap laga; konsistensi &amp; trait membuat sebagian pemain streaky, sebagian metronome. Ada pula faktor penyelesaian akhir musiman agar top skor tidak itu-itu saja.<br>' +
    '<b>Kekuatan tim per laga</b> dihitung dari XI yang benar-benar turun (bukan angka tetap sepanjang musim), sehingga cedera/rotasi bintang berdampak ke hasil.' +
    '</div></div>';
}

// ---------- Match modal ----------
function openMatchDetailsModal(tierIdx, jornadaIdx, matchIdx, se) {
  var sn = H.seasons[se];
  if (!sn || !sn.league || !sn.league[tierIdx] || !sn.league[tierIdx].jornadas) return;
  var m = sn.league[tierIdx].jornadas[jornadaIdx][matchIdx];
  if (!m) return;

  var homeId = m[0], awayId = m[1], gh = m[2], ga = m[3];
  var meta = m[12] || null;
  var homeIds = {};
  (m[6] || []).concat(m[8] || []).forEach(function(id) { homeIds[id] = 1; });

  var allEvents = [];
  (m[4] || []).forEach(function(e) { allEvents.push({ type: 'goal', side: 'h', sc: e[0], as: e[1], min: e[2] }); });
  (m[5] || []).forEach(function(e) { allEvents.push({ type: 'goal', side: 'a', sc: e[0], as: e[1], min: e[2] }); });
  (m[10] || []).forEach(function(s) { allEvents.push({ type: 'sub', side: 'h', out: s[0], in: s[1], min: s[2], why: s[3] }); });
  (m[11] || []).forEach(function(s) { allEvents.push({ type: 'sub', side: 'a', out: s[0], in: s[1], min: s[2], why: s[3] }); });
  if (meta) {
    (meta.c || []).forEach(function(c) { allEvents.push({ type: 'card', side: homeIds[c[0]] ? 'h' : 'a', p: c[0], min: c[1], k: c[2] }); });
    (meta.i || []).forEach(function(x) { allEvents.push({ type: 'inj', side: homeIds[x[0]] ? 'h' : 'a', p: x[0], min: x[1], what: x[2], games: x[3] }); });
  }
  allEvents.sort(function(a, b) { return a.min - b.min; });

  var timelineHtml = allEvents.length ? allEvents.map(function(ev) {
    var teamTxt = ev.side === 'h' ? getClubName(homeId) : getClubName(awayId);
    if (ev.type === 'goal') {
      var asTxt = ev.as ? ' · <span style="color:var(--ac);">Assist: ' + playerLink(ev.as, nameFromId(ev.as)) + '</span>' : ' · <i>Unassisted</i>';
      return '<div class="timeline-item"><span class="minute-badge">' + ev.min + '\'</span><div>⚽ <b>' + playerLink(ev.sc, nameFromId(ev.sc)) + '</b> (' + teamTxt + ')' + asTxt + '</div></div>';
    }
    if (ev.type === 'card') {
      return '<div class="timeline-item"><span class="minute-badge" style="color:' + (ev.k === 'R' ? '#f87171' : '#fde047') + ';">' + ev.min + '\'</span><div>' + (ev.k === 'R' ? '🟥 Red card' : '🟨 Yellow card') + ': <b>' + playerLink(ev.p, nameFromId(ev.p)) + '</b> (' + teamTxt + ')</div></div>';
    }
    if (ev.type === 'inj') {
      return '<div class="timeline-item"><span class="minute-badge" style="color:#f87171;">' + ev.min + '\'</span><div style="color:#fca5a5;">🤕 Injury: <b>' + playerLink(ev.p, nameFromId(ev.p)) + '</b> (' + teamTxt + ') · ' + ev.what + ' · out ~' + ev.games + ' games</div></div>';
    }
    var ic = ev.why === 'F' ? '🔋' : (ev.why === 'I' ? '🤕' : '🔄');
    var why = ev.why === 'F' ? ' <i>(fatigue)</i>' : (ev.why === 'I' ? ' <i>(injury)</i>' : '');
    return '<div class="timeline-item"><span class="minute-badge" style="color:#fdba74;">' + ev.min + '\'</span><div style="color:var(--muted);">' + ic + ' (' + teamTxt + ') IN: <b>' + playerLink(ev.in, nameFromId(ev.in)) + '</b> ➔ OUT: <b>' + playerLink(ev.out, nameFromId(ev.out)) + '</b>' + why + '</div></div>';
  }).join('') : '<div style="color:var(--muted);padding:8px 0;">No key events recorded in this match.</div>';

  var renderLineupList = function(ids) {
    return ids.map(function(id, idx) {
      var p = findPlayerRecord(id);
      var posTxt = p && p.rec ? p.rec.pos : 'N/A';
      return '<div style="padding:2px 0;"><b>' + (idx + 1) + '.</b> ' + playerLink(id, nameFromId(id)) + ' <span class="mono" style="color:var(--ac);font-size:10px;">[' + posTxt + ']</span></div>';
    }).join('');
  };

  var wx = meta && WX[meta.w] ? WX[meta.w] : null;
  var infoBar = meta ? '<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px;">' +
    (wx ? '<span class="chip">' + wx.i + ' ' + wx.n + '</span>' : '') +
    (meta.a ? '<span class="chip">🏟 ' + meta.a.toLocaleString() + '</span>' : '') +
    (meta.pm ? '<span class="chip grn">⭐ MotM: ' + playerLink(meta.pm, nameFromId(meta.pm)) + ' (' + meta.pr.toFixed(1) + ')</span>' : '') +
  '</div>' : '';

  $('#am-kicker').textContent = TIER_NAMES[tierIdx] + ' · Matchday ' + (jornadaIdx + 1) + ' · Season ' + se;
  $('#am-title').textContent = getClubName(homeId) + ' ' + gh + ' - ' + ga + ' ' + getClubName(awayId);
  $('#am-body').innerHTML =
    '<div style="text-align:center;padding:12px;background:#0c1322;border:1px solid #1e293b;border-radius:8px;margin-bottom:16px;">' +
      '<div style="font-size:32px;font-family:\'JetBrains Mono\';font-weight:900;color:var(--gold-bright);">' + gh + ' - ' + ga + '</div>' +
      '<div style="font-size:13px;color:#cbd5e1;"><b>' + getClubName(homeId) + '</b> vs <b>' + getClubName(awayId) + '</b></div>' + infoBar +
    '</div>' +
    '<h4 style="color:var(--gold-bright);margin-bottom:6px;">⏱️ Match Events &amp; Timeline</h4>' +
    '<div style="background:#0e1526;border:1px solid #1e293b;border-radius:8px;padding:10px 14px;margin-bottom:16px;">' + timelineHtml + '</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">' +
      '<div class="lineup-box"><h4 style="color:var(--gold-bright);padding-bottom:4px;margin-bottom:6px;">👕 ' + getClubName(homeId) + '</h4>' + renderLineupList(m[6] || []) + '<div style="font-weight:700;margin-top:8px;color:var(--muted);">Bench:</div>' + renderLineupList(m[8] || []) + '</div>' +
      '<div class="lineup-box"><h4 style="color:var(--gold-bright);padding-bottom:4px;margin-bottom:6px;">👕 ' + getClubName(awayId) + '</h4>' + renderLineupList(m[7] || []) + '<div style="font-weight:700;margin-top:8px;color:var(--muted);">Bench:</div>' + renderLineupList(m[9] || []) + '</div>' +
    '</div>';
  $('#archive-modal').classList.add('active');
}


function render() {
  if (!H || !S) return;
  if (!H.seasons[selectedSeason]) selectedSeason = getMaxSeasonInArchive();
  var html = '';
  var cur = H.seasons[selectedSeason];
  var maxSeasons = getMaxSeasonInArchive();

  $('#date-label').textContent = 'Season ' + selectedSeason + ' (Total: ' + maxSeasons + ' Seasons) · Era ' + cur.era;

  if (activeTab === 'league') html += renderLeagueTab(cur);
  if (activeTab === 'fa_cup') html += renderBracket64UI(cur.faCup64, 'The Wimbledon FA Cup', '64-Club Knockout · Two-Leg Ties (Home & Away)', cur.faWinner, cur.faRunner, 'fa');
  if (activeTab === 'league_cup') html += renderBracket64UI(cur.leagueCup64, 'The Wimbledon League Cup', '64 Active Professional Clubs · Two-Leg Ties', cur.lcWinner, cur.lcRunner, 'lc');
  if (activeTab === 'roster') html += renderRosterTab(cur);
  if (activeTab === 'transfers') html += renderTransfersTab(cur);
  if (activeTab === 'cabinet') html += renderCabinet();
  if (activeTab === 'hof_players') html += renderHallOfFame();
  if (activeTab === 'ledger') html += renderLedger();
  if (activeTab === 'condition') html += renderConditionTab(cur);
  if (activeTab === 'records') html += renderRecordsTab(cur);
  if (activeTab === 'settings') html += renderSettingsTab();
  if (activeTab === 'eras') {
    var erasDef = getErasDefinition();
    html += '<div class="editorial-card"><span class="kicker">Periodization</span><h2 style="color:#fff;margin-bottom:12px;">Evolution of Competition (Season 1 to ' + maxSeasons + ')</h2>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;">' +
        erasDef.map(function(e){
          return '<div style="background:#0e1526;border:1px solid #1e293b;border-radius:8px;padding:14px;border-left:4px solid var(--gold);">' +
            '<h3 style="color:var(--gold-bright);margin-bottom:4px;">Era ' + e.id + ': ' + e.name + '</h3>' +
            '<div style="font-size:12px;color:var(--ac);margin-bottom:8px;">Span: Season ' + e.range[0] + ' – ' + e.range[1] + '</div>' +
            '<p style="font-size:13px;color:#cbd5e1;line-height:1.5;">' + e.desc + '</p></div>';
        }).join('') + '</div></div>';
  }

  $('#app').innerHTML = html;
}

$('#tabs').addEventListener('click', function(e) {
  var btn = e.target.closest('button');
  if (!btn) return;
  e.preventDefault();
  document.querySelectorAll('#tabs button').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
  activeTab = btn.dataset.v;
  render();
});

// Jalankan langsung jika dokumen sudah selesai dimuat atau via listener
if (document.readyState === 'loading') {
  window.addEventListener('DOMContentLoaded', initHistoryApp);
} else {
  initHistoryApp();
}
</script>
</body>
</html>
