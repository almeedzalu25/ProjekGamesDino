<!DOCTYPE html>
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Wimbledon Heritage — Football Pyramid (370 Clubs)</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Cinzel:wght@700;900&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,700;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{--gold:#f59e0b;--gold-bright:#fde047;--silver:#94a3b8;--bronze:#b45309;--bg:#07090e;--paper:#0d121f;--card:#111827;--border:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--danger:#f43f5e;--ok:#10b981;--ac:#38bdf8;--purple:#a855f7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 'Newsreader',serif;background-image:radial-gradient(#1e293b 1px, transparent 1px);background-size:24px 24px;}
h1,h2,h3,h4{font-family:'Chakra Petch',sans-serif;margin:0;letter-spacing:-0.02em}
.serif{font-family:'Cinzel',serif}
.sans{font-family:'Inter',system-ui,sans-serif}
.mono{font-family:'JetBrains Mono',monospace}

header{background:#0a0d17;border-bottom:3px double #334155;padding:18px;text-align:center;position:relative}
.masthead-title{font-size:32px;font-weight:900;letter-spacing:2px;color:var(--gold-bright);text-shadow:0 2px 12px rgba(245,158,11,0.3)}
.masthead-sub{font-size:12px;color:var(--ac);text-transform:uppercase;letter-spacing:3px;font-family:'Inter';font-weight:700;margin-top:3px}
.masthead-bar{display:flex;justify-content:space-between;max-width:1100px;margin:10px auto 0;border-top:1px solid #1e293b;border-bottom:1px solid #1e293b;padding:4px 10px;font-size:12px;color:var(--muted);font-family:'Inter';flex-wrap:wrap;gap:6px}

.sync-bar{background:#0c111e;padding:8px 16px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-family:'Inter';border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px}
.sync-bar button, .sync-bar label.btn-upload{background:#1e293b;color:#fff;border:1px solid #334155;border-radius:6px;padding:4px 12px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none;}
.sync-bar button:hover, .sync-bar label.btn-upload:hover{border-color:var(--gold)}

nav{background:#0f172a;border-bottom:1px solid var(--border);display:flex;justify-content:center;gap:6px;padding:8px 14px;flex-wrap:wrap;position:sticky;top:0;z-index:40}
nav button{background:transparent;color:var(--muted);border:1px solid transparent;border-radius:6px;padding:6px 14px;font-family:'Inter';font-size:13px;font-weight:600;cursor:pointer;transition:0.2s}
nav button:hover{color:#fff;border-color:#334155}
nav button.on{background:var(--gold);color:#070a12;border-color:var(--gold);font-weight:700}

.container{max-width:1300px;margin:20px auto;padding:0 16px}
.editorial-card{background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:18px;box-shadow:0 4px 16px rgba(0,0,0,0.3)}
.kicker{font-family:'Inter';font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:6px;display:inline-block}

.season-selector-bar{display:flex;align-items:center;justify-content:space-between;background:#0d1527;border:1px solid var(--border);border-radius:8px;padding:10px 16px;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.season-selector-bar select{background:#1e293b;color:var(--gold-bright);border:1px solid #334155;border-radius:6px;padding:6px 12px;font-family:'JetBrains Mono';font-weight:700;cursor:pointer;max-width:100%}
.btn-ui{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:5px 12px;font-family:'Inter';font-weight:600;cursor:pointer;font-size:12px}
.btn-ui:hover{border-color:var(--gold);background:#25334d}
.btn-ui:disabled{opacity:.4;cursor:default}
.btn-gold{background:linear-gradient(135deg,#d97706,#f59e0b);color:#070a12;border:none;border-radius:6px;padding:6px 14px;font-family:'Inter';font-weight:700;cursor:pointer;font-size:12px}
.btn-gold:hover{background:linear-gradient(135deg,#f59e0b,#fde047)}
.btn-sm{padding:2px 8px;font-size:11px}

.comp-btn{background:#16203a;color:#cbd5e1;border:1px solid #334155;border-radius:6px;padding:6px 12px;font-family:'Inter';font-weight:600;font-size:12px;cursor:pointer}
.comp-btn:hover{border-color:var(--gold)}
.comp-btn.active{background:var(--gold);color:#070a12;border-color:var(--gold)}

.bracket-scroll-container{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;margin-bottom:16px}
.bracket-round-col{min-width:280px;background:#0c1221;border:1px solid var(--border);border-radius:8px;padding:12px;border-top:3px solid var(--gold);flex-shrink:0}
.match-box{background:#121a2d;border:1px solid #1e293b;border-radius:6px;padding:10px;margin-bottom:8px}
.match-line{display:flex;justify-content:space-between;align-items:center;font-family:'Inter';font-size:12.5px;margin:3px 0;gap:6px}
.match-winner{color:var(--gold-bright);font-weight:700}
.match-score{font-family:'JetBrains Mono';font-weight:700;background:#1e293b;padding:2px 6px;border-radius:4px;color:#fff;font-size:11.5px;white-space:nowrap}
.pos-tag{font-family:'JetBrains Mono';font-size:10px;color:var(--ac);font-weight:700;margin-left:4px}
.match-winner .pos-tag{color:var(--gold-bright)}

.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;background:var(--paper)}
table{width:100%;border-collapse:collapse;font-family:'Inter';font-size:12.5px}
th{background:#141d30;padding:8px 10px;text-align:left;position:sticky;top:0;white-space:nowrap}
td{padding:6px 10px;border-bottom:1px solid #141c2e;white-space:nowrap}
tr:hover td{background:#172238}
tr.zone-champ td:first-child{border-left:4px solid var(--gold-bright)}
tr.zone-up td:first-child{border-left:4px solid var(--ok)}
tr.zone-down td:first-child{border-left:4px solid var(--danger)}
.zone-legend{display:flex;gap:14px;flex-wrap:wrap;font-family:'Inter';font-size:11px;color:var(--muted);margin:8px 2px}
.zone-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}

.badge-double{display:inline-block;padding:3px 8px;border-radius:4px;font-family:'JetBrains Mono';font-size:10px;font-weight:900;background:linear-gradient(135deg,#38bdf8,#f59e0b);color:#070a12;margin-left:4px}
.badge-treble{display:inline-block;padding:3px 8px;border-radius:4px;font-family:'JetBrains Mono';font-size:10px;font-weight:900;background:linear-gradient(135deg,#eab308,#ef4444);color:#fff;margin-left:4px}
.dim-text{font-size:11px;color:var(--muted);display:block}

.player-link{color:#38bdf8;text-decoration:none;border-bottom:1px dotted #38bdf8;cursor:pointer;transition:0.2s}
.player-link:hover{color:var(--gold-bright);border-bottom-color:var(--gold-bright);text-shadow:0 0 8px rgba(245,158,11,0.4)}
.club-bracket-link{font-weight:600;color:#e2e8f0;border-bottom:1px dashed #475569;cursor:pointer;transition:0.2s}
.club-bracket-link:hover{color:var(--gold-bright);border-bottom-color:var(--gold-bright);text-shadow:0 0 8px rgba(245,158,11,0.4)}

.modal-overlay{position:fixed;inset:0;background:rgba(3,6,12,0.85);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:0.25s}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal-box{background:var(--paper);border:2px solid var(--gold);border-radius:12px;width:100%;max-width:780px;box-shadow:0 16px 50px rgba(0,0,0,0.8);overflow:hidden;display:flex;flex-direction:column}
.modal-header{background:#0e1526;border-bottom:1px solid #1e293b;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.modal-title{font-size:20px;color:var(--gold-bright);margin:0;font-family:'Cinzel',serif}
.modal-close-btn{background:#1e293b;color:#fff;border:1px solid #334155;border-radius:6px;width:30px;height:30px;font-weight:700;cursor:pointer}
.modal-close-btn:hover{background:#be123c;border-color:#f43f5e}
.modal-body{padding:20px;overflow-y:auto;max-height:80vh;font-family:'Inter',sans-serif}
.p-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.p-stat-box{background:#111827;border:1px solid #1e293b;border-radius:6px;padding:8px 12px;text-align:center}
.p-stat-box span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700}
.p-stat-box b{font-size:15px;color:var(--gold-bright);font-family:'JetBrains Mono'}
.info-note{font-family:'Inter';font-size:12px;color:var(--muted);background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:12px 16px;margin-bottom:16px}

.score-badge-btn{background:#131c30;border:1px solid #334155;color:#fde047;border-radius:4px;padding:3px 8px;font-family:'JetBrains Mono';font-weight:700;font-size:12.5px;cursor:pointer;transition:0.2s;}
.score-badge-btn:hover{background:var(--gold);color:#070a12;border-color:var(--gold);}
.lineup-box{background:#0e1626;border:1px solid #1e293b;border-radius:6px;padding:10px 14px;font-size:12px;}
.timeline-item{display:flex;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid #162032;font-size:12.5px;}
.minute-badge{background:#1e293b;color:var(--gold-bright);font-family:'JetBrains Mono';font-weight:700;padding:2px 6px;border-radius:4px;font-size:11px;min-width:34px;text-align:center;}
.tag-pos{background:#1e293b;color:#93c5fd;border:1px solid #3b82f6;padding:1px 5px;border-radius:4px;font-size:10.5px;font-weight:700}
.fitbar{display:inline-block;width:56px;height:8px;background:#1e293b;border-radius:4px;vertical-align:middle;overflow:hidden;margin-right:6px}
.fitbar>i{display:block;height:100%}

.chip.red{border-color:#be123c;color:#fecdd3}.chip.grn{border-color:#059669;color:#a7f3d0}.chip.amb{border-color:#b45309;color:#fde68a}
.range-row{display:flex;align-items:center;gap:10px;margin:8px 0;font-family:'Inter';font-size:12.5px;flex-wrap:wrap}
.range-row input[type=range]{flex:1;max-width:320px}
</style>
</head>
<body>

<header>
  <div class="masthead-title serif">THE WIMBLEDON HERITAGE</div>
  <div class="masthead-sub">Historical Archive &amp; Roll of Honour · 370 Clubs British Pyramid</div>

<div class="container" id="app"></div>

<div class="modal-overlay" id="archive-modal" onclick="if(event.target===this)closeArchiveModal()">

<header>

  <div class="m-box" id="m-body"></div>

<script id="raw-data" type="application/json">__DATA_PLACEHOLDER__</script>

<script>
var DATA = JSON.parse(document.getElementById('raw-data').textContent);
var curSe = DATA.startSe, curMode = "league", curT = 0, curJornada = 1;
var T_NAMES = ["Premier League", "The Championship"];
var FIRST_NAMES = DATA.firstNames || [];
var LAST_NAMES = DATA.lastNames || [];

function nameFromId(n){
  var F = FIRST_NAMES.length, L = LAST_NAMES.length, pairs = F * L;
  if(n < pairs){ var k = (n * 7919) % pairs; return FIRST_NAMES[k % F] + ' ' + LAST_NAMES[Math.floor(k / F)]; }
  var m = n - pairs, total = pairs * L, k2 = (m * 104729) % total;
  return FIRST_NAMES[k2 % F] + ' ' + LAST_NAMES[Math.floor(k2 / F) % L] + ' ' + LAST_NAMES[Math.floor(k2 / pairs)];
}

function getC(id){ return (id !== null && id !== undefined) ? (DATA.clubNames[id] || ('Club #' + id)) : 'TBD'; }
function pLink(id, name){ return '<span class="player-link" onclick="openPlayerDossier(' + id + ')">' + (name || nameFromId(id)) + '</span>'; }

function init(){
  document.getElementById('header-sub').textContent = 'Comprehensive Match Archive · Season ' + DATA.startSe + ' to ' + DATA.endSe;
  var sel = document.getElementById('se-sel');
  sel.innerHTML = '';
  for(var s = DATA.startSe; s <= DATA.endSe; s++){
    if(DATA.seasons[s]) sel.innerHTML += '<option value="' + s + '">Season ' + s + '</option>';
  }
  render();
}

function changeSe(s){ curSe = s; curJornada = 1; render(); }

function setCompMode(mode, tier, btnEl){
  curMode = mode;
  if(tier !== undefined) curT = tier;
  var btns = document.querySelectorAll('#comp-nav button');
  btns.forEach(function(b){ b.classList.remove('active'); });
  if(btnEl) btnEl.classList.add('active');
  render();
}

function openPlayerDossier(id){
  var pName = nameFromId(id);
  var mBody = document.getElementById('m-body');
  mBody.innerHTML = 
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-bottom:1px solid #1e293b;padding-bottom:8px;">' +
      '<h3 style="color:var(--gold-bright);margin:0;">👤 ' + pName + '</h3>' +
      '<button class="btn close-btn" onclick="document.getElementById(\'modal\').classList.remove(\'active\')">✕</button>' +

function openMatchDetails(tierIdx, jIdx, mIdx){
  var sn = DATA.seasons[curSe];

  var m = sn.league[tierIdx].jornadas[jIdx][mIdx];
  if(!m) return;

  var homeId = m[0], awayId = m[1], gh = m[2], ga = m[3];
  var allEvents = [];
  (m[4] || []).forEach(function(e){ allEvents.push({ type: 'goal', team: getC(homeId), sc: e[0], as: e[1], min: e[2] }); });
  (m[5] || []).forEach(function(e){ allEvents.push({ type: 'goal', team: getC(awayId), sc: e[0], as: e[1], min: e[2] }); });
  (m[10] || []).forEach(function(s){ allEvents.push({ type: 'sub', team: getC(homeId), out: s[0], in: s[1], min: s[2] }); });
  (m[11] || []).forEach(function(s){ allEvents.push({ type: 'sub', team: getC(awayId), out: s[0], in: s[1], min: s[2] }); });
  allEvents.sort(function(a, b){ return a.min - b.min; });

  var evHtml = allEvents.length ? allEvents.map(function(ev){
    if(ev.type === 'goal'){
      var asTxt = ev.as ? ' (ast ' + pLink(ev.as) + ')' : '';
      return '<div class="t-item"><span class="m-badge">' + ev.min + '\'</span><div>⚽ <b>' + pLink(ev.sc) + '</b> (' + ev.team + ')' + asTxt + '</div></div>';
    } else {
      return '<div class="t-item"><span class="m-badge" style="color:#fdba74;">' + ev.min + '\'</span><div style="color:var(--muted);">🔄 (' + ev.team + ') IN: ' + pLink(ev.in) + ' ➔ OUT: ' + pLink(ev.out) + '</div></div>';
    }
  }).join('') : '<div style="color:var(--muted);padding:8px 0;">No key events recorded in this match.</div>';

  var renderLineup = function(ids){
    if(!ids || !ids.length) return '<div style="color:var(--muted);">Lineup data not captured.</div>';
    return ids.map(function(id, idx){
      return '<div style="padding:2px 0;"><b>' + (idx+1) + '.</b> ' + pLink(id) + '</div>';
    }).join('');
  };

  var mBody = document.getElementById('m-body');

      '<h3 style="color:var(--gold-bright);margin:0;">' + T_NAMES[tierIdx] + ' · Matchday ' + (jIdx + 1) + '</h3>' +

    '</div>' +
    '<div style="text-align:center;padding:12px;background:#0c1322;border:1px solid #1e293b;border-radius:8px;margin-bottom:16px;">' +
      '<div style="font-size:28px;font-weight:bold;color:var(--gold-bright);font-family:\'JetBrains Mono\';">' + gh + ' - ' + ga + '</div>' +
      '<div style="font-size:14px;color:#fff;"><b>' + getC(homeId) + '</b> vs <b>' + getC(awayId) + '</b></div>' +
    '</div>' +
    '<h4 style="color:var(--gold-bright);margin-bottom:6px;">⏱️ Match Timeline</h4>' +
    '<div style="background:#0e1526;border:1px solid #1e293b;border-radius:8px;padding:10px;margin-bottom:16px;">' + evHtml + '</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">' +
      '<div style="background:#0e1626;border:1px solid #1e293b;border-radius:6px;padding:10px;"><h4 style="color:var(--gold-bright);margin:0 0 6px 0;">👕 ' + getC(homeId) + '</h4>' + renderLineup(m[6]) + '</div>' +

function renderBracket64View(cupData, title, statObj, cupKey) {
  if(!cupData) return '<div class="card"><p style="color:var(--muted);">Cup data not available for this season.</p></div>';
  var roundNames = ["Round of 64", "Round of 32", "Round of 16", "Quarter-Finals", "Semi-Finals", "Grand Final"];
  var roundKeys = ["r64", "r32", "r16", "qf", "sf", "final"];
  
  var colsHtml = roundKeys.map(function(key, idx){
    var matches = cupData[key] || [];
    var mBoxes = matches.map(function(m, mIdx){
      var res = m.res;
      var sc = res ? (res.isFinal ? (res.gh + ' - ' + res.ga) : (res.aggH + ' - ' + res.aggA + ' [Agg]')) : 'VS';
      var wH = res && res.winner === m.h;
      var wA = res && res.winner === m.a;
      var btnClick = res ? 'onclick="openCupMatchDetails(\'' + cupKey + '\',\'' + key + '\',' + mIdx + ')" style="cursor:pointer;"' : '';
      return '<div class="match-box" ' + btnClick + '>' +
        '<div class="match-line ' + (wH ? 'match-winner' : '') + '"><span>' + getC(m.h) + '</span><b>' + (res ? (res.isFinal ? res.gh : res.aggH) : '') + '</b></div>' +
        '<div class="match-line ' + (wA ? 'match-winner' : '') + '"><span>' + getC(m.a) + '</span><b>' + (res ? (res.isFinal ? res.ga : res.aggA) : '') + '</b></div>' +
        '<div style="text-align:center;font-size:11px;color:var(--gold-bright);margin-top:4px;">' + sc + '</div>' +
      '</div>';
    }).join('');
    return '<div class="bracket-col"><h4 style="color:var(--gold-bright);margin-bottom:8px;">' + roundNames[idx] + '</h4>' + mBoxes + '</div>';
  }).join('');

  var scHtml = '', asHtml = '';
  if (statObj && statObj.scorers && statObj.scorers.length) {
    scHtml = statObj.scorers.map(function(x, i){
      return '<tr><td class="mono">' + (i + 1) + '</td><td>' + pLink(x.id, nameFromId(x.id)) + '</td><td>' + getC(x.club) + '</td><td class="mono" style="color:var(--gold-bright);font-weight:bold;">' + x.g + '</td><td class="mono">' + x.a + '</td></tr>';
    }).join('');
  }
  if (statObj && statObj.assisters && statObj.assisters.length) {
    asHtml = statObj.assisters.map(function(x, i){
      return '<tr><td class="mono">' + (i + 1) + '</td><td>' + pLink(x.id, nameFromId(x.id)) + '</td><td>' + getC(x.club) + '</td><td class="mono" style="color:var(--ac);font-weight:bold;">' + x.a + '</td><td class="mono">' + x.g + '</td></tr>';
    }).join('');
  }

  return '<div class="card"><h2 style="color:var(--gold-bright);margin:0 0 10px 0;">' + title + ' (Season ' + curSe + ')</h2><div class="bracket-scroll">' + colsHtml + '</div></div>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;">' +
      '<div class="card"><h3 style="color:var(--gold-bright);margin:0 0 10px 0;">⚽ Top Goalscorers (' + title + ')</h3><div style="overflow-x:auto;"><table><tr><th>#</th><th>Player</th><th>Club</th><th>G</th><th>A</th></tr>' + (scHtml || '<tr><td colspan=5 style="text-align:center;">No data recorded.</td></tr>') + '</table></div></div>' +
      '<div class="card"><h3 style="color:var(--ac);margin:0 0 10px 0;">🎯 Top Assists (' + title + ')</h3><div style="overflow-x:auto;"><table><tr><th>#</th><th>Player</th><th>Club</th><th>A</th><th>G</th></tr>' + (asHtml || '<tr><td colspan=5 style="text-align:center;">No data recorded.</td></tr>') + '</table></div></div>' +
    '</div>';
}

function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

function pseudoRandom(seed) {
  var s = Math.floor(Math.abs(seed)) % 2147483647;
  if (s <= 0) s += 2147483646;
  var f = function() { return (s = s * 16807 % 2147483647) / 2147483647; };
  f(); f(); f(); f();
  return f;
}

function shuffleArr(arr, r) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(r() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function generatePoissonGoals(expectedLambda, r) {
  var L = Math.exp(-expectedLambda);
  var k = 0, p = 1.0;
  do { k++; p *= r(); } while (p > L && k < 12);
  return Math.max(0, k - 1);
}

function nameFromId(n) {
  var F = FIRST_NAMES_EN.length, L = LAST_NAMES_EN.length;
  var pairs = F * L;
  if (n < pairs) {
    var k = (n * 7919) % pairs;
    return FIRST_NAMES_EN[k % F] + ' ' + LAST_NAMES_EN[Math.floor(k / F)];
  }
  var m = n - pairs;
  var total = pairs * L;
  var k2 = (m * 104729) % total;
  var fi = k2 % F;
  var l1 = Math.floor(k2 / F) % L;
  var l2 = Math.floor(k2 / pairs);
  return FIRST_NAMES_EN[fi] + ' ' + LAST_NAMES_EN[l1] + '-' + LAST_NAMES_EN[l2];
}

function getClubPriorFinishTag(cId, curSe) {
  if (cId === null || cId === undefined) return '';
  var prevSe = curSe - 1;
  if (prevSe < 1 || !H.seasons[prevSe]) return '<span class="pos-tag" style="color:var(--muted)">[Inaugural]</span>';

  var prevS = H.seasons[prevSe];
  var tag = '';

  if (prevS.leagueDone && prevS.league) {
    for (var t = 0; t < prevS.tiers.length; t++) {
      var tab = prevS.league[t].table;
      for (var i = 0; i < tab.length; i++) {
        if (tab[i][0] === cId) {
          tag = TIER_SHORT[t] + ' #' + (i + 1);
          break;
        }
      }
      if (tag) break;
    }
  }

  if (prevS.faWinner === cId) tag += ' · 🛡️ FA Winner';
  else if (prevS.faRunner === cId) tag += ' · 🛡️ FA Finalist';
  else if (prevS.lcWinner === cId) tag += ' · 🏅 LC Winner';
  else if (prevS.lcRunner === cId) tag += ' · 🏅 LC Finalist';

  if (!tag) tag = 'Dormant Pool';
  return '<span class="pos-tag">[' + tag + ']</span>';
}

function clubStrength(c) {
  var sq = PLAYERS_DB[c];
  if (!sq || !sq.length) return (S.prestige[c] || 70) - 6;
  var o = sq.map(function(p){ return p.ovr; }).sort(function(a, b){ return b - a; });
  var n = Math.min(13, o.length), sum = 0;
  for (var i = 0; i < n; i++) sum += o[i];
  return sum / n;
}

function legendScore(c) {
  return c.t1Goals + 0.5 * (c.goals - c.t1Goals) + 0.5 * c.assists +
         40 * c.t1Boots + 70 * c.mvp + 10 * (c.faBoots + c.lcBoots) + 6 * c.lowBoots;
}

function retirePlayer(p, cId, se) {
  var sc = legendScore(p.career);
  if (sc >= LEGEND_THRESHOLD) {
    S.legends.push({
      id: p.id, name: p.name, pos: p.pos, age: p.age, ovr: p.ovr, peak: p.peak,
      club: +cId, origin: p.origin, debut: p.debut, retired: se,
      career: JSON.parse(JSON.stringify(p.career)),
      hist: p.hist, score: Math.round(sc)
    });
  }
}

function generateRoundRobinSchedule(teams) {
  var n = teams.length;
  var rounds = [];
  var list = teams.slice();
  var totalRounds = n - 1;
  var half = n / 2;

  for (var r = 0; r < totalRounds; r++) {
    var roundMatches = [];
    for (var i = 0; i < half; i++) {
      var home = list[i];
      var away = list[n - 1 - i];
      if (r % 2 === 1) {
        var tmp = home; home = away; away = tmp;
      }
      roundMatches.push([home, away]);
    }
    rounds.push(roundMatches);
    var fixed = list[0];
    var rest = list.slice(1);
    rest.unshift(rest.pop());
    list = [fixed].concat(rest);
  }

  var secondHalfRounds = rounds.map(function(roundMatches) {
    return roundMatches.map(function(m){ return [m[1], m[0]]; });
  });

  return rounds.concat(secondHalfRounds);
}

function build64CupStructure(entrants) {
  var r64 = [];
  for (var i = 0; i < 32; i++) {
    r64.push({ id: i, h: entrants[i * 2], a: entrants[i * 2 + 1], res: null });
  }
  var makeEmpty = function(count) {
    var arr = [];
    for (var k = 0; k < count; k++) arr.push({ id: k, h: null, a: null, res: null });
    return arr;
  };
  return {
    r64: r64,
    r32: makeEmpty(16),
    r16: makeEmpty(8),
    qf: makeEmpty(4),
    sf: makeEmpty(2),
    final: makeEmpty(1)
  };
}

function initFaCupEntrants(se, s) {
  var r = pseudoRandom(se * 8819 + 71);
  var prevSe = se - 1;
  var prevT1 = (prevSe >= 1 && H && H.seasons && H.seasons[prevSe] && H.seasons[prevSe].league) ? 
               H.seasons[prevSe].league[0].table.map(function(x){ return x[0]; }) : s.tiers[0];

  var seeded16 = prevT1.slice(0, 16);
  var remainingT1 = prevT1.slice(16, 32);
  var proPool = shuffleArr(remainingT1.concat(s.tiers[1]), r);
  var pro24 = proPool.slice(0, 24);

  var usedSet = new Set(seeded16.concat(pro24));
  var dormantPool = [];
  for (var cId = 0; cId < TOTAL_CLUBS; cId++) {
    if (!usedSet.has(cId) && s.tiers[0].indexOf(cId) === -1 && s.tiers[1].indexOf(cId) === -1) {
      dormantPool.push(cId);
    }
  }
  var wild24 = shuffleArr(dormantPool, r).slice(0, 24);

  var opponents = shuffleArr(pro24.concat(wild24), r);
  var finalEntrants = [];
  for (var i = 0; i < 16; i++) {
    finalEntrants.push(seeded16[i]);
    finalEntrants.push(opponents[i]);
  }
  for (var j = 16; j < 48; j += 2) {
    finalEntrants.push(opponents[j]);
    finalEntrants.push(opponents[j + 1]);
  }
  return build64CupStructure(finalEntrants);
}

function initLeagueCupEntrants(se, s) {
  var r = pseudoRandom(se * 4423 + 19);
  var all64 = shuffleArr(s.tiers[0].concat(s.tiers[1]), r);
  return build64CupStructure(all64);
}

function simSingleCupMatch(cupKey, stageKey, matchIdx, se) {
  var s = H.seasons[se];
  if (!s) return;
  var cup = cupKey === 'fa' ? s.faCup64 : s.leagueCup64;
  if (!cup || !cup[stageKey]) return;

  var m = cup[stageKey][matchIdx];
  if (m.res || m.h === null || m.a === null) return;

  var isFinal = (stageKey === 'final');
  var stages = ["r64", "r32", "r16", "qf", "sf", "final"];
  var nextStages = ["r32", "r16", "qf", "sf", "final", null];
  var stageIdx = stages.indexOf(stageKey);
  var nextSt = nextStages[stageIdx];

  var seed = se * 10000 + stageIdx * 500 + matchIdx * 19 + (cupKey === 'fa' ? 333 : 777);
  if (!s.cupMins) s.cupMins = { fa: {}, lc: {} };
  m.res = simulateTwoLegTie(m.h, m.a, seed, isFinal, se, { cupKey: cupKey, stageIdx: stageIdx, mins: s.cupMins[cupKey] });

  if (nextSt && cup[nextSt]) {
    var targetMatch = cup[nextSt][Math.floor(matchIdx / 2)];
    if (matchIdx % 2 === 0) targetMatch.h = m.res.winner;
    else targetMatch.a = m.res.winner;
  }

  if (isFinal) {
    if (cupKey === 'fa') { s.faWinner = m.res.winner; s.faRunner = m.res.loser; }
    else { s.lcWinner = m.res.winner; s.lcRunner = m.res.loser; }
  }

  if (!SIM_BATCH) { autoSaveHistory(); render(); }
}

function simCupStage(cupKey, stageKey, se) {
  var s = H.seasons[se];
  if (!s) return;
  var cup = cupKey === 'fa' ? s.faCup64 : s.leagueCup64;
  if (!cup || !cup[stageKey]) return;

  cup[stageKey].forEach(function(m, idx) {
    if (!m.res && m.h !== null && m.a !== null) {
      simSingleCupMatch(cupKey, stageKey, idx, se);
    }
  });
  if (!SIM_BATCH) { autoSaveHistory(); render(); }
}

function manualRedrawCup(cupKey, se) {
  var s = H.seasons[se];
  if (!s || s.finalized) return;
  if (!confirm("Undi ulang bagan untuk musim ini? Pertandingan yang sudah dimainkan di turnamen ini akan direset.")) return;

  if (s.cupMins) s.cupMins[cupKey] = {};
  if (cupKey === 'fa') s.faCup64 = initFaCupEntrants(se, s);
  else s.leagueCup64 = initLeagueCupEntrants(se, s);

  autoSaveHistory();
  render();
}

function applyPromotionRelegationAndDynastyBoost(se) {
  var s = H.seasons[se];
  var r = pseudoRandom(se * 6101 + 5);
  var t1Table = s.league[0].table.map(function(x){ return x[0]; });
  var t2Table = s.league[1].table.map(function(x){ return x[0]; });

  var t1Champ = t1Table[0];
  S.prestige[t1Champ] = clamp(S.prestige[t1Champ] + 4.0, 88, 98);
  for (var topIdx = 1; topIdx < 4; topIdx++) {
    var cTop = t1Table[topIdx];
    S.prestige[cTop] = clamp(S.prestige[cTop] + (3.0 - topIdx * 0.7), 84, 96);
  }

  var downT1toT2 = t1Table.slice(-T1_RELEGATION_COUNT);
  var upT2toT1 = t2Table.slice(0, T1_RELEGATION_COUNT);

  var midT2 = t2Table.slice(T1_RELEGATION_COUNT, -T2_RELEGATION_COUNT);
  var downT2toDormant = t2Table.slice(-T2_RELEGATION_COUNT);

  var activeSet = new Set(t1Table.concat(t2Table));
  var dormantCandidates = [];
  for (var id = 0; id < TOTAL_CLUBS; id++) {
    if (!activeSet.has(id)) {
      dormantCandidates.push({ id: id, pr: S.prestige[id] || 52 });
    }
  }
  dormantCandidates.sort(function(a, b){
    return (b.pr + (r() * 20 - 10)) - (a.pr + (r() * 20 - 10));
  });
  var upDormanttoT2 = dormantCandidates.slice(0, T2_RELEGATION_COUNT).map(function(x){ return x.id; });

  upDormanttoT2.forEach(function(cId) {
    ensureSquadForClub(cId, se + 1);
  });

  var newT1 = t1Table.slice(0, -T1_RELEGATION_COUNT).concat(upT2toT1);
  var newT2 = midT2.concat(downT1toT2, upDormanttoT2);

  S.mem = [newT1, newT2];
  s.moves = {
    up2to1: upT2toT1,
    down1to2: downT1toT2,
    upDormantTo2: upDormanttoT2,
    down2ToDormant: downT2toDormant
  };
}

function recalculateTrophyCabinet() {
  var cab = {};
  function C(c){
    if (!cab[c]) cab[c] = { t1: 0, fa: 0, lc: 0, doubles: 0, trebles: 0, pts: 0 };
    return cab[c];
  }
  var max = getMaxSeasonInArchive();
  for (var se = 1; se <= max; se++) {
    var s = H.seasons[se];
    if (!s || !s.leagueDone) continue;

    var lChamp = s.league[0].table[0][0];
    C(lChamp).t1++; C(lChamp).pts += 15;

    if (s.faWinner !== null) { C(s.faWinner).fa++; C(s.faWinner).pts += 8; }
    if (s.lcWinner !== null) { C(s.lcWinner).lc++; C(s.lcWinner).pts += 5; }

    if (lChamp === s.faWinner && lChamp === s.lcWinner) {
      C(lChamp).trebles++; C(lChamp).pts += 30;
    } else if (lChamp === s.faWinner) {
      C(lChamp).doubles++; C(lChamp).pts += 15;
    }
  }
  H.clubStats = cab;
}

function purgeArchivedSeasonFixtures(startSe, endSe) {
  for (var s = startSe; s <= endSe; s++) {
    var sn = H.seasons[s];
    if (sn && !sn.fixturesPurged) {
      if (sn.league) {
        sn.league.forEach(function(tier) {
          tier.jornadas = [];
        });
      }
      if (sn.faCup64) {
        sn.faCup64.r64 = []; sn.faCup64.r32 = []; sn.faCup64.r16 = [];
        sn.faCup64.qf = []; sn.faCup64.sf = [];
      }
      if (sn.leagueCup64) {
        sn.leagueCup64.r64 = []; sn.leagueCup64.r32 = []; sn.leagueCup64.r16 = [];
        sn.leagueCup64.qf = []; sn.leagueCup64.sf = [];
      }
      sn.fixturesPurged = true;
    }
  }
}

function simulateFullSeasonInternal(se, noSnap) {
  var s = H.seasons[se];
  if (!s || s.finalized) return;

  if (!noSnap && (!S.undo || S.undo.se !== se)) takeSnapshot(se);

  SIM_BATCH++;
  try {
  s.league = [0, 1].map(function(t){ return playTierLeague(s.tiers[t], t, se); });
  s.currentJornada = (s.tiers[0].length - 1) * 2;
  s.leagueDone = true;
  s.premierChampion = s.league[0].table[0][0];

  if (!s.faCup64) s.faCup64 = initFaCupEntrants(se, s);
  s.faWinner = simulateEntireCup64(s.faCup64, 'fa', se);
  s.faRunner = s.faCup64.final[0].res ? s.faCup64.final[0].res.loser : null;

  if (!s.leagueCup64) s.leagueCup64 = initLeagueCupEntrants(se, s);
  s.lcWinner = simulateEntireCup64(s.leagueCup64, 'lc', se);
  s.lcRunner = s.leagueCup64.final[0].res ? s.leagueCup64.final[0].res.loser : null;

  } finally { SIM_BATCH--; }
  finalizeSeason(se);
}

function advanceSingleJornada(se) {
  var s = H.seasons[se];
  if (!s || s.leagueDone) return;

  $('#status-label').textContent = 'Simulating Matchday...';

  setTimeout(function() {
    if (!s.league) {
      if (!S.undo || S.undo.se !== se) takeSnapshot(se);
      s.league = [0, 1].map(function(t){ return playTierLeague(s.tiers[t], t, se); });
      s.currentJornada = 0;
    }

    var maxJ = (s.tiers[0].length - 1) * 2;
    if (s.currentJornada < maxJ) {
      s.currentJornada++;
      selectedJornada = s.currentJornada;

      for (var t = 0; t < 2; t++) {
        s.league[t].table = recalculateTableUpToJornada(s.league[t], s.currentJornada);
      }

      if (s.currentJornada >= maxJ) {
        s.leagueDone = true;
        s.premierChampion = s.league[0].table[0][0];

        if (!s.faWinner && s.faCup64) s.faWinner = simulateEntireCup64(s.faCup64, 'fa', se);
        if (!s.lcWinner && s.leagueCup64) s.lcWinner = simulateEntireCup64(s.leagueCup64, 'lc', se);

        finalizeSeason(se);
      }
    }

    autoSaveHistory();
    requestAnimationFrame(function() {
      render();
      $('#status-label').textContent = 'Matchday ' + s.currentJornada + ' simulated';
    });
  }, 10);
}

function recalculateTableUpToJornada(tierData, playedJornadas) {
  var stats = {};
  tierData.table.forEach(function(r) {
    stats[r[0]] = { id: r[0], W: 0, D: 0, L: 0, GF: 0, GA: 0, pts: 0 };
  });

  for (var j = 0; j < playedJornadas; j++) {
    var matches = tierData.jornadas[j] || [];
    matches.forEach(function(m) {
      var h = stats[m[0]], a = stats[m[1]], gh = m[2], ga = m[3];
      h.GF += gh; h.GA += ga;
      a.GF += ga; a.GA += gh;
      if (gh > ga) { h.W++; h.pts += 3; a.L++; }
      else if (gh < ga) { a.W++; a.pts += 3; h.L++; }
      else { h.D++; h.pts += 1; a.D++; a.pts += 1; }
    });
  }

  var res = [];
  Object.keys(stats).forEach(function(k){
    var x = stats[k];
    res.push([x.id, x.W, x.D, x.L, x.GF, x.GA, x.pts]);
  });
  return res.sort(function(a, b) {
    return (b[6] - a[6]) || ((b[4] - b[5]) - (a[4] - a[5])) || (b[4] - a[4]) || (a[0] - b[0]);
  });
}

function getMaxSeasonInArchive() {
  if (!H || !H.seasons) return 1;

}

function getErasDefinition() {
  var total = getMaxSeasonInArchive();
  var span = Math.max(50, Math.ceil(total / 4));
  return [
    { id: 1, name: "Era of the Founders", range: [1, span], desc: "Establishment of the national 370-club pyramid and pure two-tier professional league." },
    { id: 2, name: "Era of the Twin Cups", range: [span + 1, span * 2], desc: "Rise of 64-club home & away knockout cup tournaments and classic underdog runs." },
    { id: 3, name: "Era of Tactical Dynasties", range: [span * 2 + 1, span * 3], desc: "Fierce multi-season battles for the prestigious League and FA Cup Treble." },
    { id: 4, name: "Era of Perpetual Glory", range: [span * 3 + 1, Math.max(total, span * 4)], desc: "Endless marathon of promotion, relegation, and all-time hall of fame records." }
  ];
}

function getEraForSeason(se) {
  var eras = getErasDefinition();
  for (var i = 0; i < eras.length; i++) {
    if (se >= eras[i].range[0] && se <= eras[i].range[1]) return eras[i].id;
  }
  return eras[eras.length - 1].id;
}

function exportBatchDetailedHtml(startSe, endSe) {
  var exportSeasons = {};
  for (var se = startSe; se <= endSe; se++) {
    if (H.seasons[se] && H.seasons[se].leagueDone) {
      var snCopy = JSON.parse(JSON.stringify(H.seasons[se]));

      ['faCup64', 'leagueCup64'].forEach(function(cupKey) {
        var cup = snCopy[cupKey];
        var statKey = cupKey === 'faCup64' ? 'faStats' : 'lcStats';
        var pMap = {};
        if (cup) {
          ["r64", "r32", "r16", "qf", "sf", "final"].forEach(function(stKey) {
            (cup[stKey] || []).forEach(function(m) {
              if (!m.res) return;
              var allEv = [];
              if (m.res.eventsH) allEv = allEv.concat(m.res.eventsH);
              if (m.res.eventsA) allEv = allEv.concat(m.res.eventsA);
              if (m.res.eventsH1) allEv = allEv.concat(m.res.eventsH1);
              if (m.res.eventsA1) allEv = allEv.concat(m.res.eventsA1);
              if (m.res.eventsH2) allEv = allEv.concat(m.res.eventsH2);
              if (m.res.eventsA2) allEv = allEv.concat(m.res.eventsA2);

              allEv.forEach(function(ev) {
                var scId = ev[0], asId = ev[1];
                if (scId) {
                  if (!pMap[scId]) pMap[scId] = { id: scId, g: 0, a: 0, club: m.h };
                  pMap[scId].g++;
                }
                if (asId) {
                  if (!pMap[asId]) pMap[asId] = { id: asId, g: 0, a: 0, club: m.a };
                  pMap[asId].a++;
                }
              });
            });
          });
        }
        var list = Object.keys(pMap).map(function(k){ return pMap[k]; });
        snCopy[statKey] = {
          scorers: list.slice().filter(function(x){ return x.g > 0; }).sort(function(a, b){ return b.g - a.g || b.a - a.a; }).slice(0, 15),
          assisters: list.slice().filter(function(x){ return x.a > 0; }).sort(function(a, b){ return b.a - a.a || b.g - a.g; }).slice(0, 10)
        };
      });

      exportSeasons[se] = snCopy;
    }
  }

  var payload = {
    startSe: startSe,
    endSe: endSe,
    clubNames: S.name,
    seasons: exportSeasons,
    firstNames: FIRST_NAMES_EN,
    lastNames: LAST_NAMES_EN
  };

  var templateEl = document.getElementById('offline-html-template');
  if (!templateEl) return;

  var rawTemplate = templateEl.innerHTML;
  var safeJson = JSON.stringify(payload);
  var finalHtml = rawTemplate.replace('__DATA_PLACEHOLDER__', safeJson);

  var blob = new Blob([finalHtml], { type: 'text/html;charset=utf-8' });
  var blobUrl = URL.createObjectURL(blob);
  window.open(blobUrl, '_blank');

  var a = document.createElement('a');
  a.href = blobUrl;
  a.download = 'wimbledon_archive_S' + startSe + '_S' + endSe + '.html';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function findPlayerRecord(id) {
  var clubs = Object.keys(PLAYERS_DB);
  for (var i = 0; i < clubs.length; i++) {
    var sq = PLAYERS_DB[clubs[i]];
    for (var j = 0; j < sq.length; j++) {
      if (sq[j].id === id) return { status: 'active', rec: sq[j], club: +clubs[i] };
    }
  }
  var lg = (S.legends || []);
  for (var k = 0; k < lg.length; k++) if (lg[k].id === id) return { status: 'legend', rec: lg[k], club: lg[k].club };
  return null;
}

function openPlayerSeasonLog(pId, se) {
  var sn = H.seasons[se];
  if (!sn || !sn.league) {
    alert("Simulate the season first to view logs.");
    return;
  }
  var pRec = findPlayerRecord(pId);
  var pName = pRec && pRec.rec ? pRec.rec.name : nameFromId(pId);
  var playerClub = -1, targetTier = -1;

  for (var t = 0; t < sn.tiers.length; t++) {
    var clubs = sn.tiers[t];
    for (var c = 0; c < clubs.length; c++) {
      var cid = clubs[c];
      var sq = PLAYERS_DB[cid] || [];
      if (sq.some(function(p){ return p.id === pId; })) {
        playerClub = cid; targetTier = t; break;
      }
    }
    if (playerClub !== -1) break;
  }

  if (playerClub === -1) {
    alert("Player not in active squad for Season " + se);
    return;
  }

  var L = sn.league[targetTier];
  var jornadas = L.jornadas || [];
  var totalJ = (sn.tiers[targetTier].length - 1) * 2;
  var playedCount = sn.leagueDone ? totalJ : (sn.currentJornada || 0);
  var logRows = [];
  var totalMins = 0, totalStarts = 0, totalSubsIn = 0, totalUnused = 0, totalGoals = 0, totalAssists = 0;

  for (var jIdx = 0; jIdx < playedCount; jIdx++) {
    var jMatches = jornadas[jIdx] || [];
    var m = jMatches.find(function(match){ return match[0] === playerClub || match[1] === playerClub; });
    if (!m) continue;

    var isHome = m[0] === playerClub;
    var oppId = isHome ? m[1] : m[0];
    var scoreTxt = isHome ? (m[2] + ' - ' + m[3]) : (m[3] + ' - ' + m[2]);
    var xiList = isHome ? (m[6] || []) : (m[7] || []);
    var benchList = isHome ? (m[8] || []) : (m[9] || []);
    var subs = isHome ? (m[10] || []) : (m[11] || []);
    var events = isHome ? (m[4] || []) : (m[5] || []);

    var subIn = subs.find(function(sb){ return sb[1] === pId; });
    var subOut = subs.find(function(sb){ return sb[0] === pId; });
    var statusTxt = '', matchMin = 0;

    if (xiList.indexOf(pId) !== -1) {
      totalStarts++;
      if (subOut) { matchMin = subOut[2]; statusTxt = '<b style="color:var(--gold-bright);">Starter</b> <span style="color:var(--danger);font-size:11px;">[Out ' + subOut[2] + '\']</span>'; }
      else { matchMin = 90; statusTxt = '<b style="color:var(--gold-bright);">Starter (90\')</b>'; }
    } else if (subIn) {
      totalSubsIn++; matchMin = 90 - subIn[2]; statusTxt = '<b style="color:var(--ok);">Sub In (' + subIn[2] + '\')</b>';
    } else if (benchList.indexOf(pId) !== -1) {
      totalUnused++; statusTxt = '<span style="color:var(--muted);">Bench</span>';
    }

    totalMins += matchMin;
    var g = events.filter(function(ev){ return ev[0] === pId; }).length;
    var a = events.filter(function(ev){ return ev[1] === pId; }).length;
    totalGoals += g; totalAssists += a;

    var contrib = [];
    if (g > 0) contrib.push('⚽ ' + g + ' G');
    if (a > 0) contrib.push('🎯 ' + a + ' A');
    var mt = m[12];
    if (mt) {
      (mt.c || []).forEach(function(cd){ if (cd[0] === pId) contrib.push(cd[2] === 'R' ? '🟥 ' + cd[1] + '\'' : '🟨 ' + cd[1] + '\''); });
      (mt.i || []).forEach(function(ij){ if (ij[0] === pId) contrib.push('🤕 ' + ij[2]); });
      if (mt.pm === pId) contrib.push('⭐ MotM ' + mt.pr.toFixed(1));
    }

    logRows.push('<tr><td class="mono">M.' + (jIdx + 1) + '</td><td>' + (isHome ? 'vs ' : '@ ') + getClubName(oppId) + '</td><td class="mono">' + scoreTxt + '</td><td>' + statusTxt + '</td><td class="mono" style="color:var(--gold-bright);">' + matchMin + '\'</td><td style="color:var(--gold-bright);font-weight:600;">' + (contrib.join(' · ') || '—') + '</td></tr>');
  }

  var summaryBanner = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:14px;">' +
    '<div style="background:#111827;border:1px solid #1e293b;padding:8px;border-radius:6px;text-align:center;"><span style="font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;">Total Minutes</span><b class="mono" style="display:block;font-size:16px;color:var(--gold-bright);">' + totalMins + '\'</b></div>' +
    '<div style="background:#111827;border:1px solid #1e293b;padding:8px;border-radius:6px;text-align:center;"><span style="font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;">Appearances</span><b class="mono" style="display:block;font-size:16px;color:var(--ac);">' + (totalStarts + totalSubsIn) + '</b></div>' +
    '<div style="background:#111827;border:1px solid #1e293b;padding:8px;border-radius:6px;text-align:center;"><span style="font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;">Starts / Subs</span><b class="mono" style="display:block;font-size:15px;color:#cbd5e1;">' + totalStarts + ' / ' + totalSubsIn + '</b></div>' +
    '<div style="background:#111827;border:1px solid #1e293b;padding:8px;border-radius:6px;text-align:center;"><span style="font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;">Goals / Assists</span><b class="mono" style="display:block;font-size:15px;color:var(--gold-bright);">⚽ ' + totalGoals + ' · 🎯 ' + totalAssists + '</b></div>' +
  '</div>';

  $('#am-kicker').textContent = 'Matchday Performance Tracker · Season ' + se;
  $('#am-title').textContent = pName + ' (' + getClubName(playerClub) + ')';
  $('#am-body').innerHTML = summaryBanner +
    '<div class="table-wrap" style="max-height:55vh;overflow-y:auto;"><table><tr><th>Round</th><th>Opponent</th><th>Score</th><th>Status</th><th>Mins</th><th>Contributions</th></tr>' +
      (logRows.join('') || '<tr><td colspan=6 style="text-align:center;padding:12px;">No appearances yet.</td></tr>') +
    '</table></div>';
  $('#archive-modal').classList.add('active');
}

function openClub5SeasonFormModal(clubId, targetSe) {
  var cName = getClubName(clubId);
  var startSe = Math.max(1, targetSe - 5);
  var endSe = Math.max(1, targetSe - 1);
  var rows = [];
  var trophies = 0, played = 0;

  if (targetSe > 1) {
    for (var s = endSe; s >= startSe; s--) {
      var sn = H.seasons[s];
      if (!sn || !sn.leagueDone) continue;
      played++;
      var posTxt = '—';
      for (var t = 0; t < sn.tiers.length; t++) {
        var tab = sn.league[t].table;
        for (var i = 0; i < tab.length; i++) {
          if (tab[i][0] === clubId) {
            posTxt = TIER_SHORT[t] + ' · #' + (i + 1) + ' (' + tab[i][6] + ' pts)';
            if (t === 0 && i === 0) { posTxt += ' 🏆 Champion'; trophies++; }
            break;
          }
        }
      }
      var faText = (sn.faWinner === clubId) ? (trophies++, "🏆 Winner") : ((sn.faRunner === clubId) ? "🥈 Finalist" : "—");
      var lcText = (sn.lcWinner === clubId) ? (trophies++, "🏆 Winner") : ((sn.lcRunner === clubId) ? "🥈 Finalist" : "—");
      rows.push({ season: s, lg: posTxt, fa: faText, lc: lcText });
    }
  }

  $('#am-kicker').textContent = 'Club Momentum & Dynamic Progress';
  $('#am-title').textContent = cName + ' (Leading to Season ' + targetSe + ')';
  $('#am-body').innerHTML =
    '<div class="p-grid">' +
      '<div class="p-stat-box"><span>Trophies Won (5 Yrs)</span><b>' + trophies + '</b></div>' +
      '<div class="p-stat-box"><span>Seasons Recorded</span><b>' + played + '</b></div>' +
      '<div class="p-stat-box"><span>Current Prestige</span><b>' + (S.prestige[clubId] || 0).toFixed(1) + '</b></div>' +
      '<div class="p-stat-box"><span>Squad Strength</span><b>' + clubStrength(clubId).toFixed(1) + '</b></div>' +
    '</div>' +
    '<h4 style="color:var(--gold-bright);margin-top:14px;border-bottom:1px solid #1e293b;padding-bottom:4px;">📜 Last 5 Seasons Track Record</h4>' +
    '<div class="table-wrap"><table><tr><th>Season</th><th>League Finish</th><th>FA Cup</th><th>League Cup</th></tr>' +
      (rows.map(function(r){ return '<tr><td class="mono"><b>S.' + r.season + '</b></td><td>' + r.lg + '</td><td style="color:var(--gold-bright);">' + r.fa + '</td><td style="color:var(--ac);">' + r.lc + '</td></tr>'; }).join('') || '<tr><td colspan=4 style="text-align:center;">No past data.</td></tr>') +
    '</table></div>';
  $('#archive-modal').classList.add('active');
}

function seasonSelectorHtml() {
  var keys = Object.keys(H.seasons).map(Number).sort(function(a, b){ return a - b; });
  return '<select onchange="selectedSeason=+this.value;selectedJornada=1;render();">' +
    keys.map(function(se) {
      var s = H.seasons[se];
      var tx = s.finalized ? ' [PL Champ: ' + getClubName(s.premierChampion) + ' | FA: ' + getClubName(s.faWinner) + ']' : (s.leagueDone ? ' (Finished)' : ' (Unplayed)');
      return '<option value="' + se + '"' + (se === selectedSeason ? ' selected' : '') + '>Season ' + se + tx + '</option>';
    }).join('') + '</select>';
}

function renderBracket64UI(cupData, title, desc, cupWinner, cupRunner, cupKey) {
  if (!cupData) return '<div class="editorial-card"><p style="color:var(--muted);">Tournament bracket not generated.</p></div>';

  var roundNames = ["Round of 64", "Round of 32", "Round of 16", "Quarter-Finals", "Semi-Finals", "Grand Final"];
  var roundKeys = ["r64", "r32", "r16", "qf", "sf", "final"];

  var colsHtml = roundKeys.map(function(key, idx){
    var matches = cupData[key] || [];
    var canSimRound = matches.some(function(m){ return !m.res && m.h !== null && m.a !== null; });

    var mBoxes = matches.map(function(m, mIdx){
      var res = m.res;
      var ready = m.h !== null && m.a !== null;
      var wH = res && res.winner === m.h;
      var wA = res && res.winner === m.a;
      var sc = res ? (res.isFinal ? (res.gh + ' - ' + res.ga + (res.penH ? ' (' + res.penH + 'p)' : '')) : (res.aggH + ' - ' + res.aggA + ' [Agg]')) : 'VS';
      var legsTxt = (res && !res.isFinal) ? '<div style="font-size:10px;color:var(--muted);text-align:center;">L1: ' + res.gh.split('/')[0] + '-' + res.ga.split('/')[0] + ' · L2: ' + res.ga.split('/')[1] + '-' + res.gh.split('/')[1] + '</div>' : '';

      var simBtn = (ready && !res) ? '<button type="button" class="btn-ui btn-sm" style="margin-top:4px;width:100%;" onclick="simSingleCupMatch(\'' + cupKey + '\',\'' + key + '\',' + mIdx + ',' + selectedSeason + ')">⚡ Sim Match</button>' : '';

      return '<div class="match-box">' +
        '<div class="match-line ' + (wH ? 'match-winner' : '') + '"><span>' + (m.h !== null ? getClubName(m.h) + ' ' + getClubPriorFinishTag(m.h, selectedSeason) : 'TBD') + '</span></div>' +
        '<div class="match-line ' + (wA ? 'match-winner' : '') + '"><span>' + (m.a !== null ? getClubName(m.a) + ' ' + getClubPriorFinishTag(m.a, selectedSeason) : 'TBD') + '</span></div>' +
        '<div style="text-align:center;font-family:\'JetBrains Mono\';font-weight:700;color:var(--gold-bright);font-size:11px;margin-top:4px;">' + sc + '</div>' +
        legsTxt +
        simBtn +
      '</div>';
    }).join('');

    var roundHeaderBtn = canSimRound ? '<button type="button" class="btn-gold btn-sm" style="width:100%;margin-bottom:6px;" onclick="simCupStage(\'' + cupKey + '\',\'' + key + '\',' + selectedSeason + ')">⚡ Sim All ' + roundNames[idx] + '</button>' : '';

    return '<div class="bracket-round-col"><h4 style="color:var(--gold-bright);margin-bottom:6px;font-size:13px;">' + roundNames[idx] + '</h4>' + roundHeaderBtn + mBoxes + '</div>';
  }).join('');

  return '<div class="editorial-card">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:gap:8px;margin-bottom:12px;">' +
      '<div><span class="kicker">Official 64-Club Knockout Tournament</span><h2 style="color:#fff;">' + title + ' — Season ' + selectedSeason + '</h2></div>' +
      '<div style="display:flex;gap:6px;"><button type="button" class="btn-ui btn-sm" onclick="manualRedrawCup(\'' + cupKey + '\',' + selectedSeason + ')">🎲 Re-Draw Bracket</button></div>' +
    '</div>' +
    (cupWinner !== null ? '<div style="background:#131c30;border:1px solid var(--gold);padding:8px 14px;border-radius:6px;margin-bottom:14px;font-size:13px;color:var(--gold-bright);">' +
      '👑 <b>Champion: ' + getClubName(cupWinner) + '</b> ' + getClubPriorFinishTag(cupWinner, selectedSeason) + ' · Runner-up: ' + getClubName(cupRunner) + '</div>' : '') +
    '<div class="bracket-scroll-container">' + colsHtml + '</div>' +
  '</div>';
}

    var pos = i + 1, zone = '';
    if (t === 0) {
      if (pos === 1) zone = 'zone-champ';
      else if (pos > n - T1_RELEGATION_COUNT) zone = 'zone-down';
    } else {
      if (pos <= T1_RELEGATION_COUNT) zone = 'zone-up';
      else if (pos > n - T2_RELEGATION_COUNT) zone = 'zone-down';
    }
    var gd = row[4] - row[5];

      '<td class="mono">' + pos + '</td>' +
      '<td>' + clubLinkAt(row[0], cur.season + 1) + ' ' + getClubPriorFinishTag(row[0], cur.season) + (t === 0 && pos === 1 ? ' <span style="color:var(--gold-bright);font-weight:bold;">🏆 Champion</span>' : '') + '</td>' +
      '<td class="mono">' + playedCount + '</td>' +
      '<td class="mono">' + row[1] + '</td><td class="mono">' + row[2] + '</td><td class="mono">' + row[3] + '</td>' +
      '<td class="mono">' + row[4] + '</td><td class="mono">' + row[5] + '</td>' +
      '<td class="mono">' + (gd > 0 ? '+' : '') + gd + '</td>' +
      '<td class="mono" style="color:var(--gold-bright);font-weight:700;">' + row[6] + '</td></tr>';
  }).join('');

  var legendTxt = t === 0 ?
    '<span><i style="background:var(--gold-bright)"></i>Premier Champion (#1)</span><span><i style="background:var(--danger)"></i>Relegated to Championship (Bottom 6)</span>' :
    '<span><i style="background:var(--ok)"></i>Promoted to Premier League (Top 6)</span><span><i style="background:var(--danger)"></i>Relegated to Dormant Pool (Bottom 10)</span>';

  var scorerRows = (L.scorers || []).map(function(x, i) {
    return '<tr><td class="mono">' + (i + 1) + '</td><td>' + playerLink(x[0], x[1]) + '</td><td>' + getClubName(x[2]) + '</td><td class="mono"><b style="color:var(--gold-bright);">' + x[3] + '</b></td><td class="mono">' + x[4] + '</td></tr>';
  }).join('');
  var assistRows = (L.assisters || []).map(function(x, i) {
    return '<tr><td class="mono">' + (i + 1) + '</td><td>' + playerLink(x[0], x[1]) + '</td><td>' + getClubName(x[2]) + '</td><td class="mono"><b style="color:var(--ac);">' + x[3] + '</b></td><td class="mono">' + x[4] + '</td></tr>';
  }).join('');

  html += '<div class="editorial-card">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">' +
      '<div><span class="kicker">Official Standings · 62 Matchdays</span><h2 style="color:#fff;">' + TIER_NAMES[t] + ' — Season ' + cur.season + '</h2></div>' +
      '<div style="font-size:12px;color:var(--muted);font-family:Inter;">32 Clubs · Leader: <b style="color:var(--gold-bright);">' + getClubName(L.table[0][0]) + '</b></div>' +
    '</div>' +
    '<div class="table-wrap" style="max-height:480px;overflow-y:auto;"><table>' +
      '<tr><th>#</th><th>Club</th><th>Pld</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr>' + rows +
    '</table></div>' +

    var jMatches = L.jornadas[selectedJornada - 1] || [];

    for (var j = 1; j <= totalJ; j++) {

          '<button type="button" class="score-badge-btn" onclick="openMatchDetailsModal(' + t + ',' + (selectedJornada - 1) + ',' + idx + ',' + cur.season + ')">' + m[2] + ' - ' + m[3] + '</button>' +
        '</td>' +
        '<td>' + clubLinkAt(m[1], cur.season + 1) + '</td>' +

    html += '<div class="editorial-card">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;">' +

        '<div style="display:flex;gap:6px;align-items:center;font-size:12px;">' +
          '<button type="button" class="btn-ui" onclick="selectedJornada--;render();" ' + (selectedJornada === 1 ? 'disabled' : '') + '>◀ Prev</button>' +
          '<select onchange="selectedJornada=+this.value;render();" style="background:#1e293b;color:var(--gold-bright);border:1px solid #334155;border-radius:6px;padding:4px 8px;font-family:\'JetBrains Mono\';">' + jOpts + '</select>' +
          '<button type="button" class="btn-ui" onclick="selectedJornada++;render();" ' + (selectedJornada === totalJ ? 'disabled' : '') + '>Next ▶</button>' +
        '</div>' +
      '</div>' +
      '<div class="table-wrap"><table>' +
        '<tr><th style="width:40px;">No</th><th style="text-align:right;">Home Club</th><th style="text-align:center;width:110px;">Score Dossier</th><th>Away Club</th></tr>' +
        (fixRows || '<tr><td colspan=4 style="text-align:center;padding:14px;color:var(--muted);">No fixtures recorded.</td></tr>') +
      '</table></div></div>';
  }

  if (cur.moves) {
    var list = function(ids) { return ids.map(function(c){ return clubLinkAt(c, cur.season + 1); }).join(', '); };
    html += '<div class="editorial-card"><span class="kicker">Official Promotion &amp; Relegation Report</span><h3 style="color:#fff;margin-bottom:8px;">🔄 Tier Movements Season ' + cur.season + ' → ' + (
cur.season + 1) + '</h3>' +
      '<div style="font-family:Inter;font-size:12.5px;line-height:1.9;">' +
        '<div><span style="color:var(--ok);font-weight:700;">▲ Championship → Premier League (6 Clubs):</span> ' + list(cur.moves.up2to1) + '</div>' +
        '<div><span style="color:var(--danger);font-weight:700;">▼ Premier League → Championship (6 Clubs):</span> ' + list(cur.moves.down1to2) + '</div>' +
        '<div><span style="color:var(--ok);font-weight:700;">▲ Dormant Pool → Championship (10 Clubs):</span> ' + list(cur.moves.upDormantTo2) + '</div>' +
        '<div><span style="color:var(--danger);font-weight:700;">▼ Championship → Dormant Pool (10 Clubs):</span> ' + list(cur.moves.down2ToDormant) + '</div>' +
      '</div></div>';
  }
  return html;
}

function renderHallOfFame() {
  var reg = [];
  Object.keys(PLAYERS_DB).forEach(function(cId) {
    PLAYERS_DB[cId].forEach(function(p) {
      reg.push({ id: p.id, name: p.name, status: 'active', age: p.age, ovr: p.ovr, club: +cId, c: p.career, score: legendScore(p.career) });
    });
  });
  (S.legends || []).forEach(function(l) {
    reg.push({ id: l.id, name: l.name, status: 'legend', age: l.age, ovr: l.ovr, club: l.club, c: l.career, score: legendScore(l.career) });
  });

  var topGoals = reg.filter(function(x){ return x.c.goals > 0; }).sort(function(a, b){ return b.c.goals - a.c.goals; }).slice(0, 10);
  var topT1 = reg.filter(function(x){ return x.c.t1Goals > 0; }).sort(function(a, b){ return b.c.t1Goals - a.c.t1Goals; }).slice(0, 10);
  var topMvp = reg.filter(function(x){ return x.c.mvp > 0; }).sort(function(a, b){ return b.c.mvp - a.c.mvp; }).slice(0, 10);
  var legends = reg.filter(function(x){ return x.status === 'legend'; }).sort(function(a, b){ return b.score - a.score; });

function pickTrait(r, age) {

             ['metro', 0.08], ['clutch', 0.06], ['leader', 0.05], ['hot', 0.06], ['late', 0.05]];
  var acc = 0;
  for (var i = 0; i < tbl.length; i++) {

function ensurePlayerFields(p) {
  if (p._v === ENGINE_VERSION) return p;
  var r = pseudoRandom((p.id || 1) * 131 + 7);
  defField(p, 'stam', clamp(Math.round(72 + gauss(r) * 7 + (p.pos === 'GK' ? 4 : (p.pos === 'MF' ? 3 : 0))), 52, 96));
  defField(p, 'tr', pickTrait(r, p.age));

  if (p.tr === 'streaky') cb = 0.38; else if (p.tr === 'metro') cb = 0.95;
  if (p.age <= 21) cb -= 0.08;
  defField(p, 'cons', Math.round(cb * 100) / 100);
  defField(p, 'fit', 100); defField(p, 'sharp', 78); defField(p, 'form', 0); defField(p, 'mor', 62);
  defField(p, 'inj', 0); defField(p, 'injT', ''); defField(p, 'susp', 0); defField(p, 'yc', 0); defField(p, 'fin', 1);
  defField(p, 'srt', 0); defField(p, 'srn', 0); defField(p, 'scs', 0); defField(p, 'sy', 0); defField(p, 'sr', 0);
  defField(p, 'sinj', 0); defField(p, 'sinjW', 0); defField(p, 'rb', 6.4);
  if (!p.career) p.career = newCareer();
  ['capps', 'cmin', 'yel', 'red', 'inj', 'potm', 'rtS', 'rtN', 'cs'].forEach(function(k) { defField(p.career, k, 0); });

function kickoffReset(p, se) {

  p.fit = 100;

// ---------- Experience (caps), efektif rating, fatigue ----------
function totalCaps(p) { var c = p.career || {}; return (c.apps || 0) + (c.capps || 0) + (p.sapp || 0); }
function expBonus(p) { return clamp(Math.log10(1 + totalCaps(p)) * 0.95, 0, 2.5); }
function isLoaned(p) { return p.loan !== undefined && p.loan !== null; }
function isAvailable(p) { return !(p.inj > 0) && !(p.susp > 0); }

function formVol(p) {
  var t = traitOf(p);
  return Math.max(0.12, (1.3 - (p.cons || 0.7)) * (t && t.vol ? t.vol : 1) * getSettings().form);
}

function effRating(p, ctx) {
  var SG = getSettings();
  var t = traitOf(p);
  var fitPen = p.fit < 90 ? (90 - p.fit) * 0.22 : 0;
  var sharpPen = p.sharp < 65 ? (65 - p.sharp) * 0.12 : 0;
  var v = p.ovr + p.form * 0.55 * Math.min(1.5, SG.form) + expBonus(p) - fitPen - sharpPen + ((p.mor || 60) - 60) * 0.02;
  if (ctx && ctx.big && t && t.clutch) v += t.clutch;
  return v;
}

function drain90(p, wxMul) {
  var t = traitOf(p);
  var posMul = p.pos === 'GK' ? 0.35 : (p.pos === 'MF' ? 1.03 : 1.0);
  var ageMul = 1 + Math.max(0, p.age - 29) * 0.045 + (p.age <= 19 ? 0.05 : 0);
  var base = (16.0 - (p.stam - 70) * 0.10) * posMul * ageMul * getSettings().fatigue * (wxMul || 1);
  if (t && t.drain) base *= t.drain;
  return base;
}
function recoveryOf(p) { return 9.5 + (p.stam - 70) * 0.05; }
function lateFade(p) { return Math.max(0, 92 - p.fit) * 0.0045 + Math.max(0, 90 - p.stam) * 0.0014; }

// ---------- Cedera (MODUL 1) ----------
var INJURY_TYPES = [
  ['Knock', 1, 3, 38], ['Muscle strain', 3, 7, 26], ['Ankle sprain', 5, 10, 12], ['Hamstring tear', 7, 14, 11],
  ['Knee ligament', 20, 34, 5], ['Broken bone', 24, 40, 2.5], ['ACL rupture', 38, 58, 1.5]
];
function rollInjuryType(r) {
  var tot = 0, i;
  for (i = 0; i < INJURY_TYPES.length; i++) tot += INJURY_TYPES[i][3];
  var x = r() * tot;
  for (i = 0; i < INJURY_TYPES.length; i++) {
    x -= INJURY_TYPES[i][3];
    if (x <= 0) return { type: INJURY_TYPES[i][0], games: INJURY_TYPES[i][1] + Math.floor(r() * (INJURY_TYPES[i][2] - INJURY_TYPES[i][1] + 1)) };
  }
  return { type: 'Knock', games: 1 };
}
function injuryHazard(p, wx) {
  var t = traitOf(p);
  var ageMul = 1 + Math.max(0, p.age - 27) * 0.05 + (p.age <= 20 ? 0.08 : 0);
  var fitMul = p.fit >= 80 ? 1 : 1 + (80 - p.fit) * 0.035;
  var sharpMul = p.sharp < 55 ? 1.25 : 1;
  return 0.0052 * getSettings().injury * ageMul * fitMul * sharpMul * (wx ? wx.inj : 1) * (t && t.inj ? t.inj : 1);
}

// ---------- Disiplin (MODUL 2) ----------
function yellowRate(p) {
  var base = p.pos === 'DF' ? 0.14 : (p.pos === 'MF' ? 0.13 : (p.pos === 'FW' ? 0.08 : 0.025));
  var t = traitOf(p);
  return base * (t && t.card ? t.card : 1) * (1 + Math.max(0, 80 - p.fit) * 0.01);
}
function redHazard(p) {
  var base = 0.0026 * (p.pos === 'DF' ? 1.3 : (p.pos === 'MF' ? 1.0 : (p.pos === 'FW' ? 0.8 : 0.6)));
  var t = traitOf(p);
  return base * (t && t.card ? t.card * 1.15 : 1);
}

function rollIncidents(xi, r, wx) {
  var SG = getSettings();
  var inj = [], red = null;
  for (var i = 0; i < xi.length; i++) {
    var p = xi[i];
    if (inj.length < 2 && r() < injuryHazard(p, wx)) {
      var it = rollInjuryType(r);
      inj.push({ p: p, min: 1 + Math.floor(r() * 89), type: it.type, games: it.games });
    }
    if (SG.discipline && !red && r() < redHazard(p)) red = { p: p, min: 6 + Math.floor(r() * 84) };
  }
  if (red) inj = inj.filter(function(x) { return x.p !== red.p; });
  return { inj: inj, red: red };
}

// ---------- Cuaca, stadion, wasit-lingkungan (MODUL 7) ----------
var WX = [
  { id: 0, n: 'Clear',  i: '☀️', goal: 1.00, fat: 1.00, inj: 1.00 },
  { id: 1, n: 'Cloudy', i: '☁️', goal: 1.00, fat: 1.00, inj: 1.00 },

  { id: 5, n: 'Heat',   i: '🔥', goal: 1.00, fat: 1.25, inj: 1.10 }
];
function rollWeather(jIdx, total, r) {
  if (!getSettings().weather) return WX[1];
  var f = jIdx / Math.max(1, total - 1);
  var cold = 1 - Math.abs(f - 0.5) * 2;
  var w = [0.36 - 0.10 * cold, 0.26, 0.16 + 0.08 * cold, 0.06 + 0.03 * cold, 0.02 + 0.08 * cold * cold, 0.12 * (1 - cold) * (1 - cold)];
  var tot = 0, i;
  for (i = 0; i < w.length; i++) tot += w[i];
  var x = r() * tot;
  for (i = 0; i < w.length; i++) { x -= w[i]; if (x <= 0) return WX[i]; }
  return WX[1];
}

function styleDef(m) { return m.st === 'ATT' ? 1.05 : (m.st === 'DEF' ? 0.93 : (m.st === 'POS' ? 0.97 : 1)); }

function playerValue(p) {
