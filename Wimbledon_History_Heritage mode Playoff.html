function findPlayerRecord(id) {
  var clubs = Object.keys(PLAYERS_DB);
  for (var i = 0; i < clubs.length; i++) {
    var sq = PLAYERS_DB[clubs[i]];
    for (var j = 0; j < sq.length; j++) {
      if (sq[j].id === id) return { status: 'active', rec: sq[j], club: +clubs[i] };
    }
  }
  var lg = (S.legends || []);
  for (var k = 0; k < lg.length; k++) if (lg[k].id === id) return { status: 'legend', rec: lg[k], club: lg[k].club };
  return null;
}

function formatEventsSummaryHtml(events) {
  if (!events || !events.length) return '';
  var parts = events.map(function(ev){
    var scName = nameFromId(ev[0]);
    var asTxt = ev[1] ? ' <span style="color:var(--muted);font-size:10px;">(ast ' + nameFromId(ev[1]) + ')</span>' : '';
    return '<span style="color:var(--gold-bright);font-weight:700;">' + ev[2] + '\'</span> ' + playerLink(ev[0], scName) + asTxt;
  });
  return '<div class="scorer-tag">⚽ ' + parts.join(' · ') + '</div>';
}

function openPlayerSeasonLog(pId, se) {
  var sn = H.seasons[se];
  if (!sn || !sn.league) {
    alert("Simulate the season first to view logs.");
    return;
  }

  var pRec = findPlayerRecord(pId);
  var pName = pRec && pRec.rec ? pRec.rec.name : nameFromId(pId);
  var playerClub = -1, targetTier = -1;

  for (var t = 0; t < sn.tiers.length; t++) {
    var clubs = sn.tiers[t];
    for (var c = 0; c < clubs.length; c++) {
      var cid = clubs[c];
      var sq = PLAYERS_DB[cid] || [];
      if (sq.some(function(p){ return p.id === pId; })) {
        playerClub = cid; targetTier = t; break;
      }
    }
    if (playerClub !== -1) break;
  }

  if (playerClub === -1) {
    alert("Player not registered in active squad for Season " + se);
    return;
  }

  var L = sn.league[targetTier];
  var jornadas = L.jornadas || [];
  var totalJornadas = (sn.tiers[targetTier].length - 1) * 2;
  var playedCount = sn.leagueDone ? totalJornadas : (sn.currentJornada || 0);
  var logRows = [];

  var totalMins = 0, totalStarts = 0, totalSubsIn = 0, totalUnused = 0, totalGoals = 0, totalAssists = 0;

  for (var jIdx = 0; jIdx < playedCount; jIdx++) {
    var jornadaNum = jIdx + 1;
    var jMatches = jornadas[jIdx] || [];
    var m = jMatches.find(function(match){ return match[0] === playerClub || match[1] === playerClub; });
    if (!m) continue;

    var isHome = m[0] === playerClub;
    var oppId = isHome ? m[1] : m[0];
    var oppName = getClubName(oppId);
    var scoreTxt = isHome ? (m[2] + ' - ' + m[3]) : (m[3] + ' - ' + m[2]);
    var myGoals = isHome ? m[2] : m[3];
    var oppGoals = isHome ? m[3] : m[2];
    var resBadge = (myGoals > oppGoals) ? '<span style="color:#10b981;font-weight:bold;">W</span>' : 
                   ((myGoals < oppGoals) ? '<span style="color:#f43f5e;font-weight:bold;">L</span>' : '<span style="color:#94a3b8;font-weight:bold;">D</span>');

    var xiList = isHome ? (m[6] || []) : (m[7] || []);
    var benchList = isHome ? (m[8] || []) : (m[9] || []);
    var subs = isHome ? (m[10] || []) : (m[11] || []);
    var events = isHome ? (m[4] || []) : (m[5] || []);

    var subIn = subs.find(function(sb){ return sb[1] === pId; });
    var subOut = subs.find(function(sb){ return sb[0] === pId; });

    var statusTxt = '', matchMin = 0;

    if (xiList.indexOf(pId) !== -1) {
      totalStarts++;
      if (subOut) {
        matchMin = subOut[2];
        statusTxt = '<b style="color:var(--gold-bright);">Starter (XI)</b> <span style="color:var(--danger);font-size:11px;">[Out ' + subOut[2] + '\']</span>';
      } else {
        matchMin = 90;
        statusTxt = '<b style="color:var(--gold-bright);">Starter (90\')</b>';
      }
    } else if (subIn) {
      totalSubsIn++; matchMin = 90 - subIn[2];
      statusTxt = '<b style="color:var(--ok);">Sub In (' + subIn[2] + '\')</b>';
    } else if (benchList.indexOf(pId) !== -1) {
      totalUnused++; statusTxt = '<span style="color:var(--muted);">Bench (Unused)</span>';
    } else {
      statusTxt = '<span style="color:#64748b;">Not in Squad</span>';
    }

    totalMins += matchMin;
    var goalsInMatch = events.filter(function(ev){ return ev[0] === pId; }).length;
    var assistsInMatch = events.filter(function(ev){ return ev[1] === pId; }).length;
    totalGoals += goalsInMatch;
    totalAssists += assistsInMatch;

    var kontribusi = [];
    if (goalsInMatch > 0) kontribusi.push('⚽ ' + goalsInMatch + ' G');
    if (assistsInMatch > 0) kontribusi.push('🎯 ' + assistsInMatch + ' A');

    logRows.push('<tr>' +
      '<td class="mono">M.' + jornadaNum + '</td>' +
      '<td>' + (isHome ? 'vs ' : '@ ') + oppName + '</td>' +
      '<td class="mono">' + scoreTxt + ' (' + resBadge + ')</td>' +
      '<td>' + statusTxt + '</td>' +
      '<td class="mono" style="color:var(--gold-bright);">' + matchMin + '\'</td>' +
      '<td style="color:var(--gold-bright);font-weight:600;">' + (kontribusi.join(' · ') || '—') + '</td>' +
    '</tr>');
  }

  var totalApps = totalStarts + totalSubsIn;
  var summaryBanner = 
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:14px;">' +
      '<div style="background:#111827;border:1px solid #1e293b;padding:8px;border-radius:6px;text-align:center;">' +
        '<span style="font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;">Total Minutes</span>' +
        '<b style="display:block;font-size:16px;color:var(--gold-bright);font-family:\'JetBrains Mono\';">' + totalMins + '\'</b>' +
      '</div>' +
      '<div style="background:#111827;border:1px solid #1e293b;padding:8px;border-radius:6px;text-align:center;">' +
        '<span style="font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;">Appearances</span>' +
        '<b style="display:block;font-size:16px;color:var(--ac);font-family:\'JetBrains Mono\';">' + totalApps + ' Matches</b>' +
      '</div>' +
      '<div style="background:#111827;border:1px solid #1e293b;padding:8px;border-radius:6px;text-align:center;">' +
        '<span style="font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;">Starts / Subs</span>' +
        '<b style="display:block;font-size:15px;color:#cbd5e1;font-family:\'JetBrains Mono\';">' + totalStarts + ' / ' + totalSubsIn + '</b>' +
      '</div>' +
      '<div style="background:#111827;border:1px solid #1e293b;padding:8px;border-radius:6px;text-align:center;">' +
        '<span style="font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;">Unused Bench</span>' +
        '<b style="display:block;font-size:15px;color:var(--muted);font-family:\'JetBrains Mono\';">' + totalUnused + 'x</b>' +
      '</div>' +
      '<div style="background:#111827;border:1px solid #1e293b;padding:8px;border-radius:6px;text-align:center;">' +
        '<span style="font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;">Goals / Assists</span>' +
        '<b style="display:block;font-size:15px;color:var(--gold-bright);font-family:\'JetBrains Mono\';">⚽ ' + totalGoals + ' · 🎯 ' + totalAssists + '</b>' +
      '</div>' +
    '</div>';

  $('#am-kicker').textContent = 'Personal Player Tracker · Season ' + se;
  $('#am-title').textContent = pName + ' (' + getClubName(playerClub) + ')';
  $('#am-body').innerHTML =
    summaryBanner +
    '<div class="table-wrap" style="max-height:55vh;overflow-y:auto;"><table>' +
      '<tr><th>Matchday</th><th>Opponent</th><th>Score</th><th>Status</th><th>Minutes</th><th>Contributions</th></tr>' +
      (logRows.join('') || '<tr><td colspan=6 style="text-align:center;padding:12px;">No matchdays simulated yet.</td></tr>') +
    '</table></div>' +
    '<div style="text-align:right;margin-top:14px;"><button type="button" class="btn-ui" onclick="openPlayerModal(' + pId + ')">Back to Profile</button></div>';

  $('#archive-modal').classList.add('active');
}

function openClub5SeasonFormModal(clubId, targetSe) {
  var cName = getClubName(clubId);
  var startSe = Math.max(1, targetSe - 5);
  var endSe = Math.max(1, targetSe - 1);
  var hasHistory = targetSe > 1;
  var rows = [];
  var trophies = 0, super8Apps = 0, podiums = 0, played = 0;

  if (hasHistory) {
    for (var s = endSe; s >= startSe; s--) {
      var sn = H.seasons[s];
      if (!sn || !sn.leagueDone) continue;
      played++;
      var fin = getClubLeagueFinish(sn, clubId);
      var lgText = fin ? (TIER_SHORT[fin.tier] + ' · #' + fin.pos + ' (' + fin.pts + ' pts)') : '—';
      var rk = sn.rank1to4 || [null, null, null, null];
      var plText = '—';
      if (fin && fin.tier === 0) {
        plText = "Outside Top 8";
        if (rk[0] === clubId) { plText = "🥇 Champion"; trophies++; podiums++; super8Apps++; }
        else if (rk[1] === clubId) { plText = "🥈 Runner-up"; podiums++; super8Apps++; }
        else if (rk[2] === clubId) { plText = "🥉 3rd Place"; podiums++; super8Apps++; }
        else if (rk[3] === clubId) { plText = "4th Place"; podiums++; super8Apps++; }
        else if (sn.super8 && sn.super8.qf.some(function(m){ return m.h === clubId || m.a === clubId; })) { plText = "Quarter-Finals"; super8Apps++; }
      }
      var cupText = function(winner, runner, brk) {
        if (winner === clubId) { trophies++; return "🏆 Winner"; }
        if (runner === clubId) return "🥈 Finalist";
        if (brk && brk.sf.some(function(m){ return m.h === clubId || m.a === clubId; })) return "Semi-Finals";
        if (brk && brk.qf.some(function(m){ return m.h === clubId || m.a === clubId; })) return "Quarter-Finals";
        return "—";
      };
      var faText = cupText(sn.faWinner, sn.faRunner, sn.faBracket);
      var lcText = cupText(sn.lcWinner, sn.lcRunner, sn.lcBracket);
      var rcText = "—";
      if (sn.rcWinner === clubId) { rcText = "👑 Maestro"; trophies++; }
      else if (sn.rcBracket && sn.rcBracket.qf.some(function(m){ return m.h === clubId || m.a === clubId; })) rcText = "Gala Entrant";
      
      if (sn.leagueShieldWinner === clubId) { trophies++; lgText += ' <span style="color:#38bdf8;">🛡️ Shield</span>'; }
      rows.push({ season: s, lg: lgText, pl: plText, fa: faText, lc: lcText, rc: rcText });
    }
  }

  var tier = tierOfClub(targetSe, clubId);
  $('#am-kicker').textContent = 'Club Momentum & Dynamic Progress';
  $('#am-title').textContent = cName + ' (Leading to Season ' + targetSe + ')';

  var tableHtml = rows.length > 0 ?
    '<div class="table-wrap" style="margin-top:10px;"><table>' +
      '<tr><th>Season</th><th>League</th><th>Playoff</th><th>FA Cup</th><th>League Cup</th><th>Champions Cup</th></tr>' +
      rows.map(function(r) {
        return '<tr><td class="mono"><b>S.' + r.season + '</b></td><td>' + r.lg + '</td><td>' + r.pl + '</td><td>' + r.fa + '</td><td>' + r.lc + '</td><td style="color:#c084fc;">' + r.rc + '</td></tr>';
      }).join('') +
    '</table></div>' : '<p style="color:var(--muted);font-style:italic;">No past records available.</p>';

  $('#am-body').innerHTML =
    '<div class="p-grid">' +
      '<div class="p-stat-box"><span>Trophies Won</span><b>' + trophies + '</b></div>' +
      '<div class="p-stat-box"><span>Top 8 Playoff</span><b>' + super8Apps + ' / ' + played + 'x</b></div>' +
      '<div class="p-stat-box"><span>Top 4 Finishes</span><b>' + podiums + 'x</b></div>' +
      '<div class="p-stat-box"><span>Tier</span><b>' + TIER_SHORT[tier] + '</b></div>' +
    '</div>' +
    '<h4 style="color:var(--gold-bright);margin-top:14px;border-bottom:1px solid #1e293b;padding-bottom:4px;">📜 Last 5 Seasons Track Record</h4>' + tableHtml;
  $('#archive-modal').classList.add('active');

      '<div class="p-stat-box"><span>Assists</span><b>' + c.assists + '</b></div>' +
      '<div class="p-stat-box"><span>Seasons Played</span><b>' + c.seasons + '</b></div>' +
    '</div>' +
    '<h4 style="color:var(--gold-bright);border-bottom:1px solid #1e293b;padding-bottom:4px;margin-bottom:8px;">📈 Career History</h4>' +
    (histRows ? '<div class="table-wrap"><table><tr><th>Season</th><th>Club</th><th>Tier</th><th>Goals</th><th>Assists</th><th>Mins</th><th>OVR</th><th>Age</th></tr>' + histRows + '</table></div>' : '<p style="color:var(--muted);">No career records.</p>');

function closeArchiveModal() { $('#archive-modal').classList.remove('active'); }
window.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeArchiveModal(); });

// 9. BRACKET UI BUILDER
// ==============================================================
function renderBracketClubName(clubId, compType, se) {
  if (clubId === null || clubId === undefined) return 'TBD';
  return '<a class="club-bracket-link" title="Click for form report" onclick="openClub5SeasonFormModal(' + clubId + ',' + se + ')">' +
    getClubName(clubId) + '</a> <span class="pos-tag">' + getTournamentClubRank(clubId, compType, se) + '</span>';
}

function scoreCell(res, side) {
  if (!res) return '';
  return side === 'h' ? (res.gh + (res.penH !== null ? ' (' + res.penH + 'p)' : '')) : (res.ga + (res.penA !== null ? ' (' + res.penA + 'p)' : ''));
}

function matchBoxHtml(m, compType, se, simStage, idx, big) {
  var played = !!m.res;
  var ready = m.h !== null && m.a !== null;
  var line = function(side) {
    var id = side === 'h' ? m.h : m.a;
    return '<div class="match-line ' + (played && m.res.winner === id ? 'match-winner' : '') + '"' + (big ? ' style="font-size:14px;' + (side === 'a' ? 'margin-top:6px;' : '') + '"' : '') + '>' +
      '<span>' + (ready ? renderBracketClubName(id, compType, se) : 'TBD') + '</span><span class="match-score">' + scoreCell(m.res, side) + '</span></div>';
  };
  var goalsH = (played && m.res.hEvents && m.res.hEvents.length) ? m.res.hEvents.map(function(e){ return nameFromId(e[0]) + " (" + e[2] + "')"; }).join(", ") : "";
  var goalsA = (played && m.res.aEvents && m.res.aEvents.length) ? m.res.aEvents.map(function(e){ return nameFromId(e[0]) + " (" + e[2] + "')"; }).join(", ") : "";

  return '<div class="match-box"' + (big ? ' style="padding:14px;"' : '') + '>' + 
    line('h') + (goalsH ? '<div class="goal-subtext">⚽ ' + goalsH + '</div>' : '') +
    line('a') + (goalsA ? '<div class="goal-subtext">⚽ ' + goalsA + '</div>' : '') +
    (ready && !played ? '<div style="text-align:right;margin-top:6px;"><button type="button" class="' + (big ? 'btn-gold' : 'btn-ui') + ' btn-sm" onclick="simMatch(\'' + compType + '\',\'' + simStage + '\',' + idx + ',' + se + ')">⚡ Sim Match</button></div>' : '') +
    (big && played ? '<div style="margin-top:8px;font-size:12px;color:var(--gold-bright);">👑 Champion: <b>' + getClubName(m.res.winner) + ' <span class="pos-tag">(#1)</span></b></div>' : '') +
  '</div>';
}

function getAppBracketStats(b) {
  var scorers = {}, assisters = {};
  if (!b) return { scorers: [], assisters: [] };
  var matches = (b.qf||[]).concat(b.sf||[], b.final ? [b.final] : [], b.thirdPlace ? [b.thirdPlace] : []);
  matches.forEach(function(m){
    if (!m || !m.res) return;
    var allEv = (m.res.hEvents||[]).concat(m.res.aEvents||[]);
    allEv.forEach(function(ev){
      var scId = ev[0], asId = ev[1];
      if (scId) scorers[scId] = (scorers[scId] || 0) + 1;
      if (asId) assisters[asId] = (assisters[asId] || 0) + 1;
    });
  });
  var sortList = function(map){
    return Object.keys(map).map(function(id){ return { id: +id, count: map[id] }; }).sort(function(a, b){ return b.count - a.count; });
  };
  return { scorers: sortList(scorers), assisters: sortList(assisters) };
}

function renderBracketUI(b, compType, se, title, desc) {
  var qfDone = b.qf.every(function(m){ return m.res !== null; });
  var sfReady = b.sf[0].h !== null;
  var sfDone = b.sf.every(function(m){ return m.res !== null; });
  var st = getAppBracketStats(b);

  var makeStatTable = function(list, label){
    if (!list.length) return "<p style='color:var(--muted);font-size:12px;padding:6px 0;'>No tournament records.</p>";
    return "<table><tr><th>#</th><th>Player</th><th>" + label + "</th></tr>" +
      list.slice(0, 5).map(function(x, i){
        return "<tr><td class='mono'>" + (i+1) + "</td><td><b>" + playerLink(x.id, nameFromId(x.id)) + "</b></td><td class='mono' style='color:var(--gold-bright);font-weight:700;'>" + x.count + "</td></tr>";
      }).join("") + "</table>";
  };

  var statsHeaderHtml = "<div style='display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:14px;'>" +
    "<div style='background:#111827;border:1px solid #1e293b;border-radius:8px;padding:12px;'><h4 style='color:var(--gold-bright);margin:0 0 8px 0;'>⚽ Tournament Golden Boot</h4>" + makeStatTable(st.scorers, "Goals") + "</div>" +
    "<div style='background:#111827;border:1px solid #1e293b;border-radius:8px;padding:12px;'><h4 style='color:var(--ac);margin:0 0 8px 0;'>🎯 Assists Leader</h4>" + makeStatTable(st.assisters, "Assists") + "</div>" +
  "</div>";

  return '<div class="editorial-card">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;">' +
      '<div><span class="kicker">Official Knockout Bracket</span><h2 style="color:#fff;">' + title + ' — Season ' + se + '</h2></div>' +
      '<div style="font-size:12px;color:var(--muted);">' + desc + '</div>' +
    '</div>' +
    statsHeaderHtml +
    '<div class="bracket-grid">' +
      '<div class="bracket-card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><h4 style="color:var(--gold-bright);">Quarter-Finals (QF)</h4>' +
        (!qfDone ? '<button type="button" class="btn-ui btn-sm" onclick="simRound(\'' + compType + '\',\'qf\',' + se + ')">Sim All QF</button>' : '') + '</div>' +
        b.qf.map(function(m, idx){ return matchBoxHtml(m, compType, se, 'qf', idx, false); }).join('') + '</div>' +
      '<div class="bracket-card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><h4 style="color:var(--gold-bright);">Semi-Finals (SF)</h4>' +
        (sfReady && !sfDone ? '<button type="button" class="btn-ui btn-sm" onclick="simRound(\'' + compType + '\',\'sf\',' + se + ')">Sim All SF</button>' : '') + '</div>' +
        b.sf.map(function(m, idx){ return matchBoxHtml(m, compType, se, 'sf', idx, false); }).join('') + '</div>' +
      (compType === 'pl' ?
        '<div class="bracket-card" style="border-top-color:#fdba74;"><div style="margin-bottom:8px;"><h4 style="color:#fdba74;">🥉 Third Place Playoff</h4></div>' +
        matchBoxHtml(b.thirdPlace, 'pl', se, 'third', 0, false) + '</div>' : '') +
      '<div class="bracket-card" style="border-top-color:var(--gold-bright);"><div style="margin-bottom:8px;"><h4 style="color:var(--gold-bright);">🏆 Grand Final</h4></div>' +
        matchBoxHtml(b.final, compType, se, 'final', 0, true) + '</div>' +
    '</div></div>';
}

function renderRosterTab(cur) {
  var allClubs = cur.tiers[0].concat(cur.tiers[1]);
  if (allClubs.indexOf(selectedRosterClub) === -1) {
    selectedRosterClub = cur.tiers[0][0];
  }

  var clubOpts = '';
  for (var t = 0; t < cur.tiers.length; t++) {
    clubOpts += '<optgroup label="' + TIER_NAMES[t] + '">';

      clubOpts += '<option value="' + cId + '"' + (cId === selectedRosterClub ? ' selected' : '') + '>' + getClubName(cId) + '</option>';
    });
    clubOpts += '</optgroup>';
  }

  var sq = PLAYERS_DB[selectedRosterClub] || [];
  var rows = sq.map(function(p, i) {
    var c = p.career || {};
    return '<tr>' +
      '<td class="mono">' + (i + 1) + '</td>' +
      '<td>' + playerLink(p.id, p.name) + '</td>' +

      '<td class="mono"><b>' + p.ovr + '</b></td>' +
      '<td class="mono" style="color:var(--muted);">' + p.pot + '</td>' +
      '<td class="mono">' + p.age + '</td>' +
      '<td class="mono" style="color:var(--gold-bright);">' + (p.smin || 0) + '\'</td>' +
      '<td class="mono">' + (p.sapp || 0) + ' (' + (p.sstart || 0) + ' XI)</td>' +
      '<td class="mono"><b>' + (p.sg || 0) + '</b></td>' +
      '<td class="mono">' + (p.sa || 0) + '</td>' +
      '<td class="mono" style="color:var(--ac);">' + (c.minutes || 0) + '\'</td>' +
      '<td class="mono">' + (c.goals || 0) + '</td>' +
      '<td class="mono">' + (c.assists || 0) + '</td>' +
      '<td><button type="button" class="btn-ui btn-sm" onclick="openPlayerSeasonLog(' + p.id + ',' + cur.season + ')">Log</button></td>' +
    '</tr>';
  }).join('');

  var tierIdx = tierOfClub(cur.season, selectedRosterClub);

  return '<div class="editorial-card">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;">' +
      '<div><span class="kicker">Roster &amp; Statistics · Season ' + cur.season + '</span>' +
      '<h2 style="color:#fff;">' + getClubName(selectedRosterClub) + ' <span class="pos-tag">[' + TIER_SHORT[tierIdx] + ']</span></h2></div>' +
      '<div style="display:flex;align-items:center;gap:8px;"><span style="font-size:12px;color:var(--muted);">Select Club:</span>' +
      '<select onchange="selectedRosterClub=+this.value;render();" style="background:#1e293b;color:var(--gold-bright);border:1px solid #334155;border-radius:6px;padding:5px 10px;font-family:Inter;font-size:12.5px;">' +
      clubOpts + '</select></div>' +
    '</div>' +
    '<div class="table-wrap"><table>' +
      '<tr><th>#</th><th>Player Name</th><th>Pos</th><th>OVR</th><th>POT</th><th>Age</th><th>Mins S.' + cur.season + '</th><th>Caps (XI)</th><th>G</th><th>A</th><th>Career Mins</th><th>Career G</th><th>Career A</th><th>Action</th></tr>' +
      (rows || '<tr><td colspan=14 style="text-align:center;padding:16px;color:var(--muted);">No player records found.</td></tr>') +
    '</table></div></div>';

function renderTransfersTab(cur) {
  var logs = cur.transfers || [];
  var rows = logs.map(function(t, idx) {
    return '<tr>' +
      '<td class="mono">' + (idx + 1) + '</td>' +
      '<td><b>' + playerLink(t.pId, t.pName) + '</b> <span class="mono" style="color:var(--ac);font-size:11px;">[' + t.pos + ' · OVR ' + t.ovr + ']</span></td>' +
      '<td style="color:#f87171;">' + getClubName(t.from) + '</td>' +

  }).join('');

  return '<div class="editorial-card">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;">' +
      '<div><span class="kicker">Official Transfer Market Gazette</span><h2 style="color:#fff;">Transfer Window Season ' + cur.season + '</h2></div>' +
      '<div style="font-size:12px;color:var(--gold-bright);font-weight:700;">Completed Transfers: ' + logs.length + ' Players</div>' +

function buildPlayerRegistry() {
  var list = [];
  Object.keys(PLAYERS_DB).forEach(function(cId) {
    PLAYERS_DB[cId].forEach(function(p) {
      list.push({ id: p.id, name: p.name, status: 'active', age: p.age, ovr: p.ovr, club: +cId, c: p.career, debut: p.debut, retired: null, score: legendScore(p.career) });
    });
  });
  (S.legends || []).forEach(function(l) {
    list.push({ id: l.id, name: l.name, status: 'legend', age: l.age, ovr: l.ovr, club: l.club, c: l.career, debut: l.debut, retired: l.retired, score: legendScore(l.career) });
  });
  return list;
}

function statusTag(x) {
  return x.status === 'legend' ?
    '<span class="legend-tag">LEGEND S.' + x.debut + '–' + x.retired + '</span>' :
    '<span class="active-tag">ACTIVE · ' + x.age + ' yo</span>';
}

function hofList(kicker, title, items, valFn, color) {
  return '<div class="editorial-card"><span class="kicker">' + kicker + '</span><h3 style="color:#fff;margin-bottom:8px;">' + title + '</h3>' +
    (items.length ? items.map(function(x, i) {
      return '<div style="display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #1a2438;font-family:Inter;font-size:12.5px;">' +
        '<div><span class="mono">#' + (i + 1) + '</span> <b>' + playerLink(x.id, x.name) + '</b> ' + statusTag(x) + '<span class="dim-text">' + getClubName(x.club) + '</span></div>' +
        '<div class="mono" style="color:' + color + ';font-weight:700;white-space:nowrap;">' + valFn(x) + '</div></div>';
    }).join('') : '<div style="color:var(--muted);padding:10px;">No records yet.</div>') + '</div>';
}

function renderHallOfFame() {
  var reg = buildPlayerRegistry();
  var finished = Object.keys(H.seasons).filter(function(k){ return H.seasons[k].finalized; }).length;
  var topGoals = reg.filter(function(x){ return x.c.goals > 0; }).sort(function(a, b){ return (b.c.goals - a.c.goals) || (b.c.t1Goals - a.c.t1Goals); }).slice(0, 10);
  var topBoots = reg.filter(function(x){ return x.c.t1Boots > 0; }).sort(function(a, b){ return (b.c.t1Boots - a.c.t1Boots) || (b.c.t1Goals - a.c.t1Goals); }).slice(0, 10);
  var topMvp = reg.filter(function(x){ return x.c.mvp > 0; }).sort(function(a, b){ return (b.c.mvp - a.c.mvp) || (b.c.t1Goals - a.c.t1Goals); }).slice(0, 10);
  var topAssists = reg.filter(function(x){ return x.c.assists > 0; }).sort(function(a, b){ return b.c.assists - a.c.assists; }).slice(0, 10);
  var topT1 = reg.filter(function(x){ return x.c.t1Goals > 0; }).sort(function(a, b){ return b.c.t1Goals - a.c.t1Goals; }).slice(0, 10);
  var stars = reg.filter(function(x){ return x.status === 'active'; }).sort(function(a, b){ return (b.ovr - a.ovr) || (b.c.goals - a.c.goals); }).slice(0, 10);
  var legends = reg.filter(function(x){ return x.status === 'legend'; }).sort(function(a, b){ return b.score - a.score; });

  var legendRows = legends.slice(0, 40).map(function(x, i) {
    return '<tr><td class="mono">' + (i + 1) + '</td><td>' + playerLink(x.id, x.name) + '</td><td>' + getClubName(x.club) + '</td>' +
      '<td class="mono">S.' + x.debut + '–S.' + x.retired + '</td>' +
      '<td class="mono"><b style="color:var(--gold-bright);">' + x.c.goals + '</b></td><td class="mono">' + x.c.assists + '</td>' +
      '<td class="mono">' + (x.c.minutes || 0) + '\'</td><td class="mono">' + x.c.t1Boots + '</td><td class="mono">' + x.c.mvp + '</td><td class="mono" style="color:#c084fc;">' + Math.round(x.score) + '</td></tr>';
  }).join('');

  var html = '<div class="info-note">📌 Hall of Fame computes across <b>all Premier and Second Division matches &amp; playoffs</b>. Completed Seasons: <b>' + finished + '</b> · Archived Legends: <b>' + legends.length + '</b>.</div>';

  html += '<div class="editorial-card"><span class="kicker">Roll of Legends</span><h3 style="color:#fff;margin-bottom:8px;">🏛️ Hall of Fame (Retired Legends)</h3>' +
    (legendRows ? '<div class="table-wrap"><table><tr><th>#</th><th>Player</th><th>Final Club</th><th>Span</th><th>Goals</th><th>Assists</th><th>Minutes</th><th>Golden Boots</th><th>POTY (MVP)</th><th>Score</th></tr>' + legendRows + '</table></div>' :
      '<div style="color:var(--muted);padding:10px;">No retired legends yet.</div>') + '</div>';

  html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;">' +
    hofList('All-Time Top Scorers', '⚽ All Goals (League + Playoff)', topGoals, function(x){ return x.c.goals + ' G'; }, 'var(--gold-bright)') +
    hofList('Premier Championship Scorers', '🥅 Top Tier Goals', topT1, function(x){ return x.c.t1Goals + ' G'; }, 'var(--gold-bright)') +
    hofList('Kings of the Golden Boot', '👟 League Golden Boots', topBoots, function(x){ return x.c.t1Boots + 'x'; }, 'var(--ac)') +
    hofList('Most Valuable Players', '⭐ Player of the Season (POTY)', topMvp, function(x){ return x.c.mvp + 'x'; }, 'var(--gold-bright)') +
    hofList('Playmakers', '🎯 All-Time Assists', topAssists, function(x){ return x.c.assists + ' A'; }, 'var(--ac)') +
    hofList('Active Stars', '🔥 Active High-Rating Stars', stars, function(x){ return 'OVR ' + x.ovr; }, 'var(--ok)') +
  '</div>';
  return html;
}

function renderLedger() {
  var allSeasonsList = Object.keys(H.seasons).map(Number).sort(function(a, b){ return a - b; });
  var totalPages = Math.ceil(allSeasonsList.length / SEASONS_PER_PAGE) || 1;
  if (ledgerCurrentPage > totalPages) ledgerCurrentPage = totalPages;
  if (ledgerCurrentPage < 1) ledgerCurrentPage = 1;
  var startIdx = (ledgerCurrentPage - 1) * SEASONS_PER_PAGE;
  var slice = allSeasonsList.slice(startIdx, startIdx + SEASONS_PER_PAGE);

  var cupCell = function(win, run, count, color) {
    return win !== null ?
      '<b' + (color ? ' style="color:' + color + ';"' : '') + '>' + getClubName(win) + '</b> <span class="pos-tag">(#1)</span> <span class="title-count-tag">Title #' + count + '</span>' +

      '⚽ <b>' + playerLink(s.awards.t1Scorer.id, s.awards.t1Scorer.name) + '</b> (' + s.awards.t1Scorer.goals + 'G · ' + s.awards.t1Scorer.bootsCount + 'x)</div>' : '<span class="dim-text">—</span>';

    return '<tr>' +
      '<td class="mono"><a class="season-link" title="Open complete standings" onclick="openLeagueSeason(' + se + ')">Season ' + se + '</a></td>' +
      '<td style="color:var(--gold-bright);">' + plChamp + '</td>' +
      '<td>' + shChamp + '</td>' +
      '<td style="color:var(--silver);">' + plRun + '</td>' +
      '<td>' + cupCell(s.faWinner, s.faRunner, s.faWinner !== null ? getHistoricalTitleCount(s.faWinner, 'fa', se) : 0) + '</td>' +
      '<td>' + cupCell(s.lcWinner, s.lcRunner, s.lcWinner !== null ? getHistoricalTitleCount(s.lcWinner, 'lc', se) : 0) + '</td>' +
      '<td>' + cupCell(s.rcWinner, s.rcRunner, s.rcWinner !== null ? getHistoricalTitleCount(s.rcWinner, 'rc', se) : 0, '#c084fc') + '</td>' +
      '<td>' + awardInfo + '</td>' +
      '<td><button type="button" class="btn-ui btn-sm" onclick="jumpToSeason(' + se + ')">Playoff</button> ' +
        (s.leagueDone ? '<button type="button" class="btn-ui btn-sm" onclick="openLeagueSeason(' + se + ')">📊 League</button>' : '') + '</td></tr>';
  }).join('');

  var pageOpts = '';
  for (var p = 1; p <= totalPages; p++) {
    pageOpts += '<option value="' + p + '"' + (p === ledgerCurrentPage ? ' selected' : '') + '>Page ' + p + ' (S.' + (1 + (p - 1) * SEASONS_PER_PAGE) + ' - S.' + Math.min(allSeasonsList.length, p * SEASONS_PER_PAGE) + ')</option>';
  }

  return '<div class="editorial-card">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;">' +
      '<div><span class="kicker">Official Chronicle Records</span><h2 style="color:#fff;">Roll of Honour (From Season 1 Onward)</h2></div>' +
      '<div style="font-size:12px;color:var(--gold-bright);">Page ' + ledgerCurrentPage + ' of ' + totalPages + ' (' + allSeasonsList.length + ' Seasons)</div>' +
    '</div>' +
    '<div class="pagination-bar">' +
      '<div><button type="button" class="btn-ui btn-sm" onclick="changeLedgerPage(1)" ' + (ledgerCurrentPage === 1 ? 'disabled' : '') + '>⏮️ First</button> ' +
        '<button type="button" class="btn-ui btn-sm" onclick="changeLedgerPage(' + (ledgerCurrentPage - 1) + ')" ' + (ledgerCurrentPage === 1 ? 'disabled' : '') + '>◀️ Previous</button></div>' +
      '<div class="pagination-controls"><span>Jump to Page: </span><select onchange="changeLedgerPage(+this.value)" style="background:#1e293b;color:#fff;border:1px solid #334155;border-radius:4px;padding:2px 8px;font-family:\'JetBrains Mono\';">' + pageOpts + '</select></div>' +
      '<div><button type="button" class="btn-ui btn-sm" onclick="changeLedgerPage(' + (ledgerCurrentPage + 1) + ')" ' + (ledgerCurrentPage === totalPages ? 'disabled' : '') + '>Next ▶</button> ' +
        '<button type="button" class="btn-ui btn-sm" onclick="changeLedgerPage(totalPages)" ' + (ledgerCurrentPage === totalPages ? 'disabled' : '') + '>Last ⏭️</button></div>' +
    '</div>' +
    '<div class="table-wrap"><table>' +
      '<tr><th>Season</th><th>Playoff Champion</th><th>League Shield</th><th>Runner-Up</th><th>FA Cup</th><th>League Cup</th><th>Champions Cup</th><th>Individual Honours</th><th>Actions</th></tr>' +
      ledgerRows + '</table></div></div>';
}

function openLeagueSeason(se) {
  selectedSeason = se;
  activeTab = 'league';
  selectedJornada = 1;
  fixturesClubFilter = -1;
  document.querySelectorAll('#tabs button').forEach(function(b){ b.classList.remove('on'); });
  var btn = document.querySelector('#tabs button[data-v="league"]');
  if (btn) btn.classList.add('on');
  render();
}

function renderLeagueTab(cur) {
  var html = '<div class="season-selector-bar">' +
    '<div style="display:flex;align-items:center;gap:8px;"><span>Select Season: </span>' + seasonSelectorHtml() + '</div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
      [0, 1].map(function(t) {
        return '<button type="button" class="comp-btn ' + (selectedTier === t ? 'active' : '') + '" onclick="selectedTier=' + t + ';selectedJornada=1;fixturesClubFilter=-1;render();">' + TIER_SHORT[t] + ' · ' + TIER_NAMES[t] + '</button>';
      }).join('') +
    '</div></div>';

  var totalJornadas = (cur.tiers[0].length - 1) * 2;
  if (!cur.leagueDone) {
    var progressText = cur.currentJornada > 0 
      ? 'Current Matchday: ' + cur.currentJornada + ' / ' + totalJornadas
      : 'Unstarted';

    html += '<div class="editorial-card" style="text-align:center;">' +
      '<span class="kicker">Matchday-by-Matchday Simulation · Season ' + cur.season + '</span>' +
      '<h3 style="color:#fff;margin:6px 0;">Status: ' + progressText + '</h3>' +
      '<div style="display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap;">' +
        '<button type="button" class="btn-gold" onclick="advanceSingleJornada(' + cur.season + ')">⚡ Simulate Next Matchday (' + (cur.currentJornada + 1) + ')</button>' +
        '<button type="button" class="btn-ui" onclick="simulateLeagueOnly(' + cur.season + ')">⏩ Fast Forward All Matchdays</button>' +
      '</div></div>';

    if (cur.currentJornada === 0) return html;
  }

  var t = selectedTier;
  var L = cur.league[t];
  var n = L.table.length;
  var playedCount = cur.leagueDone ? totalJornadas : cur.currentJornada;

  var rows = L.table.map(function(row, i) {
    var pos = i + 1, zone = '';
    if (t === 0) { if (pos === 1) zone = 'zone-champ'; else if (pos <= 8) zone = 'zone-po'; else if (pos > n - SLOTS) zone = 'zone-down'; }
    else if (t === 1) { if (pos <= SLOTS) zone = 'zone-up'; }
    var gd = row[4] - row[5];
    return '<tr class="' + zone + '">' +
      '<td class="mono">' + pos + '</td>' +
      '<td>' + clubLinkAt(row[0], cur.season + 1) + (t === 0 && pos === 1 ? ' <span style="color:#38bdf8;font-weight:bold;">🛡️ Shield</span>' : '') + '</td>' +
      '<td class="mono">' + playedCount + '</td>' +
      '<td class="mono">' + row[1] + '</td><td class="mono">' + row[2] + '</td><td class="mono">' + row[3] + '</td>' +
      '<td class="mono">' + row[4] + '</td><td class="mono">' + row[5] + '</td>' +
      '<td class="mono">' + (gd > 0 ? '+' : '') + gd + '</td>' +
      '<td class="mono" style="color:var(--gold-bright);font-weight:700;">' + row[6] + '</td></tr>';
  }).join('');

  var legendTxt = t === 0 ?
    '<span><i style="background:var(--gold-bright)"></i>League Shield Winner (#1)</span><span><i style="background:var(--ac)"></i>Playoff Qualifier (Top 8)</span><span><i style="background:var(--danger)"></i>Relegated to Second Division</span>' :
    '<span><i style="background:var(--ok)"></i>Promoted to Premier Championship</span>';

  var scorerRows = L.scorers.map(function(x, i) {
    return '<tr><td class="mono">' + (i + 1) + '</td><td>' + playerLink(x[0], x[1]) + '</td><td>' + getClubName(x[2]) + '</td><td class="mono"><b style="color:var(--gold-bright);">' + x[3] + '</b></td><td class="mono">' + x[4] + '</td></tr>';
  }).join('');
  var assistRows = L.assisters.map(function(x, i) {
    return '<tr><td class="mono">' + (i + 1) + '</td><td>' + playerLink(x[0], x[1]) + '</td><td>' + getClubName(x[2]) + '</td><td class="mono"><b style="color:var(--ac);">' + x[4] + '</b></td><td class="mono">' + x[3] + '</td></tr>';
  }).join('');

  html += '<div class="editorial-card">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">' +
      '<div><span class="kicker">Standings (' + totalJornadas + ' Matchdays)</span><h2 style="color:#fff;">' + TIER_NAMES[t] + ' — Season ' + cur.season + '</h2></div>' +
      '<div style="font-size:12px;color:var(--muted);font-family:Inter;">' + n + ' clubs · Leader: <b style="color:var(--gold-bright);">' + getClubName(L.table[0][0]) + '</b></div>' +
    '</div>' +
    '<div class="table-wrap" style="max-height:500px;overflow-y:auto;"><table>' +
      '<tr><th>#</th><th>Club</th><th>Pld</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr>' + rows +
    '</table></div>' +
    '<div class="zone-legend">' + legendTxt + '</div>' +
  '</div>';

  var allJornadas = L.jornadas || [];
  var isPurged = (allJornadas.length === 0 && cur.fixturesPurged);

  if (!isPurged) {
    var maxViewableJornada = cur.leagueDone ? totalJornadas : cur.currentJornada;
    if (selectedJornada > maxViewableJornada) selectedJornada = maxViewableJornada;
    if (selectedJornada < 1) selectedJornada = 1;

    var curJornadaMatches = allJornadas[selectedJornada - 1] || [];
    var filteredMatches = curJornadaMatches.map(function(m, idx){ return { match: m, originalIdx: idx }; });
    if (fixturesClubFilter !== -1) {
      filteredMatches = filteredMatches.filter(function(item){ return item.match[0] === fixturesClubFilter || item.match[1] === fixturesClubFilter; });
    }

    var clubOpts = '<option value="-1"' + (fixturesClubFilter === -1 ? ' selected' : '') + '>All Clubs in Matchday ' + selectedJornada + '</option>' +
      cur.tiers[t].map(function(cid) {
        return '<option value="' + cid + '"' + (fixturesClubFilter === cid ? ' selected' : '') + '>' + getClubName(cid) + '</option>';
      }).join('');

    var jOpts = '';
    for (var j = 1; j <= maxViewableJornada; j++) {
      jOpts += '<option value="' + j + '"' + (j === selectedJornada ? ' selected' : '') + '>Matchday ' + j + '</option>';
    }

    var fixtureRows = filteredMatches.map(function(item, idx) {
      var m = item.match;
      var origIdx = item.originalIdx;
      var homeWon = m[2] > m[3];
      var awayWon = m[3] > m[2];
      var hEventsSummary = formatEventsSummaryHtml(m[4]);
      var aEventsSummary = formatEventsSummaryHtml(m[5]);
      
      return '<tr class="match-row-clickable">' +
        '<td class="mono" style="color:var(--muted);vertical-align:top;">' + (idx + 1) + '</td>' +
        '<td style="text-align:right;vertical-align:top;' + (homeWon ? 'font-weight:700;color:var(--gold-bright);' : '') + '">' +
          clubLinkAt(m[0], cur.season + 1) + hEventsSummary +
        '</td>' +
        '<td class="mono" style="text-align:center;vertical-align:top;width:110px;">' +
          '<button type="button" class="score-badge-btn" title="View Dossier" onclick="openMatchDetailsModal(' + t + ',' + (selectedJornada - 1) + ',' + origIdx + ',' + cur.season + ')">' + m[2] + ' - ' + m[3] + '</button>' +
        '</td>' +
        '<td style="vertical-align:top;' + (awayWon ? 'font-weight:700;color:var(--gold-bright);' : '') + '">' +
          clubLinkAt(m[1], cur.season + 1) + aEventsSummary +
        '</td>' +
      '</tr>';
    }).join('');

    html += '<div class="editorial-card">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;">' +
        '<div><span class="kicker">Matchday Fixtures</span><h3 style="color:#fff;">📜 Fixtures &amp; Match Records</h3></div>' +
        '<div style="display:flex;align-items:center;gap:8px;"><span style="font-size:12px;color:var(--muted);">Filter Club:</span>' +
        '<select onchange="fixturesClubFilter=+this.value;render();" style="background:#1e293b;color:var(--gold-bright);border:1px solid #334155;border-radius:4px;padding:4px 8px;font-family:Inter;font-size:12px;">' + clubOpts + '</select></div>' +
      '</div>' +
      '<div class="pagination-bar" style="border-top:1px solid #1e293b;margin-bottom:8px;">' +
        '<div><button type="button" class="btn-ui btn-sm" onclick="selectedJornada=1;render();" ' + (selectedJornada === 1 ? 'disabled' : '') + '>⏮️ Round 1</button> ' +
        '<button type="button" class="btn-ui btn-sm" onclick="selectedJornada--;render();" ' + (selectedJornada === 1 ? 'disabled' : '') + '>◀️ Prev</button></div>' +
        '<div class="pagination-controls"><span style="font-weight:700;color:var(--gold-bright);">Select Round:</span> ' +
        '<select onchange="selectedJornada=+this.value;render();" style="background:#1e293b;color:#fff;border:1px solid #334155;border-radius:4px;padding:3px 8px;font-family:monospace;">' + jOpts + '</select></div>' +
        '<div><button type="button" class="btn-ui btn-sm" onclick="selectedJornada++;render();" ' + (selectedJornada === maxViewableJornada ? 'disabled' : '') + '>Next ▶</button> ' +
        '<button type="button" class="btn-ui btn-sm" onclick="selectedJornada=' + maxViewableJornada + ';render();" ' + (selectedJornada === maxViewableJornada ? 'disabled' : '') + '>Last ⏭️</button></div>' +
      '</div>' +
      '<div class="table-wrap"><table>' +
        '<tr><th style="width:50px;">No</th><th style="text-align:right;">Home</th><th style="text-align:center;width:110px;">Score</th><th>Away</th></tr>' +
        (fixtureRows || '<tr><td colspan=4 style="text-align:center;padding:16px;color:var(--muted);">No fixtures for this round.</td></tr>') +
      '</table></div></div>';
  }

  html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;">' +
    '<div class="editorial-card"><span class="kicker">Top Scorers ' + TIER_SHORT[t] + '</span><h3 style="color:#fff;margin-bottom:8px;">⚽ Top 15 Goalscorers</h3>' +
      '<div class="table-wrap"><table><tr><th>#</th><th>Player</th><th>Club</th><th>G</th><th>A</th></tr>' + scorerRows + '</table></div></div>' +
    '<div class="editorial-card"><span class="kicker">Playmakers ' + TIER_SHORT[t] + '</span><h3 style="color:#fff;margin-bottom:8px;">🎯 Top 10 Assists</h3>' +
      '<div class="table-wrap"><table><tr><th>#</th><th>Player</th><th>Club</th><th>A</th><th>G</th></tr>' + assistRows + '</table></div></div>' +
  '</div>';

  if (cur.moves) {
    var list = function(ids) { return ids.map(function(c){ return clubLinkAt(c, cur.season + 1); }).join(', '); };
    html += '<div class="editorial-card"><span class="kicker">Promotion &amp; Relegation</span><h3 style="color:#fff;margin-bottom:8px;">🔄 Tier Moves Season ' + cur.season + ' → ' + (cur.season + 1) + '</h3>' +
      '<div style="font-family:Inter;font-size:12.5px;line-height:1.9;">' +
        '<div><span style="color:var(--ok);font-weight:700;">▲ Tier 2 → Tier 1:</span> ' + list(cur.moves.up2to1) + '</div>' +
        '<div><span style="color:var(--danger);font-weight:700;">▼ Tier 1 → Tier 2:</span> ' + list(cur.moves.down1to2) + '</div>' +
      '</div></div>';
  }
  return html;
}

function changeLedgerPage(p) { ledgerCurrentPage = p; render(); }

function jumpToSeason(targetSe) {
  selectedSeason = targetSe;
  activeTab = 'hall';
  document.querySelectorAll('#tabs button').forEach(function(b){ b.classList.remove('on'); });
  document.querySelector('#tabs button[data-v="hall"]').classList.add('on');
  render();
}

function render() {
  if (!H || !S) return;
  if (!H.seasons[selectedSeason]) selectedSeason = getMaxSeasonInArchive();
  var html = '';
  var cur = H.seasons[selectedSeason];
  var eras = getErasDefinition();
  var eraInfo = eras[cur.era - 1] || eras[eras.length - 1];
  var maxSeasons = getMaxSeasonInArchive();

  $('#date-label').textContent = 'Season ' + selectedSeason + ' (Total: ' + maxSeasons + ' Seasons) · Era ' + cur.era;

  // TAB 1: PLAYOFF CHAMBER
  if (activeTab === 'hall') {
    html += '<div class="era-banner">' +
      eras.map(function(e) {
        return '<div class="era-card ' + (e.id === cur.era ? 'active' : '') + '" onclick="jumpToSeason(' + e.range[0] + ')">' +
          '<div class="era-title">Era ' + e.id + ': ' + e.name + '</div>' +
          '<div class="era-desc">Season ' + e.range[0] + ' to ' + e.range[1] + '</div></div>';
      }).join('') + '</div>';

    var isDouble = cur.finalized && cur.rank1to4[0] === cur.leagueShieldWinner;
    var isTreble = cur.t1PlayoffDone && cur.faCupDone && cur.leagueCupDone &&
      cur.rank1to4[0] === cur.faWinner && cur.faWinner === cur.lcWinner;

    html += '<div class="season-selector-bar">' +
      '<div style="display:flex;align-items:center;gap:8px;"><span>Select Season: </span>' + seasonSelectorHtml() + '</div>' +
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">' +
        (isDouble ? '<span class="badge-double">👑 DOUBLE WINNER! (Shield + Playoff)</span>' : '') +
        (isTreble ? '<span class="badge-treble">👑 HISTORIC TREBLE WINNER!</span>' : '') +
        (cur.leagueShieldWinner !== null ? '<span class="badge-shield">🛡️ Shield: ' + getClubName(cur.leagueShieldWinner) + '</span>' : '') +
        (cur.finalized ?
          '<span class="badge-trophy">👑 Playoff Champion: ' + getClubName(cur.rank1to4[0]) + ' ' + getTournamentClubRank(cur.rank1to4[0], 'pl', selectedSeason) + '</span>' :
          (!cur.leagueDone ? '<button type="button" class="btn-ui" onclick="advanceSingleJornada(' + selectedSeason + ')">⚽ Sim 1 Matchday</button>' : '') +
          (!cur.leagueDone ? '<button type="button" class="btn-ui" onclick="simulateLeagueOnly(' + selectedSeason + ')">📊 League Only</button>' : '') +
          '<button type="button" class="btn-gold" onclick="simulateEntireSeason(' + selectedSeason + ')">⚡ Simulate Season ' + selectedSeason + '</button>') +
        (cur.leagueDone ? '<button type="button" class="btn-ui" onclick="openLeagueSeason(' + selectedSeason + ')">📊 League Table</button>' : '') +
      '</div></div>';

    if (!cur.leagueDone) {
      html += unplayedLeagueCard(cur);
    } else {
      if (cur.awards) {
        var a = cur.awards;
        html += '<div class="awards-banner">' +
          '<div class="award-item"><span class="kicker" style="margin:0 0 2px 0;">⭐ Player of the Season (POTY)</span><br><b>' + playerLink(a.mvp.id, a.mvp.name) + '</b> (' + getClubName(a.mvp.club) + ') <span class="award-tag">' + a.mvp.mvpCount + 'x MVP</span></div>' +
          '<div class="award-item"><span class="kicker" style="margin:0 0 2px 0;">⚽ Premier Golden Boot</span><br><b>' + playerLink(a.t1Scorer.id, a.t1Scorer.name) + '</b> (' + getClubName(a.t1Scorer.club) + ') <span class="award-tag">' + a.t1Scorer.goals + ' G · ' + a.t1Scorer.bootsCount + 'x</span></div>' +
          '<div class="award-item"><span class="kicker" style="margin:0 0 2px 0;">🛡️ Top Scorer FA Cup</span><br><b>' + playerLink(a.faScorer.id, a.faScorer.name) + '</b> (' + getClubName(a.faScorer.club) + ') <span class="award-tag">' + a.faScorer.goals + ' Goals</span></div>' +
          '<div class="award-item"><span class="kicker" style="margin:0 0 2px 0;">🏅 Top Scorer League Cup</span><br><b>' + playerLink(a.lcScorer.id, a.lcScorer.name) + '</b> (' + getClubName(a.lcScorer.club) + ') <span class="award-tag">' + a.lcScorer.goals + ' Goals</span></div>' +
          '<div class="award-item"><span class="kicker" style="margin:0 0 2px 0;">⚽ Division 2 Top Scorer</span><br><b>' + playerLink(a.t2Scorer.id, a.t2Scorer.name) + '</b> (' + getClubName(a.t2Scorer.club) + ') <span class="award-tag">' + a.t2Scorer.goals + ' G</span></div>' +
        '</div>';
      }

      html += '<div class="comp-toggle-bar" style="display:flex;gap:8px;margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:10px;flex-wrap:wrap;">' +
        '<button type="button" class="comp-btn ' + (selectedCompView === 'pl' ? 'active' : '') + '" onclick="selectedCompView=\'pl\';render();">🏆 Premier Playoffs (Elite Eight)</button>' +
        '<button type="button" class="comp-btn ' + (selectedCompView === 'fa' ? 'active' : '') + '" onclick="selectedCompView=\'fa\';render();">🛡️ Heritage FA Challenge Cup</button>' +
        '<button type="button" class="comp-btn ' + (selectedCompView === 'lc' ? 'active' : '') + '" onclick="selectedCompView=\'lc\';render();">🏅 League Cup</button>' +
      '</div>';

      var compTitle = selectedCompView === 'pl' ? 'Premier Playoffs — Elite Eight' : (selectedCompView === 'fa' ? 'Heritage FA Challenge Cup' : 'League Cup Championship');
      var compDesc = selectedCompView === 'pl' ? eraInfo.name + ' · Top 8 of Premier Championship' : eraInfo.name;
      html += renderBracketUI(getBracket(cur, selectedCompView), selectedCompView, selectedSeason, compTitle, compDesc);

      if (selectedCompView === 'pl' && cur.t1PlayoffDone) {
        html += '<div class="editorial-card" style="margin-top:-6px;">' +
          '<h4 style="color:var(--gold-bright);margin-bottom:8px;">🎖️ OFFICIAL PODIUM · SEASON ' + selectedSeason + '</h4>' +
          '<div class="podium-grid">' +
            '<div class="podium-box p-1"><span class="rank-badge rb-1">Champion (Gold)</span><br><b>' + getClubName(cur.rank1to4[0]) + '</b> <span class="pos-tag">(#1)</span></div>' +
            '<div class="podium-box p-2"><span class="rank-badge rb-2">Runner-Up (Silver)</span><br><b>' + getClubName(cur.rank1to4[1]) + '</b> <span class="pos-tag">(#2)</span></div>' +
            '<div class="podium-box p-3"><span class="rank-badge rb-3">3rd Place (Bronze)</span><br><b>' + getClubName(cur.rank1to4[2]) + '</b> <span class="pos-tag">(#3)</span></div>' +
            '<div class="podium-box p-4"><span class="rank-badge rb-4">4th Place</span><br><b>' + getClubName(cur.rank1to4[3]) + '</b> <span class="pos-tag">(#4)</span></div>' +
          '</div></div>';
      }
    }
  }

  // TAB 2: LIGA & KLASEMEN
  if (activeTab === 'league') html += renderLeagueTab(cur);

  // TAB ROSTER
  if (activeTab === 'roster') html += renderRosterTab(cur);

  // TAB 3: TRANSFERS
  if (activeTab === 'transfers') html += renderTransfersTab(cur);

  // TAB 4: COPA DE MAESTROS
  if (activeTab === 'cadenza_cup') {
    html += '<div class="season-selector-bar">' +
      '<div style="display:flex;align-items:center;gap:8px;"><span>Select Season: </span>' + seasonSelectorHtml() + '</div>' +
      '<div style="display:flex;gap:8px;align-items:center;">' +
        (!cur.leagueDone ? '<span class="dim-text">Simulate league matchdays first</span>' :
          (!cur.ravestonCupDone ?
            '<button type="button" class="btn-purple" onclick="simulateEntireRavestonCup(' + selectedSeason + ')">⚡ Simulate Entire Champions Cup</button>' :
            '<span class="badge-trophy" style="background:#7e22ce33;color:#c084fc;border-color:#a855f7;">👑 Champion: ' + getClubName(cur.rcWinner) + ' ' + getTournamentClubRank(cur.rcWinner, 'rc', selectedSeason) + '</span>')) +
      '</div></div>';
    html += cur.leagueDone ?
      renderBracketUI(cur.rcBracket, 'rc', selectedSeason, 'Champions Cup / Masters Shield', 'Invitational post-season tournament featuring the top 8 strongest Premier clubs') :
      unplayedLeagueCard(cur);
  }

  // TAB 5: TROPHY CABINET
  if (activeTab === 'cabinet') {
    recalculateTrophyCabinet();
    var sortedClubs = Object.keys(H.clubStats).map(function(cId) { return { id: +cId, st: H.clubStats[cId] }; })
      .sort(function(a, b) {
        return (b.st.pts - a.st.pts) || (b.st.t1 - a.st.t1) || (b.st.shield - a.st.shield) || (b.st.doubles - a.st.doubles) || (b.st.fa - a.st.fa);
      });
    var rows = sortedClubs.slice(0, 150).map(function(item, idx) {
      var st = item.st, badges = '';
      if (st.quads > 0) badges += '<span class="badge-quad">' + st.quads + 'x QUADRUPLE</span>';
      if (st.trebles > 0) badges += '<span class="badge-treble">' + st.trebles + 'x TREBLE</span>';
      if (st.doubles > 0) badges += '<span class="badge-double">' + st.doubles + 'x DOUBLE</span>';
      return '<tr>' +
        '<td class="mono" style="' + (idx < 3 ? 'color:var(--gold-bright);font-weight:700;' : '') + '">' + (idx + 1) + '</td>' +
        '<td><b>' + getClubName(item.id) + '</b> ' + badges + '</td>' +
        '<td><b style="color:var(--gold-bright);">' + st.t1 + 'x</b></td>' +
        '<td><b style="color:var(--ac);">' + st.shield + 'x</b></td>' +
        '<td class="mono">' + st.r2 + '</td>' +
        '<td><b>' + st.fa + 'x</b></td>' +
        '<td><b>' + st.lc + 'x</b></td>' +
        '<td style="color:#c084fc;"><b>' + st.rc + 'x</b></td>' +
        '<td class="mono" style="font-size:14px;color:var(--ac);font-weight:700;">' + st.pts + ' pts</td></tr>';
    }).join('');
    html += '<div class="editorial-card">' +
      '<span class="kicker">Museum of National Glory</span>' +
      '<h2 style="color:#fff;margin-bottom:8px;">All-Time Honors &amp; Trophy Cabinet (370 Clubs)</h2>' +
      '<div class="info-note">Point System: Playoff Champion 12 · League Shield 10 · Runner-up 6 · 3rd 4 · 4th 2 · FA Cup 5/2 · League Cup 3/1 · Masters Cup 4/2 · Double +15 · Treble +20 · Quadruple +35.</div>' +
      '<div class="table-wrap"><table>' +
        '<tr><th>#</th><th>Club Name</th><th>Playoff</th><th>League Shield</th><th>Runner-Up</th><th>FA Cup</th><th>League Cup</th><th>Champions Cup</th><th>Historic Pts</th></tr>' +
        (rows || '<tr><td colspan=9 style="text-align:center;padding:20px;">No seasons simulated yet.</td></tr>') +
      '</table></div></div>';
  }

  // TAB 6: HOF
  if (activeTab === 'hof_players') html += renderHallOfFame();

  // TAB 7: ERAS
  if (activeTab === 'eras') {
    var erasDef = getErasDefinition();
    html += '<div class="editorial-card">' +
      '<span class="kicker">Periodization</span>' +
      '<h2 style="color:#fff;margin-bottom:12px;">Evolution of Competition (Season 1 to ' + maxSeasons + ')</h2>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;">' +
        erasDef.map(function(e) {
          return '<div style="background:#0e1526;border:1px solid #1e293b;border-radius:8px;padding:14px;border-left:4px solid var(--gold);">' +
            '<h3 style="color:var(--gold-bright);margin-bottom:4px;">Era ' + e.id + ': ' + e.name + '</h3>' +
            '<div style="font-size:12px;color:var(--ac);margin-bottom:8px;">Span: Season ' + e.range[0] + ' – ' + e.range[1] + '</div>' +
            '<p style="font-size:13px;color:#cbd5e1;line-height:1.5;">' + e.desc + '</p>' +
            '<button type="button" class="btn-ui" style="margin-top:10px;font-size:11px;" onclick="jumpToSeason(' + e.range[0] + ')">View Era Archive</button></div>';
        }).join('') + '</div></div>';
  }

  // TAB 8: LEDGER
  if (activeTab === 'ledger') html += renderLedger();

  $('#app').innerHTML = html;
}

$('#tabs').addEventListener('click', function(e) {
  var btn = e.target.closest('button');
  if (!btn) return;
  e.preventDefault();
  document.querySelectorAll('#tabs button').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
  activeTab = btn.dataset.v;
  render();
});

window.addEventListener('load', function() { initHistoryApp(); });
</script>
</body>
</html>
