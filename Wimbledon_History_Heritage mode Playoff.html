<style>
:root{--gold:#f59e0b;--gold-bright:#fde047;--silver:#94a3b8;--bronze:#b45309;--bg:#07090e;--paper:#0d121f;--card:#111827;--border:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--danger:#f43f5e;--ok:#10b981;--ac:#38bdf8;--purple:#a855f7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 'Newsreader',serif;background-image:radial-gradient(#1e293b 1px, transparent 1px);background-size:24px 24px;}
h1,h2,h3,h4{font-family:'Chakra Petch',sans-serif;margin:0;letter-spacing:-0.02em}
.serif{font-family:'Cinzel',serif}
.sans{font-family:'Inter',system-ui,sans-serif}
.mono{font-family:'JetBrains Mono',monospace}

header{background:#0a0d17;border-bottom:3px double #334155;padding:18px;text-align:center;position:relative}
.masthead-title{font-size:32px;font-weight:900;letter-spacing:2px;color:var(--gold-bright);text-shadow:0 2px 12px rgba(245,158,11,0.3)}
.masthead-sub{font-size:12px;color:var(--ac);text-transform:uppercase;letter-spacing:3px;font-family:'Inter';font-weight:700;margin-top:3px}
.masthead-bar{display:flex;justify-content:space-between;max-width:1100px;margin:10px auto 0;border-top:1px solid #1e293b;border-bottom:1px solid #1e293b;padding:4px 10px;font-size:12px;color:var(--muted);font-family:'Inter';flex-wrap:wrap;gap:6px}

.sync-bar{background:#0c111e;padding:8px 16px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-family:'Inter';border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px}
.sync-bar button, .sync-bar label.btn-upload{background:#1e293b;color:#fff;border:1px solid #334155;border-radius:6px;padding:4px 12px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none;}
.sync-bar button:hover, .sync-bar label.btn-upload:hover{border-color:var(--gold)}

nav{background:#0f172a;border-bottom:1px solid var(--border);display:flex;justify-content:center;gap:6px;padding:8px 14px;flex-wrap:wrap;position:sticky;top:0;z-index:40}
nav button{background:transparent;color:var(--muted);border:1px solid transparent;border-radius:6px;padding:6px 14px;font-family:'Inter';font-size:13px;font-weight:600;cursor:pointer;transition:0.2s}
nav button:hover{color:#fff;border-color:#334155}
nav button.on{background:var(--gold);color:#070a12;border-color:var(--gold);font-weight:700}

.container{max-width:1300px;margin:20px auto;padding:0 16px}
.editorial-card{background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:18px;box-shadow:0 4px 16px rgba(0,0,0,0.3)}
.kicker{font-family:'Inter';font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:6px;display:inline-block}

.era-banner{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media(max-width:850px){.era-banner{grid-template-columns:1fr 1fr}}
.era-card{background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:10px 12px;cursor:pointer;transition:0.2s}
.era-card:hover,.era-card.active{border-color:var(--gold);background:#1a233a}
.era-title{font-family:'Inter';font-size:12px;font-weight:700;color:var(--gold-bright)}
.era-desc{font-size:11px;color:var(--muted);margin-top:2px}

.season-selector-bar{display:flex;align-items:center;justify-content:space-between;background:#0d1527;border:1px solid var(--border);border-radius:8px;padding:10px 16px;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.season-selector-bar select{background:#1e293b;color:var(--gold-bright);border:1px solid #334155;border-radius:6px;padding:6px 12px;font-family:'JetBrains Mono';font-weight:700;cursor:pointer;max-width:100%}
.btn-ui{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:5px 12px;font-family:'Inter';font-weight:600;cursor:pointer;font-size:12px}
.btn-ui:hover{border-color:var(--gold);background:#25334d}
.btn-ui:disabled{opacity:.4;cursor:default}
.btn-gold{background:linear-gradient(135deg,#d97706,#f59e0b);color:#070a12;border:none;border-radius:6px;padding:6px 14px;font-family:'Inter';font-weight:700;cursor:pointer;font-size:12px}
.btn-gold:hover{background:linear-gradient(135deg,#f59e0b,#fde047)}
.btn-purple{background:linear-gradient(135deg,#7e22ce,#a855f7);color:#fff;border:none;border-radius:6px;padding:6px 14px;font-family:'Inter';font-weight:700;cursor:pointer;font-size:12px}
.btn-purple:hover{background:linear-gradient(135deg,#9333ea,#c084fc)}
.btn-sm{padding:2px 8px;font-size:11px}

.comp-btn{background:#16203a;color:#cbd5e1;border:1px solid #334155;border-radius:6px;padding:6px 12px;font-family:'Inter';font-weight:600;font-size:12px;cursor:pointer}
.comp-btn:hover{border-color:var(--gold)}
.comp-btn.active{background:var(--gold);color:#070a12;border-color:var(--gold)}

.bracket-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;margin-bottom:16px}
.bracket-card{background:#0c1221;border:1px solid var(--border);border-radius:8px;padding:12px;border-top:3px solid var(--gold)}
.match-box{background:#121a2d;border:1px solid #1e293b;border-radius:6px;padding:10px;margin-bottom:8px}
.match-line{display:flex;justify-content:space-between;align-items:center;font-family:'Inter';font-size:13px;margin:3px 0;gap:8px}
.match-winner{color:var(--gold-bright);font-weight:700}
.match-score{font-family:'JetBrains Mono';font-weight:700;background:#1e293b;padding:2px 8px;border-radius:4px;color:#fff;font-size:12px;white-space:nowrap}
.goal-subtext{font-size:10.5px;color:var(--muted);font-family:'Inter';line-height:1.3;margin-bottom:4px;padding-left:4px}

.pos-tag{font-family:'JetBrains Mono';font-size:11px;color:var(--ac);font-weight:700;margin-left:4px}
.match-winner .pos-tag{color:var(--gold-bright)}

.podium-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
@media(max-width:768px){.podium-grid{grid-template-columns:1fr 1fr}}
.podium-box{padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:#131c30}
.p-1{border-color:var(--gold);background:#251c09}.p-1 b{color:var(--gold-bright)}
.p-2{border-color:var(--silver);background:#18202e}.p-2 b{color:#f1f5f9}
.p-3{border-color:var(--bronze);background:#24160c}.p-3 b{color:#fdba74}
.p-4{border-color:#3b82f6;background:#0e1e38}.p-4 b{color:#93c5fd}

.rank-badge{display:inline-block;padding:2px 6px;border-radius:4px;font-weight:700;font-size:10px;text-transform:uppercase;font-family:'JetBrains Mono';margin-bottom:4px}
.rb-1{background:#eab30833;color:var(--gold-bright);border:1px solid #eab308}
.rb-2{background:#94a3b833;color:#e2e8f0;border:1px solid #94a3b8}
.rb-3{background:#b4530933;color:#fdba74;border:1px solid #b45309}
.rb-4{background:#3b82f633;color:#93c5fd;border:1px solid #3b82f6}

.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;background:var(--paper)}
table{width:100%;border-collapse:collapse;font-family:'Inter';font-size:12.5px}
th{background:#141d30;padding:8px 10px;text-align:left;position:sticky;top:0;white-space:nowrap}
td{padding:6px 10px;border-bottom:1px solid #141c2e;white-space:nowrap}
tr:hover td{background:#172238}
tr.zone-champ td:first-child{border-left:3px solid var(--gold-bright)}
tr.zone-po td:first-child{border-left:3px solid var(--ac)}
tr.zone-up td:first-child{border-left:3px solid var(--ok)}
tr.zone-down td:first-child{border-left:3px solid var(--danger)}
.zone-legend{display:flex;gap:14px;flex-wrap:wrap;font-family:'Inter';font-size:11px;color:var(--muted);margin:8px 2px}
.zone-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}

.badge-trophy{display:inline-block;padding:2px 8px;border-radius:4px;font-family:'JetBrains Mono';font-size:11px;font-weight:700;background:#f59e0b22;color:var(--gold-bright);border:1px solid #f59e0b}
.badge-shield{display:inline-block;padding:2px 8px;border-radius:4px;font-family:'JetBrains Mono';font-size:11px;font-weight:700;background:#38bdf822;color:var(--ac);border:1px solid #38bdf8}
.badge-double{display:inline-block;padding:3px 8px;border-radius:4px;font-family:'JetBrains Mono';font-size:10px;font-weight:900;background:linear-gradient(135deg,#38bdf8,#f59e0b);color:#070a12;margin-left:4px}
.badge-treble{display:inline-block;padding:3px 8px;border-radius:4px;font-family:'JetBrains Mono';font-size:10px;font-weight:900;background:linear-gradient(135deg,#eab308,#ef4444);color:#fff;margin-left:4px}
.dim-text{font-size:11px;color:var(--muted);display:block}
.title-count-tag{font-family:'JetBrains Mono';font-size:10.5px;color:var(--gold-bright);font-weight:700;margin-left:3px;background:rgba(245,158,11,0.15);padding:1px 5px;border-radius:3px;border:1px solid rgba(245,158,11,0.3)}
.shield-count-tag{font-family:'JetBrains Mono';font-size:10.5px;color:var(--ac);font-weight:700;margin-left:3px;background:rgba(56,189,248,0.15);padding:1px 5px;border-radius:3px;border:1px solid rgba(56,189,248,0.3)}

.awards-banner{background:#11192e;border:1px solid #23324d;border-radius:8px;padding:12px 16px;margin-bottom:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;font-family:'Inter';font-size:12px}
.award-item b{color:var(--gold-bright)}
.award-tag{font-family:'JetBrains Mono';font-size:11px;color:var(--ac);font-weight:700}

.pagination-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 6px;flex-wrap:wrap;gap:8px}
.pagination-controls{display:flex;gap:4px;align-items:center}

.player-link{color:#38bdf8;text-decoration:none;border-bottom:1px dotted #38bdf8;cursor:pointer;transition:0.2s}
.player-link:hover{color:var(--gold-bright);border-bottom-color:var(--gold-bright);text-shadow:0 0 8px rgba(245,158,11,0.4)}
.club-bracket-link{font-weight:600;color:#e2e8f0;border-bottom:1px dashed #475569;cursor:pointer;transition:0.2s}
.club-bracket-link:hover{color:var(--gold-bright);border-bottom-color:var(--gold-bright);text-shadow:0 0 8px rgba(245,158,11,0.4)}
.season-link{color:var(--gold-bright);cursor:pointer;border-bottom:1px dotted var(--gold);font-weight:700}
.season-link:hover{color:#fff}

.modal-overlay{position:fixed;inset:0;background:rgba(3,6,12,0.85);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:0.25s}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal-box{background:var(--paper);border:2px solid var(--gold);border-radius:12px;width:100%;max-width:780px;box-shadow:0 16px 50px rgba(0,0,0,0.8);overflow:hidden;display:flex;flex-direction:column}
.modal-header{background:#0e1526;border-bottom:1px solid #1e293b;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.modal-title{font-size:20px;color:var(--gold-bright);margin:0;font-family:'Cinzel',serif}
.modal-close-btn{background:#1e293b;color:#fff;border:1px solid #334155;border-radius:6px;width:30px;height:30px;font-weight:700;cursor:pointer}
.modal-close-btn:hover{background:#be123c;border-color:#f43f5e}
.modal-body{padding:20px;overflow-y:auto;max-height:80vh;font-family:'Inter',sans-serif}
.p-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.p-stat-box{background:#111827;border:1px solid #1e293b;border-radius:6px;padding:8px 12px;text-align:center}
.p-stat-box span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700}
.p-stat-box b{font-size:15px;color:var(--gold-bright);font-family:'JetBrains Mono'}
.info-note{font-family:'Inter';font-size:12px;color:var(--muted);background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:12px 16px;margin-bottom:16px}
.scorer-tag{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4;font-family:'Inter',sans-serif}
.scorer-tag b{color:#cbd5e1;font-weight:600}

.match-row-clickable{cursor:pointer;transition:0.15s;}
.match-row-clickable:hover td{background:#1e293b;}
.score-badge-btn{background:#131c30;border:1px solid #334155;color:#fde047;border-radius:4px;padding:3px 8px;font-family:'JetBrains Mono';font-weight:700;font-size:12.5px;cursor:pointer;transition:0.2s;}
.score-badge-btn:hover{background:var(--gold);color:#070a12;border-color:var(--gold);}
.lineup-box{background:#0e1626;border:1px solid #1e293b;border-radius:6px;padding:10px 14px;font-size:12px;}
.timeline-item{display:flex;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid #162032;font-size:12.5px;}
.minute-badge{background:#1e293b;color:var(--gold-bright);font-family:'JetBrains Mono';font-weight:700;padding:2px 6px;border-radius:4px;font-size:11px;min-width:34px;text-align:center;}
.tag-pos{background:#1e293b;color:#93c5fd;border:1px solid #3b82f6;padding:1px 5px;border-radius:4px;font-size:10.5px;font-weight:700}
</style>
</head>

<header>
  <div class="masthead-title serif">THE WIMBLEDON HERITAGE</div>
  <div class="masthead-sub">Historical Archive &amp; Roll of Honour · 370 Clubs British Pyramid</div>
  <div class="masthead-bar">
    <span>NATIONAL ARCHIVE ENGINE v9 (370 BRITISH CLUBS · PREMIER &amp; SECOND DIVISION)</span>
    <span id="date-label">Loading Registry...</span>
    <span id="masthead-cap-label">2 ACTIVE TIERS · 32 CLUBS EACH · 306 REGIONAL POOL</span>
  </div>
</header>

<div class="sync-bar">
  <span id="status-label">Initializing Engine...</span>
  <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
    <button type="button" onclick="advanceSingleJornada(selectedSeason)" style="color:var(--gold-bright);border-color:var(--gold);">⚽ Sim 1 Matchday</button>
    <button type="button" onclick="addNewSeasonManually()">➕ Advance 1 Season</button>
    <button type="button" onclick="runBatch(10)" style="color:var(--gold-bright);border-color:var(--gold)">⚡ Simulate 10 Seasons</button>
    <button type="button" onclick="runBatch(50)" style="color:var(--ac);border-color:var(--ac)">⚡ Simulate 50 Seasons (Auto-Archive)</button>
    <button type="button" onclick="undoLastSeason()" style="color:#fdba74;border-color:#b45309">↩ Undo Last Season</button>
    <button type="button" onclick="saveHistoryToIndexedDB(true)">💾 Save DB</button>
    <button type="button" onclick="exportDataToJson()" style="color:var(--ok);border-color:var(--ok);">📥 Export JSON</button>
    <label class="btn-upload" style="color:var(--ac);border-color:var(--ac);">
      📤 Import JSON <input type="file" id="import-json-input" accept=".json" style="display:none;" onchange="importDataFromJson(event)">
    </label>
    <button type="button" onclick="exportSingleSeasonHtml(selectedSeason)" style="color:var(--gold-bright);border-color:var(--gold);">📄 Export Active Season HTML</button>

<nav id="tabs">

  <button type="button" data-v="roster">📋 Squad Rosters</button>
  <button type="button" data-v="transfers">🔄 Transfer Window</button>
  <button type="button" data-v="cadenza_cup">👑 Champions Cup</button>
  <button type="button" data-v="cabinet">🏆 All-Time Trophy Cabinet</button>
  <button type="button" data-v="hof_players">⭐ Player Hall of Fame</button>
  <button type="button" data-v="eras">📜 Historical Chronicles</button>
  <button type="button" data-v="ledger">📋 Roll of Honour (Season 1 Onward)</button>
</nav>

<div class="container" id="app"></div>

<div class="modal-overlay" id="archive-modal" onclick="if(event.target===this)closeArchiveModal()">
  <div class="modal-box">
    <div class="modal-header">
      <div>
        <span class="kicker" style="margin:0;" id="am-kicker">Gazette Dossier</span>
        <h3 class="modal-title" id="am-title">Dossier Title</h3>

      <button type="button" class="modal-close-btn" onclick="closeArchiveModal()">✕</button>
    </div>
    <div class="modal-body" id="am-body"></div>
  </div>
</div>

    <div><span>Select Season: </span><select id="se-sel" onchange="changeSe(+this.value)"></select></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;" id="comp-nav">
      <button class="btn active" onclick="setCompMode('league',0,this)">Premier Championship</button>
      <button class="btn" onclick="setCompMode('league',1,this)">Second Division</button>
      <button class="btn" style="color:var(--gold-bright);" onclick="setCompMode('pl',0,this)">🏆 Premier Playoffs</button>
      <button class="btn" style="color:var(--ac);" onclick="setCompMode('fa',0,this)">🛡️ FA Challenge Cup</button>
      <button class="btn" style="color:#fdba74;" onclick="setCompMode('lc',0,this)">🏅 League Cup</button>
      <button class="btn" style="color:var(--purple);" onclick="setCompMode('rc',0,this)">👑 Champions Cup</button>
    </div>
  </div>
  <div id="app"></div>
</div>
<div class="modal" id="modal" onclick="if(event.target===this||event.target.classList.contains('close-btn'))this.classList.remove('active')">
  <div class="m-box" id="m-body"></div>
</div>

<script id="raw-data" type="application/json">__DATA_PLACEHOLDER__</script>

<script>
var DATA = JSON.parse(document.getElementById('raw-data').textContent);
var curSe = DATA.startSe, curMode = "league", curT = 0, curJornada = 1;
var T_NAMES = ["Premier Championship", "Second Division"];
var FIRST_NAMES = DATA.firstNames || [];
var LAST_NAMES = DATA.lastNames || [];

function nameFromId(n){
  var F = FIRST_NAMES.length, L = LAST_NAMES.length, pairs = F * L;
  if(n < pairs){ var k = (n * 7919) % pairs; return FIRST_NAMES[k % F] + ' ' + LAST_NAMES[Math.floor(k / F)]; }
  var m = n - pairs, total = pairs * L, k2 = (m * 104729) % total;
  return FIRST_NAMES[k2 % F] + ' ' + LAST_NAMES[Math.floor(k2 / F) % L] + ' ' + LAST_NAMES[Math.floor(k2 / pairs)];
}

function getC(id){ return (id !== null && id !== undefined) ? (DATA.clubNames[id] || ('Club #' + id)) : 'TBD'; }

function init(){
  document.getElementById('header-sub').textContent = 'Comprehensive Match Archive · Season ' + DATA.startSe + ' to ' + DATA.endSe;
  var sel = document.getElementById('se-sel');
  sel.innerHTML = '';
  for(var s = DATA.startSe; s <= DATA.endSe; s++){
    if(DATA.seasons[s]) sel.innerHTML += '<option value="' + s + '">Season ' + s + '</option>';
  }
  render();
}

function changeSe(s){ curSe = s; curJornada = 1; render(); }

function setCompMode(mode, tier, btnEl){
  curMode = mode;
  if(tier !== undefined) curT = tier;
  var btns = document.querySelectorAll('#comp-nav button');
  btns.forEach(function(b){ b.classList.remove('active'); });
  if(btnEl) btnEl.classList.add('active');
  render();
}

function getBracketStats(b){
  var scorers = {}, assisters = {};
  if(!b) return { scorers: [], assisters: [] };
  var matches = (b.qf || []).concat(b.sf || [], b.final ? [b.final] : [], b.thirdPlace ? [b.thirdPlace] : []);
  matches.forEach(function(m){
    if(!m || !m.res) return;
    var allEv = (m.res.hEvents || []).concat(m.res.aEvents || []);
    allEv.forEach(function(ev){
      var scId = ev[0], asId = ev[1];
      if(scId) scorers[scId] = (scorers[scId] || 0) + 1;
      if(asId) assisters[asId] = (assisters[asId] || 0) + 1;
    });
  });
  var sortList = function(map){
    return Object.keys(map).map(function(id){ return { id: +id, count: map[id] }; }).sort(function(a, b){ return b.count - a.count; });
  };
  return { scorers: sortList(scorers), assisters: sortList(assisters) };
}

function openPlayerSeasonLog(pId){
  var sn = DATA.seasons[curSe]; if(!sn || !sn.league) return;
  var L = sn.league[curT];
  var totalJ = (L.table.length - 1) * 2;
  var logRows = [];
  var pName = nameFromId(pId);
  var pClub = -1;

  for(var j = 0; j < totalJ; j++){
    var jMatches = (L.jornadas && L.jornadas[j]) ? L.jornadas[j] : [];
    for(var m = 0; m < jMatches.length; m++){
      var match = jMatches[m];
      var inH = (match[6] || []).indexOf(pId) !== -1 || (match[8] || []).indexOf(pId) !== -1;
      var inA = (match[7] || []).indexOf(pId) !== -1 || (match[9] || []).indexOf(pId) !== -1;
      if(inH){ pClub = match[0]; break; }
      if(inA){ pClub = match[1]; break; }
    }
    if(pClub !== -1) break;
  }

  if(pClub === -1){ alert('Player not registered in this tier for Season ' + curSe); return; }

  var totalMins = 0, totalStarts = 0, totalSubsIn = 0, totalUnused = 0, totalGoals = 0, totalAssists = 0;
  for(var j2 = 0; j2 < totalJ; j2++){
    var jMatches2 = (L.jornadas && L.jornadas[j2]) ? L.jornadas[j2] : [];
    var match2 = jMatches2.find(function(x){ return x[0] === pClub || x[1] === pClub; });
    if(!match2) continue;

    var isHome = match2[0] === pClub;
    var opp = isHome ? match2[1] : match2[0];
    var scoreTxt = isHome ? (match2[2] + ' - ' + match2[3]) : (match2[3] + ' - ' + match2[2]);
    var xi = isHome ? (match2[6] || []) : (match2[7] || []);
    var bench = isHome ? (match2[8] || []) : (match2[9] || []);
    var subs = isHome ? (match2[10] || []) : (match2[11] || []);
    var evs = isHome ? (match2[4] || []) : (match2[5] || []);
    var subIn = subs.find(function(sb){ return sb[1] === pId; });
    var subOut = subs.find(function(sb){ return sb[0] === pId; });
    var statusTxt = '<span style="color:#64748b;">Not in Squad</span>';
    var matchMin = 0;

    if(xi.indexOf(pId) !== -1){
      totalStarts++;
      if(subOut){ matchMin = subOut[2]; statusTxt = '<b style="color:var(--gold-bright);">Starter (XI)</b> <span style="color:var(--danger);">[Out ' + subOut[2] + 'm]</span>'; }
      else { matchMin = 90; statusTxt = '<b style="color:var(--gold-bright);">Starter (90m)</b>'; }
    } else if(subIn){
      totalSubsIn++; matchMin = 90 - subIn[2]; statusTxt = '<b style="color:var(--ok);">Sub In (' + subIn[2] + 'm)</b>';
    } else if(bench.indexOf(pId) !== -1){
      totalUnused++; statusTxt = '<span style="color:var(--muted);">Bench (Unused)</span>';
    }

    totalMins += matchMin;
    var gCount = evs.filter(function(e){ return e[0] === pId; }).length;
    var aCount = evs.filter(function(e){ return e[1] === pId; }).length;
    totalGoals += gCount; totalAssists += aCount;
    var kontrib = [];
    if(gCount > 0) kontrib.push('⚽ ' + gCount + ' G');
    if(aCount > 0) kontrib.push('🎯 ' + aCount + ' A');

    logRows.push('<tr><td class="mono">M.' + (j2 + 1) + '</td><td>' + (isHome ? 'vs ' : '@ ') + getC(opp) + '</td><td class="mono">' + scoreTxt + '</td><td>' + statusTxt + '</td><td class="mono" style="color:var(--gold-bright);">' + matchMin + 'm</td><td style="color:var(--gold-bright);font-weight:600;">' + (kontrib.join(' · ') || '—') + '</td></tr>');
  }

  var totalApps = totalStarts + totalSubsIn;
  var summaryBanner = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:14px;">' +
    '<div style="background:#111827;border:1px solid #1e293b;padding:8px;border-radius:6px;text-align:center;"><span style="font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;">Total Minutes</span><b class="mono" style="display:block;font-size:16px;color:var(--gold-bright);">' + totalMins + 'm</b></div>' +
    '<div style="background:#111827;border:1px solid #1e293b;padding:8px;border-radius:6px;text-align:center;"><span style="font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;">Appearances</span><b class="mono" style="display:block;font-size:16px;color:var(--ac);">' + totalApps + ' Matches</b></div>' +
    '<div style="background:#111827;border:1px solid #1e293b;padding:8px;border-radius:6px;text-align:center;"><span style="font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;">Starts / Subs</span><b class="mono" style="display:block;font-size:15px;color:#cbd5e1;">' + totalStarts + ' / ' + totalSubsIn + '</b></div>' +
    '<div style="background:#111827;border:1px solid #1e293b;padding:8px;border-radius:6px;text-align:center;"><span style="font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;">Unused Bench</span><b class="mono" style="display:block;font-size:15px;color:var(--muted);">' + totalUnused + 'x</b></div>' +
    '<div style="background:#111827;border:1px solid #1e293b;padding:8px;border-radius:6px;text-align:center;"><span style="font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;">Goals / Assists</span><b class="mono" style="display:block;font-size:15px;color:var(--gold-bright);">⚽ ' + totalGoals + ' · 🎯 ' + totalAssists + '</b></div>' +
  '</div>';

  document.getElementById('m-body').innerHTML = '<h2 style="color:var(--gold-bright);margin-top:0;">' + pName + ' (' + getC(pClub) + ')</h2><h4 style="color:var(--ac);margin-bottom:10px;">📋 Matchday Report Season ' + curSe + ' (' + T_NAMES[curT] + ')</h4>' + summaryBanner + '<div style="overflow-x:auto;max-height:55vh;"><table><tr><th>Matchday</th><th>Opponent</th><th>Score</th><th>Status</th><th>Minutes</th><th>Contributions</th></tr>' + logRows.join('') + '</table></div><div style="text-align:right;margin-top:12px;"><button class="btn close-btn">Close</button></div>';
  document.getElementById('modal').classList.add('active');
}

function openDossier(tIdx, jIdx, mIdx){
  var sn = DATA.seasons[curSe];
  var m = sn.league[tIdx].jornadas[jIdx][mIdx];
  showMatchModal(m, 'Matchday ' + (jIdx + 1));
}

function openBracketMatchDossier(compKey, stage, idx){
  var sn = DATA.seasons[curSe];
  var b = compKey === 'pl' ? sn.super8 : (compKey === 'fa' ? sn.faBracket : (compKey === 'rc' ? sn.rcBracket : sn.lcBracket));
  var m = stage === 'qf' ? b.qf[idx] : (stage === 'sf' ? b.sf[idx] : (stage === 'third' ? b.thirdPlace : b.final));
  if(!m || !m.res) return;
  var matchArr = [m.h, m.a, m.res.gh, m.res.ga, m.res.hEvents || [], m.res.aEvents || [], [], [], [], [], m.res.hSubs || [], m.res.aSubs || []];
  showMatchModal(matchArr, 'Knockout Stage (' + stage.toUpperCase() + ')');
}

function showMatchModal(m, subTitle){
  var allEv = [];
  (m[4] || []).forEach(function(e){ allEv.push({type:'goal', t:m[0], sc:e[0], as:e[1], min:e[2]}); });
  (m[5] || []).forEach(function(e){ allEv.push({type:'goal', t:m[1], sc:e[0], as:e[1], min:e[2]}); });
  (m[10] || []).forEach(function(s){ allEv.push({type:'sub', t:m[0], out:s[0], in:s[1], min:s[2]}); });
  (m[11] || []).forEach(function(s){ allEv.push({type:'sub', t:m[1], out:s[0], in:s[1], min:s[2]}); });
  allEv.sort(function(a,b){ return a.min - b.min; });

  var evHtml = allEv.length ? allEv.map(function(e){
    if(e.type === 'goal'){ return '<div class="t-item"><span class="m-badge">' + e.min + 'm</span><div>⚽ <b><a style="color:#38bdf8;cursor:pointer;" onclick="openPlayerSeasonLog(' + e.sc + ')">' + nameFromId(e.sc) + '</a></b> (' + getC(e.t) + ')' + (e.as ? ' · Assist: <b>' + nameFromId(e.as) + '</b>' : '') + '</div></div>'; }
    else { return '<div class="t-item"><span class="m-badge" style="color:#fdba74;">' + e.min + 'm</span><div style="color:var(--muted);">🔄 (' + getC(e.t) + ') IN: <b><a style="color:#4ade80;cursor:pointer;" onclick="openPlayerSeasonLog(' + e.in + ')">' + nameFromId(e.in) + '</a></b> ➔ OUT: <b>' + nameFromId(e.out) + '</b></div></div>'; }
  }).join('') : '<p style="color:var(--muted);">No key events recorded.</p>';

  var renderXI = function(ids){ return ids.length ? ids.map(function(id,i){ return '<div style="padding:2px 0;cursor:pointer;" onclick="openPlayerSeasonLog(' + id + ')"><b>' + (i + 1) + '.</b> <span style="color:var(--ac);text-decoration:underline;">' + nameFromId(id) + '</span></div>'; }).join('') : '<span style="color:var(--muted);">Lineup archived.</span>'; };
  var hXi = renderXI(m[6] || []), aXi = renderXI(m[7] || []);
  var hBench = renderXI(m[8] || []), aBench = renderXI(m[9] || []);

  document.getElementById('m-body').innerHTML = '<h2 style="color:var(--gold-bright);margin-top:0;">' + getC(m[0]) + ' ' + m[2] + ' - ' + m[3] + ' ' + getC(m[1]) + '</h2><h4 style="color:var(--ac);margin-bottom:6px;">⏱️ Match Events &amp; Substitutions (' + subTitle + ')</h4><div style="margin-bottom:14px;">' + evHtml + '</div><div style="font-size:11px;color:var(--gold-bright);margin-bottom:8px;">💡 Click player name to view <b>Personal Matchday Log</b>.</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:12px;"><div style="background:#111827;padding:10px;border-radius:6px;"><b>Lineup: ' + getC(m[0]) + '</b>' + hXi + '<div style="font-weight:700;margin-top:8px;color:var(--muted);">Substitutes:</div>' + hBench + '</div><div style="background:#111827;padding:10px;border-radius:6px;"><b>Lineup: ' + getC(m[1]) + '</b>' + aXi + '<div style="font-weight:700;margin-top:8px;color:var(--muted);">Substitutes:</div>' + aBench + '</div></div><div style="text-align:right;margin-top:12px;"><button class="btn close-btn">Close</button></div>';
  document.getElementById('modal').classList.add('active');
}

function renderBracketView(b, compTitle, compKey){
  if(!b) return '<div class="card"><p style="color:var(--muted);">Bracket uninitialized for this season.</p></div>';
  var st = getBracketStats(b);

  var makeStatTable = function(list, label){
    if(!list.length) return '<p style="color:var(--muted);font-size:12px;padding:6px 0;">No tournament records.</p>';
    return '<table><tr><th>#</th><th>Player</th><th>' + label + '</th></tr>' + list.slice(0, 5).map(function(x, i){ return '<tr><td class="mono">' + (i + 1) + '</td><td><b>' + nameFromId(x.id) + '</b></td><td class="mono" style="color:var(--gold-bright);font-weight:700;">' + x.count + '</td></tr>'; }).join('') + '</table>';
  };

  var statsHeaderHtml = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:14px;">' +
    '<div style="background:#111827;border:1px solid #1e293b;border-radius:8px;padding:12px;"><h4 style="color:var(--gold-bright);margin:0 0 8px 0;">⚽ Tournament Golden Boot</h4>' + makeStatTable(st.scorers, 'Goals') + '</div>' +
    '<div style="background:#111827;border:1px solid #1e293b;border-radius:8px;padding:12px;"><h4 style="color:var(--ac);margin:0 0 8px 0;">🎯 Tournament Assists Leader</h4>' + makeStatTable(st.assisters, 'Assists') + '</div>' +
  '</div>';

  var renderMatchLine = function(m, stage, idx){
    if(!m) return '';
    var res = m.res;
    var sc = res ? (res.gh + ' - ' + res.ga + (res.penH !== null ? ' (' + res.penH + 'p)' : '')) : 'VS';
    var wH = res && res.winner === m.h;
    var wA = res && res.winner === m.a;
    var goalsH = (res && res.hEvents && res.hEvents.length) ? res.hEvents.map(function(e){ return nameFromId(e[0]) + ' (' + e[2] + 'm)'; }).join(', ') : '';
    var goalsA = (res && res.aEvents && res.aEvents.length) ? res.aEvents.map(function(e){ return nameFromId(e[0]) + ' (' + e[2] + 'm)'; }).join(', ') : '';
    var btnHtml = res ? ('<div style="text-align:center;margin-top:6px;"><button class="score-btn" onclick="openBracketMatchDossier(\'' + compKey + '\',\'' + stage + '\',' + idx + ')">' + sc + '</button></div>') : '';

    return '<div class="match-box">' +
      '<div class="match-line ' + (wH ? 'match-winner' : '') + '"><span>' + getC(m.h) + '</span><b>' + (res ? res.gh : '') + '</b></div>' +
      (goalsH ? '<div class="goal-tag">⚽ ' + goalsH + '</div>' : '') +
      '<div class="match-line ' + (wA ? 'match-winner' : '') + '"><span>' + getC(m.a) + '</span><b>' + (res ? res.ga : '') + '</b></div>' +
      (goalsA ? '<div class="goal-tag">⚽ ' + goalsA + '</div>' : '') +
      btnHtml +
    '</div>';
  };

  var qfHtml = b.qf.map(function(m, i){ return renderMatchLine(m, 'qf', i); }).join('');
  var sfHtml = b.sf.map(function(m, i){ return renderMatchLine(m, 'sf', i); }).join('');
  var fHtml = renderMatchLine(b.final, 'final', 0);
  var thHtml = b.thirdPlace ? renderMatchLine(b.thirdPlace, 'third', 0) : '';

  return '<div class="card"><h2 style="color:var(--gold-bright);margin:0 0 10px 0;">' + compTitle + ' (Season ' + curSe + ')</h2>' + statsHeaderHtml + '<div class="bracket-grid"><div class="bracket-col"><h4 style="color:var(--gold);margin-bottom:8px;">Quarter-Finals (QF)</h4>' + qfHtml + '</div><div class="bracket-col"><h4 style="color:var(--gold);margin-bottom:8px;">Semi-Finals (SF)</h4>' + sfHtml + '</div>' + (b.thirdPlace ? '<div class="bracket-col" style="border-top-color:#fdba74;"><h4 style="color:#fdba74;margin-bottom:8px;">Third Place Playoff</h4>' + thHtml + '</div>' : '') + '<div class="bracket-col" style="border-top-color:var(--gold-bright);"><h4 style="color:var(--gold-bright);margin-bottom:8px;">Grand Final 🏆</h4>' + fHtml + '</div></div></div>';
}

function render(){
  var sn = DATA.seasons[curSe]; if(!sn) return;
  if(curMode === 'pl') return document.getElementById('app').innerHTML = renderBracketView(sn.super8, '🏆 Premier Championship — Playoffs (Elite Eight)', 'pl');
  if(curMode === 'fa') return document.getElementById('app').innerHTML = renderBracketView(sn.faBracket, '🛡️ Heritage FA Challenge Cup', 'fa');
  if(curMode === 'lc') return document.getElementById('app').innerHTML = renderBracketView(sn.lcBracket, '🏅 League Cup Championship', 'lc');
  if(curMode === 'rc') return document.getElementById('app').innerHTML = renderBracketView(sn.rcBracket, '👑 Champions Cup / Masters Shield', 'rc');

  var L = sn.league[curT];
  var totalJ = (L.table.length - 1) * 2;
  if(curJornada > totalJ) curJornada = totalJ;
  if(curJornada < 1) curJornada = 1;
  var shChamp = sn.leagueShieldWinner !== null ? getC(sn.leagueShieldWinner) : '—';
  var poChamp = sn.rank1to4 ? getC(sn.rank1to4[0]) : '—';

  var tableRows = L.table.map(function(r, i){
    return '<tr><td class="mono">' + (i + 1) + '</td><td><b>' + getC(r[0]) + '</b></td><td class="mono">' + totalJ + '</td><td class="mono">' + r[1] + '</td><td class="mono">' + r[2] + '</td><td class="mono">' + r[3] + '</td><td class="mono">' + r[4] + '</td><td class="mono">' + r[5] + '</td><td class="mono">' + (r[4] - r[5]) + '</td><td class="mono" style="color:var(--gold-bright);font-weight:bold;">' + r[6] + '</td></tr>';
  }).join('');

  var tierClubs = sn.tiers[curT] || [];
  var allScorers = (L.scorers && L.scorers.length) ? L.scorers : (sn.scorers || []);
  var tierScorers = allScorers.filter(function(x){ return tierClubs.indexOf(x[2]) !== -1; });
  var scorerRows = tierScorers.slice(0, 15).map(function(x, i) {
    return '<tr><td class="mono">' + (i + 1) + '</td><td><b><a style="color:#38bdf8;cursor:pointer;" onclick="openPlayerSeasonLog(' + x[0] + ')">' + (x[1] || nameFromId(x[0])) + '</a></b></td><td>' + getC(x[2]) + '</td><td class="mono" style="color:var(--gold-bright);font-weight:700;">' + x[3] + '</td><td class="mono">' + x[4] + '</td></tr>';
  }).join('');

  var allAssisters = (L.assisters && L.assisters.length) ? L.assisters : (sn.assisters || []);
  var tierAssisters = allAssisters.filter(function(x){ return tierClubs.indexOf(x[2]) !== -1; });
  var assistRows = tierAssisters.slice(0, 10).map(function(x, i) {
    return '<tr><td class="mono">' + (i + 1) + '</td><td><b><a style="color:#38bdf8;cursor:pointer;" onclick="openPlayerSeasonLog(' + x[0] + ')">' + (x[1] || nameFromId(x[0])) + '</a></b></td><td>' + getC(x[2]) + '</td><td class="mono" style="color:var(--ac);font-weight:700;">' + x[4] + '</td><td class="mono">' + x[3] + '</td></tr>';
  }).join('');

  var jMatches = (L.jornadas && L.jornadas[curJornada - 1]) ? L.jornadas[curJornada - 1] : [];
  var fixRows = jMatches.map(function(m, idx){
    return '<tr><td class="mono">' + (idx + 1) + '</td><td style="text-align:right;">' + getC(m[0]) + '</td><td style="text-align:center;"><button class="score-btn" onclick="openDossier(' + curT + ',' + (curJornada - 1) + ',' + idx + ')">' + m[2] + ' - ' + m[3] + '</button></td><td>' + getC(m[1]) + '</td></tr>';
  }).join('');

  var jOpts = '';
  for(var j = 1; j <= totalJ; j++) jOpts += '<option value="' + j + '"' + (j === curJornada ? ' selected' : '') + '>Matchday ' + j + '</option>';

  var tablesLeaderboard = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-bottom:16px;">' +

    var matchFitness = p.ovr + formRoll - ageFatigue;

  var gk = ratedSquad.filter(function(x){ return x.p.pos === 'GK'; }).sort(byScore);
  var def = ratedSquad.filter(function(x){ return x.p.pos === 'DF'; }).sort(byScore);

  var fwd = ratedSquad.filter(function(x){ return x.p.pos === 'FW'; }).sort(byScore);

  var xi = [];
  if (gk[0]) xi.push(gk[0].p);
  for (var i = 0; i < 4 && i < def.length; i++) xi.push(def[i].p);
  for (var j = 0; j < 4 && j < med.length; j++) xi.push(med[j].p);
  for (var k = 0; k < 2 && k < fwd.length; k++) xi.push(fwd[k].p);

  var usedIds = new Set(xi.map(function(p){ return p.id; }));
  ratedSquad.sort(byScore).forEach(function(item){
    if (xi.length < 11 && !usedIds.has(item.p.id)) {
      xi.push(item.p);
      usedIds.add(item.p.id);
    }
  });

  var bench = squad.filter(function(p){ return !usedIds.has(p.id); }).sort(function(a, b){ return b.ovr - a.ovr; });

}

    var seller = chosen.seller;

    var bSquad = PLAYERS_DB[buyer] || [];
    var sSquad = PLAYERS_DB[seller] || [];
    if (sSquad.length <= 18 || bSquad.length >= 26) return;

    PLAYERS_DB[seller] = sSquad.filter(function(x){ return x.id !== star.id; });
    star.club = buyer;
    star.seasonsAtClub = 1;
    PLAYERS_DB[buyer].push(star);

    transfersLog.push({ pId: star.id, pName: star.name, pos: star.pos, ovr: star.ovr, from: seller, to: buyer, type: 'Marquee Signing' });
  });

  allClubs.forEach(function(buyer) {
    var bPr = S.prestige[buyer] || 70;
    if (r() >= 0.50) return;
    var seller = allClubs[Math.floor(r() * allClubs.length)];
    if (seller === buyer) return;

    var sSquad = PLAYERS_DB[seller] || [];
    var bSquad = PLAYERS_DB[buyer] || [];
    if (sSquad.length <= 18 || bSquad.length >= 26) return;

    var cand = sSquad.filter(function(p){ return p.age >= 19 && p.age <= 32 && Math.abs(p.ovr - bPr) <= 9; });
    if (!cand.length) return;
    var target = cand[Math.floor(r() * cand.length)];

    PLAYERS_DB[seller] = sSquad.filter(function(x){ return x.id !== target.id; });
    target.club = buyer;
    target.seasonsAtClub = 1;
    PLAYERS_DB[buyer].push(target);

    transfersLog.push({ pId: target.id, pName: target.name, pos: target.pos, ovr: target.ovr, from: seller, to: buyer, type: 'Open Window Transfer' });
  });

  allClubs.forEach(function(cId) {
    var sq = PLAYERS_DB[cId];
    while (sq.length < SQUAD_SIZE) sq.push(makeYouth(cId, POS_LAYOUT[sq.length % POS_LAYOUT.length], se, r));
    while (sq.length > 25) {
      sq.sort(function(a, b){ return a.ovr - b.ovr; });
      var dropped = sq.shift();
      var lowClub = rankedClubs[rankedClubs.length - 1 - Math.floor(r() * 10)];
      if (lowClub && PLAYERS_DB[lowClub].length < 25) {
        dropped.club = lowClub;
        PLAYERS_DB[lowClub].push(dropped);
      }
    }
  });

  return transfersLog;
}

function buildPlayerIndex() {
  var m = {};
  Object.keys(PLAYERS_DB).forEach(function(c) { PLAYERS_DB[c].forEach(function(p) { m[p.id] = p; }); });
  return m;
}

function getMaxSeasonInArchive() {
  if (!H || !H.seasons) return 1;
  var keys = Object.keys(H.seasons).map(Number);
  return keys.length ? Math.max.apply(null, keys) : 1;
}

function getErasDefinition() {
  var total = getMaxSeasonInArchive();
  var span = Math.max(50, Math.ceil(total / 4));
  return [
    { id: 1, name: "Era of the British Pioneers", range: [1, span], desc: "Establishment of the national 370-club pyramid and the 32-club Premier Championship." },
    { id: 2, name: "Era of Expansion & County Shields", range: [span + 1, span * 2], desc: "Expansion of regional powerhouses and national knockout cup supremacy." },
    { id: 3, name: "Golden Era of Tactical Mastery", range: [span * 2 + 1, span * 3], desc: "Modern tactical revolution and the inception of the end-of-season Champions Cup." },
    { id: 4, name: "Era of Perpetuity & Parity", range: [span * 3 + 1, Math.max(total, span * 4)], desc: "Balanced two-tier marathon and the endless pursuit of dynasty glory." }

function takeSnapshot(se) {

    se: se,

  };
}

function recalculateTableUpToJornada(tierData, playedJornadas) {
  var stats = {};
  tierData.table.forEach(function(r) {
    stats[r[0]] = { id: r[0], W: 0, D: 0, L: 0, GF: 0, GA: 0, pts: 0 };
  });

  for (var j = 0; j < playedJornadas; j++) {
    var matches = tierData.jornadas[j] || [];
    matches.forEach(function(m) {
      var h = stats[m[0]], a = stats[m[1]], gh = m[2], ga = m[3];
      h.GF += gh; h.GA += ga;
      a.GF += ga; a.GA += gh;
      if (gh > ga) { h.W++; h.pts += 3; a.L++; }
      else if (gh < ga) { a.W++; a.pts += 3; h.L++; }
      else { h.D++; h.pts += 1; a.D++; a.pts += 1; }
    });
  }

  var res = [];
  Object.keys(stats).forEach(function(k){
    var x = stats[k];
    res.push([x.id, x.W, x.D, x.L, x.GF, x.GA, x.pts]);
  });
  return res.sort(function(a, b) {
    return (b[6] - a[6]) || ((b[4] - b[5]) - (a[4] - a[5])) || (b[4] - a[4]) || (a[0] - b[0]);
  });
}

function buildLineupWeights(lineup) {
  var cs = [], ca = [], ts = 0, ta = 0;
  for (var i = 0; i < lineup.length; i++) {
    var p = lineup[i];
    var f = Math.pow(Math.max(1, p.ovr - 40) / 50, 3);
    ts += POS_SCORE_W[p.pos] * f;
    ta += POS_ASSIST_W[p.pos] * f;
    cs.push(ts); ca.push(ta);
  }
  return { cs: cs, ca: ca, ts: ts, ta: ta };
}

function pickIdx(cum, total, r) {
  var x = r() * total;
  for (var i = 0; i < cum.length; i++) if (x <= cum[i]) return i;
  return cum.length - 1;
}

function generateMatchEventsWithSubs(xi, bench, goals, rr) {
  var subs = [];
  var currentXI = xi.slice();
  var benchPool = bench.slice();
  var playerMinutes = {};
  
  xi.forEach(function(p){ playerMinutes[p.id] = 90; });
  bench.forEach(function(p){ playerMinutes[p.id] = 0; });

  var subMinutes = [
    55 + Math.floor(rr() * 10),
    66 + Math.floor(rr() * 10),
    76 + Math.floor(rr() * 10)
  ].sort(function(a, b){ return a - b; });

  for (var s = 0; s < 3 && benchPool.length > 0; s++) {
    var sMin = subMinutes[s];
    var outCandidates = currentXI.filter(function(p){ return p.pos !== 'GK'; });
    if (!outCandidates.length) break;
    
    var outP = outCandidates[Math.floor(rr() * outCandidates.length)];
    var outIdx = currentXI.indexOf(outP);

    var matchingSubs = benchPool.filter(function(bp){ return bp.pos === outP.pos; });
    var inP = null;
    if (matchingSubs.length > 0 && rr() < 0.75) {
      inP = matchingSubs[Math.floor(rr() * matchingSubs.length)];
    } else {
      var nonGkBench = benchPool.filter(function(bp){ return bp.pos !== 'GK'; });
      inP = nonGkBench.length ? nonGkBench[Math.floor(rr() * nonGkBench.length)] : benchPool[0];
    }

    if (!inP) break;

    subs.push([outP.id, inP.id, sMin]);
    playerMinutes[outP.id] = sMin;
    playerMinutes[inP.id] = 90 - sMin;

    currentXI[outIdx] = inP;
    benchPool = benchPool.filter(function(bp){ return bp.id !== inP.id; });
  }

  var weightsEarly = buildLineupWeights(xi);
  var weightsLate = buildLineupWeights(currentXI);
  var events = [];

  for (var k = 0; k < goals; k++) {
    var minute = Math.floor(rr() * 90) + 1;
    var pool = (minute < 65) ? xi : currentXI;
    var w = (minute < 65) ? weightsEarly : weightsLate;

    var si = pickIdx(w.cs, w.ts, rr);
    var scorer = pool[si];
    scorer.tempG = (scorer.tempG || 0) + 1;

    var assistId = null;
    if (rr() < 0.75) {
      var ai = pickIdx(w.ca, w.ta, rr);
      if (ai === si) ai = pickIdx(w.ca, w.ta, rr);
      if (ai !== si) {
        var assister = pool[ai];
        assister.tempA = (assister.tempA || 0) + 1;
        assistId = assister.id;
      }
    }
    events.push([scorer.id, assistId, minute]);
  }
  events.sort(function(a, b){ return a[2] - b[2]; });

  return { events: events, subs: subs, minutes: playerMinutes };
}

function generateRoundRobinSchedule(teams) {
  var n = teams.length;
  var rounds = [];
  var list = teams.slice();
  var totalRounds = n - 1;
  var half = n / 2;

  for (var r = 0; r < totalRounds; r++) {
    var roundMatches = [];
    for (var i = 0; i < half; i++) {
      var home = list[i];
      var away = list[n - 1 - i];
      if (r % 2 === 1) {
        var tmp = home; home = away; away = tmp;
      }
      roundMatches.push([home, away]);
    }
    rounds.push(roundMatches);
    var fixed = list[0];
    var rest = list.slice(1);
    rest.unshift(rest.pop());
    list = [fixed].concat(rest);
  }

  var secondHalfRounds = rounds.map(function(roundMatches) {
    return roundMatches.map(function(m){ return [m[1], m[0]]; });
  });

  return rounds.concat(secondHalfRounds);
}

function playTierLeague(clubs, t, se) {
  var rr = pseudoRandom(se * 10007 + t * 7919 + 13);
  var schedule = generateRoundRobinSchedule(clubs);
  var totalJornadas = schedule.length;
  
  var clubMap = {};
  clubs.forEach(function(c) {
    var sq = PLAYERS_DB[c];
    clubMap[c] = {
      id: c,
      sq: sq,
      str: clubStrength(c) + (rr() - 0.5) * 5,
      W: 0, D: 0, L: 0, GF: 0, GA: 0
    };
  });

  var jornadasData = [];

  for (var jIdx = 0; jIdx < totalJornadas; jIdx++) {
    var fixturesThisJornada = [];
    var pairings = schedule[jIdx];

    for (var mIdx = 0; mIdx < pairings.length; mIdx++) {
      var hId = pairings[mIdx][0];
      var aId = pairings[mIdx][1];
      var home = clubMap[hId];
      var away = clubMap[aId];

      var hLineup = pickStartingXI(home.sq, rr);
      var aLineup = pickStartingXI(away.sq, rr);

      var diff = (home.str + 2) - away.str;
      var lh = Math.max(0.85, Math.min(3.8, 1.48 * Math.exp(diff / 22)));
      var la = Math.max(0.65, Math.min(3.5, 1.18 * Math.exp(-diff / 22)));
      var gh = generatePoissonGoals(lh, rr);
      var ga = generatePoissonGoals(la, rr);

      home.GF += gh; home.GA += ga; away.GF += ga; away.GA += gh;
      if (gh > ga) { home.W++; away.L++; }
      else if (gh < ga) { away.W++; home.L++; }
      else { home.D++; away.D++; }

      home.sq.forEach(function(p){ p.tempG = 0; p.tempA = 0; });
      away.sq.forEach(function(p){ p.tempG = 0; p.tempA = 0; });

      var hSim = generateMatchEventsWithSubs(hLineup.xi, hLineup.bench, gh, rr);
      var aSim = generateMatchEventsWithSubs(aLineup.xi, aLineup.bench, ga, rr);

      hLineup.xi.forEach(function(p){ p.sstart = (p.sstart || 0) + 1; });
      aLineup.xi.forEach(function(p){ p.sstart = (p.sstart || 0) + 1; });

      home.sq.forEach(function(p){
        var mins = hSim.minutes[p.id] || 0;
        p.sg = (p.sg || 0) + (p.tempG || 0);
        p.sa = (p.sa || 0) + (p.tempA || 0);
        p.smin = (p.smin || 0) + mins;
        if (mins > 0) p.sapp = (p.sapp || 0) + 1;
      });

      away.sq.forEach(function(p){
        var mins = aSim.minutes[p.id] || 0;
        p.sg = (p.sg || 0) + (p.tempG || 0);
        p.sa = (p.sa || 0) + (p.tempA || 0);
        p.smin = (p.smin || 0) + mins;
        if (mins > 0) p.sapp = (p.sapp || 0) + 1;
      });

      fixturesThisJornada.push([
        home.id, away.id, gh, ga,
        hSim.events, aSim.events,
        hLineup.xi.map(function(p){ return p.id; }),
        aLineup.xi.map(function(p){ return p.id; }),
        hLineup.bench.map(function(p){ return p.id; }),
        aLineup.bench.map(function(p){ return p.id; }),
        hSim.subs, aSim.subs
      ]);
    }
    jornadasData.push(fixturesThisJornada);
  }

  var table = clubs.map(function(cId) {
    var x = clubMap[cId];
    return [x.id, x.W, x.D, x.L, x.GF, x.GA, (x.W * 3 + x.D)];
  }).sort(function(a, b) {
    return (b[6] - a[6]) || ((b[4] - b[5]) - (a[4] - a[5])) || (b[4] - a[4]) || (a[0] - b[0]);
  });

  var pool = [];
  clubs.forEach(function(cId) {
    PLAYERS_DB[cId].forEach(function(p){ pool.push(p); });
  });

  var scorers = pool.slice().sort(function(a, b){ return (b.sg - a.sg) || (b.sa - a.sa) || (b.ovr - a.ovr); })
    .slice(0, 15).map(function(p){ return [p.id, p.name, p.club, p.sg, p.sa]; });
  var assisters = pool.slice().sort(function(a, b){ return (b.sa - a.sa) || (b.sg - a.sg) || (b.ovr - a.ovr); })
    .slice(0, 10).map(function(p){ return [p.id, p.name, p.club, p.sg, p.sa]; });

  return { table: table, scorers: scorers, assisters: assisters, jornadas: jornadasData };
}

// Simulasi Pekan dengan Asynchronous Rendering Anti-Lag
function advanceSingleJornada(se) {
  var s = H.seasons[se];
  if (!s || s.leagueDone) return;

  $('#status-label').textContent = 'Simulating Matchday...';

  setTimeout(function() {
    if (!s.league) {
      if (!S.undo || S.undo.se !== se) takeSnapshot(se);
      s.league = [0, 1].map(function(t){ return playTierLeague(s.tiers[t], t, se); });
      s.currentJornada = 0;
    }

    var maxJ = (s.tiers[0].length - 1) * 2;
    if (s.currentJornada < maxJ) {
      s.currentJornada++;
      selectedJornada = s.currentJornada;

      for (var t = 0; t < 2; t++) {
        s.league[t].table = recalculateTableUpToJornada(s.league[t], s.currentJornada);
      }

      if (s.currentJornada >= maxJ) {
        s.leagueDone = true;
        s.leagueShieldWinner = s.league[0].table[0][0];
        s.super8 = buildSuper8FromTable(s.league[0].table);
        s.faBracket = buildCupBracket(se, 'fa', s);
        s.lcBracket = buildCupBracket(se, 'lc', s);
        s.rcBracket = buildCupBracket(se, 'rc', s);
      }
    }

    autoSaveHistory();
    requestAnimationFrame(function() {
      render();
      $('#status-label').textContent = 'Matchday ' + s.currentJornada + ' simulated';
    });
  }, 10);
}

function simulateLeague(se, noSnap) {
  var s = H.seasons[se];
  if (!s || s.leagueDone) return;
  if (!noSnap && (!S.undo || S.undo.se !== se)) takeSnapshot(se);
  s.league = [0, 1].map(function(t){ return playTierLeague(s.tiers[t], t, se); });
  s.currentJornada = (s.tiers[0].length - 1) * 2;
  selectedJornada = s.currentJornada;
  s.leagueDone = true;
  s.leagueShieldWinner = s.league[0].table[0][0];
  s.super8 = buildSuper8FromTable(s.league[0].table);
  s.faBracket = buildCupBracket(se, 'fa', s);
  s.lcBracket = buildCupBracket(se, 'lc', s);
  s.rcBracket = buildCupBracket(se, 'rc', s);
}

function makeBracket(matchups, withThird) {
  var b = {
    qf: matchups.map(function(m, i){ return { id: i, h: m[0], a: m[1], res: null }; }),
    sf: [{ id: 0, h: null, a: null, res: null }, { id: 1, h: null, a: null, res: null }],
    final: { id: 0, h: null, a: null, res: null }
  };
  if (withThird) b.thirdPlace = { id: 0, h: null, a: null, res: null };
  return b;
}

function buildSuper8FromTable(table) {
  var q = table.slice(0, 8).map(function(r){ return r[0]; });
  return makeBracket([[q[0], q[7]], [q[3], q[4]], [q[1], q[6]], [q[2], q[5]]], true);
}

function buildCupBracket(se, type, s) {
  var r = pseudoRandom(se * 9871 + (type === 'fa' ? 7919 : (type === 'rc' ? 4433 : 3571)));
  var sel;
  if (type === 'fa') {
    var top12 = s.league[0].table.slice(0, 12).map(function(x){ return x[0]; });
    var elite6 = shuffleArr(top12, r).slice(0, 6);
    var wildPool = s.league[1].table.slice(0, 8).map(function(x){ return x[0]; });
    sel = elite6.concat(shuffleArr(wildPool, r).slice(0, 2));
  } else if (type === 'rc') {
    sel = s.tiers[0].slice().sort(function(a, b){ return clubStrength(b) - clubStrength(a); }).slice(0, 8);
  } else {
    sel = shuffleArr(s.tiers[0].concat(s.tiers[1]), r).slice(0, 8);
  }
  sel = shuffleArr(sel, r);
  return makeBracket([[sel[0], sel[1]], [sel[2], sel[3]], [sel[4], sel[5]], [sel[6], sel[7]]], false);
}

function playMatchSimulation(h, a, seedVal, isCup, se, compType) {
  var r = pseudoRandom(seedVal);
  var ovrH = clubStrength(h);
  var ovrA = clubStrength(a);

  if (compType === 'fa') {
    if (tierOfClub(se, h) === 0) ovrH += 3;
    if (tierOfClub(se, a) === 0) ovrA += 3;
    if (r() < 0.08) {
      var ud = (ovrH > ovrA) ? 'a' : 'h';
      if (ud === 'a') ovrA += (5 + Math.floor(r() * 5)); else ovrH += (5 + Math.floor(r() * 5));
    }
  } else if (compType === 'lc') {
    if (r() < 0.28) {
      var ud2 = (ovrH > ovrA) ? 'a' : 'h';
      if (ud2 === 'a') ovrA += (10 + Math.floor(r() * 8)); else ovrH += (10 + Math.floor(r() * 8));
    }
  }

  var diff = (ovrH + 2) - ovrA;
  var lambdaH = Math.max(0.85, Math.min(3.8, 1.48 * Math.exp(diff / 22)));
  var lambdaA = Math.max(0.65, Math.min(3.5, 1.18 * Math.exp(-diff / 22)));
  var gh = generatePoissonGoals(lambdaH, r);
  var ga = generatePoissonGoals(lambdaA, r);

  var hSquad = PLAYERS_DB[h] || [];
  var aSquad = PLAYERS_DB[a] || [];
  var hLineup = pickStartingXI(hSquad, r);
  var aLineup = pickStartingXI(aSquad, r);

  var hSim = generateMatchEventsWithSubs(hLineup.xi, hLineup.bench, gh, r);
  var aSim = generateMatchEventsWithSubs(aLineup.xi, aLineup.bench, ga, r);

  hLineup.xi.forEach(function(p){ p.sstart = (p.sstart || 0) + 1; });
  aLineup.xi.forEach(function(p){ p.sstart = (p.sstart || 0) + 1; });

  hSquad.forEach(function(p){
    var mins = hSim.minutes[p.id] || 0;
    p.sg = (p.sg || 0) + (p.tempG || 0);
    p.sa = (p.sa || 0) + (p.tempA || 0);
    p.smin = (p.smin || 0) + mins;
    if (mins > 0) p.sapp = (p.sapp || 0) + 1;
  });

  aSquad.forEach(function(p){
    var mins = aSim.minutes[p.id] || 0;
    p.sg = (p.sg || 0) + (p.tempG || 0);
    p.sa = (p.sa || 0) + (p.tempA || 0);
    p.smin = (p.smin || 0) + mins;
    if (mins > 0) p.sapp = (p.sapp || 0) + 1;
  });

  var penH = null, penA = null;
  if (gh === ga) {
    var scoreH = 0, scoreA = 0, remH = 5, remA = 5;
    for (var kick = 0; kick < 5; kick++) {
      if (r() < 0.76) scoreH++;
      remH--;
      if (scoreH > scoreA + remA || scoreA > scoreH + remH) break;
      if (r() < 0.74) scoreA++;
      remA--;
      if (scoreH > scoreA + remA || scoreA > scoreH + remH) break;
    }
    while (scoreH === scoreA) {
      var goalH = (r() < 0.75) ? 1 : 0;
      var goalA = (r() < 0.75) ? 1 : 0;
      scoreH += goalH; scoreA += goalA;
      if (goalH !== goalA) break;
    }
    penH = scoreH; penA = scoreA;
  }
  var winner = (gh > ga || (penH !== null && penH > penA)) ? h : a;
  var loser = (winner === h) ? a : h;
  return { 
    gh: gh, ga: ga, penH: penH, penA: penA, winner: winner, loser: loser, 
    hEvents: hSim.events, aEvents: aSim.events,
    hSubs: hSim.subs, aSubs: aSim.subs
  };
}

var SEED_MULT = { pl: 1000, fa: 7000, rc: 5500, lc: 9000 };

function getBracket(s, compType) {
  return compType === 'pl' ? s.super8 : (compType === 'fa' ? s.faBracket : (compType === 'rc' ? s.rcBracket : s.lcBracket));
}

function matchSeed(compType, stage, idx, se) {
  var m = SEED_MULT[compType];
  if (stage === 'qf') return se * m + idx * 31;
  if (stage === 'sf') return se * m + 200 + idx * 47;
  if (stage === 'third') return se * m + 555;
  return se * m + 999;
}

function playBracketMatch(b, compType, stage, idx, se) {
  var isCup = compType !== 'pl';
  var m = stage === 'qf' ? b.qf[idx] : (stage === 'sf' ? b.sf[idx] : (stage === 'third' ? b.thirdPlace : b.final));
  if (!m || m.res || m.h === null || m.a === null) return;
  m.res = playMatchSimulation(m.h, m.a, matchSeed(compType, stage, idx, se), isCup, se, compType);
}

function _simStage(compType, stage, se) {
  var s = H.seasons[se];
  if (!s || !s.leagueDone) return;
  var b = getBracket(s, compType);
  if (stage === 'qf') {
    for (var i = 0; i < 4; i++) playBracketMatch(b, compType, 'qf', i, se);
  } else if (stage === 'sf') {
    for (var j = 0; j < 2; j++) playBracketMatch(b, compType, 'sf', j, se);
  } else if (stage === 'finals') {
    if (compType === 'pl') playBracketMatch(b, compType, 'third', 0, se);
    playBracketMatch(b, compType, 'final', 0, se);
  }
  checkBracketAdvancement(compType, se);
}

function simMatch(compType, stage, idx, se) {
  var s = H.seasons[se];
  if (!s || !s.leagueDone) return;
  playBracketMatch(getBracket(s, compType), compType, stage, idx, se);
  checkBracketAdvancement(compType, se);
  autoSaveHistory();
  render();
}

function simRound(compType, stage, se) {
  _simStage(compType, stage, se);
  autoSaveHistory();
  render();
}

function checkBracketAdvancement(compType, se) {
  var sObj = H.seasons[se];
  var b = getBracket(sObj, compType);

  if (b.qf.every(function(m){ return m.res !== null; }) && b.sf[0].h === null) {
    b.sf[0].h = b.qf[0].res.winner; b.sf[0].a = b.qf[1].res.winner;
    b.sf[1].h = b.qf[2].res.winner; b.sf[1].a = b.qf[3].res.winner;
  }
  if (b.sf[0].res !== null && b.sf[1].res !== null && b.final.h === null) {
    b.final.h = b.sf[0].res.winner;
    b.final.a = b.sf[1].res.winner;
    if (compType === 'pl') {
      b.thirdPlace.h = b.sf[0].res.loser;
      b.thirdPlace.a = b.sf[1].res.loser;
    }
  }

  if (compType === 'pl') {
    if (b.final.res !== null && b.thirdPlace.res !== null) {
      sObj.rank1to4 = [b.final.res.winner, b.final.res.loser, b.thirdPlace.res.winner, b.thirdPlace.res.loser];
      sObj.t1PlayoffDone = true;
    }
  } else if (b.final.res !== null) {
    if (compType === 'fa') { sObj.faWinner = b.final.res.winner; sObj.faRunner = b.final.res.loser; sObj.faCupDone = true; }
    else if (compType === 'lc') { sObj.lcWinner = b.final.res.winner; sObj.lcRunner = b.final.res.loser; sObj.leagueCupDone = true; }
    else { sObj.rcWinner = b.final.res.winner; sObj.rcRunner = b.final.res.loser; sObj.ravestonCupDone = true; }
  }
  tryFinalizeSeason(se);
}

// ==============================================================
// 6. FINALISASI & PROMOSI/DEGRADASI
// ==============================================================
function tryFinalizeSeason(se) {
  var s = H.seasons[se];
  if (!s || s.finalized || !s.leagueDone) return;
  if (s.t1PlayoffDone && s.faCupDone && s.leagueCupDone && s.ravestonCupDone) {
    finalizeSeason(se);
  }
}

function pickCupScorer(clubIds, r) {
  var best = null;
  clubIds.forEach(function(cId) {
    if (cId === null || cId === undefined) return;
    (PLAYERS_DB[cId] || []).forEach(function(p) {
      var g = Math.round(POS_SCORE_W[p.pos] * (3 + r() * 5) * (p.ovr / 80));
      if (!best || g > best.g || (g === best.g && p.ovr > best.p.ovr)) best = { p: p, club: +cId, g: g };
    });
  });
  return best;
}

function simulateSeasonIndividualAwards(se) {
  var s = H.seasons[se];
  if (s.awards) return;
  var r = pseudoRandom(se * 4421 + 99);
  var idx = buildPlayerIndex();
  var L = s.league;

  var allT1Players = [];
  s.tiers[0].forEach(function(cId){ (PLAYERS_DB[cId] || []).forEach(function(p){ allT1Players.push(p); }); });
  allT1Players.sort(function(a,b){ return (b.sg - a.sg) || (b.sa - a.sa) || (b.ovr - a.ovr); });

  var tp = allT1Players[0];
  tp.career.t1Boots++;

  var lowSc = L[1].scorers[0];
  var lowPl = idx[lowSc[0]];
  lowPl.career.lowBoots++;
  var t2ScorerObj = { id: lowPl.id, name: lowPl.name, club: lowSc[2], goals: lowSc[3] };

  var champ = s.rank1to4[0];
  var shieldChamp = s.leagueShieldWinner;
  var best = null, bestScore = -1e9, bestClub = null;
  s.tiers[0].forEach(function(cId) {
    (PLAYERS_DB[cId] || []).forEach(function(p) {
      var sc = p.sg + 0.7 * p.sa + (p.ovr - 70) * 0.8 + 
               (cId === champ ? 12 : 0) + (cId === shieldChamp ? 8 : 0) +
               (cId === s.faWinner ? 3 : 0) + (cId === s.lcWinner ? 2 : 0) + (p.id === tp.id ? 8 : 0);
      if (sc > bestScore) { bestScore = sc; best = p; bestClub = cId; }
    });
  });
  best.career.mvp++;

  var faSc = pickCupScorer([s.faWinner, s.faRunner], r);
  var lcSc = pickCupScorer([s.lcWinner, s.lcRunner], r);
  faSc.p.career.faBoots++;
  lcSc.p.career.lcBoots++;

  s.awards = {
    mvp: { id: best.id, name: best.name, club: bestClub, ovr: best.ovr, mvpCount: best.career.mvp },
    t1Scorer: { id: tp.id, name: tp.name, club: tp.club, goals: tp.sg, assists: tp.sa, bootsCount: tp.career.t1Boots },
    faScorer: { id: faSc.p.id, name: faSc.p.name, club: faSc.club, goals: faSc.g, bootsCount: faSc.p.career.faBoots },
    lcScorer: { id: lcSc.p.id, name: lcSc.p.name, club: lcSc.club, goals: lcSc.g, bootsCount: lcSc.p.career.lcBoots },
    t2Scorer: t2ScorerObj
  };
}

function commitSeasonPlayerStats(se) {
  var s = H.seasons[se];
  for (var t = 0; t < s.tiers.length; t++) {
    s.tiers[t].forEach(function(cId) {
      (PLAYERS_DB[cId] || []).forEach(function(p) {
        var c = p.career;
        c.goals += p.sg; c.assists += p.sa; c.seasons++;
        c.minutes = (c.minutes || 0) + (p.smin || 0);
        c.apps = (c.apps || 0) + (p.sapp || 0);
        c.starts = (c.starts || 0) + (p.sstart || 0);
        if (t === 0) { c.t1Goals += p.sg; c.t1Seasons++; }
        p.hist.push([se, +cId, t, p.sg, p.sa, p.ovr, p.age, p.smin || 0, p.sapp || 0, p.sstart || 0]);
        p.sg = 0; p.sa = 0; p.smin = 0; p.sapp = 0; p.sstart = 0;
      });
    });
  }
}

function applyPromotionRelegationAndDynastyBoost(se) {
  var s = H.seasons[se];
  var r = pseudoRandom(se * 6101 + 5);
  var base = [78, 66], spread = [18, 12];
  var tabs = s.league.map(function(l){ return l.table.map(function(x){ return x[0]; }); });

  for (var t = 0; t < 2; t++) {
    var n = tabs[t].length;
    tabs[t].forEach(function(c, pos) {
      var target = base[t] + spread[t] * (1 - pos / (n - 1));
      var np = S.prestige[c] + 0.2 * (target - S.prestige[c]) + (r() - 0.5) * 2;
      S.prestige[c] = Math.round(clamp(np, 50, 95) * 10) / 10;
    });
  }

  var shieldChamp = s.leagueShieldWinner;
  if (shieldChamp !== null) {
    S.prestige[shieldChamp] = clamp(S.prestige[shieldChamp] + 4.0, 88, 98);
  }
  for (var topIdx = 1; topIdx < 4; topIdx++) {
    var cTop = tabs[0][topIdx];
    S.prestige[cTop] = clamp(S.prestige[cTop] + (3.0 - topIdx * 0.7), 84, 96);
  }

  var t1 = tabs[0], t2 = tabs[1];
  var down1 = t1.slice(-SLOTS), up2 = t2.slice(0, SLOTS);
  S.mem = [
    t1.slice(0, t1.length - SLOTS).concat(up2),
    t2.slice(SLOTS).concat(down1)
  ];
  s.moves = { up2to1: up2, down1to2: down1 };
}

function finalizeSeason(se) {
  var s = H.seasons[se];
  if (s.finalized) return;
  simulateSeasonIndividualAwards(se);
  commitSeasonPlayerStats(se);
  applyPromotionRelegationAndDynastyBoost(se);
  agePlayersOneYear(se);
  s.transfers = runTransferMarket(se);
  s.finalized = true;

  if (se % 50 === 0) {
    exportBatchDetailedHtml(se - 49, se);
  }

  H.seasons[se + 1] = createBlankSeasonObject(se + 1);
  recalculateTrophyCabinet();
}

function simulateFullSeasonInternal(se, noSnap) {
  simulateLeague(se, noSnap);
  ['pl', 'fa', 'lc', 'rc'].forEach(function(cp) {
    _simStage(cp, 'qf', se);
    _simStage(cp, 'sf', se);
    _simStage(cp, 'finals', se);
  });
}

function simulateLeagueOnly(se) {
  simulateLeague(se, false);
  autoSaveHistory();
  render();
}

function simulateEntireSeason(se) {
  $('#status-label').textContent = 'Simulating Season ' + se + '...';
  setTimeout(function() {
    simulateFullSeasonInternal(se, false);
    autoSaveHistory();
    requestAnimationFrame(function() {
      render();
      $('#status-label').textContent = 'Season ' + se + ' finalized!';
    });
  }, 10);
}

function simulateEntireRavestonCup(se) {
  _simStage('rc', 'qf', se);
  _simStage('rc', 'sf', se);
  _simStage('rc', 'finals', se);
  autoSaveHistory();
  render();
}

function simulateNextSeasonsBatch(count) {
  var first = findNextUncompletedSeason();
  var last = first;
  for (var i = 0; i < count; i++) {
    var se = findNextUncompletedSeason();
    simulateFullSeasonInternal(se, i < count - 1);
    last = se;
  }
  recalculateTrophyCabinet();
  selectedSeason = last;
  return { first: first, last: last };
}

function runBatch(count) {
  $('#status-label').textContent = '⏳ Simulating ' + count + ' seasons...';
  setTimeout(function() {
    var t0 = Date.now();
    var res = simulateNextSeasonsBatch(count);
    saveHistoryToIndexedDB(false);
    requestAnimationFrame(function() {
      render();
      var secs = ((Date.now() - t0) / 1000).toFixed(1);
      $('#status-label').textContent = '✅ ' + count + ' seasons completed (S.' + res.first + ' – S.' + res.last + ') in ' + secs + 's';
    });
  }, 40);
}

// Navigasi Maju 1 Musim dengan Optimasi Anti-Lag
function addNewSeasonManually() {
  var se = findNextUncompletedSeason();
  $('#status-label').textContent = 'Simulating Season ' + se + '...';
  setTimeout(function() {
    simulateFullSeasonInternal(se, false);
    recalculateTrophyCabinet();
    selectedSeason = se;
    autoSaveHistory();
    requestAnimationFrame(function() {
      render();
      $('#status-label').textContent = 'Season ' + se + ' completed';
    });
  }, 10);
}

function undoLastSeason() {
  if (!S.undo) { alert("Belum ada musim yang bisa di-undo."); return; }
  var se = S.undo.se;
  if (!confirm("Batalkan Season " + se + " beserta semua musim sesudahnya?")) return;
  var snap = JSON.parse(S.undo.json);
  PLAYERS_DB = snap.roster;
  S.playerRoster = PLAYERS_DB;
  S.prestige = snap.prestige;
  S.mem = snap.mem;
  S.nextPlayerId = snap.nextPlayerId;
  S.legends = snap.legends;
  Object.keys(H.seasons).map(Number).forEach(function(k){ if (k >= se) delete H.seasons[k]; });
  H.seasons[se] = createBlankSeasonObject(se);
  S.undo = null;
  recalculateTrophyCabinet();
  selectedSeason = se;
  saveHistoryToIndexedDB(false);
  render();
}

function newCab() {
  return { t1: 0, shield: 0, r2: 0, r3: 0, r4: 0, fa: 0, far: 0, lc: 0, lcr: 0, rc: 0, rcr: 0, lg1: 0, lg2: 0, doubles: 0, trebles: 0, quads: 0, pts: 0 };
}

function recalculateTrophyCabinet() {
  var cab = {};
  function C(c){ if (!cab[c]) cab[c] = newCab(); return cab[c]; }
  var max = getMaxSeasonInArchive();
  for (var se = 1; se <= max; se++) {
    var s = H.seasons[se];
    if (!s) continue;

    if (s.leagueDone && s.league) {
      var sh = s.leagueShieldWinner || s.league[0].table[0][0];
      C(sh).shield++; C(sh).pts += 10;
      C(s.league[1].table[0][0]).lg2++; C(s.league[1].table[0][0]).pts += 3;
    }
    if (s.t1PlayoffDone && s.rank1to4[0] !== null) {
      C(s.rank1to4[0]).t1++; C(s.rank1to4[0]).pts += 12;
      C(s.rank1to4[1]).r2++; C(s.rank1to4[1]).pts += 6;
      C(s.rank1to4[2]).r3++; C(s.rank1to4[2]).pts += 4;
      C(s.rank1to4[3]).r4++; C(s.rank1to4[3]).pts += 2;
    }
    if (s.faWinner !== null) { C(s.faWinner).fa++; C(s.faWinner).pts += 5; }
    if (s.faRunner !== null) { C(s.faRunner).far++; C(s.faRunner).pts += 2; }
    if (s.lcWinner !== null) { C(s.lcWinner).lc++; C(s.lcWinner).pts += 3; }
    if (s.lcRunner !== null) { C(s.lcRunner).lcr++; C(s.lcRunner).pts += 1; }
    if (s.rcWinner !== null) { C(s.rcWinner).rc++; C(s.rcWinner).pts += 4; }
    if (s.rcRunner !== null) { C(s.rcRunner).rcr++; C(s.rcRunner).pts += 2; }

    if (s.leagueDone && s.t1PlayoffDone && s.rank1to4[0] !== null) {
      var poChamp = s.rank1to4[0];
      var shChamp = s.leagueShieldWinner || s.league[0].table[0][0];
      if (poChamp === shChamp) {
        C(poChamp).doubles++; C(poChamp).pts += 15;
      }
      if (poChamp === s.faWinner && poChamp === s.lcWinner) {
        if (s.rcWinner !== null && poChamp === s.rcWinner) { C(poChamp).quads++; C(poChamp).pts += 35; }
        else { C(poChamp).trebles++; C(poChamp).pts += 20; }
      }
    }
  }
  H.clubStats = cab;
}

function getHistoricalTitleCount(clubId, compType, upToSeason) {
  if (clubId === null || clubId === undefined) return 0;
  var count = 0;
  for (var se = 1; se <= upToSeason; se++) {
    var s = H.seasons[se];
    if (!s) continue;
    if (compType === 'pl' && s.t1PlayoffDone && s.rank1to4[0] === clubId) count++;
    else if (compType === 'shield' && s.leagueDone && s.leagueShieldWinner === clubId) count++;
    else if (compType === 'fa' && s.faCupDone && s.faWinner === clubId) count++;
    else if (compType === 'lc' && s.leagueCupDone && s.lcWinner === clubId) count++;
    else if (compType === 'rc' && s.ravestonCupDone && s.rcWinner === clubId) count++;
  }
  return count;
}

function getTournamentClubRank(clubId, compType, se) {
  if (clubId === null || clubId === undefined || !H || !H.seasons) return '(-)';
  var prevSe = se - 1;
  if (prevSe < 1 || !H.seasons[prevSe]) return '(-)';
  var sPrev = H.seasons[prevSe];

  if (compType === 'pl') {
    if (!sPrev.t1PlayoffDone) return '(-)';
    if (sPrev.rank1to4[0] === clubId) return '(#1)';
    if (sPrev.rank1to4[1] === clubId) return '(#2)';
    if (sPrev.rank1to4[2] === clubId) return '(#3)';
    if (sPrev.rank1to4[3] === clubId) return '(#4)';
    if (sPrev.super8 && sPrev.super8.qf) {
      for (var i = 0; i < sPrev.super8.qf.length; i++) {
        if (sPrev.super8.qf[i].h === clubId || sPrev.super8.qf[i].a === clubId) return '(#5-8)';
      }
    }
    return '(-)';
  }

  var isDone = compType === 'fa' ? sPrev.faCupDone : (compType === 'lc' ? sPrev.leagueCupDone : sPrev.ravestonCupDone);
  var brk = getBracket(sPrev, compType);
  if (!isDone || !brk) return '(-)';
  var winId = compType === 'fa' ? sPrev.faWinner : (compType === 'lc' ? sPrev.lcWinner : sPrev.rcWinner);
  var runId = compType === 'fa' ? sPrev.faRunner : (compType === 'lc' ? sPrev.lcRunner : sPrev.rcRunner);
  if (winId === clubId) return '(#1)';
  if (runId === clubId) return '(#2)';
  for (var j = 0; j < brk.sf.length; j++) if (brk.sf[j].h === clubId || brk.sf[j].a === clubId) return '(#3-4)';
  for (var k = 0; k < brk.qf.length; k++) if (brk.qf[k].h === clubId || brk.qf[k].a === clubId) return '(#5-8)';
  return '(-)';
}

function getClubLeagueFinish(sn, clubId) {
  if (!sn || !sn.leagueDone || !sn.league) return null;
  for (var t = 0; t < sn.tiers.length; t++) {
    var tab = sn.league[t].table;
    for (var i = 0; i < tab.length; i++) {
      if (tab[i][0] === clubId) return { tier: t, pos: i + 1, n: tab.length, pts: tab[i][6] };
    }
  }
  return null;
}

function setStatus(t) { var el = $('#status-label'); if (el) el.textContent = t; }

function resetEntireHistoryBlank() {
  if (!confirm("Reset seluruh arsip dan mulai Season 1 dengan 370 Klub?")) return;
  S = generateClubsRegistry();
  PLAYERS_DB = {};
  initActivePlayerPool();
  H = generateEmptyHistoryStructure(1);
  saveHistoryToIndexedDB(false);
  selectedSeason = 1;
  ledgerCurrentPage = 1;
  selectedJornada = 1;
  render();
  alert("Database berhasil di-reset!");
}

function initHistoryApp() {
  setStatus('Menghubungkan ke arsip sejarah British Pyramid...');
  var finish = function(loaded, note) {
    S = (loaded && loaded.version === 5 && loaded.name && loaded.name.length === 370) ? loaded : generateClubsRegistry();
    initActivePlayerPool();
    loadOrInitializeHistory();
    setStatus(note);
  };
  if (typeof indexedDB === 'undefined') { finish(null, '⚠️ Mode Memori Aktif (370 Clubs)'); return; }
  var req = indexedDB.open(DB_NAME, 1);
  req.onupgradeneeded = function(e) {
    var db = e.target.result;
    if (!db.objectStoreNames.contains('k')) db.createObjectStore('k');
  };
  req.onsuccess = function() {
    var db = req.result;
    var getReq = db.transaction('k', 'readonly').objectStore('k').get('S');
    getReq.onsuccess = function() {
      finish(getReq.result, '✅ Database Connected (370 Clubs · 2 Tiers · S.' + getMaxSeasonInArchive() + ')');
    };
    getReq.onerror = function() { finish(null, '⚠️ Mode Memori Aktif (370 Clubs)'); };
  };
  req.onerror = function() { finish(null, '⚠️ Mode Memori Aktif (370 Clubs)'); };
}

function loadOrInitializeHistory() {
  if (S.historyArchive && S.historyArchive.seasons && Object.keys(S.historyArchive.seasons).length > 0) {
    H = S.historyArchive;
  } else {
    H = generateEmptyHistoryStructure(1);
    saveHistoryToIndexedDB(false);
  }
  selectedSeason = findNextUncompletedSeason();
  render();
}

function autoSaveHistory() {
  if (saveTimer) clearTimeout(saveTimer);
  // Debounce 2000 ms agar UI tidak lag
  saveTimer = setTimeout(function() { saveHistoryToIndexedDB(false); }, 2000);
}

function saveHistoryToIndexedDB(showAlert) {
  if (!H || !S) return;
  S.historyArchive = H;
  S.playerRoster = PLAYERS_DB;
  if (typeof indexedDB === 'undefined') return;
  var req = indexedDB.open(DB_NAME, 1);
  req.onupgradeneeded = function(e) {
    var db = e.target.result;
    if (!db.objectStoreNames.contains('k')) db.createObjectStore('k');
  };
  req.onsuccess = function() {
    var db = req.result;
    var tx = db.transaction('k', 'readwrite');
    tx.objectStore('k').put(S, 'S');
    tx.oncomplete = function() {
      setStatus('💾 Saved to Database (' + new Date().toLocaleTimeString() + ')');
      if (showAlert) alert("Seluruh rekam jejak berhasil disimpan ke IndexedDB!");
    };
  };
}

function exportDataToJson() {
  if (!H || !S) return;
  S.historyArchive = H;
  S.playerRoster = PLAYERS_DB;
  var dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(S));
  var downloadAnchor = document.createElement('a');
  var ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  downloadAnchor.setAttribute("href", dataStr);
  downloadAnchor.setAttribute("download", "cadenza_370clubs_backup_" + ts + ".json");
  document.body.appendChild(downloadAnchor);
  downloadAnchor.click();
  downloadAnchor.remove();
}

function importDataFromJson(event) {
  var file = event.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var imported = JSON.parse(e.target.result);
      if (!imported || !imported.name || !imported.mem) {
        alert("File JSON tidak cocok dengan struktur Cadenza Heritage!");
        return;
      }
      S = imported;
      PLAYERS_DB = S.playerRoster || {};
      H = S.historyArchive || generateEmptyHistoryStructure(1);
      recalculateTrophyCabinet();
      saveHistoryToIndexedDB(false);
      selectedSeason = findNextUncompletedSeason();
      render();
      alert("✅ Data berhasil diimpor!");
    } catch (err) {
      alert("Gagal membaca file JSON: " + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}
